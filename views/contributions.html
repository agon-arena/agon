<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />

<link rel="icon" type="image/png" href="/favicon-64.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon-192-optimized.png">
<meta name="theme-color" content="#243038">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="stylesheet" href="/style.min.css?v=20260706-dock-centres" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@200;300;400;600;700;800&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <script>if (window.self !== window.top) document.documentElement.classList.add('in-iframe'); document.addEventListener('DOMContentLoaded', function(){ if (window.self !== window.top) document.body.classList.add('in-iframe'); });</script>
  <style>
    body { background-color: #243038; }
    html.in-iframe .mobile-back-button,
    html.in-iframe .back-link { display: none !important; }
    html.in-iframe .app-floating-refresh-btn { display: none !important; }
    .page-notifications .topbar-inner,
    .page-notifications-mobile .topbar-inner {
      justify-content: center;
    }
    .page-notifications .home-brand-block,
    .page-notifications-mobile .home-brand-block {
      flex: 0 0 auto;
    }
    .page-notifications .topbar-actions,
    .page-notifications-mobile .topbar-actions {
      position: absolute;
      right: 16px;
    }
    .home-bottom-nav { display: none !important; }

    /* Textes sur fond sombre — même habillage que la page notifications */
    .page-contributions .section-header h3 {
      color: #e8e8e8;
    }
    .page-contributions .contributions-section-title {
      color: #e8e8e8;
      font-size: 17px;
      font-weight: 700;
      margin: 26px 0 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .page-contributions .contributions-section-title:first-child {
      margin-top: 0;
    }
    .page-contributions .contribution-item {
      display: block;
      color: #e8e8e8;
      background: #2e3d47;
      border: 1px solid #3a4a55;
      border-radius: 12px;
      padding: 13px 15px;
      margin-bottom: 10px;
      text-decoration: none;
      transition: background 0.12s ease;
    }
    .page-contributions .contribution-item:hover {
      background: #344853;
    }
    .page-contributions .contribution-title {
      color: #e8e8e8;
      font-weight: 700;
      font-size: 15px;
      margin: 0 0 4px;
      line-height: 1.35;
    }
    .page-contributions .contribution-subtitle {
      color: #a0b0bb;
      font-size: 13px;
      margin: 0 0 6px;
      line-height: 1.45;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .page-contributions .contribution-meta {
      color: #7a8a94;
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .page-contributions .contribution-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: #1e3a5f;
      color: #9cc3f0;
      border-radius: 999px;
      padding: 2px 9px;
      font-size: 11px;
      font-weight: 700;
    }
    .page-contributions .empty-state {
      color: #a0b0bb;
      background: #2e3d47;
      border: 1px dashed #3a4a55;
      border-radius: 12px;
      padding: 14px 16px;
      font-size: 13.5px;
    }
  </style>
</head>
<body class="page-notifications page-notifications-mobile page-contributions">
<header class="topbar">
  <div class="container topbar-inner topbar-home">

    <div class="home-brand-block">
      <img src="/logo.jpeg" alt="Logo agôn" class="home-logo">

      <p class="topbar-message">
         <strong>La vraie gloire<br> est convaincre.
  <strong>
      </p>
    </div>

    <div class="topbar-actions">
      <div class="back-notifications-stack">
        <button
          type="button"
          class="mobile-back-button"
          onclick="return handleNotificationsBackNavigation(event, '/')"
          aria-label="Revenir à la page précédente"
        >
          <i class="fa-solid fa-arrow-left"></i>
        </button>

        <div class="debate-nav-row">
          <a href="/" class="back-link" onclick="return handleNotificationsBackNavigation(event, '/')">← Retour</a>
        </div>
      </div>
    </div>

  </div>
</header>

<main class="container home-page">
  <section class="debates-section">
    <div class="section-header section-header-home">
      <div>
        <h3>Mes contributions</h3>
      </div>
    </div>

    <div class="contributions-section-title"><i class="fa-solid fa-landmark"></i> Mes arènes</div>
    <div id="contributions-debates"><div class="empty-state">Chargement…</div></div>

    <div class="contributions-section-title"><i class="fa-regular fa-lightbulb"></i> Mes idées</div>
    <div id="contributions-arguments"><div class="empty-state">Chargement…</div></div>

    <div class="contributions-section-title"><i class="fa-regular fa-comment"></i> Mes commentaires</div>
    <div id="contributions-comments"><div class="empty-state">Chargement…</div></div>
  </section>
</main>

<button
  type="button"
  class="app-floating-refresh-btn"
  onclick="window.location.reload()"
  title="Actualiser"
  aria-label="Actualiser la page"
>
  <i class="fa-solid fa-rotate-right"></i>
</button>

<script>
(function() {
  function esc(value) {
    return String(value == null ? "" : value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function formatDate(iso) {
    if (!iso) return "";
    try {
      return new Date(iso).toLocaleDateString("fr-FR", { day: "numeric", month: "long", year: "numeric" });
    } catch (e) {
      return "";
    }
  }

  function renderEmpty(container, message) {
    container.innerHTML = '<div class="empty-state">' + esc(message) + '</div>';
  }

  function renderDebates(container, debates) {
    if (!debates.length) return renderEmpty(container, "Tu n'as pas encore ouvert d'arène.");
    container.innerHTML = debates.map(function(d) {
      return '<a class="contribution-item" href="/debate?id=' + encodeURIComponent(d.id) + '">' +
        '<p class="contribution-title">' + esc(d.question) + '</p>' +
        '<div class="contribution-meta">' +
          '<span class="contribution-badge"><i class="fa-solid fa-landmark"></i> ' + (d.type === "open" ? "Arène libre" : "Pour / Contre") + '</span>' +
          (d.category ? '<span>' + esc(d.category) + '</span>' : '') +
          '<span>' + esc(formatDate(d.created_at)) + '</span>' +
        '</div>' +
      '</a>';
    }).join("");
  }

  function renderArguments(container, args) {
    if (!args.length) return renderEmpty(container, "Tu n'as pas encore proposé d'idée.");
    container.innerHTML = args.map(function(a) {
      var votes = Number(a.votes) || 0;
      return '<a class="contribution-item" href="/debate?id=' + encodeURIComponent(a.debate_id) + '">' +
        '<p class="contribution-title">' + esc(a.title || "(sans titre)") + '</p>' +
        (a.body ? '<p class="contribution-subtitle">' + esc(a.body) + '</p>' : '') +
        '<div class="contribution-meta">' +
          '<span class="contribution-badge"><i class="fa-solid fa-bolt"></i> ' + votes + ' voix</span>' +
          (a.debate_question ? '<span>dans « ' + esc(a.debate_question) + ' »</span>' : '') +
          '<span>' + esc(formatDate(a.created_at)) + '</span>' +
        '</div>' +
      '</a>';
    }).join("");
  }

  function renderComments(container, comments) {
    if (!comments.length) return renderEmpty(container, "Tu n'as pas encore commenté d'idée.");
    container.innerHTML = comments.map(function(c) {
      var inner =
        '<p class="contribution-subtitle">' + esc(c.content) + '</p>' +
        '<div class="contribution-meta">' +
          (c.argument_title ? '<span>sous « ' + esc(c.argument_title) + ' »</span>' : '') +
          (c.debate_question ? '<span>dans « ' + esc(c.debate_question) + ' »</span>' : '') +
          '<span>' + esc(formatDate(c.created_at)) + '</span>' +
        '</div>';
      if (c.debate_id) {
        return '<a class="contribution-item" href="/debate?id=' + encodeURIComponent(c.debate_id) + '">' + inner + '</a>';
      }
      return '<div class="contribution-item">' + inner + '</div>';
    }).join("");
  }

  function load() {
    var debatesEl = document.getElementById("contributions-debates");
    var argumentsEl = document.getElementById("contributions-arguments");
    var commentsEl = document.getElementById("contributions-comments");
    if (!debatesEl || !argumentsEl || !commentsEl) return;

    var key = null;
    try { key = localStorage.getItem("key"); } catch (e) {}
    if (!key) {
      renderEmpty(debatesEl, "Tu n'as pas encore ouvert d'arène.");
      renderEmpty(argumentsEl, "Tu n'as pas encore proposé d'idée.");
      renderEmpty(commentsEl, "Tu n'as pas encore commenté d'idée.");
      return;
    }

    fetch("/api/my-contributions?key=" + encodeURIComponent(key))
      .then(function(r) {
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.json();
      })
      .then(function(data) {
        renderDebates(debatesEl, data.debates || []);
        renderArguments(argumentsEl, data.arguments || []);
        renderComments(commentsEl, data.comments || []);
      })
      .catch(function() {
        var message = "Impossible de charger tes contributions. Réessaie dans un instant.";
        renderEmpty(debatesEl, message);
        renderEmpty(argumentsEl, message);
        renderEmpty(commentsEl, message);
      });
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", load);
  } else {
    load();
  }
})();
</script>

<script>
(function() {
  if (window.self === window.top) return;
  function notifyContributionsIframeReady() {
    window.__agonPageArrivalReady = true;
    try {
      window.parent.postMessage({
        type: "agon:debate-iframe-ready",
        pathname: String(location.pathname || "/contributions"),
        href: String(location.href || "")
      }, "*");
    } catch (error) {}
    try {
      window.parent.postMessage({
        type: "agon:iframe-page-context",
        page: "contributions",
        pathname: String(location.pathname || "/contributions"),
        href: String(location.href || "")
      }, "*");
    } catch (error) {}
  }
  notifyContributionsIframeReady();
  window.addEventListener("pageshow", notifyContributionsIframeReady);
  window.addEventListener("load", notifyContributionsIframeReady);
})();
</script>

<script src="/script.min.js?v=20260706-dock-unifie" defer></script>
</body>
</html>
