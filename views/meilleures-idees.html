<script>
(function() {
  var MNORIA_LOGOS_ICON = '<i class="mnoria-logos-icon" aria-hidden="true"><svg viewBox="2 0 21 21" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 11a1 1 0 0 1 1 1a2 2 0 0 1-2 2a3 3 0 0 1-3-3a4 4 0 0 1 4-4a5 5 0 0 1 5 5a6 6 0 0 1-6 6a7 7 0 0 1-7-7a8 8 0 0 1 8-8a9 9 0 0 1 9 9"/></svg></i>';

  function esc(value) {
    return String(value == null ? "" : value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function setCount(id, n) {
    var el = document.getElementById(id);
    if (el) el.textContent = String(n);
  }

  function renderEmpty(container, message) {
    container.innerHTML = '<div class="empty-state">' + esc(message) + '</div>';
  }

  var LOADING_SABLIER_HTML = '<div class="empty-state contributions-loading"><img src="/sablier-96.png" alt="" class="contributions-loading-spinner"></div>';

  function renderLoading(container) {
    container.innerHTML = LOADING_SABLIER_HTML;
  }

  var PAGE_SIZE = 5;

  function renderPaginated(container, items, renderItem, emptyMessage) {
    if (!items.length) return renderEmpty(container, emptyMessage);
    var pages = Math.ceil(items.length / PAGE_SIZE);
    var page = 0;

    function draw() {
      var slice = items.slice(page * PAGE_SIZE, (page + 1) * PAGE_SIZE);
      var html = slice.map(renderItem).join("");
      if (pages > 1) {
        html += '<div class="contributions-pager">' +
          '<button type="button" class="contributions-pager-btn" data-dir="-1" aria-label="Page précédente"' + (page === 0 ? ' disabled' : '') + '><i class="fa-solid fa-chevron-left"></i></button>' +
          '<span class="contributions-pager-info">' + (page + 1) + ' / ' + pages + '</span>' +
          '<button type="button" class="contributions-pager-btn" data-dir="1" aria-label="Page suivante"' + (page === pages - 1 ? ' disabled' : '') + '><i class="fa-solid fa-chevron-right"></i></button>' +
        '</div>';
      }
      container.innerHTML = html;
      if (pages > 1) {
        container.querySelectorAll(".contributions-pager-btn").forEach(function(btn) {
          btn.addEventListener("click", function(event) {
            event.preventDefault();
            page = Math.min(pages - 1, Math.max(0, page + Number(btn.getAttribute("data-dir"))));
            draw();
          });
        });
      }
    }

    draw();
  }

  // ===== Les meilleures idées (classement global, pas lié à une clé) =====
  var BEST_IDEAS_EMPTY_MESSAGE = {
    open: {
      day: "Pas encore de meilleure idée du jour dans une arène libre.",
      week: "Pas encore de meilleure idée de la semaine dans une arène libre.",
      month: "Pas encore de meilleure idée du mois dans une arène libre."
    },
    positioned: {
      day: "Pas encore de meilleure idée du jour dans une arène à positions.",
      week: "Pas encore de meilleure idée de la semaine dans une arène à positions.",
      month: "Pas encore de meilleure idée du mois dans une arène à positions."
    }
  };
  var bestIdeasCurrentPeriod = "day";
  var bestIdeasCache = {};

  function bestIdeaItemHtml(item, metric, showSide) {
    var primaryBadge = metric === "aiScore"
      ? '<span class="contribution-badge">' + MNORIA_LOGOS_ICON + ' ' + (Number(item.ai_score) || 0) + '/100</span>'
      : '<span class="contribution-badge"><i class="fa-solid fa-bolt"></i> ' + (Number(item.votes) || 0) + ' voix</span>';
    return '<a class="contribution-item" href="/debate?id=' + encodeURIComponent(item.debate_id) + '">' +
      '<p class="contribution-title">' + esc(item.title || "(sans titre)") + '</p>' +
      (item.body ? '<p class="contribution-subtitle">' + esc(item.body) + '</p>' : '') +
      '<div class="contribution-meta">' +
        primaryBadge +
        (showSide && item.side_label ? '<span class="contribution-badge best-ideas-side-badge">' + esc(item.side_label) + '</span>' : '') +
        (item.debate_question ? '<span>dans « ' + esc(item.debate_question) + ' »</span>' : '') +
      '</div>' +
    '</a>';
  }

  function renderBestIdeasForMetric(metric, data) {
    var suffix = metric === "aiScore" ? "aiscore" : "votes";
    var openEl = document.getElementById("best-ideas-open-" + suffix);
    var positionedEl = document.getElementById("best-ideas-positioned-" + suffix);
    if (!openEl || !positionedEl) return;
    var period = data.period || "day";
    var bucket = (metric === "aiScore" ? data.aiScore : data.votes) || {};
    renderPaginated(openEl, bucket.open || [], function(item) { return bestIdeaItemHtml(item, metric, false); }, BEST_IDEAS_EMPTY_MESSAGE.open[period]);
    renderPaginated(positionedEl, bucket.positioned || [], function(item) { return bestIdeaItemHtml(item, metric, true); }, BEST_IDEAS_EMPTY_MESSAGE.positioned[period]);
    setCount("best-ideas-open-" + suffix + "-count", (bucket.open || []).length);
    setCount("best-ideas-positioned-" + suffix + "-count", (bucket.positioned || []).length);
  }

  function renderBestIdeas(data) {
    renderBestIdeasForMetric("votes", data);
    renderBestIdeasForMetric("aiScore", data);
  }

  function loadBestIdeas(period) {
    if (bestIdeasCache[period]) {
      renderBestIdeas(bestIdeasCache[period]);
      return;
    }

    ["best-ideas-open-votes", "best-ideas-positioned-votes", "best-ideas-open-aiscore", "best-ideas-positioned-aiscore"].forEach(function(id) {
      var el = document.getElementById(id);
      if (el) renderLoading(el);
    });

    fetch("/api/best-ideas?period=" + encodeURIComponent(period))
      .then(function(r) {
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.json();
      })
      .then(function(data) {
        bestIdeasCache[period] = data;
        if (bestIdeasCurrentPeriod === period) renderBestIdeas(data);
      })
      .catch(function() {
        if (bestIdeasCurrentPeriod !== period) return;
        var message = "Impossible de charger les meilleures idées pour l'instant.";
        ["best-ideas-open-votes", "best-ideas-positioned-votes", "best-ideas-open-aiscore", "best-ideas-positioned-aiscore"].forEach(function(id) {
          var el = document.getElementById(id);
          if (el) renderEmpty(el, message);
        });
      });
  }

  function setupBestIdeasTabs() {
    var tabs = document.querySelectorAll(".best-ideas-period-tab");
    if (!tabs.length) return;
    tabs.forEach(function(tab) {
      tab.addEventListener("click", function() {
        var period = tab.getAttribute("data-period");
        if (!period || period === bestIdeasCurrentPeriod) return;
        bestIdeasCurrentPeriod = period;
        tabs.forEach(function(t) {
          var active = t === tab;
          t.classList.toggle("active", active);
          t.setAttribute("aria-selected", active ? "true" : "false");
        });
        loadBestIdeas(period);
      });
    });
  }

  function load() {
    setupBestIdeasTabs();
    loadBestIdeas(bestIdeasCurrentPeriod);
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", load);
  } else {
    load();
  }
})();
</script>

<script>
(function() {
  if (window.self === window.top) return;
  function notifyMeilleuresIdeesIframeReady() {
    window.__mnoriaPageArrivalReady = true;
    try {
      window.parent.postMessage({
        type: "mnoria:debate-iframe-ready",
        pathname: String(location.pathname || "/meilleures-idees"),
        href: String(location.href || "")
      }, "*");
    } catch (error) {}
    try {
      window.parent.postMessage({
        type: "mnoria:iframe-page-context",
        page: "meilleures-idees",
        pathname: String(location.pathname || "/meilleures-idees"),
        href: String(location.href || "")
      }, "*");
    } catch (error) {}
  }
  notifyMeilleuresIdeesIframeReady();
  window.addEventListener("pageshow", notifyMeilleuresIdeesIframeReady);
  window.addEventListener("load", notifyMeilleuresIdeesIframeReady);
})();
</script>
