<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">

  <title>Apprentissage | mnoria</title>
  <link rel="icon" type="image/png" href="/mnoria-icon-64.png?v=20260825-mnoria-icon-v2">
  <link rel="manifest" href="/manifest.webmanifest?v=20260825-mnoria-icon-v2">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Mnoria">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;700&display=swap">
  <link rel="stylesheet" href="/vendor/fontawesome/css/all.min.css">
  <script>
    if (window.self !== window.top) document.documentElement.classList.add('in-iframe');
    document.addEventListener('DOMContentLoaded', function(){
      if (window.self !== window.top) {
        document.body.classList.add('in-iframe');
      }
    });
  </script>
  <style>
    /* Garde-fou (bug constaté le 13/08/2026) : l'attribut hidden est ignoré
       dès qu'un élément porte une classe qui fixe elle-même son display
       (ex. .qcm-options { display:flex }, .qcm-next-btn.visible { display:
       block }) — même spécificité CSS que la règle native [hidden]{display:
       none}, donc la classe posée après dans la feuille de style l'emporte.
       Résultat concret : le bouton "Réfléchis à ta réponse" affichait les
       propositions juste en dessous au lieu de les cacher tant qu'on n'a pas
       cliqué (cf. wireRevealGate). !important au lieu d'une règle par
       élément affecté : plus sûr contre un futur cas similaire. */
    [hidden] {
      display: none !important;
    }
    /* Même bleu-gris foncé que le bandeau des bulles sur l'accueil (#243038).
       Posé à la fois sur html et body : html a déjà ce fond par défaut (cf.
       style.css ligne ~14068), mais sans hauteur de body qui couvre tout le
       viewport, une bande plus claire pouvait apparaître sous une carte courte. */
    html,
    html:has(body.page-qcm-du-jour) {
      background-color: #243038;
    }
    body.page-qcm-du-jour {
      min-height: 100vh;
      background-color: #243038;
    }
    /* html.in-iframe (pas body.in-iframe) : la classe est posée sur
       <html> de façon synchrone dès l'exécution de ce script (ligne ~21),
       avant même que <body> existe — alors que body.in-iframe n'est ajoutée
       qu'au DOMContentLoaded. Un sélecteur basé sur body.in-iframe faisait
       donc d'abord peindre le cadre avec les règles "hors iframe" (marge du
       haut bien plus grande, cf. .qcm-page-shell plus bas), qui ne se
       corrigeait qu'après coup — un saut visible du cadre vers le haut au
       chargement (constaté le 04/08/2026). */
    html.in-iframe body.page-qcm-du-jour {
      box-sizing: border-box;
      padding-bottom: 360px;
    }
    body.page-qcm-du-jour .topbar-inner {
      justify-content: center !important;
      padding: 2px 0 !important;
    }
    body.page-qcm-du-jour .home-brand-block {
      flex: 0 0 auto !important;
      margin-left: 0 !important;
    }
    body.page-qcm-du-jour .home-logo {
      width: 116px !important;
      transform: translateY(2px) !important;
    }
    body.page-qcm-du-jour .topbar-inner > :not(.home-brand-block),
    body.page-qcm-du-jour .home-brand-block > :not(.home-brand-main) {
      display: none !important;
    }
    @media (max-width: 768px) {
      body.page-qcm-du-jour .home-logo {
        width: 74px !important;
      }
      body.page-qcm-du-jour .topbar-inner {
        padding: 0 !important;
      }
    }
    .qcm-page-shell {
      width: min(100% - 32px, 900px);
      margin: 112px auto 180px;
    }
    /* Issue de secours si iOS restaure exceptionnellement /apprentissage
       comme document principal au lieu de l'iframe de l'accueil. La flèche
       habituelle appartient au parent et ne peut donc pas exister dans ce
       contexte ; celle-ci garantit qu'on ne reste jamais bloqué. */
    .qcm-top-level-exit {
      display: none;
    }
    html:not(.in-iframe) .qcm-top-level-exit {
      position: fixed;
      left: calc(20% - 13px);
      bottom: max(24px, env(safe-area-inset-bottom, 0px));
      z-index: 10002;
      width: 42px;
      height: 42px;
      border-radius: 999px;
      align-items: center;
      justify-content: center;
      background: #101820;
      border: 1px solid rgba(229, 237, 243, 0.5);
      box-shadow: 0 7px 18px rgba(0, 0, 0, 0.32);
      color: #e5edf3;
      text-decoration: none;
      display: flex;
    }
    html:not(.in-iframe) .qcm-top-level-exit:focus-visible {
      outline: 2px solid #ffffff;
      outline-offset: 3px;
    }
    html.in-iframe .page-qcm-du-jour .qcm-page-shell {
      margin: 4px auto 0;
    }
    /* Doit rester APRÈS la règle ci-dessus (même sélecteur, donc même
       spécificité) : un margin-bottom placé avant un margin raccourci
       équivalent serait écrasé par lui, peu importe le media query. */
    @media (max-width: 768px) {
      /* Vraie zone scrollable en bas, sans pseudo-bandeau ajouté au DOM. */
      html.in-iframe body.page-qcm-du-jour {
        padding-bottom: clamp(360px, 42vh, 520px);
      }
    }
    @media (min-width: 769px) {
      .qcm-page-shell {
        width: min(100% - 64px, 1200px);
      }
    }
    .qcm-panel,
    .qcm-panel * {
      box-sizing: border-box;
    }
    .qcm-panel {
      position: relative;
      width: 100%;
      /* Légèrement translucide (demande du 18/08/2026) plutôt qu'un blanc
         opaque plein : laisse deviner le fond de la question (cf.
         applyQuestionBackgroundImage) sans jamais nuire à la lisibilité du
         texte, toujours en pleine opacité. */
      background: rgba(255, 255, 255, 0.94);
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 24px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.18);
      font-family: Arial, Helvetica, sans-serif;
    }
    /* Croix de fermeture du cadre — visible sur Découvrir/Ancrer/Relier (cf.
       setPanelCloseVisible). Demande du 17/08/2026 : rester APPARENTE même
       en scrollant, alors que .qcm-panel n'a pas de scroll propre (c'est la
       page qui défile). Même motif que .qcm-fiche-close (sticky) plus haut,
       adapté ici : un ancre position:sticky, hauteur 0 (ne pousse aucun
       contenu, contrairement à un sticky "plein" qui réserverait sa propre
       ligne), qui épingle son bord haut au défilement — le bouton, positionné
       en absolute PAR RAPPORT À CETTE ANCRE, reste donc toujours à la même
       distance de son bord haut, que l'ancre soit encore à sa position
       naturelle (haut du cadre) ou déjà épinglée en haut du viewport. */
    .qcm-panel-close-anchor {
      position: sticky;
      top: var(--qcm-topbar-height, 0px);
      height: 0;
      overflow: visible;
      z-index: 5;
    }
    .qcm-panel-close {
      display: none;
      position: absolute;
      top: -20px;
      right: -12px;
      width: 28px;
      height: 28px;
      align-items: center;
      justify-content: center;
      border: none;
      border-radius: 999px;
      background: #eef3f6;
      color: #243038;
      font-size: 14px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(17, 24, 39, 0.18);
    }
    .qcm-panel-close.visible {
      display: flex;
    }
    .qcm-panel h1 {
      margin: 0 0 4px;
      font-family: "Barlow Condensed", Arial, sans-serif;
      font-size: 34px;
      line-height: 1;
      color: #111827;
      text-align: center;
    }
    .qcm-panel .qcm-subtitle {
      margin: 0 0 16px;
      color: #6b7280;
      font-size: 14px;
      text-align: center;
    }
    /* Jauge de charge d'apprentissage (demande du 17/08/2026) : compteur à
       aiguille en 4 zones (calme -> surchargé), cf. renderLoadGauge. Le
       needle est une <line> tournée par transform:rotate autour du centre
       (100,100) plutôt que recalculée en JS à chaque fois — beaucoup plus
       simple qu'une régénération de path. */
    .qcm-load-gauge {
      display: none;
      flex-direction: column;
      align-items: center;
      margin: 0 auto 18px;
      max-width: 260px;
    }
    .qcm-load-gauge.visible {
      display: flex;
    }
    .qcm-load-gauge-svg {
      width: 100%;
      max-width: 220px;
      height: auto;
      overflow: visible;
    }
    .qcm-load-gauge-arc {
      fill: none;
      stroke-width: 16;
      stroke-linecap: butt;
    }
    .qcm-load-gauge-arc-calm { stroke: #16a34a; }
    .qcm-load-gauge-arc-moderate { stroke: #f59e0b; }
    .qcm-load-gauge-arc-busy { stroke: #ea580c; }
    .qcm-load-gauge-arc-overloaded { stroke: #dc2626; }
    .qcm-load-gauge-needle {
      stroke: #243038;
      stroke-width: 4;
      stroke-linecap: round;
      transform-origin: 100px 100px;
      transform: rotate(-90deg);
      transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .qcm-load-gauge-hub {
      fill: #243038;
    }
    /* Repère "Idéal" (demande du 17/08/2026) : petit tiret fixe sur le
       cadran, à la position correspondant à LOAD_GAUGE_IDEAL_QUESTIONS —
       indépendant de la charge réelle affichée par l'aiguille, jamais
       animé/tourné en CSS (transform posé une seule fois en JS via
       initLoadGaugeIdealMarker, cf. plus bas). */
    .qcm-load-gauge-ideal-tick {
      stroke: #111827;
      stroke-width: 2;
      stroke-linecap: round;
    }
    .qcm-load-gauge-ideal-label {
      fill: #111827;
      font-family: "Barlow Condensed", Arial, sans-serif;
      font-size: 9px;
      font-weight: 700;
      text-anchor: middle;
    }
    .qcm-load-gauge-label {
      margin: 2px 0 0;
      font-family: "Barlow Condensed", Arial, sans-serif;
      font-size: 20px;
      font-weight: 700;
      color: #111827;
      text-align: center;
    }
    .qcm-load-gauge-caption {
      margin: 2px 0 0;
      color: #6b7280;
      font-size: 12.5px;
      text-align: center;
    }
    .qcm-slot-switcher {
      display: none;
      justify-content: center;
      gap: 8px;
      margin: 0 0 20px;
    }
    .qcm-slot-switcher.visible {
      display: flex;
    }
    .qcm-slot-btn {
      padding: 6px 14px;
      border: 1px solid #d1d5db;
      border-radius: 999px;
      background: #f9fafb;
      color: #4b5563;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }
    .qcm-slot-btn.active {
      border-color: #243038;
      background: #243038;
      color: #ffffff;
    }
    .qcm-slot-btn.qcm-learning-back-btn {
      border-color: #516776;
      background: #ffffff;
      color: #243038;
    }
    /* Catégorie sans créneau prêt (ex. QCM actu/Culture générale pas encore
       généré) : visible pour montrer la mise en page normale plutôt que de
       la faire disparaître ou de rediriger automatiquement ailleurs, mais
       non cliquable. */
    .qcm-slot-btn:disabled {
      border-color: #e5e7eb;
      background: #f3f4f6;
      color: #9ca3af;
      cursor: not-allowed;
    }
    /* "Ancrer"/"Relier" dorés avec reflet quand de nouveaux éléments les attendent
       (isCategoryAvailable, cf. renderCategorySwitcher) — même dégradé que le bouton
       "Ma mémoire" du sélecteur de l'accueil (#mnoria-cloud-mode-memoire-btn, style.css), pour
       une mise en avant cohérente sur tout le site. Retombe sur le style neutre habituel dès
       que la série est faite (available forcé à false en local dans renderFinalScore, jamais
       via un refetch serveur — cf. ce commentaire là-bas pour le pourquoi) — demande du
       17/08/2026. Jamais posé sur l'onglet actif : .active a
       une spécificité plus forte (2 classes) et l'emporterait de toute façon sur le fond, mais
       le reflet animé resterait visible en trop sur un onglet déjà ouvert sans ce garde-fou
       (cf. renderCategorySwitcher, qui n'ajoute cette classe que si !active).
       overflow:hidden : contient le reflet (::after) dans la forme arrondie de la pastille. */
    .qcm-slot-btn-new {
      position: relative;
      overflow: hidden;
      border-color: transparent;
      background: linear-gradient(135deg, #ffd166, #e99a2e);
      color: #1A1F24;
      box-shadow: inset 0 0 0 1px rgba(122, 72, 10, 0.28);
    }
    .qcm-slot-btn-new::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(120deg, transparent 18%, rgba(255, 255, 255, 0.55) 50%, transparent 82%);
      transform: translateX(-130%);
      animation: qcm-slot-btn-new-shine 2.8s ease-in-out infinite;
    }
    @keyframes qcm-slot-btn-new-shine {
      0%, 55%, 100% { transform: translateX(-130%); }
      75% { transform: translateX(130%); }
    }
    @media (max-width: 480px) {
      .qcm-slot-switcher { gap: 4px; }
      .qcm-slot-btn {
        padding: 6px 8px;
        font-size: 12px;
      }
    }
    /* "Mes acquis" (demande du 16/08/2026) : accueille désormais "Tous mes apprentissages"
       (classé par thématique, y compris la rubrique "Comprendre les liens") — retiré de
       Découvrir, qui ne garde que "En attente de réalisation" (cf. loadMesAcquis,
       renderMesAcquisList). */
    .qcm-mes-acquis-row {
      display: none;
      justify-content: center;
      margin: -10px 0 20px;
    }
    /* Même règle de visibilité que le switcher juste au-dessus (#qcm-category-switcher.visible,
       posée/retirée par renderCategorySwitcher) : masqué pendant le chargement initial, jamais
       affiché seul sans ses boutons Découvrir/Ancrer/Relier. Margin-top négatif : rapproche le
       bouton du switcher (demande du 16/08/2026), qui garde par ailleurs ses 20px de marge
       basse habituels pour les autres pages n'ayant pas ce bouton. */
    #qcm-category-switcher.visible + .qcm-mes-acquis-row {
      display: flex;
    }
    .qcm-mes-acquis-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 16px;
      border: 1.5px solid #243038;
      border-radius: 999px;
      background: #ffffff;
      color: #243038;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }
    .qcm-mes-acquis-btn i {
      font-size: 12px;
    }
    .qcm-mes-acquis-btn:hover:not(.active) {
      background: #eef2f5;
    }
    .qcm-mes-acquis-btn.active {
      border-color: #243038;
      background: #243038;
      color: #ffffff;
    }
    .qcm-custom-search {
      display: none;
      flex-wrap: wrap;
      gap: 8px;
      margin: 0 0 20px;
    }
    .qcm-custom-search.visible {
      display: flex;
    }
    .qcm-custom-search-input {
      flex: 1;
      flex-basis: 280px;
      min-width: 0;
      /* <textarea> plutôt qu'un <input> à une seule ligne (cf. 12/08/2026) :
         un placeholder/sujet trop long pour la largeur du champ passait à la
         ligne suivante au lieu de rester lisible en entier — jamais de
         coupure ni d'ellipsis, la hauteur s'adapte plutôt que le texte.
         Compact par défaut (desktop, largeur confortable, le placeholder
         tient sur une ligne) — agrandi seulement sur mobile ci-dessous, où
         il ne tient pas (cf. 13/08/2026 : trop haute sur desktop sinon).
         height:auto obligatoire : public/style.css impose "textarea{height:
         140px}" globalement (zones de commentaires) — height prime sur
         min-height, sans ce override le champ restait bloqué à 140px malgré
         min-height:44px (constaté le 13/08/2026, capture à l'appui : le
         bouton "Générer" s'étirait aussi en énorme cercle à côté, cf.
         align-items:stretch par défaut sur .qcm-custom-search). */
      height: auto;
      min-height: 44px;
      padding: 10px 14px;
      border: 1px solid #d1d5db;
      border-radius: 18px;
      background: #f9fafb;
      color: #1f2937;
      font-size: 14px;
      font-family: inherit;
      line-height: 1.4;
      resize: none;
    }
    .qcm-custom-search-input:focus {
      outline: none;
      border-color: #516776;
      background: #ffffff;
    }
    .qcm-custom-search-btn {
      flex-shrink: 0;
      padding: 10px 16px;
      border: none;
      border-radius: 999px;
      background: #243038;
      color: #ffffff;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }
    .qcm-custom-search-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .qcm-knowledge-add {
      position: relative;
      flex: 0 0 100%;
      display: flex;
      justify-content: flex-start;
    }
    .qcm-knowledge-add-toggle {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 7px 2px;
      border: 0;
      background: transparent;
      color: #516776;
      font: inherit;
      font-size: 13px;
      font-weight: 700;
      line-height: 1.2;
      cursor: pointer;
    }
    .qcm-knowledge-add-toggle:hover,
    .qcm-knowledge-add-toggle:focus-visible,
    .qcm-knowledge-add-toggle[aria-expanded="true"] {
      color: #243038;
    }
    .qcm-knowledge-add-toggle:focus-visible {
      outline: 2px solid #516776;
      outline-offset: 3px;
      border-radius: 4px;
    }
    .qcm-knowledge-add-menu {
      position: absolute;
      z-index: 20;
      top: calc(100% + 4px);
      left: 0;
      width: min(390px, calc(100vw - 48px));
      padding: 6px;
      border: 1px solid #d9dfe3;
      border-radius: 14px;
      background: #ffffff;
      box-shadow: 0 12px 30px rgba(36, 48, 56, 0.12);
    }
    .qcm-knowledge-add-menu[hidden] {
      display: none;
    }
    .qcm-knowledge-add-option {
      display: grid;
      grid-template-columns: 24px minmax(0, 1fr);
      gap: 0 9px;
      align-items: center;
      padding: 10px 11px;
      border-radius: 9px;
      color: #243038;
      text-decoration: none;
    }
    .qcm-knowledge-add-option:hover,
    .qcm-knowledge-add-option:focus-visible {
      outline: none;
      background: #eef2f5;
    }
    .qcm-knowledge-add-option i {
      grid-row: 1 / span 2;
      color: #516776;
      text-align: center;
    }
    .qcm-knowledge-add-option strong {
      font-size: 13px;
      line-height: 1.3;
    }
    .qcm-knowledge-add-option span {
      color: #6b7280;
      font-size: 12px;
      line-height: 1.35;
    }
    .qcm-custom-search-status {
      margin: -8px 0 20px;
      font-size: 13px;
      color: #6b7280;
      text-align: center;
    }
    .qcm-custom-search-status.is-error {
      color: #d64545;
    }
    /* "Camembert" qui se noircit en boucle pendant la génération (demande du
       13/08/2026, remplace un chiffré temps écoulé/compte à rebours écarté
       par l'utilisateur) : la durée réelle varie de quelques secondes à
       plusieurs minutes (sujet énumérable, cf. server.js
       NOTION_QUIZ_ENUMERABLE_MAX_ROUNDS) — plutôt que d'afficher un temps
       potentiellement faux, une boucle indéterminée qui montre juste "ça
       travaille" sans jamais prétendre savoir combien de temps il reste.
       conic-gradient mis à jour en JS (cf. startPieSpinner) plutôt qu'une
       animation CSS pure : évite @property, pas supporté partout. */
    .qcm-pie-spinner {
      width: 36px;
      height: 36px;
      margin: 4px auto 20px;
      border-radius: 50%;
      background: conic-gradient(#243038 0deg, #e2e6ea 0deg);
      box-shadow: inset 0 0 0 1px #d1d5db;
    }
    /* Bouton "Explorer les apprentissages disponibles" (demande du 13/08/2026) :
       adopter un sujet déjà généré par un autre visiteur plutôt que de
       relancer une génération IA pour un sujet proche. Style secondaire
       (contour, pas fond plein) : moins prioritaire que "Générer". */
    .qcm-explore-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      margin: 0 0 20px;
      padding: 10px 16px;
      border: 1px solid #d1d5db;
      border-radius: 999px;
      background: #f9fafb;
      color: #243038;
      font: inherit;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }
    .qcm-explore-btn:hover,
    .qcm-explore-btn:focus-visible {
      background: #eef3f6;
      border-color: #516776;
    }
    .qcm-explore-search-input {
      width: 100%;
      margin: 0 0 14px;
      padding: 10px 14px;
      border: 1px solid #d1d5db;
      border-radius: 999px;
      background: #f9fafb;
      color: #1f2937;
      font: inherit;
      font-size: 14px;
      box-sizing: border-box;
    }
    .qcm-explore-search-input:focus {
      outline: none;
      border-color: #516776;
      background: #ffffff;
    }
    /* position:relative (jamais fixed, contrairement à .qcm-fiche-overlay) :
       porte le dégradé "suite" générique (.scroll-fade-hint, cf. style.css,
       position:absolute) directement en enfant — la contrainte iOS Safari
       documentée plus haut (position:absolute dans un ancêtre position:fixed
       scrollable) ne s'applique pas ici, .qcm-explore-list-wrap n'est pas
       fixed. */
    .qcm-explore-list-wrap {
      position: relative;
    }
    .qcm-explore-list {
      display: flex;
      flex-direction: column;
      gap: 6px;

       pour un sujet déjà dans la liste personnelle du visiteur (contrairement
       à .qcm-explore-item-meta, qui elle bascule selon cet état). */
    .qcm-explore-item-count {
      font-size: 12px;
      font-weight: 600;
      color: #6b7280;
    }
    /* Intitulé exact tapé par le créateur (demande du 13/08/2026) : distinct
       du titre au-dessus (item.label, reformulé par l'IA) — jamais en gras,

    .qcm-explore-item-query {

       sujet + niveau choisis, pour éviter une génération lancée par erreur
       (sujet mal tapé, mauvais niveau cliqué) — même famille visuelle que les
       autres popups de cette page (.qcm-fiche-overlay/.qcm-fiche-modal). */
    .qcm-generate-confirm-text {

    .qcm-progress {

    /* Barre de progression Ancrer/Relier (demande du 17/08/2026, cf.
       renderProgressIndicatorHtml) — remplace le texte "Question X / Y" sur
       ces deux catégories uniquement, centrée au-dessus de la question. */
    .qcm-progress-bar {
      position: relative;
      width: 100%;
      max-width: 320px;
      height: 10px;
      margin: 0 auto 22px;
      border-radius: 999px;
      background: #e5e7eb;
      box-shadow: inset 0 1px 2px rgba(15, 23, 42, 0.12);
      overflow: visible;
    }
    .qcm-progress-bar-fill {
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, #2f6fed, #243038);
      box-shadow: 0 0 8px rgba(47, 111, 237, 0.45);
      transition: width 0.35s ease;
      overflow: hidden;
    }
    /* +1 furtif au milieu de l'écran à chaque bonne réponse (Ancrer/Relier,
       demande du 17/08/2026, agrandi + halo flouté le même jour) : apparaît
       puis disparaît seul, pas un compteur persistant. Position fixe (pas liée
       à la barre, ni au scroll), retiré du DOM par showProgressPlusOne() une
       fois l'animation terminée. */
    .qcm-progress-plus-one {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.6);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 18px 34px;
      border-radius: 999px;
      background: radial-gradient(circle, rgba(31, 157, 85, 0.42), rgba(31, 157, 85, 0));
      font-family: inherit;
      font-weight: 800;
      font-size: 96px;
      color: #1f9d55;
      text-shadow:
        0 0 22px rgba(31, 157, 85, 0.95),
        0 0 55px rgba(31, 157, 85, 0.8),
        0 0 100px rgba(31, 157, 85, 0.6),
        0 0 160px rgba(31, 157, 85, 0.4);
      box-shadow:
        0 0 50px 16px rgba(31, 157, 85, 0.45),
        0 0 110px 40px rgba(31, 157, 85, 0.3);
      pointer-events: none;
      white-space: nowrap;
      z-index: 500;
      animation: qcm-progress-plus-one-pop 450ms ease forwards;
    }
    @keyframes qcm-progress-plus-one-pop {
      0% { opacity: 0; transform: translate(-50%, -50%) scale(0.5); filter: blur(6px); }
      12% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); filter: blur(0); }
      50% { opacity: 1; transform: translate(-50%, -50%) scale(1); filter: blur(0); }
      100% { opacity: 0; transform: translate(-50%, -50%) scale(1.25); filter: blur(4px); }
    }

    .qcm-mesqcm-group + .qcm-mesqcm-group {

    .qcm-mesqcm-table-shell {

    .qcm-mesqcm-table-scroll-hint {

    /* Nombre de questions du QCM associé à cette connaissance (demande du
       13/08/2026) — texte simple entre parenthèses à côté du nom, jamais
       confondu avec le badge d'ancrage (%) de la colonne suivante. */
    .qcm-mesqcm-question-count {
      flex: 0 0 auto;
      color: #6b7280;
      font-size: 12px;
      font-weight: 400;
      white-space: nowrap;
    }
    /* Fenêtre de choix ouverte au clic sur le nom d'un apprentissage (cf.
       openMesQcmActionMenu) : "Consulter la fiche", "Faire/refaire le QCM"
       ou "Supprimer". Une vraie fenêtre modale centrée (.qcm-fiche-overlay/
       .qcm-fiche-modal, même gabarit que la fiche elle-même) plutôt qu'un
       petit menu ancré sous le bouton (demande du 13/08/2026 : "trop petit,
       on dirait un menu") — .qcm-mesqcm-action-menu-item/-info ci-dessous
       restent utilisées à l'intérieur de cette fenêtre. */
    .qcm-mesqcm-action-modal-name {
      margin: 0 0 12px;
      font-size: 17px;
      font-weight: 800;
      color: #111827;
    }
    /* Taux d'ancrage (demande du 13/08/2026) : rappelé en tête de la fenêtre
       de choix plutôt que seulement dans la colonne du tableau, désormais
       cachée derrière ce popup pour Fiche/QCM/Supprimer. */
    .qcm-mesqcm-action-menu-info {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 6px 12px 10px;
      margin-bottom: 4px;
      border-bottom: 1px solid #eef1f3;
      font-size: 13px;
      font-weight: 700;
      color: #6b7280;
    }
    .qcm-mesqcm-action-menu-item {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 10px 12px;
      border: none;
      border-radius: 8px;
      background: none;
      font: inherit;
      font-size: 14px;
      font-weight: 600;
      color: #111827;
      text-align: left;
      cursor: pointer;
    }
    .qcm-mesqcm-action-menu-item:hover,
    .qcm-mesqcm-action-menu-item:focus-visible {
      background: #f3f4f6;
    }
    .qcm-mesqcm-action-menu-item i {
      flex: 0 0 auto;
      width: 18px;
      text-align: center;
      color: #516776;
    }
    .qcm-mesqcm-action-menu-item-danger {
      color: #dc2626;
    }
    .qcm-mesqcm-action-menu-item-danger i {
      color: #dc2626;
    }
    .qcm-mesqcm-action-menu-item-danger:hover,
    .qcm-mesqcm-action-menu-item-danger:focus-visible {
      background: #fef2f2;
    }
    /* Retrait d'un apprentissage (cf. server.js POST
       /api/users/notion-quizzes/remove) — ne supprime que la ligne
       personnelle du visiteur, jamais le QCM partagé. Confirmation native
       (window.confirm) avant l'appel, même convention que les autres
       suppressions du site (cf. deleteDebate, deleteReport). */
    .qcm-mesqcm-delete-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      padding: 0;
      border: 1px solid #d1d5db;
      border-radius: 999px;
      background: #f9fafb;
      color: #6b7280;
      font-size: 13px;
      cursor: pointer;
    }
    .qcm-mesqcm-delete-btn:hover {
      background: #fef2f2;
      border-color: #dc2626;
      color: #dc2626;
    }
    /* Pastilles de thématiques (cf. renderThemeTags, server.js
       classifyCultureGeneraleThemesWithAI) — sous le nom dans le tableau
       "Mes QCM", sous le nom dans la fiche (cf. buildFicheModalHtml). */
    .qcm-mesqcm-themes {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin: 4px 0 0 24px;
    }
    .qcm-fiche-name + .qcm-mesqcm-themes {
      margin: 0 0 10px;
    }
    .qcm-mesqcm-theme-tag {
      padding: 2px 9px;
      border-radius: 999px;
      background: #eef3f6;
      color: #516776;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
    }
    /* "Les liens" (cf. renderLinksSection, server.js
       findAndStoreCultureGeneraleNotionLink) — connaissances déjà apprises
       reliées à celle-ci dans la fiche, cliquables pour ouvrir la fiche liée. */
    .qcm-fiche-links {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin: 0 0 14px;
    }
    .qcm-fiche-link-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border: 1px solid #e2e8ec;
      border-radius: 10px;
      background: #f8fafb;
      font-family: Arial, Helvetica, sans-serif;
      text-align: left;
      cursor: pointer;
    }
    .qcm-fiche-link-item:hover {
      border-color: #a8bcc7;
      background: #eef3f6;
    }
    .qcm-fiche-link-label {
      flex: none;
      padding: 2px 9px;
      border-radius: 999px;
      background: #dde8ee;
      color: #34505f;
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
    }
    .qcm-fiche-link-name {
      font-size: 14px;
      font-weight: 700;
      color: #1f2d33;
    }
    /* Corrigé des questions dans la fiche "Mes QCM" (cf.
       renderFicheQuestionCorrige) — lecture seule, jamais interactif : la
       bonne réponse est directement mise en évidence, contrairement au vrai
       QCM où elle n'est révélée qu'après réponse. */
    .qcm-fiche-corrige-item {
      margin-top: 18px;
      padding-top: 14px;
      border-top: 1px solid #eef1f3;
    }
    .qcm-fiche-corrige-num {
      margin: 0 0 4px;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      color: #9ca3af;
    }
    .qcm-fiche-corrige-question {
      margin: 0 0 8px;
      font-size: 15px;
      font-weight: 600;
      color: #111827;
      line-height: 1.35;
    }
    .qcm-fiche-corrige-list {
      margin: 0 0 8px;
      padding: 0;
      list-style: none;
    }
    .qcm-fiche-corrige-list li {
      padding: 7px 10px;
      margin-bottom: 5px;
      border: 1px solid #e5e7eb;
      border-radius: 6px;
      background: #f9fafb;
      color: #4b5563;
      font-size: 14px;
    }
    .qcm-fiche-corrige-list.qcm-fiche-corrige-ordered {
      list-style: decimal;
      padding-left: 20px;
    }
    .qcm-fiche-corrige-list.qcm-fiche-corrige-ordered li {
      padding: 2px 0;
      margin-bottom: 2px;
      border: none;
      background: none;
    }
    .qcm-fiche-corrige-list li.is-correct {
      border-color: #1f9d55;
      background: #f0fdf4;
      color: #166534;
      font-weight: 600;
    }
    .qcm-fiche-corrige-explanation {
      margin: 0;
      font-size: 13px;
      color: #6b7280;
      line-height: 1.4;
    }
    /* Fiche ouverte depuis "Mes apprentissages" : nom + détail pur du
       concept/mécanisme/citation/œuvre, même esprit que les cartes Éclairages
       sans reprendre leur mise en page riche (sources) ni tout ce qui relie
       l'élément à l'actualité du jour (déjà exclu côté serveur). L'image du
       concept/mécanisme/auteur/œuvre (sourceDetail.image), quand elle
       existe, est en revanche reprise telle quelle. */
    .qcm-fiche-overlay {
      position: fixed;
      inset: 0;
      z-index: 1000;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      /* max(20px, safe-area) plutôt qu'un padding fixe : en PWA standalone
         (encoche/île dynamique), un padding-top de 20px seul ne suffit pas à
         dégager la zone sûre — la croix de fermeture en haut de la fiche
         (.qcm-fiche-close) pouvait se retrouver sous le statut/l'encoche,
         invisible ou impossible à toucher. */
      padding: max(20px, env(safe-area-inset-top)) 20px max(20px, env(safe-area-inset-bottom));
      background: rgba(17, 24, 39, 0.55);
    }
    /* .scroll-fade-hint (générique, cf. style.css) est position:absolute —
       correct pour ses autres usages (imbriqué dans un cadre non-scrollable),
       mais pas ici où le parent scrollable EST l'élément position:fixed
       (.qcm-fiche-overlay) : sur iOS Safari un enfant absolute d'un tel
       parent ne reste pas fiablement épinglé pendant le défilement. Posé en
       position:fixed direct sur <body> à la place (cf. openMesQcmFiche), et
       recalé ici en largeur sur la fiche (max-width identique à
       .qcm-fiche-modal) — sinon le dégradé pleine largeur déborde des bords
       d'une fiche centrée plus étroite que l'écran.
       "bottom" décalé de env(safe-area-inset-bottom) plutôt que collé à 0 :
       en PWA standalone sur certains iPhones (X/XS/11/11 Pro), le compositeur
       WebKit ne peint rien dans les ~44 derniers px du bas de l'écran (limite
       matérielle déjà documentée, aucune technique CSS ne peint dans cette
       zone) — un élément à bottom:0 y devient invisible/coupé. Le décaler de
       la valeur fiable de la zone sûre (déjà utilisée par le dock flottant du
       site pour la même raison) le sort de cette zone morte. */
    /* bottom = exactement env(safe-area-inset-bottom), sans marge de confort
       supplémentaire : d'après le diagnostic déjà mené sur ces appareils
       (memory standalone-bottom-band-abandoned), le dock flottant du site est
       "déjà au plus bas affichable" à cette valeur précise — descendre
       davantage retomberait dans la zone que WebKit ne peint jamais en
       standalone. */
    .qcm-fiche-fade-hint {
      position: fixed;
      bottom: var(--mnoria-safe-bottom, env(safe-area-inset-bottom, 0px));
      max-width: 480px;
      margin: 0 auto;
      z-index: 1001;
    }
    /* Centré sur min-height:100% (pas plus, sinon la fiche est centrée dans
       un cadre plus grand que l'écran et apparaît trop basse). Le débattement
       de scroll vers le bas vient du spacer .qcm-fiche-scroll-spacer placé
       APRÈS la fiche dans la colonne : il pousse le groupe (fiche + spacer)
       vers le haut à la centration, sans jamais faire descendre la fiche.
       Seul .qcm-fiche-overlay scrolle (cf. .qcm-fiche-modal plus bas, sans
       son propre overflow) : deux zones de scroll imbriquées se disputaient
       le geste tactile sur mobile et empêchaient d'atteindre le bas d'une
       fiche longue. */
    .qcm-fiche-overlay-inner {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100%;
    }
    .qcm-fiche-scroll-spacer {
      flex: 0 0 auto;
      width: 100%;
      height: 20px;
      pointer-events: none;
    }
    .qcm-fiche-modal {
      width: 100%;
      max-width: 480px;
      padding: 20px;
      border-radius: 12px;
      background: #ffffff;
      box-shadow: 0 20px 45px rgba(17, 24, 39, 0.25);
    }
    .qcm-fiche-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }
    .qcm-fiche-rubric {
      display: flex;
      align-items: center;
      gap: 6px;
      margin: 0;
      font-size: 13px;
      font-weight: 700;
      color: #516776;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }
    /* position:sticky (pas fixed) : la croix doit rester visible en haut à
       droite en scrollant une fiche longue, mais ancrée au CADRE (la carte
       blanche .qcm-fiche-modal, centrée et pas forcément pleine largeur sur
       desktop), pas à l'écran — un position:fixed la détachait visuellement
       de la carte sur un écran large (constaté le 13/08/2026, capture à
       l'appui : la croix restait collée au coin de l'écran, loin de la carte
       étroite et centrée). sticky reste dans le flux de .qcm-fiche-head
       (justify-content:space-between la positionne donc naturellement à
       droite du libellé de rubrique) tout en s'épinglant verticalement au
       défilement de .qcm-fiche-overlay (le conteneur scrollable) — sans
       jamais quitter la largeur du cadre. */
    .qcm-fiche-close {
      position: sticky;
      top: max(20px, env(safe-area-inset-top));
      z-index: 1002;
      flex: 0 0 auto;
      width: 28px;
      height: 28px;
      border: none;
      border-radius: 999px;
      background: #eef3f6;
      color: #243038;
      font-size: 14px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(17, 24, 39, 0.18);
    }
    .qcm-fiche-name {
      margin: 0 0 4px;
      font-size: 18px;
      font-weight: 700;
      color: #111827;
      line-height: 1.3;
    }
    .qcm-fiche-meta {
      margin: 0 0 12px;
      font-size: 13px;
      font-weight: 600;
      color: #516776;
    }
    .qcm-fiche-image {
      margin: 0 auto 14px;
      max-width: 280px;
    }
    .qcm-fiche-image img {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 8px;
      border: 1px solid #e5e7eb;
    }
    .qcm-fiche-image figcaption {
      margin-top: 4px;
      font-size: 11px;
      color: #9ca3af;
      text-align: right;
    }
    .qcm-fiche-image figcaption a {
      color: #9ca3af;
    }
    .qcm-fiche-section-label {
      margin: 14px 0 4px;
      font-size: 13px;
      font-weight: 700;
      color: #243038;
      text-transform: uppercase;
      letter-spacing: 0.02em;
    }
    .qcm-fiche-explanation {
      margin: 0 0 4px;
      font-size: 14px;
      color: #4b5563;
      line-height: 1.5;
    }
    .qcm-fiche-explanation:first-of-type {
      margin-top: 0;
    }
    .qcm-fiche-bottom-close {
      display: block;
      width: 100%;
      margin: 18px 0 0;
      padding: 11px 16px;
      border: 1px solid #d7dde2;
      border-radius: 10px;
      background: #f3f6f4;
      color: #1f2933;
      font: inherit;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease;
    }
    .qcm-fiche-bottom-close:hover {
      background: #e9efec;
      border-color: #c6d0d8;
    }
    /* Badge cosmétique au-dessus de la question pour les formats
       vrai_faux/texte_a_trous : rend la variété de formats visible sans
       toucher au reste de la mise en page. */
    .qcm-type-badge {
      display: inline-block;
      margin: 0 0 8px;
      padding: 3px 10px;
      border-radius: 999px;
      background: #eef3f6;
      color: #243038;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }
    /* Badge d'origine (actu / culture générale) : distingue une question
       actualité d'une question culture générale une fois mélangées dans la
       même session (cf. fusion QCM actu + Culture Générale) — seules ces
       dernières alimentent Mon univers. */
    .qcm-origin-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      margin: 0 6px 8px 0;
      padding: 3px 10px;
      border-radius: 999px;
      background: #e9f1fb;
      color: #1e3a5f;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.02em;
    }
    /* Boutons Facile/Moyen/Difficile (cf. wireDifficultyButtons, demande du
       13/08/2026) : remplacent "Valider" — valider et noter la difficulté
       ressentie en un seul geste, obligatoire pour passer à la suite.
       "Moyen" mis en avant visuellement (plus grand, couleur pleine) comme
       choix par défaut/neutre ; Facile/Difficile en retrait de part et
       d'autre. */
    .qcm-difficulty-wrap {
      margin: 16px 0 0;
    }
    .qcm-difficulty-label {
      margin: 0 0 6px;
      font-family: "Barlow Condensed", Arial, sans-serif;
      font-size: 13px;
      color: #8a97a3;
    }
    .qcm-difficulty-buttons {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .qcm-difficulty-btn {
      flex: 1;
      padding: 10px 8px;
      border: 1px solid #d1d5db;
      border-radius: 999px;
      background: #f9fafb;
      color: #516776;
      font-family: "Barlow Condensed", Arial, sans-serif;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      cursor: pointer;
    }
    .qcm-difficulty-btn:hover:not(:disabled) {
      border-color: #b8c2ca;
      background: #eef3f6;
    }
    .qcm-difficulty-btn:disabled {
      opacity: 0.45;
      cursor: default;
    }
    .qcm-difficulty-btn-moyen {
      flex: 1.3;
      padding: 12px 8px;
      border: none;
      background: #243038;
      color: #ffffff;
      font-size: 15px;
    }
    .qcm-difficulty-btn-moyen:hover:not(:disabled) {
      background: #384852;
    }
    /* Bouton "Ne plus me la demander" (cf. wireExcludeButton) : discret,
       en bas de carte sous "Valider ma réponse"/les propositions (jamais en
       haut, cf. demande du 13/08/2026 — pour ne pas laisser deviner qu'une
       question est "à écarter" avant même de l'avoir lue) — exclut la
       question courante des futures repasses ("Renforcement"), jamais de la
       session en cours. */
    .qcm-exclude-btn {
      display: block;
      margin: 10px auto 0;
      padding: 3px 10px;
      border: 1px solid #dbe2e7;
      border-radius: 999px;
      background: #ffffff;
      color: #7a8792;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.02em;
      cursor: pointer;
    }
    .qcm-exclude-btn:hover {
      border-color: #b8c2ca;
      color: #516776;
    }
    .qcm-exclude-btn:disabled {
      opacity: 0.6;
      cursor: default;
    }
    /* Marqueur "___" d'une question texte_a_trous, mis en valeur dans le
       texte de la question — jamais introduit avant l'échappement HTML
       (cf. renderChoiceQuestion), donc toujours sûr à afficher. */
    .qcm-blank {
      display: inline-block;
      min-width: 46px;
      padding: 0 4px;
      border-bottom: 2px solid #516776;
      color: #516776;
      font-weight: 700;
      text-align: center;
    }
    .qcm-assoc-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }
    .qcm-assoc-left {
      flex: 1 1 auto;
      padding: 10px 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      background: #f9fafb;
      color: #1f2937;
      font-size: 14px;
    }
    .qcm-assoc-select {
      flex: 1 1 auto;
      padding: 10px 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      background: #ffffff;
      color: #1f2937;
      font-size: 14px;
      cursor: pointer;
    }
    .qcm-assoc-select:disabled {
      cursor: default;
      opacity: 0.85;
    }
    .qcm-assoc-select.is-correct {
      border-color: #1f9d55;
      background: #f0fdf4;
      color: #166534;
    }
    .qcm-assoc-select.is-wrong {
      border-color: #d64545;
      background: #fef2f2;
      color: #991b1b;
    }
    .qcm-assoc-correct-hint {
      flex: 1 1 auto;
      font-size: 12px;
      color: #1f9d55;
    }
    /* Format "qcm_multi" : boutons à bascule (coche visible une fois
       sélectionné), même gabarit que .qcm-option-btn mais sans la barre de
       remplissage (les stats agrégées ne représentent pas un choix par
       option ici, cf. commentaire côté serveur — pas de %). */
    .qcm-multi-hint {
      /* Marge haute positive (pas négative) : cet indice suit tantôt la question
         (.qcm-question, déjà 18px de marge basse), tantôt le bouton "Réfléchis à ta
         réponse..." quand la question est gate (qcm-reveal-btn, sans marge basse) —
         une valeur négative le faisait chevaucher ce bouton. */
      margin: 8px 0 14px;
      color: #6b7280;
      font-size: 13px;
    }
    .qcm-option-btn-multi .qcm-option-row {
      justify-content: flex-start;
      gap: 10px;
    }
    .qcm-option-check {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 20px;
      height: 20px;
      border: 1.5px solid #d1d5db;
      border-radius: 5px;
      background: #ffffff;
      color: transparent;
      font-size: 12px;
      transition: border-color 0.15s ease, background 0.15s ease, color 0.15s ease;
    }
    .qcm-option-btn-multi.is-selected .qcm-option-check {
      border-color: #243038;
      background: #243038;
      color: #ffffff;
    }
    .qcm-option-btn-multi.answered.is-correct .qcm-option-check {
      border-color: #1f9d55;
      background: #1f9d55;
      color: #ffffff;
    }
    .qcm-option-btn-multi.answered.is-wrong-picked .qcm-option-check {
      border-color: #d64545;
      background: #d64545;
      color: #ffffff;
    }
    /* Format "ordre" : deux zones — la séquence choisie (numérotée) et les
       éléments encore disponibles — plutôt qu'un glisser-déposer. */
    .qcm-order-hint {
      margin: -12px 0 14px;
      color: #6b7280;
      font-size: 13px;
    }
    .qcm-order-chosen {
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-height: 12px;
      margin-bottom: 14px;
    }
    .qcm-order-pool {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 4px;
    }
    .qcm-order-chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      background: #f9fafb;
      color: #1f2937;
      font-size: 14px;
      text-align: left;
      cursor: pointer;
    }
    .qcm-order-chip:disabled {
      cursor: default;

  // Hauteur réelle du bandeau .topbar (sticky, z-index 20, cf. style.css) —
  // mesurée plutôt que recopiée en dur : elle varie selon le breakpoint et
  // grandit avec env(safe-area-inset-top) en PWA standalone sur encoche.
  // .qcm-panel-close-anchor (juste plus bas) s'épingle à cette hauteur
  // plutôt qu'à 0, sinon la croix du cadre se retrouverait masquée SOUS le
  // bandeau une fois les deux épinglés au même point pendant le scroll
  // (demande du 17/08/2026, "reste apparent même en scrollant").
  (function () {
    // +20px de marge (demande du 17/08/2026 : la croix passe à top:-20px sur
    // .qcm-panel-close — assez haute pour rester lisible à côté du titre,
    // mais sans déborder du cadre, cf. réajustement du même jour) : sans
    // cette marge supplémentaire ici, une fois épinglée sous le bandeau
    // pendant le scroll, ce même décalage négatif ferait remonter la croix
    // SOUS le bandeau lui-même (chevauchement) plutôt que juste sous son
    // bord — cf. .qcm-panel-close-anchor plus bas, qui s'épingle à cette
    // hauteur.
    var QCM_PANEL_CLOSE_TOP_MARGIN_PX = 20;
    function syncTopbarHeightVar() {
      var topbar = document.querySelector('.topbar');
      var height = (topbar ? topbar.getBoundingClientRect().height : 0) + QCM_PANEL_CLOSE_TOP_MARGIN_PX;
      document.documentElement.style.setProperty('--qcm-topbar-height', height + 'px');
    }
    syncTopbarHeightVar();
    window.addEventListener('resize', syncTopbarHeightVar, { passive: true });
  })();

<script>
(function () {
  var body = document.getElementById('qcm-body');
  var titleText = document.getElementById('qcm-title-text');
  var subtitleText = document.getElementById('qcm-subtitle-text');
  var categorySwitcher = document.getElementById('qcm-category-switcher');
  var customSearchForm = document.getElementById('qcm-custom-search');
  var customSearchInput = document.getElementById('qcm-custom-search-input');
  var customSearchBtn = document.getElementById('qcm-custom-search-btn');
  var customSearchStatus = document.getElementById('qcm-custom-search-status');
  var knowledgeAdd = document.getElementById('qcm-knowledge-add');
  var knowledgeAddToggle = document.getElementById('qcm-knowledge-add-toggle');
  var knowledgeAddMenu = document.getElementById('qcm-knowledge-add-menu');
  var exploreBtn = document.getElementById('qcm-explore-btn');
  var mesAcquisBtn = document.getElementById('qcm-mes-acquis-btn');
  var loadGaugeEl = document.getElementById('qcm-load-gauge');
  var loadGaugeNeedle = document.getElementById('qcm-load-gauge-needle');
  var loadGaugeLabel = document.getElementById('qcm-load-gauge-label');
  var loadGaugeCaption = document.getElementById('qcm-load-gauge-caption');
  var loadGaugeToken = 0;

  function closeKnowledgeAddMenu(options) {
    if (!knowledgeAddMenu || knowledgeAddMenu.hidden) return;
    knowledgeAddMenu.hidden = true;
    knowledgeAddToggle.setAttribute('aria-expanded', 'false');
    if (options && options.restoreFocus) knowledgeAddToggle.focus();
  }
  if (knowledgeAddToggle && knowledgeAddMenu) {
    knowledgeAddToggle.addEventListener('click', function () {
      var willOpen = knowledgeAddMenu.hidden;
      knowledgeAddMenu.hidden = !willOpen;
      knowledgeAddToggle.setAttribute('aria-expanded', willOpen ? 'true' : 'false');
    });
    knowledgeAddToggle.addEventListener('keydown', function (event) {
      if (event.key !== 'ArrowDown') return;
      event.preventDefault();
      knowledgeAddMenu.hidden = false;
      knowledgeAddToggle.setAttribute('aria-expanded', 'true');
      knowledgeAddMenu.querySelector('a')?.focus();
    });
    document.addEventListener('click', function (event) {
      if (!knowledgeAdd.contains(event.target)) closeKnowledgeAddMenu();
    });
    document.addEventListener('keydown', function (event) {
      if (event.key === 'Escape' && !knowledgeAddMenu.hidden) {
        event.preventDefault();
        closeKnowledgeAddMenu({ restoreFocus: true });
      }
    });
  }
  var voterKey = null;
  var questions = [];
  // Référence stable du QCM complet (demande du 13/08/2026, "Refaire les
  // questions loupées") — jamais mutée après le chargement, contrairement à
  // `questions` (l'ensemble affiché à l'instant, qui peut devenir un
  // sous-ensemble des seules questions loupées, ou un ordre mélangé). Sert de
  // socle pour un "Refaire" complet même après un ou plusieurs passages en
  // mode "questions loupées uniquement".
  var originalQuestions = [];
  var answeredByQuestionId = {};
  var currentIndex = 0;
  var currentSlot = null;
  var currentQuizDate = null;
  var currentCategory = null;
  // "Refaire" (demande du 13/08/2026) : rejoue le même QCM depuis le début
  // avec de vraies nouvelles réponses (contrairement à l'ancien "Revoir" qui
  // ne faisait que rafficher les réponses déjà verrouillées), mais sans
  // jamais compter pour l'ancrage/le compteur X/4 (cf. server.js POST
  // /api/daily-quiz/practice-answer, qui grade sans jamais écrire dans
  // daily_quiz_answers — table dont dépend tout le calcul de streak). Les
  // vraies réponses (answeredByQuestionId) restent intactes pendant ce
  // temps, dans une carte séparée.
  var practiceMode = false;
  var practiceAnsweredByQuestionId = {};
  // Compte les bonnes réponses réelles du QCM en cours (+1, +2, +3…) plutôt que
  // d'afficher systématiquement "+1" (demande du 17/08/2026) — remis à zéro à
  // chaque nouveau QCM chargé (cf. loadSlot).
  var qcmCorrectStreakCount = 0;
  function quizAnswerEndpoint() {
    return practiceMode ? '/api/daily-quiz/practice-answer' : '/api/daily-quiz/answer';
  }
  function recordAnsweredQuestion(questionId, data) {
    (practiceMode ? practiceAnsweredByQuestionId : answeredByQuestionId)[questionId] = data;
    // Une bonne réponse réelle peut créer la toute première acquisition affichée dans
    // "Ma mémoire". Supprime immédiatement la confirmation locale d'univers vide : au retour
    // sur l'accueil, le module attendra alors la réponse fraîche et ne montrera jamais
    // furtivement l'ancien message vide devant les nouvelles bulles.
    if (!practiceMode && data && data.correct) {
      try { sessionStorage.removeItem('mnoriaUniverseEmpty:' + voterKey); } catch (e) {}
      qcmCorrectStreakCount += 1;
      showProgressPlusOne(qcmCorrectStreakCount);
    }
  }
  // +N furtif au milieu de l'écran à chaque bonne réponse, sur les 3 catégories
  // (Découvrir/Ancrer/Relier) : purement visuel, retiré du DOM après
  // l'animation CSS (qcm-progress-plus-one-pop) pour ne jamais s'accumuler
  // entre deux questions. N = qcmCorrectStreakCount (+1, +2, +3… au fil des
  // bonnes réponses du QCM en cours, pas systématiquement "+1").
  function showProgressPlusOne(count) {
    var el = document.createElement('span');
    el.className = 'qcm-progress-plus-one';
    el.textContent = '+' + count;
    document.body.appendChild(el);
    setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 500);
    playEncouragingChime();
