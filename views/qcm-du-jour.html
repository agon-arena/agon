<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <script src="/no-zoom.js?v=20260603" defer></script>
  <title>Connaissances | agôn</title>
  <link rel="icon" type="image/png" href="/favicon-64.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icon-192-optimized.png">
  <meta name="theme-color" content="#243038">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Agôn">
  <link rel="stylesheet" href="/style.min.css?v=20260804-bubblejank3">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;700&display=swap">
  <link rel="stylesheet" href="/vendor/fontawesome/css/all.min.css">
  <script>
    if (window.self !== window.top) document.documentElement.classList.add('in-iframe');
    document.addEventListener('DOMContentLoaded', function(){
      if (window.self !== window.top) {
        document.body.classList.add('in-iframe');
        try { window.parent.postMessage({ type: 'agon:debate-iframe-ready', pathname: location.pathname, href: location.href }, '*'); } catch (e) {}
      }
    });
  </script>
  <style>
    /* Même bleu-gris foncé que le bandeau des bulles sur l'accueil (#243038).
       Posé à la fois sur html et body : html a déjà ce fond par défaut (cf.
       style.css ligne ~14068), mais sans hauteur de body qui couvre tout le
       viewport, une bande plus claire pouvait apparaître sous une carte courte. */
    html,
    html:has(body.page-qcm-du-jour) {
      background-color: #243038;
    }
    body.page-qcm-du-jour {
      min-height: 100vh;
      background-color: #243038;
    }
    /* html.in-iframe (pas body.in-iframe) : la classe est posée sur
       <html> de façon synchrone dès l'exécution de ce script (ligne ~21),
       avant même que <body> existe — alors que body.in-iframe n'est ajoutée
       qu'au DOMContentLoaded. Un sélecteur basé sur body.in-iframe faisait
       donc d'abord peindre le cadre avec les règles "hors iframe" (marge du
       haut bien plus grande, cf. .qcm-page-shell plus bas), qui ne se
       corrigeait qu'après coup — un saut visible du cadre vers le haut au
       chargement (constaté le 04/08/2026). */
    html.in-iframe body.page-qcm-du-jour {
      box-sizing: border-box;
      padding-bottom: 360px;
    }
    body.page-qcm-du-jour .topbar-inner {
      justify-content: center !important;
      padding: 2px 0 !important;
    }
    body.page-qcm-du-jour .home-brand-block {
      flex: 0 0 auto !important;
      margin-left: 0 !important;
    }
    body.page-qcm-du-jour .home-logo {
      width: 116px !important;
      transform: translateY(2px) !important;
    }
    body.page-qcm-du-jour .topbar > .agon-user-score-row,
    body.page-qcm-du-jour .topbar-inner > :not(.home-brand-block),
    body.page-qcm-du-jour .home-brand-block > :not(.home-brand-main) {
      display: none !important;
    }
    @media (max-width: 768px) {
      body.page-qcm-du-jour .home-logo {
        width: 74px !important;
      }
      body.page-qcm-du-jour .topbar-inner {
        padding: 0 !important;
      }
    }
    .qcm-page-shell {
      width: min(100% - 32px, 900px);
      margin: 112px auto 180px;
    }
    html.in-iframe .page-qcm-du-jour .qcm-page-shell {
      margin: 20px auto 0;
    }
    /* Doit rester APRÈS la règle ci-dessus (même sélecteur, donc même
       spécificité) : un margin-bottom placé avant un margin raccourci
       équivalent serait écrasé par lui, peu importe le media query. */
    @media (max-width: 768px) {
      /* Vraie zone scrollable en bas, sans pseudo-bandeau ajouté au DOM. */
      html.in-iframe body.page-qcm-du-jour {
        padding-bottom: clamp(360px, 42vh, 520px);
      }
    }
    @media (min-width: 769px) {
      .qcm-page-shell {
        width: min(100% - 64px, 1200px);
      }
    }
    .qcm-panel,
    .qcm-panel * {
      box-sizing: border-box;
    }
    .qcm-panel {
      position: relative;
      width: 100%;
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 24px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.18);
      font-family: Arial, Helvetica, sans-serif;
    }
    .qcm-panel h1 {
      margin: 0 0 4px;
      font-family: "Barlow Condensed", Arial, sans-serif;
      font-size: 34px;
      line-height: 1;
      color: #111827;
      text-align: center;
    }
    .qcm-panel .qcm-subtitle {
      margin: 0 0 16px;
      color: #6b7280;
      font-size: 14px;
      text-align: center;
    }
    .qcm-slot-switcher {
      display: none;
      justify-content: center;
      gap: 8px;
      margin: 0 0 20px;
    }
    .qcm-slot-switcher.visible {
      display: flex;
    }
    .qcm-slot-btn {
      padding: 6px 14px;
      border: 1px solid #d1d5db;
      border-radius: 999px;
      background: #f9fafb;
      color: #4b5563;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }
    .qcm-slot-btn.active {
      border-color: #243038;
      background: #243038;
      color: #ffffff;
    }
    .qcm-progress {
      margin: 0 0 16px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #516776;
    }
    .qcm-question {
      margin: 0 0 18px;
      font-size: 19px;
      font-weight: 600;
      color: #111827;
      line-height: 1.3;
    }
    .qcm-options {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .qcm-option-btn {
      position: relative;
      display: block;
      width: 100%;
      text-align: left;
      padding: 12px 14px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      background: #f9fafb;
      color: #1f2937;
      font-size: 15px;
      cursor: pointer;
      overflow: hidden;
      transition: border-color 0.15s ease, background 0.15s ease;
    }
    .qcm-option-btn:hover:not(:disabled) {
      border-color: #516776;
      background: #eef3f6;
    }
    .qcm-option-btn:disabled {
      cursor: default;
    }
    .qcm-option-fill {
      position: absolute;
      inset: 0;
      width: 0%;
      background: rgba(81, 103, 118, 0.14);
      transition: width 0.4s ease;
      z-index: 0;
    }
    .qcm-option-label,
    .qcm-option-pct {
      position: relative;
      z-index: 1;
    }
    .qcm-option-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .qcm-option-pct {
      display: none;
      font-size: 13px;
      font-weight: 700;
      color: #516776;
      white-space: nowrap;
    }
    .qcm-option-btn.answered .qcm-option-pct {
      display: inline;
    }
    .qcm-option-btn.is-correct {
      border-color: #1f9d55;
      background: #f0fdf4;
    }
    .qcm-option-btn.is-correct .qcm-option-fill {
      background: rgba(31, 157, 85, 0.16);
    }
    .qcm-option-btn.is-wrong-picked {
      border-color: #d64545;
      background: #fef2f2;
    }
    .qcm-option-btn.is-wrong-picked .qcm-option-fill {
      background: rgba(214, 69, 69, 0.16);
    }
    .qcm-feedback {
      display: none;
      margin-top: 14px;
      padding: 12px 14px;
      border-radius: 8px;
      background: #f3f4f6;
      color: #374151;
      font-size: 14px;
      line-height: 1.4;
      text-align: center;
    }
    .qcm-feedback.visible {
      display: block;
    }
    .qcm-feedback .qcm-feedback-verdict {
      display: block;
      margin-bottom: 4px;
      font-weight: 700;
    }
    .qcm-feedback.is-correct .qcm-feedback-verdict { color: #1f9d55; }
    .qcm-feedback.is-wrong .qcm-feedback-verdict { color: #d64545; }
    .qcm-next-btn {
      display: none;
      margin: 16px auto 0;
      padding: 10px 18px;
      border: none;
      border-radius: 999px;
      background: #243038;
      color: #ffffff;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
    }
    .qcm-next-btn.visible {
      display: block;
    }
    .qcm-final-actions {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 16px;
    }
    .qcm-final-actions .qcm-next-btn {
      margin: 0;
    }
    .qcm-state-message {
      color: #6b7280;
      font-size: 15px;
      line-height: 1.4;
    }
    .qcm-loading-hourglass {
      display: inline-block;
      width: 28px;
      height: 28px;
      margin-right: 7px;
      vertical-align: middle;
      object-fit: contain;
      animation: qcmHourglassSpin 0.9s linear infinite;
    }
    @keyframes qcmHourglassSpin { to { transform: rotate(360deg); } }
    .qcm-final-score {
      text-align: center;
      padding: 8px 0;
    }
    .qcm-final-score i {
      font-size: 32px;
      color: #f5b642;
      margin-bottom: 10px;
    }
    .qcm-final-score .qcm-final-score-value {
      font-family: "Barlow Condensed", Arial, sans-serif;
      font-size: 40px;
      color: #111827;
      line-height: 1;
      margin: 4px 0 6px;
    }
    .qcm-final-score .qcm-final-score-label {
      color: #6b7280;
      font-size: 14px;
    }
    .qcm-final-score-hint {
      margin: 14px auto 0;
      max-width: 420px;
      padding: 10px 14px;
      border-radius: 8px;
      background: #f3f4f6;
      color: #4b5563;
      font-size: 13px;
      line-height: 1.4;
    }
    /* Onglet "Mes acquis" : chaque rubrique (mêmes thèmes que les pages
       Éclairages et "Ce jour dans l'Histoire") est un menu repliable — replié
       par défaut, un clic sur son en-tête déplie la liste des notions
       acquises, triées par ordre alphabétique (cf. sourceName, server.js
       extractCultureGeneraleItemName). Le clic sur une notion ouvre la fiche
       (.qcm-fiche-overlay) avec le détail pur du concept/mécanisme/citation/
       œuvre (sourceDetail), jamais la question du QCM. */
    .qcm-acquis-group + .qcm-acquis-group {
      margin-top: 10px;
    }
    .qcm-acquis-group-title {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      margin: 0;
      padding: 14px 4px;
      border: none;
      border-bottom: 1px solid #e5e7eb;
      background: none;
      font: inherit;
      font-family: "Barlow Condensed", Arial, sans-serif;
      font-size: 20px;
      font-weight: 700;
      color: #000000;
      text-align: left;
      cursor: pointer;
    }
    .qcm-acquis-group-title i.qcm-acquis-group-icon {
      font-size: 16px;
      color: #516776;
    }
    .qcm-acquis-group-count {
      flex: 0 0 auto;
      padding: 1px 8px;
      border-radius: 999px;
      background: #eef3f6;
      color: #516776;
      font-family: Arial, sans-serif;
      font-size: 12px;
      font-weight: 700;
    }
    .qcm-acquis-group-chevron {
      flex: 0 0 auto;
      margin-left: auto;
      font-size: 14px;
      color: #9ca3af;
      transition: transform 0.15s ease;
    }
    .qcm-acquis-group.is-open .qcm-acquis-group-chevron {
      transform: rotate(90deg);
    }
    .qcm-acquis-group-items {
      display: none;
      padding: 14px 0 4px;
    }
    .qcm-acquis-group.is-open .qcm-acquis-group-items {
      display: block;
    }
    .qcm-acquis-item {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 12px 4px;
      border: none;
      border-bottom: 1px solid #eef1f3;
      background: none;
      font: inherit;
      text-align: left;
      cursor: pointer;
    }
    .qcm-acquis-item + .qcm-acquis-item {
      margin-top: 0;
    }
    .qcm-acquis-name {
      flex: 1 1 auto;
      margin: 0;
      font-size: 15px;
      font-weight: 400;
      color: #6b7280;
      line-height: 1.35;
    }
    .qcm-acquis-item-chevron {
      flex: 0 0 auto;
      font-size: 13px;
      color: #9ca3af;
    }
    /* Progression vers la validation (4 bonnes réponses à intervalles
       croissants — 3j/7j/1mois, cf. server.js DAILY_QUIZ_ACQUIS_VALIDATION_STREAK) : une
       pastille "n / 3" tant que ce n'est pas acquis, un badge vert une fois
       validé. */
    .qcm-acquis-badge {
      flex: 0 0 auto;
      padding: 2px 9px;
      border-radius: 999px;
      background: #eef3f6;
      color: #516776;
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }
    .qcm-acquis-badge.is-validated {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: #1f9d55;
      color: #ffffff;
    }
    .qcm-acquis-badge.is-validated i {
      font-size: 11px;
    }
    /* Bouton en bas de chaque rubrique dépliée pour la replier sans avoir à
       remonter jusqu'à son en-tête. */
    .qcm-acquis-group-collapse {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
      margin-top: 16px;
      padding: 8px 0 0;
      border: none;
      background: none;
      font: inherit;
      color: #6b7280;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.02em;
      cursor: pointer;
    }
    .qcm-acquis-group-collapse:hover {
      color: #243038;
    }
    /* Fiche ouverte au clic sur une ligne d'acquis : nom + détail pur du
       concept/mécanisme/citation/œuvre, même esprit que les cartes Éclairages
       sans reprendre leur mise en page riche (sources) ni tout ce qui relie
       l'élément à l'actualité du jour (déjà exclu côté serveur). L'image du
       concept/mécanisme/auteur/œuvre (sourceDetail.image), quand elle
       existe, est en revanche reprise telle quelle. */
    .qcm-fiche-overlay {
      position: fixed;
      inset: 0;
      z-index: 1000;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 20px;
      background: rgba(17, 24, 39, 0.55);
    }
    /* Centré sur min-height:100% (pas plus, sinon la fiche est centrée dans
       un cadre plus grand que l'écran et apparaît trop basse). Le débattement
       de scroll vers le bas vient du spacer .qcm-fiche-scroll-spacer placé
       APRÈS la fiche dans la colonne : il pousse le groupe (fiche + spacer)
       vers le haut à la centration, sans jamais faire descendre la fiche.
       Seul .qcm-fiche-overlay scrolle (cf. .qcm-fiche-modal plus bas, sans
       son propre overflow) : deux zones de scroll imbriquées se disputaient
       le geste tactile sur mobile et empêchaient d'atteindre le bas d'une
       fiche longue. */
    .qcm-fiche-overlay-inner {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100%;
    }
    .qcm-fiche-scroll-spacer {
      flex: 0 0 auto;
      width: 100%;
      height: 140px;
      pointer-events: none;
    }
    .qcm-fiche-modal {
      width: 100%;
      max-width: 480px;
      padding: 20px;
      border-radius: 12px;
      background: #ffffff;
      box-shadow: 0 20px 45px rgba(17, 24, 39, 0.25);
    }
    .qcm-fiche-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }
    .qcm-fiche-rubric {
      display: flex;
      align-items: center;
      gap: 6px;
      margin: 0;
      font-size: 13px;
      font-weight: 700;
      color: #516776;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }
    .qcm-fiche-close {
      flex: 0 0 auto;
      width: 28px;
      height: 28px;
      border: none;
      border-radius: 999px;
      background: #eef3f6;
      color: #243038;
      font-size: 14px;
      cursor: pointer;
    }
    .qcm-fiche-name {
      margin: 0 0 4px;
      font-size: 18px;
      font-weight: 700;
      color: #111827;
      line-height: 1.3;
    }
    .qcm-fiche-meta {
      margin: 0 0 12px;
      font-size: 13px;
      font-weight: 600;
      color: #516776;
    }
    .qcm-fiche-image {
      margin: 0 auto 14px;
      max-width: 280px;
    }
    .qcm-fiche-image img {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 8px;
      border: 1px solid #e5e7eb;
    }
    .qcm-fiche-image figcaption {
      margin-top: 4px;
      font-size: 11px;
      color: #9ca3af;
      text-align: right;
    }
    .qcm-fiche-image figcaption a {
      color: #9ca3af;
    }
    .qcm-fiche-section-label {
      margin: 14px 0 4px;
      font-size: 13px;
      font-weight: 700;
      color: #243038;
      text-transform: uppercase;
      letter-spacing: 0.02em;
    }
    .qcm-fiche-explanation {
      margin: 0 0 4px;
      font-size: 14px;
      color: #4b5563;
      line-height: 1.5;
    }
    .qcm-fiche-explanation:first-of-type {
      margin-top: 0;
    }
    .qcm-fiche-bottom-close {
      display: block;
      width: 100%;
      margin: 18px 0 0;
      padding: 11px 16px;
      border: 1px solid #d7dde2;
      border-radius: 10px;
      background: #f3f6f4;
      color: #1f2933;
      font: inherit;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease;
    }
    .qcm-fiche-bottom-close:hover {
      background: #e9efec;
      border-color: #c6d0d8;
    }
    /* Badge cosmétique au-dessus de la question pour les formats
       vrai_faux/texte_a_trous : rend la variété de formats visible sans
       toucher au reste de la mise en page. */
    .qcm-type-badge {
      display: inline-block;
      margin: 0 0 8px;
      padding: 3px 10px;
      border-radius: 999px;
      background: #eef3f6;
      color: #243038;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }
    /* Marqueur "___" d'une question texte_a_trous, mis en valeur dans le
       texte de la question — jamais introduit avant l'échappement HTML
       (cf. renderChoiceQuestion), donc toujours sûr à afficher. */
    .qcm-blank {
      display: inline-block;
      min-width: 46px;
      padding: 0 4px;
      border-bottom: 2px solid #516776;
      color: #516776;
      font-weight: 700;
      text-align: center;
    }
    .qcm-assoc-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }
    .qcm-assoc-left {
      flex: 1 1 auto;
      padding: 10px 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      background: #f9fafb;
      color: #1f2937;
      font-size: 14px;
    }
    .qcm-assoc-select {
      flex: 1 1 auto;
      padding: 10px 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      background: #ffffff;
      color: #1f2937;
      font-size: 14px;
      cursor: pointer;
    }
    .qcm-assoc-select:disabled {
      cursor: default;
      opacity: 0.85;
    }
    .qcm-assoc-select.is-correct {
      border-color: #1f9d55;
      background: #f0fdf4;
      color: #166534;
    }
    .qcm-assoc-select.is-wrong {
      border-color: #d64545;
      background: #fef2f2;
      color: #991b1b;
    }
    .qcm-assoc-correct-hint {
      flex: 1 1 auto;
      font-size: 12px;
      color: #1f9d55;
    }
    /* Format "qcm_multi" : boutons à bascule (coche visible une fois
       sélectionné), même gabarit que .qcm-option-btn mais sans la barre de
       remplissage (les stats agrégées ne représentent pas un choix par
       option ici, cf. commentaire côté serveur — pas de %). */
    .qcm-multi-hint {
      margin: -12px 0 14px;
      color: #6b7280;
      font-size: 13px;
    }
    .qcm-option-btn-multi .qcm-option-row {
      justify-content: flex-start;
      gap: 10px;
    }
    .qcm-option-check {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 20px;
      height: 20px;
      border: 1.5px solid #d1d5db;
      border-radius: 5px;
      background: #ffffff;
      color: transparent;
      font-size: 12px;
      transition: border-color 0.15s ease, background 0.15s ease, color 0.15s ease;
    }
    .qcm-option-btn-multi.is-selected .qcm-option-check {
      border-color: #243038;
      background: #243038;
      color: #ffffff;
    }
    .qcm-option-btn-multi.answered.is-correct .qcm-option-check {
      border-color: #1f9d55;
      background: #1f9d55;
      color: #ffffff;
    }
    .qcm-option-btn-multi.answered.is-wrong-picked .qcm-option-check {
      border-color: #d64545;
      background: #d64545;
      color: #ffffff;
    }
    /* Format "ordre" : deux zones — la séquence choisie (numérotée) et les
       éléments encore disponibles — plutôt qu'un glisser-déposer. */
    .qcm-order-hint {
      margin: -12px 0 14px;
      color: #6b7280;
      font-size: 13px;
    }
    .qcm-order-chosen {
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-height: 12px;
      margin-bottom: 14px;
    }
    .qcm-order-pool {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 4px;
    }
    .qcm-order-chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      background: #f9fafb;
      color: #1f2937;
      font-size: 14px;
      text-align: left;
      cursor: pointer;
    }
    .qcm-order-chip:disabled {
      cursor: default;
    }
    .qcm-order-chip-chosen {
      width: 100%;
      background: #eef3f6;
      border-color: #516776;
    }
    .qcm-order-chip-num {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 20px;
      height: 20px;
      border-radius: 999px;
      background: #243038;
      color: #ffffff;
      font-size: 12px;
      font-weight: 700;
    }
    .qcm-order-chip-static {
      cursor: default;
    }
    .qcm-order-correct-label {
      margin: 0 0 2px;
      color: #6b7280;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }
  </style>
</head>
<body class="page-qcm-du-jour">
<header class="topbar">
  <div class="container topbar-inner topbar-home">
    <div class="home-brand-block">
      <div class="home-brand-main">
        <img src="/logo.jpeg" alt="Logo agôn" class="home-logo">
      </div>
    </div>
  </div>
</header>
<main class="qcm-page-shell">
  <section class="qcm-panel" id="qcm-panel" aria-live="polite">
    <h1><i class="fa-solid fa-circle-question"></i> <span id="qcm-title-text">Connaissances</span></h1>
    <p class="qcm-subtitle" id="qcm-subtitle-text">Teste-toi sur l'actualité du jour, en 10 questions.</p>
    <div class="qcm-slot-switcher" id="qcm-category-switcher"></div>
    <div class="qcm-slot-switcher" id="qcm-slot-switcher"></div>
    <div id="qcm-body"></div>
  </section>
</main>
<script src="/script.min.js?v=20260804-refreshoverlaybleed1" defer></script>
<script>
(function () {
  var body = document.getElementById('qcm-body');
  var titleText = document.getElementById('qcm-title-text');
  var subtitleText = document.getElementById('qcm-subtitle-text');
  var categorySwitcher = document.getElementById('qcm-category-switcher');
  var slotSwitcher = document.getElementById('qcm-slot-switcher');
  var voterKey = null;
  var questions = [];
  var answeredByQuestionId = {};
  var currentIndex = 0;
  var currentSlot = null;
  var currentCategory = null;
  var slotsStatus = null;
  // Jeton incrémenté à chaque loadSlot/loadAcquis : les callbacks async de
  // ces fonctions (fetch imbriqués, parfois lents) vérifient qu'ils sont
  // toujours le dernier appel en date avant de toucher au DOM. Sans ça, un
  // changement d'onglet pendant qu'une requête est encore en vol (ex. clic
  // sur "Mes acquis" avant que /results ait répondu pour l'onglet précédent)
  // laisse la réponse tardive écraser l'écran affiché entre-temps — cf. le
  // "flash" de l'écran de fin de QCM signalé sur l'onglet Mes acquis.
  var loadToken = 0;

  // Trois onglets de haut niveau : "QCM actu" (matin/soir, actualité du
  // jour), "QCM culture générale" (un seul créneau combiné culture_generale,
  // cf. server.js fetchCultureGeneraleQuizCandidates, qui réinjecte aussi des
  // repasses de répétition espacée propres à chaque visiteur) et "Mes acquis"
  // (lecture seule de la banque personnelle, pas un QCM à répondre).
  // Plus de QCM Révision (retiré le 02/08/2026, devenu redondant avec la
  // répétition espacée intégrée à Culture Générale).
  // Le sélecteur de créneaux existant (#qcm-slot-switcher) ne montre plus
  // que les créneaux de la catégorie active, comme sous-choix — reste masqué
  // pour "histoire" tant qu'elle ne contient qu'un seul créneau.
  var CATEGORY_BY_SLOT = {
    morning: 'actu',
    evening: 'actu',
    culture_generale: 'histoire'
  };
  // "acquis" n'est pas un créneau (aucune entrée dans DAILY_QUIZ_SLOTS côté
  // serveur, pas de quiz à répondre) : un onglet à part, toujours visible
  // (cf. isCategoryAvailable), qui affiche la banque de questions déjà
  // réussies plutôt que de charger un QCM — voir loadAcquis ci-dessous.
  var CATEGORY_ORDER = ['actu', 'histoire', 'acquis'];
  var CATEGORY_LABELS = { actu: 'QCM actu', histoire: 'QCM Culture Générale', acquis: 'Mes acquis' };
  var QCM_SUBTITLE_BY_CATEGORY = {
    actu: "Teste-toi sur l'actualité du jour, en 10 questions.",
    histoire: "Teste-toi sur l'histoire et les éclairages du jour. Certaines questions déjà réussies reviennent de temps en temps pour valider tes acquis.",
    acquis: "Les questions de culture générale auxquelles tu as déjà bien répondu, avec leur explication. 4 bonnes réponses à intervalles croissants (3 jours, 7 jours, 1 mois) pour les valider définitivement."
  };
  // Rubrique d'origine (sourceType, cf. server.js generateNarrativeDailyQuiz)
  // de chaque question de culture générale — mêmes icônes/libellés que la
  // page Éclairages et "Ce jour dans l'Histoire", pour que la banque
  // d'acquis se sente comme le même univers.
  var ACQUIS_SOURCE_TYPE_ORDER = ['histoire', 'parallele', 'pensee', 'mecanisme', 'concept', 'citation', 'oeuvre', 'latin'];
  var ACQUIS_SOURCE_TYPE_META = {
    histoire: { icon: 'fa-clock-rotate-left', label: "Ce jour dans l'Histoire" },
    parallele: { icon: 'fa-landmark', label: 'Parallèle historique' },
    pensee: { icon: 'fa-brain', label: 'Pensée philosophique' },
    mecanisme: { icon: 'fa-people-group', label: 'Mécanisme sociologique' },
    concept: { icon: 'fa-shapes', label: 'Concept du jour' },
    citation: { icon: 'fa-quote-left', label: 'Citation du jour' },
    oeuvre: { icon: 'fa-palette', label: "Œuvre d'art du jour" },
    latin: { icon: 'fa-scroll', label: 'Mot latin du jour' }
  };

  function availableSlotKeysInCategory(category) {
    return Object.keys(slotsStatus.slots).filter(function (k) {
      return slotsStatus.slots[k].available && CATEGORY_BY_SLOT[k] === category;
    });
  }

  // "acquis" n'a pas de créneau à vérifier : toujours affiché, son propre
  // état vide gère le cas "rien encore" (cf. renderAcquisEmpty).
  function isCategoryAvailable(category) {
    if (category === 'acquis') return true;
    return availableSlotKeysInCategory(category).length > 0;
  }

  // Préférence au sein d'une catégorie : le soir prime sur le matin (déjà le
  // cas avant), sinon le premier créneau disponible dans l'ordre déclaré.
  function pickDefaultSlotForCategory(category) {
    var keys = availableSlotKeysInCategory(category);
    if (category === 'actu' && keys.indexOf('evening') !== -1) return 'evening';
    if (category === 'actu' && keys.indexOf('morning') !== -1) return 'morning';
    return keys[0] || null;
  }

  function renderCategorySwitcher() {
    var availableCategories = CATEGORY_ORDER.filter(isCategoryAvailable);
    if (availableCategories.length < 2) {
      categorySwitcher.className = 'qcm-slot-switcher';
      categorySwitcher.innerHTML = '';
      return;
    }
    categorySwitcher.className = 'qcm-slot-switcher visible';
    categorySwitcher.innerHTML = '';
    CATEGORY_ORDER.forEach(function (category) {
      if (availableCategories.indexOf(category) === -1) return;
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'qcm-slot-btn' + (category === currentCategory ? ' active' : '');
      btn.textContent = CATEGORY_LABELS[category];
      btn.addEventListener('click', function () {
        if (category === currentCategory) return;
        if (category === 'acquis') { loadAcquis(); return; }
        var slotToLoad = pickDefaultSlotForCategory(category);
        if (!slotToLoad) return;
        loadSlot(slotToLoad);
      });
      categorySwitcher.appendChild(btn);
    });
  }

  function escapeHtml(str) {
    var div = document.createElement('div');
    div.textContent = String(str == null ? '' : str);
    return div.innerHTML;
  }

  function renderMessage(text) {
    var loadingHtml = /^Chargement\b/i.test(String(text || ''))
      ? '<img src="/sablier-96.png" alt="" class="qcm-loading-hourglass" aria-hidden="true">'
      : '';
    body.innerHTML = '<p class="qcm-state-message">' + loadingHtml + escapeHtml(text) + '</p>';
  }

  function pct(count, total) {
    if (!total) return 0;
    return Math.round((count / total) * 100);
  }

  // Libellés du badge cosmétique affiché au-dessus de la question pour les
  // formats autres que "qcm" classique — rend la variété de formats visible
  // sans rien changer d'autre à la mise en page.
  var QUESTION_TYPE_BADGE_LABELS = {
    vrai_faux: 'Vrai ou faux ?',
    texte_a_trous: 'Texte à trous',
    association: 'Association',
    intrus: "Trouve l'intrus",
    qcm_multi: 'Plusieurs réponses',
    ordre: "Remets dans l'ordre"
  };
  var FILL_BLANK_MARKER = '___';

  function renderTypeBadge(type) {
    var label = QUESTION_TYPE_BADGE_LABELS[type];
    return label ? '<span class="qcm-type-badge">' + escapeHtml(label) + '</span>' : '';
  }

  // Point d'entrée unique : dispatché selon le format de la question
  // courante. "association"/"qcm_multi"/"ordre" ont chacun une interaction
  // fondamentalement différente d'un choix unique et un rendu dédié ; les
  // autres formats (dont "intrus", identique à "qcm" question ×
  // 4 options) partagent le même rendu à options (renderChoiceQuestion).
  function renderQuestion() {
    var question = questions[currentIndex];
    var answer = answeredByQuestionId[question.id];
    var type = question.type || 'qcm';
    if (type === 'association') {
      renderAssociationQuestion(question, answer);
    } else if (type === 'qcm_multi') {
      renderMultiChoiceQuestion(question, answer);
    } else if (type === 'ordre') {
      renderOrderQuestion(question, answer);
    } else {
      renderChoiceQuestion(question, answer);
    }
  }

  // Câblage partagé du bouton "Question suivante" / "Voir mon score",
  // identique quel que soit le format de question qui vient d'être répondu.
  function wireNextButton(nextBtn) {
    var isLast = currentIndex === questions.length - 1;
    nextBtn.textContent = isLast ? 'Voir mon score' : 'Question suivante';
    nextBtn.className = 'qcm-next-btn visible';
    nextBtn.onclick = function () {
      if (isLast) renderFinalScore();
      else { currentIndex += 1; renderQuestion(); }
    };
  }

  function renderChoiceQuestion(question, answer) {
    var type = question.type || 'qcm';
    var questionHtml = type === 'texte_a_trous'
      ? escapeHtml(question.question).split(FILL_BLANK_MARKER).join('<span class="qcm-blank">' + FILL_BLANK_MARKER + '</span>')
      : escapeHtml(question.question);

    var html = '';
    html += '<p class="qcm-progress">Question ' + (currentIndex + 1) + ' / ' + questions.length + '</p>';
    html += renderTypeBadge(type);
    html += '<p class="qcm-question">' + questionHtml + '</p>';
    html += '<div class="qcm-options" id="qcm-options"></div>';
    html += '<div class="qcm-feedback" id="qcm-feedback"></div>';
    html += '<button type="button" class="qcm-next-btn" id="qcm-next-btn"></button>';
    body.innerHTML = html;

    var optionsEl = document.getElementById('qcm-options');
    question.options.forEach(function (optionText, index) {
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'qcm-option-btn';
      btn.innerHTML =
        '<span class="qcm-option-fill"></span>' +
        '<span class="qcm-option-row">' +
        '<span class="qcm-option-label">' + escapeHtml(optionText) + '</span>' +
        '<span class="qcm-option-pct"></span>' +
        '</span>';
      btn.addEventListener('click', function () { submitChoiceAnswer(question, index); });
      optionsEl.appendChild(btn);
    });

    if (answer) applyChoiceAnswerState(question, answer);
  }

  function applyChoiceAnswerState(question, answer) {
    var optionsEl = document.getElementById('qcm-options');
    var buttons = optionsEl.querySelectorAll('.qcm-option-btn');
    var total = answer.totalAnswers || 0;
    buttons.forEach(function (btn, index) {
      btn.disabled = true;
      btn.classList.add('answered');
      var count = (answer.stats && answer.stats[index]) || 0;
      btn.querySelector('.qcm-option-fill').style.width = pct(count, total) + '%';
      btn.querySelector('.qcm-option-pct').textContent = pct(count, total) + '%';
      if (index === answer.correctIndex) btn.classList.add('is-correct');
      else if (index === answer.optionIndex) btn.classList.add('is-wrong-picked');
    });

    var feedback = document.getElementById('qcm-feedback');
    feedback.className = 'qcm-feedback visible ' + (answer.correct ? 'is-correct' : 'is-wrong');
    feedback.innerHTML =
      '<span class="qcm-feedback-verdict">' + (answer.correct ? 'Bonne réponse !' : 'Raté !') + '</span>' +
      escapeHtml(answer.explanation || '');

    wireNextButton(document.getElementById('qcm-next-btn'));
  }

  function submitChoiceAnswer(question, optionIndex) {
    var optionsEl = document.getElementById('qcm-options');
    optionsEl.querySelectorAll('.qcm-option-btn').forEach(function (btn) { btn.disabled = true; });

    fetch('/api/daily-quiz/answer', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ voterKey: voterKey, questionId: question.id, optionIndex: optionIndex, slot: currentSlot })
    })
      .then(function (res) { return res.json(); })
      .then(function (data) {
        if (data.error) throw new Error(data.error);
        answeredByQuestionId[question.id] = data;
        applyChoiceAnswerState(question, data);
      })
      .catch(function () {
        optionsEl.querySelectorAll('.qcm-option-btn').forEach(function (btn) { btn.disabled = false; });
      });
  }

  // ── Format "association" : relier chaque élément de question.lefts à
  // l'élément de question.rights qui lui correspond. Un <select> natif par
  // ligne plutôt qu'un glisser-déposer ou un système de clic-appariement :
  // aucune dépendance, tactile/clavier/lecteur d'écran gratuits, cohérent
  // avec le reste du site (vanilla JS, sans framework). ─────────────────
  function renderAssociationQuestion(question, answer) {
    var html = '';
    html += '<p class="qcm-progress">Question ' + (currentIndex + 1) + ' / ' + questions.length + '</p>';
    html += renderTypeBadge('association');
    html += '<p class="qcm-question">' + escapeHtml(question.question) + '</p>';
    html += '<div id="qcm-assoc-rows"></div>';
    html += '<div class="qcm-feedback" id="qcm-feedback"></div>';
    html += '<button type="button" class="qcm-next-btn visible" id="qcm-assoc-submit-btn" disabled>Valider</button>';
    html += '<button type="button" class="qcm-next-btn" id="qcm-next-btn"></button>';
    body.innerHTML = html;

    var rowsEl = document.getElementById('qcm-assoc-rows');
    var lefts = question.lefts || [];
    var rights = question.rights || [];
    var selects = lefts.map(function (leftText) {
      var row = document.createElement('div');
      row.className = 'qcm-assoc-row';
      var leftSpan = document.createElement('span');
      leftSpan.className = 'qcm-assoc-left';
      leftSpan.textContent = leftText;
      var select = document.createElement('select');
      select.className = 'qcm-assoc-select';
      var placeholder = document.createElement('option');
      placeholder.value = '';
      placeholder.textContent = 'Choisis…';
      select.appendChild(placeholder);
      rights.forEach(function (rightText) {
        var opt = document.createElement('option');
        opt.value = rightText;
        opt.textContent = rightText;
        select.appendChild(opt);
      });
      row.appendChild(leftSpan);
      row.appendChild(select);
      rowsEl.appendChild(row);
      return select;
    });

    var submitBtn = document.getElementById('qcm-assoc-submit-btn');
    function updateSubmitEnabled() {
      submitBtn.disabled = selects.some(function (s) { return !s.value; });
    }
    selects.forEach(function (select) {
      select.addEventListener('change', updateSubmitEnabled);
    });
    submitBtn.onclick = function () {
      var pairsGuess = lefts.map(function (leftText, index) {
        return { left: leftText, right: selects[index].value };
      });
      submitAssociationAnswer(question, pairsGuess, selects, submitBtn);
    };

    // Reprise de session (page rechargée après une réponse déjà envoyée) :
    // le serveur ne connaît que le verdict global (tout correct ou non, cf.
    // POST /answer), pas le choix exact fait pour chaque ligne à l'époque —
    // applyAssociationAnswerState gère ce cas en pré-remplissant chaque
    // <select> avec la bonne réponse plutôt qu'en essayant de deviner ce qui
    // avait été choisi.
    if (answer) applyAssociationAnswerState(question, answer, selects);
  }

  function submitAssociationAnswer(question, pairsGuess, selects, submitBtn) {
    selects.forEach(function (s) { s.disabled = true; });
    submitBtn.disabled = true;

    fetch('/api/daily-quiz/answer', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ voterKey: voterKey, questionId: question.id, slot: currentSlot, associationAnswer: pairsGuess })
    })
      .then(function (res) { return res.json(); })
      .then(function (data) {
        if (data.error) throw new Error(data.error);
        answeredByQuestionId[question.id] = data;
        applyAssociationAnswerState(question, data, selects);
      })
      .catch(function () {
        selects.forEach(function (s) { s.disabled = false; });
        submitBtn.disabled = false;
      });
  }

  // `selects` reflète soit un choix réel de l'utilisateur qui vient de
  // répondre (chaque <select> a une valeur, comparée à la bonne réponse),
  // soit une reprise de session où le serveur ne renvoie que le verdict
  // global (cf. commentaire dans renderAssociationQuestion) : dans ce
  // second cas chaque <select> est encore vide, on le pré-remplit alors
  // directement avec la bonne réponse plutôt que d'afficher un faux "raté"
  // sur une ligne où l'utilisateur n'a en réalité rien choisi ici.
  function applyAssociationAnswerState(question, answer, selects) {
    var lefts = question.lefts || [];
    var correctByLeft = {};
    (answer.pairs || []).forEach(function (p) { correctByLeft[p.left] = p.right; });

    selects.forEach(function (select, index) {
      var leftText = lefts[index];
      var correctRight = correctByLeft[leftText];
      var chosen = select.value;
      select.disabled = true;
      if (!chosen) {
        select.value = correctRight;
        return;
      }
      if (chosen === correctRight) {
        select.classList.add('is-correct');
      } else {
        select.classList.add('is-wrong');
        var hint = document.createElement('span');
        hint.className = 'qcm-assoc-correct-hint';
        hint.textContent = 'Bonne réponse : ' + correctRight;
        select.parentNode.appendChild(hint);
      }
    });

    var submitBtn = document.getElementById('qcm-assoc-submit-btn');
    if (submitBtn) submitBtn.remove();

    var feedback = document.getElementById('qcm-feedback');
    feedback.className = 'qcm-feedback visible ' + (answer.correct ? 'is-correct' : 'is-wrong');
    feedback.innerHTML =
      '<span class="qcm-feedback-verdict">' + (answer.correct ? 'Bonne réponse !' : 'Raté !') + '</span>' +
      escapeHtml(answer.explanation || '');

    wireNextButton(document.getElementById('qcm-next-btn'));
  }

  // ── Format "qcm_multi" : plusieurs bonnes réponses parmi 4-5 options —
  // boutons à bascule (pas de sélection immédiate comme "qcm", il faut
  // pouvoir cocher/décocher avant de valider) + bouton "Valider" dédié, même
  // principe que le bouton de "association" ci-dessus. ───────────────────
  function renderMultiChoiceQuestion(question, answer) {
    var html = '';
    html += '<p class="qcm-progress">Question ' + (currentIndex + 1) + ' / ' + questions.length + '</p>';
    html += renderTypeBadge('qcm_multi');
    html += '<p class="qcm-question">' + escapeHtml(question.question) + '</p>';
    html += '<p class="qcm-multi-hint">Plusieurs réponses sont correctes.</p>';
    html += '<div class="qcm-options" id="qcm-options"></div>';
    html += '<div class="qcm-feedback" id="qcm-feedback"></div>';
    html += '<button type="button" class="qcm-next-btn visible" id="qcm-multi-submit-btn" disabled>Valider</button>';
    html += '<button type="button" class="qcm-next-btn" id="qcm-next-btn"></button>';
    body.innerHTML = html;

    var optionsEl = document.getElementById('qcm-options');
    var submitBtn = document.getElementById('qcm-multi-submit-btn');
    var selected = {};
    var buttons = question.options.map(function (optionText, index) {
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'qcm-option-btn qcm-option-btn-multi';
      btn.innerHTML =
        '<span class="qcm-option-row">' +
        '<span class="qcm-option-check" aria-hidden="true"><i class="fa-solid fa-check"></i></span>' +
        '<span class="qcm-option-label">' + escapeHtml(optionText) + '</span>' +
        '</span>';
      btn.addEventListener('click', function () {
        if (selected[index]) { delete selected[index]; btn.classList.remove('is-selected'); }
        else { selected[index] = true; btn.classList.add('is-selected'); }
        submitBtn.disabled = !Object.keys(selected).length;
      });
      optionsEl.appendChild(btn);
      return btn;
    });

    submitBtn.onclick = function () {
      submitMultiChoiceAnswer(question, Object.keys(selected).map(Number), buttons, submitBtn);
    };

    if (answer) applyMultiChoiceAnswerState(answer, buttons);
  }

  function submitMultiChoiceAnswer(question, optionIndexes, buttons, submitBtn) {
    buttons.forEach(function (btn) { btn.disabled = true; });
    submitBtn.disabled = true;

    fetch('/api/daily-quiz/answer', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ voterKey: voterKey, questionId: question.id, slot: currentSlot, optionIndexes: optionIndexes })
    })
      .then(function (res) { return res.json(); })
      .then(function (data) {
        if (data.error) throw new Error(data.error);
        answeredByQuestionId[question.id] = data;
        applyMultiChoiceAnswerState(data, buttons);
      })
      .catch(function () {
        buttons.forEach(function (btn) { btn.disabled = false; });
        submitBtn.disabled = false;
      });
  }

  // Reprise de session : le serveur ne renvoie que le verdict global + la
  // vraie liste correctIndexes, jamais ce qui avait été coché à l'époque —
  // chaque bouton n'est donc marqué "correct" ou neutre qu'à partir de
  // correctIndexes, jamais "raté" individuellement lors d'une reprise (même
  // limite que "association", cf. applyAssociationAnswerState).
  function applyMultiChoiceAnswerState(answer, buttons) {
    var correctSet = {};
    (answer.correctIndexes || []).forEach(function (i) { correctSet[i] = true; });
    buttons.forEach(function (btn, index) {
      btn.disabled = true;
      btn.classList.add('answered');
      if (correctSet[index]) btn.classList.add('is-correct');
      else if (btn.classList.contains('is-selected')) btn.classList.add('is-wrong-picked');
    });

    var submitBtn = document.getElementById('qcm-multi-submit-btn');
    if (submitBtn) submitBtn.remove();

    var feedback = document.getElementById('qcm-feedback');
    feedback.className = 'qcm-feedback visible ' + (answer.correct ? 'is-correct' : 'is-wrong');
    feedback.innerHTML =
      '<span class="qcm-feedback-verdict">' + (answer.correct ? 'Bonne réponse !' : 'Raté !') + '</span>' +
      escapeHtml(answer.explanation || '');

    wireNextButton(document.getElementById('qcm-next-btn'));
  }

  // ── Format "ordre" : remettre 3-4 éléments dans leur ordre correct — tap
  // pour construire la séquence (pas de glisser-déposer, aucune dépendance,
  // tactile/clavier gratuits comme le <select> de "association") : chaque
  // tap sur un élément disponible l'ajoute à la séquence choisie, un tap sur
  // un élément déjà placé le retire (pour corriger sans tout recommencer). ─
  function renderOrderQuestion(question, answer) {
    var html = '';
    html += '<p class="qcm-progress">Question ' + (currentIndex + 1) + ' / ' + questions.length + '</p>';
    html += renderTypeBadge('ordre');
    html += '<p class="qcm-question">' + escapeHtml(question.question) + '</p>';
    html += '<p class="qcm-order-hint">Touche les éléments dans le bon ordre.</p>';
    html += '<div class="qcm-order-chosen" id="qcm-order-chosen"></div>';
    html += '<div class="qcm-order-pool" id="qcm-order-pool"></div>';
    html += '<div class="qcm-feedback" id="qcm-feedback"></div>';
    html += '<button type="button" class="qcm-next-btn visible" id="qcm-order-submit-btn" disabled>Valider</button>';
    html += '<button type="button" class="qcm-next-btn" id="qcm-next-btn"></button>';
    body.innerHTML = html;

    var poolEl = document.getElementById('qcm-order-pool');
    var chosenEl = document.getElementById('qcm-order-chosen');
    var submitBtn = document.getElementById('qcm-order-submit-btn');
    var items = question.items || [];
    var chosenOrder = [];

    function renderChosen() {
      chosenEl.innerHTML = '';
      chosenOrder.forEach(function (text, i) {
        var chip = document.createElement('button');
        chip.type = 'button';
        chip.className = 'qcm-order-chip qcm-order-chip-chosen';
        chip.innerHTML = '<span class="qcm-order-chip-num">' + (i + 1) + '</span><span>' + escapeHtml(text) + '</span>';
        chip.addEventListener('click', function () {
          chosenOrder.splice(i, 1);
          renderChosen();
          renderPool();
        });
        chosenEl.appendChild(chip);
      });
      submitBtn.disabled = chosenOrder.length !== items.length;
    }

    function renderPool() {
      poolEl.innerHTML = '';
      items.forEach(function (text) {
        if (chosenOrder.indexOf(text) !== -1) return;
        var chip = document.createElement('button');
        chip.type = 'button';
        chip.className = 'qcm-order-chip';
        chip.textContent = text;
        chip.addEventListener('click', function () {
          chosenOrder.push(text);
          renderChosen();
          renderPool();
        });
        poolEl.appendChild(chip);
      });
    }
    renderPool();
    renderChosen();

    submitBtn.onclick = function () {
      submitOrderAnswer(question, chosenOrder.slice(), poolEl, chosenEl, submitBtn);
    };

    if (answer) applyOrderAnswerState(answer, poolEl, chosenEl, submitBtn, items);
  }

  function submitOrderAnswer(question, orderedItems, poolEl, chosenEl, submitBtn) {
    submitBtn.disabled = true;
    poolEl.querySelectorAll('.qcm-order-chip').forEach(function (c) { c.disabled = true; });
    chosenEl.querySelectorAll('.qcm-order-chip').forEach(function (c) { c.disabled = true; });

    fetch('/api/daily-quiz/answer', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ voterKey: voterKey, questionId: question.id, slot: currentSlot, orderedItems: orderedItems })
    })
      .then(function (res) { return res.json(); })
      .then(function (data) {
        if (data.error) throw new Error(data.error);
        answeredByQuestionId[question.id] = data;
        applyOrderAnswerState(data, poolEl, chosenEl, submitBtn, question.items);
      })
      .catch(function () {
        submitBtn.disabled = false;
        poolEl.querySelectorAll('.qcm-order-chip').forEach(function (c) { c.disabled = false; });
        chosenEl.querySelectorAll('.qcm-order-chip').forEach(function (c) { c.disabled = false; });
      });
  }

  // Affiche le bon ordre (révélé par le serveur une fois répondu) en lecture
  // seule plutôt que de comparer élément par élément à ce qui avait été
  // choisi — même limite de reprise de session que "association"/"qcm_multi" :
  // seul le verdict global est connu après un rechargement de page.
  function applyOrderAnswerState(answer, poolEl, chosenEl, submitBtn, fallbackItems) {
    if (submitBtn) submitBtn.remove();
    var correctItems = answer.items || fallbackItems || [];
    poolEl.innerHTML = '';
    chosenEl.innerHTML = '<p class="qcm-order-correct-label">Bon ordre :</p>';
    correctItems.forEach(function (text, i) {
      var chip = document.createElement('div');
      chip.className = 'qcm-order-chip qcm-order-chip-chosen qcm-order-chip-static';
      chip.innerHTML = '<span class="qcm-order-chip-num">' + (i + 1) + '</span><span>' + escapeHtml(text) + '</span>';
      chosenEl.appendChild(chip);
    });

    var feedback = document.getElementById('qcm-feedback');
    feedback.className = 'qcm-feedback visible ' + (answer.correct ? 'is-correct' : 'is-wrong');
    feedback.innerHTML =
      '<span class="qcm-feedback-verdict">' + (answer.correct ? 'Bonne réponse !' : 'Raté !') + '</span>' +
      escapeHtml(answer.explanation || '');

    wireNextButton(document.getElementById('qcm-next-btn'));
  }

  function renderFinalScore() {
    var total = questions.length;
    var correct = 0;
    questions.forEach(function (q) {
      var a = answeredByQuestionId[q.id];
      if (a && a.correct) correct += 1;
    });
    var scoreHint = 'Dans quelques instants, ton score Gnosis apparaîtra et te permettra de voir ton classement par rapport aux autres utilisateurs (disponible depuis le bandeau blanc en haut ou en bas).';
    body.innerHTML =
      '<div class="qcm-final-score">' +
      '<i class="fa-solid fa-trophy"></i>' +
      '<div class="qcm-final-score-value">' + correct + ' / ' + total + '</div>' +
      '<div class="qcm-final-score-label">bonnes réponses aujourd’hui</div>' +
      '</div>' +
      '<p class="qcm-final-score-hint">' + scoreHint + '</p>' +
      '<div class="qcm-final-actions">' +
      '<button type="button" class="qcm-next-btn visible" id="qcm-review-btn">Revoir</button>' +
      '</div>';

    // Les réponses du jour sont verrouillées côté serveur (une seule par
    // question et par voterKey) : "Revoir" repart de la question 1 pour les
    // revoir, sans pouvoir les changer, plutôt qu'un vrai reset.
    document.getElementById('qcm-review-btn').onclick = function () {
      currentIndex = 0;
      renderQuestion();
    };
  }

  function renderSlotSwitcher() {
    var availableKeys = availableSlotKeysInCategory(currentCategory);
    if (availableKeys.length < 2) {
      slotSwitcher.className = 'qcm-slot-switcher';
      slotSwitcher.innerHTML = '';
      return;
    }
    slotSwitcher.className = 'qcm-slot-switcher visible';
    slotSwitcher.innerHTML = '';
    availableKeys.forEach(function (slotKey) {
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'qcm-slot-btn' + (slotKey === currentSlot ? ' active' : '');
      btn.textContent = slotsStatus.slots[slotKey].label;
      btn.addEventListener('click', function () {
        if (slotKey === currentSlot) return;
        loadSlot(slotKey);
      });
      slotSwitcher.appendChild(btn);
    });
  }

  function renderAcquisEmpty() {
    renderMessage("Réponds à des questions de QCM Culture Générale pour commencer à remplir ta banque d'acquis.");
  }

  // Entrées de la dernière liste rendue (item + meta de sa rubrique),
  // indexées par data-acquis-index sur chaque ligne — sert à retrouver le
  // détail au clic sans le remettre dans le DOM (cf. openAcquisFiche).
  var acquisFicheItems = [];

  // Nom affiché et clé de tri : toujours le nom du concept/mécanisme/auteur/
  // œuvre (sourceName, cf. server.js extractCultureGeneraleItemName et sa
  // résolution rétroactive resolveMissingAcquisSourceNames) — jamais la
  // question elle-même, qui ne doit apparaître que dans la fiche de détail.
  function acquisDisplayName(item) {
    return item.sourceName;
  }

  // Chaque rubrique d'origine (dans l'ordre ACQUIS_SOURCE_TYPE_ORDER) est un
  // menu repliable, replié par défaut — un clic sur son en-tête déplie la
  // liste des notions acquises, triées par ordre alphabétique sur le nom du
  // concept/mécanisme/auteur. Le clic sur une notion ouvre la fiche (détail
  // pur du concept/mécanisme/citation/œuvre, cf. sourceDetail, jamais la
  // question du QCM). Un acquis dont le nom ou le détail n'a pas pu être
  // résolu (contenu source disparu) n'est pas affiché plutôt que de retomber
  // sur la question.
  function renderAcquisList(items) {
    items = items.filter(function (item) {
      return !!item.sourceName && item.sourceDetail && item.sourceDetail.sections && item.sourceDetail.sections.length;
    });
    if (!items.length) { renderAcquisEmpty(); return; }
    var bySourceType = {};
    items.forEach(function (item) {
      var key = ACQUIS_SOURCE_TYPE_META[item.sourceType] ? item.sourceType : 'histoire';
      (bySourceType[key] = bySourceType[key] || []).push(item);
    });
    acquisFicheItems = [];
    var html = '<div class="qcm-acquis-list">';
    ACQUIS_SOURCE_TYPE_ORDER.forEach(function (key) {
      var group = bySourceType[key];
      if (!group || !group.length) return;
      var meta = ACQUIS_SOURCE_TYPE_META[key];
      group.sort(function (a, b) {
        return acquisDisplayName(a).localeCompare(acquisDisplayName(b), 'fr', { sensitivity: 'base' });
      });
      html += '<div class="qcm-acquis-group">';
      html += '<button type="button" class="qcm-acquis-group-title" aria-expanded="false">';
      html += '<i class="fa-solid ' + meta.icon + ' qcm-acquis-group-icon"></i> ' + escapeHtml(meta.label);
      html += '<span class="qcm-acquis-group-count">' + group.length + '</span>';
      html += '<i class="fa-solid fa-chevron-right qcm-acquis-group-chevron"></i>';
      html += '</button>';
      html += '<div class="qcm-acquis-group-items">';
      group.forEach(function (item) {
        var target = item.target || 3;
        var badgeHtml = item.validated
          ? '<span class="qcm-acquis-badge is-validated"><i class="fa-solid fa-circle-check"></i> Acquis</span>'
          : '<span class="qcm-acquis-badge">' + item.streak + ' / ' + target + '</span>';
        var ficheIndex = acquisFicheItems.length;
        acquisFicheItems.push({ item: item, meta: meta });
        html += '<button type="button" class="qcm-acquis-item' + (item.validated ? ' is-validated' : '') + '" data-acquis-index="' + ficheIndex + '">';
        html += '<p class="qcm-acquis-name">' + escapeHtml(acquisDisplayName(item)) + '</p>' + badgeHtml + '<i class="fa-solid fa-chevron-right qcm-acquis-item-chevron"></i>';
        html += '</button>';
      });
      html += '<button type="button" class="qcm-acquis-group-collapse"><i class="fa-solid fa-chevron-up"></i> Replier</button>';
      html += '</div>';
      html += '</div>';
    });
    html += '</div>';
    body.innerHTML = html;
    body.querySelectorAll('.qcm-acquis-group-title').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var group = btn.closest('.qcm-acquis-group');
        var isOpen = group.classList.toggle('is-open');
        btn.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
      });
    });
    body.querySelectorAll('.qcm-acquis-group-collapse').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var group = btn.closest('.qcm-acquis-group');
        group.classList.remove('is-open');
        var titleBtn = group.querySelector('.qcm-acquis-group-title');
        if (titleBtn) titleBtn.setAttribute('aria-expanded', 'false');
      });
    });
    body.querySelectorAll('.qcm-acquis-item').forEach(function (btn) {
      btn.addEventListener('click', function () {
        openAcquisFiche(acquisFicheItems[Number(btn.getAttribute('data-acquis-index'))]);
      });
    });
  }

  // Fiche ouverte au clic sur une ligne d'acquis : nom + détail pur du
  // concept/mécanisme/citation/œuvre (sourceDetail, cf. server.js
  // extractCultureGeneraleItemDetail) — jamais la question du QCM ni son
  // rapprochement avec l'actualité du jour, déjà exclus côté serveur.
  // Fermable par la croix, un clic hors modale ou Échap.
  function openAcquisFiche(entry) {
    var item = entry.item;
    var meta = entry.meta;
    var detail = item.sourceDetail || { meta: null, sections: [] };
    var html =
      '<div class="qcm-fiche-modal">' +
      '<div class="qcm-fiche-head">' +
      '<p class="qcm-fiche-rubric"><i class="fa-solid ' + meta.icon + '"></i> ' + escapeHtml(meta.label) + '</p>' +
      '<button type="button" class="qcm-fiche-close" aria-label="Fermer"><i class="fa-solid fa-xmark"></i></button>' +
      '</div>' +
      '<p class="qcm-fiche-name">' + escapeHtml(item.sourceName) + '</p>';
    if (detail.meta) html += '<p class="qcm-fiche-meta">' + escapeHtml(detail.meta) + '</p>';
    if (detail.image && detail.image.url) {
      var img = detail.image;
      var captionText = 'Image : ' + (img.credit || (img.source === 'press' ? "source de l'actualité" : 'Wikipedia'));
      html += '<figure class="qcm-fiche-image">' +
        '<img src="' + escapeHtml(img.url) + '" alt="' + escapeHtml(item.sourceName) + '" loading="lazy" onerror="this.closest(\'.qcm-fiche-image\').remove();">' +
        (img.pageUrl
          ? '<figcaption><a href="' + escapeHtml(img.pageUrl) + '" target="_blank" rel="noopener noreferrer">' + escapeHtml(captionText) + '</a></figcaption>'
          : '<figcaption>' + escapeHtml(captionText) + '</figcaption>') +
        '</figure>';
    }
    detail.sections.forEach(function (section) {
      if (section.label) html += '<h3 class="qcm-fiche-section-label">' + escapeHtml(section.label) + '</h3>';
      html += '<p class="qcm-fiche-explanation">' + escapeHtml(section.text) + '</p>';
    });
    html += '<button type="button" class="qcm-fiche-bottom-close">Fermer</button>';
    html += '</div>';
    var overlay = document.createElement('div');
    overlay.className = 'qcm-fiche-overlay';
    overlay.innerHTML = '<div class="qcm-fiche-overlay-inner">' + html + '<div class="qcm-fiche-scroll-spacer" aria-hidden="true"></div></div>';
    document.body.appendChild(overlay);
    // Pas attachScrollFadeHint (générique) : il se base sur le bas de TOUTE la
    // zone de scroll, qui inclut ici .qcm-fiche-scroll-spacer (sombre, sous la
    // fiche) — le dégradé blanc y jurait sur le fond sombre et restait visible
    // bien après la fin du vrai contenu. On se base plutôt sur le bas réel de
    // .qcm-fiche-modal (la carte blanche) par rapport au viewport.
    var ficheModalEl = overlay.querySelector('.qcm-fiche-modal');
    if (ficheModalEl) {
      var ficheFadeHint = document.createElement('div');
      ficheFadeHint.className = 'scroll-fade-hint is-hidden';
      ficheFadeHint.style.setProperty('--scroll-fade-color', '#ffffff');
      ficheFadeHint.innerHTML = '<span class="scroll-fade-hint-text">suite <span aria-hidden="true">↓</span></span>';
      overlay.appendChild(ficheFadeHint);
      ficheFadeHint.querySelector('.scroll-fade-hint-text').addEventListener('click', function (e) {
        e.stopPropagation();
        overlay.scrollBy({ top: overlay.clientHeight * 0.8, behavior: 'smooth' });
      });
      var updateFicheFadeHint = function () {
        var rect = ficheModalEl.getBoundingClientRect();
        ficheFadeHint.classList.toggle('is-hidden', rect.bottom <= window.innerHeight + 4);
      };
      overlay.addEventListener('scroll', updateFicheFadeHint, { passive: true });
      requestAnimationFrame(updateFicheFadeHint);
    }
    try { window.parent.postMessage({ type: 'agon:qcm-fiche-visibility', open: true }, '*'); } catch (e) {}
    function close() {
      overlay.remove();
      document.removeEventListener('keydown', onKeydown);
      try { window.parent.postMessage({ type: 'agon:qcm-fiche-visibility', open: false }, '*'); } catch (e) {}
    }
    function onKeydown(e) {
      if (e.key === 'Escape') close();
    }
    overlay.addEventListener('click', function (e) {
      if (e.target === overlay || e.target.classList.contains('qcm-fiche-overlay-inner')) close();
    });
    overlay.querySelector('.qcm-fiche-close').addEventListener('click', close);
    overlay.querySelector('.qcm-fiche-bottom-close').addEventListener('click', close);
    document.addEventListener('keydown', onKeydown);
  }

  // Pas un créneau à charger (cf. isCategoryAvailable) : lit directement la
  // banque personnelle de l'utilisateur plutôt que de démarrer un QCM.
  function loadAcquis() {
    var myToken = ++loadToken;
    currentCategory = 'acquis';
    currentSlot = null;
    titleText.textContent = CATEGORY_LABELS.acquis;
    if (subtitleText) subtitleText.textContent = QCM_SUBTITLE_BY_CATEGORY.acquis;
    renderCategorySwitcher();
    renderSlotSwitcher();

    if (!voterKey) {
      renderAcquisEmpty();
      return;
    }
    renderMessage('Chargement de tes acquis…');
    fetch('/api/daily-quiz/acquis?voterKey=' + encodeURIComponent(voterKey), { cache: 'no-store' })
      .then(function (res) { return res.json(); })
      .then(function (data) {
        if (myToken !== loadToken) return;
        renderAcquisList(Array.isArray(data.acquis) ? data.acquis : []);
      })
      .catch(function () {
        if (myToken === loadToken) renderMessage('Impossible de charger tes acquis pour le moment.');
      });
  }

  function loadSlot(slotKey) {
    var myToken = ++loadToken;
    currentSlot = slotKey;
    currentCategory = CATEGORY_BY_SLOT[slotKey] || currentCategory;
    currentIndex = 0;
    questions = [];
    answeredByQuestionId = {};
    titleText.textContent = 'Connaissances';
    if (subtitleText) subtitleText.textContent = QCM_SUBTITLE_BY_CATEGORY[currentCategory] || QCM_SUBTITLE_BY_CATEGORY.actu;
    renderCategorySwitcher();
    renderSlotSwitcher();
    renderMessage('Chargement du QCM…');

    fetch('/api/daily-quiz/today?slot=' + encodeURIComponent(slotKey) + (voterKey ? '&voterKey=' + encodeURIComponent(voterKey) : ''), { cache: 'no-store' })
      .then(function (res) { return res.json(); })
      .then(function (data) {
        if (myToken !== loadToken) return;
        questions = Array.isArray(data.questions) ? data.questions : [];
        if (!questions.length) {
          renderMessage('Ce QCM n’est pas encore prêt, reviens un peu plus tard.');
          return;
        }
        if (!voterKey) {
          currentIndex = 0;
          renderQuestion();
          return;
        }
        fetch('/api/daily-quiz/results?voterKey=' + encodeURIComponent(voterKey) + '&slot=' + encodeURIComponent(slotKey), { cache: 'no-store' })
          .then(function (res) { return res.json(); })
          .then(function (data) {
            if (myToken !== loadToken) return;
            (data.answers || []).forEach(function (a) { answeredByQuestionId[a.questionId] = a; });
            var firstUnanswered = questions.findIndex(function (q) { return !answeredByQuestionId[q.id]; });
            if (firstUnanswered === -1) {
              renderFinalScore();
            } else {
              currentIndex = firstUnanswered;
              renderQuestion();
            }
          })
          .catch(function () { if (myToken === loadToken) { currentIndex = 0; renderQuestion(); } });
      })
      .catch(function () {
        if (myToken === loadToken) renderMessage('Impossible de charger ce QCM pour le moment.');
      });
  }

  function init() {
    voterKey = typeof getKey === 'function' ? getKey() : null;

    fetch('/api/daily-quiz/status' + (voterKey ? '?voterKey=' + encodeURIComponent(voterKey) : ''), { cache: 'no-store' })
      .then(function (res) { return res.json(); })
      .then(function (statusData) {
        slotsStatus = statusData && statusData.slots ? statusData : { slots: {}, defaultSlot: null };
        var params = new URLSearchParams(location.search);
        var requestedSlot = params.get('slot');
        var slotToLoad = (requestedSlot && slotsStatus.slots[requestedSlot] && slotsStatus.slots[requestedSlot].available)
          ? requestedSlot
          : slotsStatus.defaultSlot;
        if (!slotToLoad) {
          // Aucun QCM prêt (matin/soir/culture générale) : "Mes acquis" reste
          // consultable (isCategoryAvailable le garantit toujours) — on
          // l'ouvre directement plutôt que de bloquer sur un message sans
          // issue, cf. demande utilisateur du 04/08/2026.
          loadAcquis();
          return;
        }
        loadSlot(slotToLoad);
      })
      .catch(function () {
        renderMessage('Impossible de charger Connaissances pour le moment.');
      });
  }

  // getKey() est défini dans script.min.js : ce script inline n'est pas
  // concerné par l'attribut defer (ignoré sans src), il s'exécute donc avant
  // que script.min.js n'ait fini de charger — on attend DOMContentLoaded,
  // qui n'arrive qu'une fois tous les scripts deferred exécutés.
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function () {
      init();
      attachPageScrollFadeHint('#ffffff', { contentEndSelector: '.qcm-panel' });
    });
  } else {
    init();
    attachPageScrollFadeHint('#ffffff', { contentEndSelector: '.qcm-panel' });
  }
})();
</script>
</body>
</html>
