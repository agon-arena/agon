      '<div class="qcm-fiche-overlay-inner">' +
        '<div class="qcm-fiche-modal">' +
          '<div class="qcm-fiche-head">' +
            '<p class="qcm-fiche-rubric"><i class="fa-solid fa-circle-check"></i> Apprentissage prêt</p>' +
            '<button type="button" class="qcm-fiche-close" aria-label="Fermer"><i class="fa-solid fa-xmark"></i></button>' +
          '</div>' +
          '<p class="qcm-generate-confirm-text">« ' + escapeHtml(label) + ' » est prêt, ' + countText + ' à mémoriser.</p>' +
          '<div class="qcm-generate-confirm-actions">' +
            '<button type="button" class="qcm-generate-confirm-ok qcm-ready-modal-ok">J’ai compris</button>' +
          '</div>' +
        '</div>' +
      '</div>';
    document.body.appendChild(overlay);
    positionFicheClose(overlay);
    try { window.parent.postMessage({ type: 'mnoria:qcm-fiche-visibility', open: true }, '*'); } catch (e) {}

    function close() {
      overlay.remove();
      document.removeEventListener('keydown', onKeydown);
      try { window.parent.postMessage({ type: 'mnoria:qcm-fiche-visibility', open: false }, '*'); } catch (e) {}
    }
    function onKeydown(e) { if (e.key === 'Escape') close(); }
    overlay.addEventListener('click', function (e) {
      if (e.target === overlay || e.target.classList.contains('qcm-fiche-overlay-inner')) close();
    });
    document.addEventListener('keydown', onKeydown);
    overlay.querySelector('.qcm-fiche-close').addEventListener('click', close);
    overlay.querySelector('.qcm-ready-modal-ok').addEventListener('click', close);
  }

  // Même slot déterministe que normalizeCustomTopicKey côté serveur. Il est calculé avant
  // le POST afin d'inscrire aussi les sujets libres dans le suivi local persistant : quitter
  // la page ne fait ainsi plus disparaître la ligne « En cours de création », et
  // /apprentissage peut interroger generation-status jusqu'à l'apparition du QCM.
  function getCustomTopicPendingSlot(topic, level) {
    var normalized = String(topic || '')
      .trim()
      .toLowerCase()
      .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
      .replace(/[^a-z0-9]+/g, ' ')
      .trim();
    if (!window.crypto || !window.crypto.subtle || typeof TextEncoder !== 'function') {
      return Promise.resolve('');
    }
    return window.crypto.subtle.digest('SHA-1', new TextEncoder().encode(normalized))
      .then(function (digest) {
        var id = Array.from(new Uint8Array(digest)).map(function (byte) {
          return byte.toString(16).padStart(2, '0');
        }).join('').slice(0, 16);
        return 'notion:custom:' + id + (level ? ':' + level : '');
      })
      .catch(function () { return ''; });
  }

  // Barre de recherche libre "Mes apprentissages" (cf. server.js POST
  // /api/users/notion-quizzes/custom). Comme pour un clic "Mémoriser" sur
  // Éclairages/Ce jour dans l'Histoire, le sujet nommé et l'indicateur animé
  // restent visibles pendant la génération IA. Ici, la réponse ouvre ensuite
  // directement le QCM tout juste créé via loadSlot.
  // Niveau d'approfondissement toujours demandé avant génération (cf.
  // showNotionQuizLevelPicker, public/script.js — demande du 12/08/2026).
  // Extrait du corps de submitCustomTopic (demande du 27/08/2026, "Créer cet
  // apprentissage" sur une proposition IA de la V2 doit réutiliser EXACTEMENT
  // ce même pipeline plutôt qu'un deuxième chemin de génération) — même
  // comportement strict qu'avant pour submitCustomTopic (onCreated est
  // simplement absent dans son cas), niveau toujours choisi par l'utilisateur
  // via le sélecteur existant, jamais présélectionné automatiquement.
  function startCustomTopicGeneration(topic, onCreated) {
    if (!voterKey) {
      setCustomSearchStatus('Identifiant introuvable, recharge la page et réessaie.', true);
      return;
    }
    if (typeof showNotionQuizLevelPicker !== 'function') {
      setCustomSearchStatus('Génération impossible pour le moment, réessaie.', true);
      return;
    }
    showNotionQuizLevelPicker(function (level) {
      showGenerateConfirmModal(topic, level, async function () {
        var pendingCustomSlot = await getCustomTopicPendingSlot(topic, level);
        if (pendingCustomSlot && typeof window.mnoriaStartPendingNotionQuizGeneration === 'function') {
          window.mnoriaStartPendingNotionQuizGeneration({ slot: pendingCustomSlot, label: topic });
        }
        customSearchGenerationActive = true;
        customTopicGenerationLabel = topic;
        customSearchBtn.disabled = true;
        customSearchInput.disabled = true;
        if (currentCategory === 'mesqcm' && !currentSlot) renderMesQcmList(currentMesQcmQuizzes);
        setCustomSearchStatus(
          'Génération du QCM « ' + topic + ' » en cours — cela peut prendre plusieurs minutes…',
          false
        );
        startPieSpinner();

        function customGenerationErrorMessage(code, fallback) {
          var messages = {
            AI_CONFIG_MISSING: 'Le service IA n’est pas configuré pour le moment.',
            AI_UNAVAILABLE: 'Le service IA est temporairement indisponible. Réessaie dans quelques instants.',
            AI_TIMEOUT: 'La génération a pris trop de temps. Réessaie dans quelques instants.',
            CONTENT_UNUSABLE: 'Le contenu généré n’a pas pu être exploité. Essaie de préciser le sujet.',
            KNOWLEDGE_REJECTED: 'Aucune connaissance suffisamment fiable et importante n’a été trouvée sur ce sujet.',
            QCM_UNUSABLE: 'La fiche a été créée, mais ses questions n’ont pas pu être validées. Réessaie ou précise le sujet.',
            STORAGE_TEMPORARY: 'L’apprentissage n’a pas pu être enregistré pour le moment. Réessaie dans quelques instants.'
          };
          return messages[code] || fallback || 'Une erreur inattendue a interrompu la génération. Réessaie dans quelques instants.';
        }

        function customGenerationDiagnosticMessage(diagnostics) {
          if (!diagnostics || typeof diagnostics !== 'object') return '';
          var reasons = diagnostics.reasonCounts && typeof diagnostics.reasonCounts === 'object'
            ? Object.keys(diagnostics.reasonCounts).sort().map(function (code) {
                return code + '×' + Number(diagnostics.reasonCounts[code] || 0);
              }).filter(function (value) { return !/×0$/.test(value); })
            : [];
          if (diagnostics.criticErrorCode) reasons.push(String(diagnostics.criticErrorCode));
          if (!reasons.length) {
            reasons.push('générées=' + Number(diagnostics.generatedQuestionCount || 0));
            reasons.push('qualité=' + Number(diagnostics.finalQualityAcceptedCount || 0));
            reasons.push('structure=' + Number(diagnostics.postQualityStructuralCount || 0));
            reasons.push('connaissance=' + Number(diagnostics.postQualityKnowledgeMatchedCount || 0));
            reasons.push('stockables=' + Number(diagnostics.postQualityConstraintCount || 0));
          }
          return reasons.length ? ' Référence diagnostic : ' + reasons.join(', ') + '.' : '';
        }

        fetch('/api/users/notion-quizzes/custom', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ legacyKey: voterKey, topic: topic, level: level })
        })
          .then(function (res) {
            return res.text().then(function (body) {
              var data = null;
              try { data = body ? JSON.parse(body) : null; } catch (_) {}
              return { status: res.status, data: data, invalidJson: !data };
            });
          })
          .then(function (result) {
            customSearchGenerationActive = false;
            stopPieSpinner();
            customSearchBtn.disabled = false;
            customSearchInput.disabled = false;
            if (result.invalidJson) {
              if (pendingCustomSlot && typeof window.mnoriaFinishPendingNotionQuizGeneration === 'function') {
                window.mnoriaFinishPendingNotionQuizGeneration(pendingCustomSlot);
              }
              customTopicGenerationLabel = '';
              if (currentCategory === 'mesqcm' && !currentSlot) renderMesQcmList(currentMesQcmQuizzes);
              var httpReference = Number(result.status) ? ' (HTTP ' + Number(result.status) + ')' : '';
              setCustomSearchStatus('Le serveur a interrompu la génération' + httpReference + '. Réessaie dans quelques instants.', true);
              return;
            }
            if (!result.data.ok) {
              if (pendingCustomSlot && typeof window.mnoriaFinishPendingNotionQuizGeneration === 'function') {
                window.mnoriaFinishPendingNotionQuizGeneration(pendingCustomSlot);
              }
              customTopicGenerationLabel = '';
              if (currentCategory === 'mesqcm' && !currentSlot) renderMesQcmList(currentMesQcmQuizzes);
              if (result.data.diagnostics) {
                console.warn('[qcm-generation-diagnostics]', result.data.code, result.data.diagnostics);
              }
              setCustomSearchStatus(
                customGenerationErrorMessage(result.data.code, result.data.error) + customGenerationDiagnosticMessage(result.data.diagnostics),
                true
              );
              return;
            }
            if (pendingCustomSlot && typeof window.mnoriaFinishPendingNotionQuizGeneration === 'function') {
              window.mnoriaFinishPendingNotionQuizGeneration(pendingCustomSlot);
            }
            customTopicGenerationLabel = '';
            customSearchInput.value = '';
            setCustomSearchStatus('', false);
            loadSlot(result.data.slot, result.data.quizDate, result.data.label);
            showNotionQuizReadyModal(result.data.label || topic, result.data.questionCount);
            if (typeof onCreated === 'function') onCreated(result.data);
          })
          .catch(function () {
            customSearchGenerationActive = false;
            // Une coupure réseau ou la destruction de la page ne prouve pas que le serveur a
            // arrêté son travail. On conserve donc le marqueur persistant : la page
            // Apprentissage le réconciliera avec generation-status au prochain affichage.
            customTopicGenerationLabel = '';
            stopPieSpinner();
            customSearchBtn.disabled = false;
            customSearchInput.disabled = false;
            if (currentCategory === 'mesqcm' && !currentSlot) renderMesQcmList(currentMesQcmQuizzes);
            setCustomSearchStatus('Connexion interrompue. Vérifie ton réseau puis réessaie.', true);
          });
        });
    });
  }
  function submitCustomTopic(e) {
    e.preventDefault();
    var topic = (customSearchInput.value || '').trim();
    if (topic.length < 3) {
      setCustomSearchStatus('Décris le sujet en au moins 3 caractères.', true);
      return;
    }
    startCustomTopicGeneration(topic);
  }
  customSearchForm.addEventListener('submit', submitCustomTopic);
  // <textarea> plutôt qu'un <input> (cf. 12/08/2026) : Entrée y insère une
  // ligne par défaut au lieu de soumettre le formulaire — on garde le
  // réflexe "Entrée = valider" tant que Shift n'est pas maintenu (qui reste
  // libre d'insérer un retour à la ligne volontaire).
  customSearchInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      customSearchForm.requestSubmit();
    }
  });

  // "Explorer les apprentissages disponibles" (demande du 13/08/2026) :
  // adopter un sujet libre déjà généré par un autre visiteur (cf. server.js
  // GET /api/users/notion-quizzes/explore) au lieu de relancer une
  // génération IA (submitCustomTopic ci-dessus) pour un sujet proche mais
  // formulé différemment. Même fenêtre modale que openMesQcmActionMenu
  // (.qcm-fiche-overlay/.qcm-fiche-modal) pour rester cohérent visuellement.
  var mesQcmExploreModalEls = null;
  function closeMesQcmExploreModal() {
    if (!mesQcmExploreModalEls) return;
    mesQcmExploreModalEls.overlay.remove();
    if (mesQcmExploreModalEls.closeResizeObserver) mesQcmExploreModalEls.closeResizeObserver.disconnect();
    document.removeEventListener('keydown', mesQcmExploreModalEls.onKeydown);
    try { window.parent.postMessage({ type: 'mnoria:qcm-fiche-visibility', open: false }, '*'); } catch (e) {}
    mesQcmExploreModalEls = null;
  }
  function openMesQcmExploreModal() {
    closeMesQcmActionModal();
    closeMesQcmExploreModal();
    var modalHtml =
      '<div class="qcm-fiche-modal qcm-explore-modal">' +
        '<div class="qcm-fiche-head">' +
          '<p class="qcm-fiche-rubric"><i class="fa-solid fa-compass"></i> Apprentissages disponibles</p>' +
          '<button type="button" class="qcm-fiche-close" aria-label="Fermer"><i class="fa-solid fa-xmark"></i></button>' +
        '</div>' +
        '<input type="text" class="qcm-explore-search-input" id="qcm-explore-search-input" placeholder="Filtrer par sujet…">' +
        '<div class="qcm-explore-list-wrap"><div class="qcm-explore-list" id="qcm-explore-list"></div></div>' +
      '</div>';

    var overlay = document.createElement('div');
    overlay.className = 'qcm-fiche-overlay';
    overlay.innerHTML = '<div class="qcm-fiche-overlay-inner">' + modalHtml + '</div>';
    document.body.appendChild(overlay);
    positionFicheClose(overlay);
    // La carte change de hauteur à chaque étape (sablier -> liste, recherche
    // filtrée qui raccourcit/allonge le nombre de résultats...) : un seul
    // calcul à l'ouverture laissait la croix décrochée du coin réel de la
    // carte dès que son contenu changeait (demande du 30/08/2026, "elle peut
    // apparaître au milieu du cadre").
    var exploreCloseResizeObserver = null;
    if (typeof ResizeObserver === 'function') {
      var exploreCardEl = overlay.querySelector('.qcm-fiche-modal');
      exploreCloseResizeObserver = new ResizeObserver(function () { positionFicheClose(overlay); });
      exploreCloseResizeObserver.observe(exploreCardEl);
    }
    try { window.parent.postMessage({ type: 'mnoria:qcm-fiche-visibility', open: true }, '*'); } catch (e) {}

    function onKeydown(e) { if (e.key === 'Escape') closeMesQcmExploreModal(); }
    overlay.addEventListener('click', function (e) {
      if (e.target === overlay || e.target.classList.contains('qcm-fiche-overlay-inner')) closeMesQcmExploreModal();
    });
    document.addEventListener('keydown', onKeydown);
    overlay.querySelector('.qcm-fiche-close').addEventListener('click', closeMesQcmExploreModal);
    mesQcmExploreModalEls = { overlay: overlay, onKeydown: onKeydown, closeResizeObserver: exploreCloseResizeObserver };

    var searchInput = overlay.querySelector('#qcm-explore-search-input');
    var listWrapEl = overlay.querySelector('.qcm-explore-list-wrap');
    var listEl = overlay.querySelector('#qcm-explore-list');
    var ownedSlots = {};
    currentMesQcmQuizzes.forEach(function (q) { ownedSlots[q.slot] = true; });

    // "suite" + dégradé (demande du 13/08/2026, même habillage générique que
    // les autres listes/pages du site, cf. .scroll-fade-hint dans style.css)
    // signalant qu'il reste des sujets à découvrir plus bas dans la liste.
    // Contrairement à .qcm-fiche-fade-hint plus haut (posé directement sur
    // <body> à cause du parent position:fixed+scroll de la fiche),
    // .qcm-explore-list-wrap n'est PAS position:fixed : le positionnement
    // absolute générique fonctionne ici sans contournement.
    var exploreFadeHint = document.createElement('div');
    exploreFadeHint.className = 'scroll-fade-hint is-hidden';
    exploreFadeHint.style.setProperty('--scroll-fade-color', '#ffffff');
    exploreFadeHint.innerHTML = '<span class="scroll-fade-hint-text">suite <span aria-hidden="true">↓</span></span>';
    listWrapEl.appendChild(exploreFadeHint);
    exploreFadeHint.querySelector('.scroll-fade-hint-text').addEventListener('click', function (e) {
      e.stopPropagation();
      listEl.scrollBy({ top: listEl.clientHeight * 0.8, behavior: 'smooth' });
    });
    function updateExploreFadeHint() {
      var hasOverflow = listEl.scrollHeight > listEl.clientHeight + 2;
      var atBottom = listEl.scrollTop + listEl.clientHeight >= listEl.scrollHeight - 4;
      exploreFadeHint.classList.toggle('is-hidden', !hasOverflow || atBottom);
    }
    listEl.addEventListener('scroll', updateExploreFadeHint, { passive: true });

    function renderExploreList(items) {
      if (!items.length) {
        listEl.innerHTML = '<p class="qcm-state-message">Aucun sujet trouvé pour le moment.</p>';
        updateExploreFadeHint();
        return;
      }
      // Classés par thématique (demande du 30/08/2026, "la même que Ma
      // mémoire") : items déjà groupés par item.theme côté serveur (cf. GET
      // .../explore) — on insère juste un intitulé de groupe à chaque
      // changement de thématique, jamais de logique de tri ici.
      var lastTheme;
      var hasSeenTheme = false;
      listEl.innerHTML = items.map(function (item) {
        var themeHeadingHtml = '';
        if (!hasSeenTheme || item.theme !== lastTheme) {
          themeHeadingHtml = '<p class="qcm-explore-theme-heading">' + escapeHtml(item.theme || 'Autres sujets') + '</p>';
          lastTheme = item.theme;
          hasSeenTheme = true;
        }
        var already = !!ownedSlots[item.slot];
        var metaText = already ? 'Déjà dans ta liste' : (item.userCount + ' visiteur' + (item.userCount > 1 ? 's' : ''));
        var count = Number(item.questionCount) || 0;
        var countText = count + ' question' + (count > 1 ? 's' : '');
        var queryHtml = item.searchTopic ? '<span class="qcm-explore-item-query">' + escapeHtml(item.searchTopic) + '</span>' : '';
        return themeHeadingHtml +
          '<button type="button" class="qcm-explore-item" data-slot="' + escapeHtml(item.slot) + '" data-quiz-date="' + escapeHtml(item.quizDate) + '"' + (already ? ' disabled' : '') + '>' +
          '<span class="qcm-explore-item-label">' + escapeHtml(item.label) + '<span class="qcm-explore-item-count">' + escapeHtml(countText) + '</span>' + queryHtml + '</span>' +
          '<span class="qcm-explore-item-meta">' + escapeHtml(metaText) + '</span>' +
        '</button>';
      }).join('');
      listEl.querySelectorAll('.qcm-explore-item:not(:disabled)').forEach(function (itemBtn) {
        itemBtn.addEventListener('click', function () {
          adoptExploreItem(itemBtn.getAttribute('data-slot'), itemBtn.getAttribute('data-quiz-date'), itemBtn);
        });
      });
      requestAnimationFrame(updateExploreFadeHint);
    }

    function fetchAndRenderExplore(search) {
      listEl.innerHTML = '<p class="qcm-state-message"><img src="/sablier-96.png" alt="" class="qcm-loading-hourglass" aria-hidden="true">Chargement…</p>';
      updateExploreFadeHint();
      fetch('/api/users/notion-quizzes/explore' + (search ? '?search=' + encodeURIComponent(search) : ''))
        .then(function (res) { return res.json(); })
        .then(function (data) { renderExploreList(Array.isArray(data.items) ? data.items : []); })
        .catch(function () {
          listEl.innerHTML = '<p class="qcm-state-message">Impossible de charger la liste pour le moment.</p>';
          updateExploreFadeHint();
        });
    }

    function adoptExploreItem(slot, quizDate, itemBtn) {

      fetch('/api/users/notion-quizzes/adopt', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },

  // Jauge de charge d'apprentissage (demande du 17/08/2026, cf. server.js
  // GET /api/users/learning-load + lib/spaced-repetition/learning-load.js
  // pour tout le calcul — ce bloc ne fait que l'afficher). Visible
  // uniquement sur "Découvrir" (appelée depuis loadMesQcm), jamais pendant
  // un QCM en cours ni sur Ancrer/Relier (cf. hideLoadGauge dans loadSlot).
  // "Charge de mémorisation" (demande du 17/08/2026), plus clair que le
  // simple "Charge" — précise qu'il s'agit du rythme des repasses à venir,
  // pas d'une charge générale de l'appli.
  // shortLabel (demande du 27/08/2026, nouveau composant barre) : juste le
  // qualificatif, affiché séparément du titre "Charge de mémorisation" dans
  // le nouveau design compact — même 4 niveaux, mêmes seuils (minRatio/
  // maxRatio) et même label complet qu'avant, rien de métier n'a changé ici.
  var LOAD_GAUGE_LEVEL_META = {
    calm: { label: 'Charge de mémorisation calme', shortLabel: 'Calme', minRatio: 0, maxRatio: 0.5 },
    moderate: { label: 'Charge de mémorisation modérée', shortLabel: 'Modérée', minRatio: 0.5, maxRatio: 1.0 },
    busy: { label: 'Charge de mémorisation élevée', shortLabel: 'Élevée', minRatio: 1.0, maxRatio: 1.75 },
    overloaded: { label: 'Surcharge de mémorisation', shortLabel: 'Surchargée', minRatio: 1.75, maxRatio: 2.75 }
  };
  var LOAD_GAUGE_LEVEL_ORDER = ['calm', 'moderate', 'busy', 'overloaded'];

  // Repère "Idéal" : un rythme confortable de 12 repasses/jour, pas un seuil
  // d'alerte. Les niveaux calme/modéré/élevé/surchargé continuent d'utiliser
  // le plafond technique de 20 côté serveur ; seule l'échelle visuelle du
  // pourcentage est recalée ici sur le rythme idéal demandé.
  var LOAD_GAUGE_IDEAL_QUESTIONS = 12;

  // Repère "Idéal" placé aux 2/3 de la piste (demande du 30/08/2026) : le
  // dernier tiers de la barre reste disponible pour visualiser la surcharge
  // au-delà du rythme idéal (110 %, 120 %, 130 %… jusqu'à "Surcharge
  // cognitive" en bout de piste). LOAD_GAUGE_BAR_MAX_PERCENT est donc le
  // pourcentage de charge (base 12 questions = 100 %) qui correspond à
  // l'extrémité droite de la barre : 100 / (2/3) = 150 %.
  var LOAD_GAUGE_IDEAL_POSITION_PERCENT = 200 / 3;
  var LOAD_GAUGE_BAR_MAX_PERCENT = 150;

  // Repère "Idéal" (demande du 27/08/2026, nouvelle barre horizontale ;
  // repositionné aux 2/3 le 30/08/2026) : position fixe, indépendante de la
  // charge réelle affichée par la barre. Posée une seule fois, jamais
  // recalculée au fil des rendus.
  (function initLoadGaugeIdealMarker() {
    var marker = document.getElementById('qcm-load-gauge-ideal-marker');
    var label = document.getElementById('qcm-load-gauge-ideal-label');
    if (!marker && !label) return;
    if (marker) marker.style.left = LOAD_GAUGE_IDEAL_POSITION_PERCENT + '%';
    if (label) label.style.left = LOAD_GAUGE_IDEAL_POSITION_PERCENT + '%';
  })();

  function hideLoadGauge() {
    loadGaugeToken++;
    if (loadGaugeEl) {
      loadGaugeEl.classList.remove('visible');
      // .hidden ET la classe : une règle globale [hidden]{display:none !important}
      // (cf. .mnoria-tribunes-btn[hidden] plus haut dans ce projet, même piège) bat
      // toujours .qcm-load-gauge.visible{display:flex} tant que l'attribut reste
      // posé — poser seulement la classe n'aurait aucun effet visuel à l'affichage.
      loadGaugeEl.hidden = true;
    }
  }

  function renderLoadGauge(gauge) {
    if (!loadGaugeEl || !gauge) return;
    loadGaugeEl.hidden = false;
    var meta = LOAD_GAUGE_LEVEL_META[gauge.level] || LOAD_GAUGE_LEVEL_META.calm;
    // Le pourcentage visible exprime l'avancement vers le rythme idéal :
    // 12 questions prévues = 100 %. Au-delà, il continue de grimper (110 %,
    // 120 %, 130 %…, demande du 30/08/2026) au lieu d'être plafonné — seul le
    // remplissage visuel de la barre est borné, sur une échelle qui va
    // jusqu'à LOAD_GAUGE_BAR_MAX_PERCENT (150 %, l'extrémité de la piste,
    // repère "Surcharge cognitive"). La couleur/le libellé continuent de
    // refléter le niveau calculé côté serveur. Aucun calcul FSRS ni seuil
    // métier n'est modifié.
    var peakLoad = Math.max(0, Number(gauge.peakLoad) || 0);
    var chargePercent = Math.round((peakLoad / LOAD_GAUGE_IDEAL_QUESTIONS) * 100);
    var barFillPercent = Math.min((chargePercent / LOAD_GAUGE_BAR_MAX_PERCENT) * 100, 100);
    if (loadGaugePercent) loadGaugePercent.textContent = chargePercent + ' %';
    if (loadGaugeBarFill) {
      loadGaugeBarFill.className = 'qcm-load-gauge-bar-fill qcm-load-gauge-bar-fill-' + gauge.level;
      var loadGaugeSegmentCount = 60;
      if (loadGaugeBarFill.children.length !== loadGaugeSegmentCount) {
        loadGaugeBarFill.innerHTML = '';
        for (var segmentIndex = 0; segmentIndex < loadGaugeSegmentCount; segmentIndex += 1) {
          var newSegment = document.createElement('span');
          newSegment.className = 'qcm-load-gauge-segment';
          loadGaugeBarFill.appendChild(newSegment);
        }
      }
      var loadGaugeSegments = loadGaugeBarFill.querySelectorAll('.qcm-load-gauge-segment');
      Array.prototype.forEach.call(loadGaugeSegments, function (segment, index) {
        var segmentSize = 100 / loadGaugeSegmentCount;
        var segmentStart = index * segmentSize;
        var segmentFill = Math.max(0, Math.min(100, ((barFillPercent - segmentStart) / segmentSize) * 100));
        segment.style.setProperty('--segment-fill', segmentFill + '%');
        segment.classList.toggle('is-filled', segmentFill === 100);
        segment.classList.toggle('is-partial', segmentFill > 0 && segmentFill < 100);
        segment.classList.toggle('is-current', segmentFill > 0 && (segmentFill < 100 || index === Math.ceil(barFillPercent / segmentSize) - 1));
      });
      var loadGaugeTrack = loadGaugeBarFill.parentElement;
      if (loadGaugeTrack) {
        loadGaugeTrack.setAttribute('aria-valuemax', String(LOAD_GAUGE_BAR_MAX_PERCENT));
        loadGaugeTrack.setAttribute('aria-valuenow', String(Math.min(chargePercent, LOAD_GAUGE_BAR_MAX_PERCENT)));
      }
    }
    if (loadGaugeLabel) loadGaugeLabel.textContent = meta.shortLabel || meta.label;
    if (loadGaugeCaption) {
      if (gauge.peakLoad > 0 && gauge.peakDayIndex >= 0) {
        var when = gauge.peakDayIndex === 0 ? "aujourd'hui" : (gauge.peakDayIndex === 1 ? 'demain' : 'dans ' + gauge.peakDayIndex + ' jours');
        loadGaugeCaption.textContent = 'Pic estimé : ' + gauge.peakLoad + ' question' + (gauge.peakLoad > 1 ? 's' : '') + ' ' + when + '.';
      } else {
        loadGaugeCaption.textContent = 'Aucune repasse programmée pour l’instant.';
      }
    }
    loadGaugeEl.classList.add('visible');
  }

  function fetchLoadGaugeData() {

    return fetch('/api/users/learning-load?legacyKey=' + encodeURIComponent(voterKey), { cache: 'no-store' })
      .then(function (res) { return res.json(); })
      .then(function (data) { return data && !data.error ? data : null; })
      .catch(function () { return null; });

  // "À apprendre ensuite" (demande du 30/08/2026) : section compacte intégrée
  // directement sous "Commencer un nouvel apprentissage" (remplace l'ancienne
  // entrée "Préconisations" du menu + sa fenêtre dédiée) — mêmes routes
  // backend (GET .../learn-next puis .../ai-fallback, cf. server.js et
  // lib/learn-next/ pour l'algorithme catalogue-prioritaire + IA en
  // complément, toujours 3 au plus), mêmes handlers de clic, seule la
  // présentation change.
  function sendLearnNextEvent(item, eventType) {
    if (!voterKey) return;
    fetch('/api/users/recommendations/learn-next/events', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        legacyKey: voterKey,
        events: [{
          eventType: eventType,
          subjectType: item.subjectType,
          subjectSourceId: item.subjectSourceId,
          solarSystemId: item.solarSystemId || null,
          recommendationType: item.recommendationType,
          score: item.score
        }]
      })
    }).catch(function () {});
