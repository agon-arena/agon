  <style>
    /* Garde-fou (bug constaté le 13/08/2026) : l'attribut hidden est ignoré
       dès qu'un élément porte une classe qui fixe elle-même son display
       (ex. .qcm-options { display:flex }, .qcm-next-btn.visible { display:
       block }) — même spécificité CSS que la règle native [hidden]{display:
       none}, donc la classe posée après dans la feuille de style l'emporte.
       Résultat concret : le bouton "Réfléchis à ta réponse" affichait les
       propositions juste en dessous au lieu de les cacher tant qu'on n'a pas
       cliqué (cf. wireRevealGate). !important au lieu d'une règle par
       élément affecté : plus sûr contre un futur cas similaire. */
    [hidden] {
      display: none !important;
    }
    /* Même bleu-gris foncé que le bandeau des bulles sur l'accueil (#243038).
       Posé à la fois sur html et body : html a déjà ce fond par défaut (cf.
       style.css ligne ~14068), mais sans hauteur de body qui couvre tout le
       viewport, une bande plus claire pouvait apparaître sous une carte courte. */
    html,
    html:has(body.page-qcm-du-jour) {
      background-color: #243038;
    }
    body.page-qcm-du-jour {
      min-height: 100vh;
      background-color: #243038;
    }
    /* État initial peint avant toute exécution du JS : la page Apprentissage affiche déjà la
       texture neuronale utilisée ensuite par Découvrir/Ancrer/Relier/Mes acquis. Cela supprime
       le flash bleu pétrole pendant que les premières données sont récupérées. */
    body.page-qcm-du-jour.qcm-learning-background {
      background-image:
        linear-gradient(rgba(16, 24, 32, 0.72), rgba(16, 24, 32, 0.72)),
        url('/mnoria_master_4K_seamless_infini.webp?v=20260816-webp-lossy');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }
    /* Sur desktop, la marge basse du contenu peut appartenir au canevas de
       <html> plutôt qu'aux pixels peints par <body>. Le fond racine bleu
       pétrole devenait alors visible en fin de défilement. Peindre la même
       texture sur les deux surfaces garantit un fond neuronal continu. */
    @media (min-width: 769px) {
      html:has(body.page-qcm-du-jour.qcm-learning-background),
      body.page-qcm-du-jour.qcm-learning-background {
        background-image:
          linear-gradient(rgba(16, 24, 32, 0.72), rgba(16, 24, 32, 0.72)),
          url('/mnoria_master_4K_seamless_infini.webp?v=20260816-webp-lossy');
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        background-attachment: fixed;
      }
    }
    /* Apprentissage reprend le véritable bandeau de navigation d'index. */
    body.page-qcm-du-jour .qcm-home-bottom-nav {
      z-index: 10020;
      padding-bottom: max(10px, env(safe-area-inset-bottom, 0px));
      border-radius: 0 !important;
    }
    body.page-qcm-du-jour .qcm-home-bottom-nav .home-bottom-nav-item,
    body.page-qcm-du-jour .qcm-home-bottom-nav .home-bottom-nav-item i,
    body.page-qcm-du-jour .qcm-home-bottom-nav .home-bottom-nav-item span {
      color: #000000 !important;
    }
    @media (min-width: 769px) {
      body.page-qcm-du-jour .qcm-home-bottom-nav {
        gap: 6px !important;
      }
      body.page-qcm-du-jour .qcm-home-bottom-nav .home-bottom-nav-item {
        padding-left: 10px !important;
        padding-right: 10px !important;
      }
    }
    /* html.in-iframe (pas body.in-iframe) : la classe est posée sur
       <html> de façon synchrone dès l'exécution de ce script (ligne ~21),
       avant même que <body> existe — alors que body.in-iframe n'est ajoutée
       qu'au DOMContentLoaded. Un sélecteur basé sur body.in-iframe faisait
       donc d'abord peindre le cadre avec les règles "hors iframe" (marge du
       haut bien plus grande, cf. .qcm-page-shell plus bas), qui ne se
       corrigeait qu'après coup — un saut visible du cadre vers le haut au
       chargement (constaté le 04/08/2026). */
    html.in-iframe body.page-qcm-du-jour {
      box-sizing: border-box;
      padding-bottom: 360px;
    }
    body.page-qcm-du-jour .topbar-inner {
      justify-content: center !important;
      padding: 2px 0 !important;
    }
    body.page-qcm-du-jour .home-brand-block {
      flex: 0 0 auto !important;
      margin-left: 0 !important;
    }
    body.page-qcm-du-jour .home-logo {
      width: 116px !important;
      transform: translateY(2px) !important;
    }
    body.page-qcm-du-jour .topbar-inner > :not(.home-brand-block),
    body.page-qcm-du-jour .home-brand-block > :not(.home-brand-main) {
      display: none !important;
    }
    @media (max-width: 768px) {
      body.page-qcm-du-jour .home-logo {
        width: 74px !important;
      }
      body.page-qcm-du-jour .topbar-inner {
        padding: 0 !important;
      }
    }
    .qcm-page-shell {
      width: min(100% - 32px, 900px);
      margin: 112px auto 180px;
    }
    /* /apprentissage est maintenant une page top-level : le grand retrait
       historique réservé au modal iframe n'est plus nécessaire. */
    html:not(.in-iframe) .qcm-page-shell {
      margin: 16px auto 180px;
    }
    html.in-iframe .page-qcm-du-jour .qcm-page-shell {
      margin: 4px auto 0;
    }
    /* Pendant une séance, crée une vraie réserve de défilement APRÈS le cadre.
       Une simple margin-bottom sur le dernier élément peut être absorbée ou
       insuffisamment exposée par Safari standalone face au bandeau fixe : ce
       pseudo-élément appartient au contenu scrollable et permet donc de faire
       remonter entièrement le bas du cadre au-dessus de la navigation. */
    body.qcm-in-session .qcm-page-shell::after,
    body.qcm-discover-overview .qcm-page-shell::after {
      content: "";
      display: block;
      width: 100%;
      height: calc(110px + env(safe-area-inset-bottom, 0px));
      pointer-events: none;
    }
    /* Doit rester APRÈS la règle ci-dessus (même sélecteur, donc même
       spécificité) : un margin-bottom placé avant un margin raccourci
       équivalent serait écrasé par lui, peu importe le media query. */
    @media (max-width: 768px) {
      html:not(.in-iframe) .qcm-page-shell {
        margin-top: 12px;
      }
      body.qcm-in-session .qcm-page-shell::after,
      body.qcm-discover-overview .qcm-page-shell::after {
        height: calc(150px + env(safe-area-inset-bottom, 0px));
      }
      /* Vraie zone scrollable en bas, sans pseudo-bandeau ajouté au DOM. */
      html.in-iframe body.page-qcm-du-jour {
        padding-bottom: clamp(360px, 42vh, 520px);
      }
    }
    @media (min-width: 769px) {
      .qcm-page-shell {
        width: min(100% - 64px, 780px);
      }
    }
    .qcm-panel,
    .qcm-panel * {
      box-sizing: border-box;
    }
    .qcm-panel {
      position: relative;
      width: 100%;
      /* Opaque par défaut (liste Découvrir, Mes acquis...) : pas d'image de
         fond à deviner derrière en dehors d'une question (demande du
         27/08/2026). */
      background: #ffffff;
      border: 2px solid #111827;
      border-radius: 8px;
      padding: 24px;
      /* Très léger liseret blanc à l'extérieur du noir (demande du
         30/08/2026 — l'essai précédent en `outline` rendait mal, cf.
         "tu l'as mis à l'intérieur") : box-shadow avec spread, toujours
         dessiné à l'extérieur de la bordure et fidèle au border-radius dans
         tous les navigateurs, contrairement à outline. */
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.85),
        0 12px 30px rgba(0, 0, 0, 0.18);
      font-family: Arial, Helvetica, sans-serif;
    }
    /* À la première arrivée seulement, le panneau conserve sa place mais ne
       peint aucun enfant avant que données, jauge, rubriques et police soient
       toutes prêtes. La classe est retirée une seule fois par
       signalIframeReady : aucun affichage successif bouton -> jauge -> liste. */
    .qcm-panel.qcm-panel-awaiting-content {
      visibility: hidden;
    }
    .qcm-panel-close {
      position: absolute;
      top: 9px;
      right: 9px;
      z-index: 4;
      display: none;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      padding: 0;
      border: none !important;
      border-radius: 999px;
      background: transparent !important;
      box-shadow: none !important;
      color: #8a949c;
      font-size: 14px;
      cursor: pointer;
    }
    .qcm-panel-close.visible {
      display: inline-flex;
    }
    .qcm-panel-close:hover,
    .qcm-panel-close:focus-visible {
      background: transparent !important;
      box-shadow: none !important;
      color: #243038;
    }
    /* Légèrement translucide uniquement pendant une question en cours (posé
       par applyQuestionBackgroundImage/clearQuestionBackgroundImage, demande
       du 18/08/2026, ajustée plusieurs fois le 27/08/2026, puis restreinte à
       ce seul état le 27/08/2026) : laisse deviner le fond de la question
       sans jamais nuire à la lisibilité du texte. Un seul et même cadre pour
       Découvrir/Ancrer/Relier : cette valeur s'applique identiquement aux 3
       catégories dès qu'une question est affichée. */
    body.qcm-in-session .qcm-panel,
    body.qcm-learning-background .qcm-panel {
      background: rgba(255, 255, 255, 0.8);
    }
    .qcm-panel h1 {
      margin: 0 0 4px;
      font-family: "Barlow Condensed", Arial, sans-serif;
      font-size: 34px;
      line-height: 1;
      color: #111827;
      text-align: center;
    }
    .qcm-panel .qcm-subtitle {
      margin: 0 0 16px;
      color: #6b7280;
      font-size: 14px;
      text-align: center;
    }
    /* Conservés uniquement comme cibles internes pour le code historique qui
       met à jour leur texte ; ils ne participent plus à la mise en page. */
    .qcm-page-heading-hidden {
      display: none !important;
    }
    /* Le libellé réel du parcours devient le titre du cadre pendant la
       séance. Il reste masqué sur les vues Découvrir/Ancrer/Relier/Mes
       acquis, où les rubriques suffisent à identifier la page. */
    body.qcm-in-session .qcm-panel h1.qcm-page-heading-hidden {
      display: block !important;
      max-width: 680px;
      margin: 0 auto 8px;
      padding: 0 34px;
      color: #17212a;
      font-size: clamp(28px, 4.5vw, 34px);
      line-height: 1.15;
      text-align: center;
      text-wrap: balance;
    }
    /* Petit liseret noir sous le titre du QCM pendant la séance (demande du
       30/08/2026). */
    body.qcm-in-session .qcm-panel h1.qcm-page-heading-hidden::after {
      content: '';
      display: block;
      width: 40px;
      height: 3px;
      margin: 12px auto 0;
      background: #111827;
    }
    /* Charge de mémorisation (demande du 17/08/2026, remplacée le 27/08/2026
       par une barre de progression horizontale — l'ancien cadran à aiguille
       jugé trop massif). L'échelle visuelle atteint désormais 100 % au rythme
       idéal de 12 questions ; gauge.ratio/niveau/seuils restent calculés par
       le serveur (lib/spaced-repetition/learning-load.js), sans modification. */
    .qcm-load-gauge {
      display: none;
      flex-direction: column;
      margin: 2px auto 20px;
      width: 100%;
      max-width: 700px;
      padding: 16px 18px 15px;
      border: 1px solid rgba(31, 53, 62, 0.1);
      border-radius: 16px;
      background: linear-gradient(145deg, #ffffff 0%, #f7f9fa 100%);
      box-shadow: 0 8px 22px rgba(31, 53, 62, 0.07);
      box-sizing: border-box;
    }
    .qcm-load-gauge.visible {
      display: flex;
    }
    .qcm-load-gauge-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
    }
    .qcm-load-gauge-title {
      font-family: "Barlow Condensed", Arial, sans-serif;
      font-size: 18px;
      font-weight: 700;
      color: #111827;
    }
    .qcm-load-gauge-percent {
      font-family: "Barlow Condensed", Arial, sans-serif;
      font-size: 24px;
      font-weight: 700;
      color: #111827;
      white-space: nowrap;
    }
    .qcm-load-gauge-label {
      margin: 1px 0 12px;
      color: #6b7280;
      font-size: 12.5px;
      text-align: left;
    }
    .qcm-load-gauge-bar-track {
      position: relative;
      width: 100%;
      height: 30px;
      padding: 4px 0;
      box-sizing: border-box;
      overflow: visible;
    }
    .qcm-load-gauge-bar-fill {
      --gauge-color-start: #55c979;
      --gauge-color-end: #179748;
      display: grid;
      grid-template-columns: repeat(60, minmax(0, 1fr));
      align-items: center;
      gap: 2px;
      width: 100%;
      height: 100%;
    }
    .qcm-load-gauge-segment {
      --segment-fill: 0%;
      height: 100%;
      position: relative;
      overflow: hidden;
      height: 18px;
      border: none;
      border-radius: 2px;
      background: linear-gradient(90deg,
        var(--gauge-color-start) 0,
        var(--gauge-color-end) var(--segment-fill),
        #d5dde1 var(--segment-fill),
        #e0e6e8 100%);
      box-shadow: 0 1px 2px rgba(31, 53, 62, 0.12);
      transition: background 0.35s ease, height 0.25s ease, box-shadow 0.25s ease;
    }
    .qcm-load-gauge-segment.is-filled,
    .qcm-load-gauge-segment.is-partial {
      box-shadow: 0 2px 4px rgba(31, 53, 62, 0.2);
    }
    .qcm-load-gauge-segment.is-current {
      height: 24px;
      box-shadow: 0 2px 6px rgba(31, 53, 62, 0.3);
    }
    /* Mêmes 4 couleurs que l'ancien cadran (.qcm-load-gauge-arc-*), reprises
       telles quelles (un léger dégradé clair->couleur de base et un halo
       assorti, demande du 27/08/2026 "plus visuelle" — jamais de teinte
       nouvelle, juste une variation de luminosité de la même couleur). */
    .qcm-load-gauge-bar-fill-calm { --gauge-color-start: #5dd184; --gauge-color-end: #19964a; }
    .qcm-load-gauge-bar-fill-moderate { --gauge-color-start: #ffd160; --gauge-color-end: #ee9810; }
    .qcm-load-gauge-bar-fill-busy { --gauge-color-start: #ffad62; --gauge-color-end: #e45d16; }
    .qcm-load-gauge-bar-fill-overloaded { --gauge-color-start: #fa8585; --gauge-color-end: #d83232; }
    /* Repère "Idéal" (demande du 17/08/2026, repositionné en barre le
       27/08/2026, puis décalé aux 2/3 de la barre le 30/08/2026 pour laisser
       un tiers de piste à la zone de surcharge au-delà des 100 % — la barre
       continue donc désormais au-delà de l'idéal, cf. LOAD_GAUGE_IDEAL_
       POSITION_PERCENT/LOAD_GAUGE_BAR_MAX_PERCENT en JS) : sa position reste
       indépendante de la charge réelle. Trait sombre et court, chevauchant la
       barre pour rester lisible quelle que soit la couleur du remplissage
       dessous. */
    .qcm-load-gauge-ideal-marker {
      position: absolute;
      z-index: 2;
      top: -6px;
      left: 100%;
      width: 2px;
      height: 40px;
      background: #111827;
      border-radius: 999px;
      transform: translateX(-50%);
      pointer-events: none;
    }
    .qcm-load-gauge-ideal-marker::before {
      content: '';
      position: absolute;
      top: -2px;
      left: 50%;
      width: 7px;
      height: 7px;
      border: 2px solid #ffffff;
      border-radius: 50%;
      background: #111827;
      box-shadow: 0 1px 4px rgba(15, 23, 42, 0.3);
      transform: translateX(-50%);
    }
    /* Repère "Surcharge" en bout de piste (demande du 30/08/2026) : même
       trait + pastille que le repère "Idéal" ci-dessus, en rouge pour
       reprendre la couleur du niveau "overloaded" existant. */
    .qcm-load-gauge-overload-marker {
      position: absolute;
      z-index: 2;
      top: -6px;
      left: 100%;
      width: 2px;
      height: 40px;
      background: #d83232;
      border-radius: 999px;
      transform: translateX(-50%);
      pointer-events: none;
    }
    .qcm-load-gauge-overload-marker::before {
      content: '';
      position: absolute;
      top: -2px;
      left: 50%;
      width: 7px;
      height: 7px;
      border: 2px solid #ffffff;
      border-radius: 50%;
      background: #d83232;
      box-shadow: 0 1px 4px rgba(15, 23, 42, 0.3);
      transform: translateX(-50%);
    }
    /* Repère textuel "Idéal" sous la barre, aux 2/3 (demande du 30/08/2026). */
    .qcm-load-gauge-axis-labels {
      position: relative;
      width: 100%;
      height: 12px;
      margin: 11px 0 0;
    }
    .qcm-load-gauge-ideal-label {
      position: absolute;
      top: 0;
      left: 66.6667%;
      transform: translateX(-50%);
      display: block;
      width: max-content;
      font-family: "Barlow Condensed", Arial, sans-serif;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      white-space: nowrap;
      color: #111827;
    }
    /* "Surcharge" : sous la piste, en bout de piste (demande du 30/08/2026,
       même ligne que "Idéal") — couleur reprise du niveau "overloaded"
       existant (.qcm-load-gauge-bar-fill-overloaded), jamais une teinte
       nouvelle. */
    .qcm-load-gauge-overload-label {
      position: absolute;
      top: 0;
      left: 100%;
      transform: translateX(-80%);
      display: block;
      width: max-content;
      font-family: "Barlow Condensed", Arial, sans-serif;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      white-space: nowrap;
      color: #d83232;
    }
    .qcm-load-gauge-caption {
      margin: 9px 0 0;
      color: #6b7280;
      font-size: 12.5px;
      text-align: left;
    }
    @media (max-width: 480px) {
      .qcm-load-gauge {
        padding: 14px 13px 13px;
        border-radius: 14px;
      }
      .qcm-load-gauge-title {

      .qcm-load-gauge-percent {

      }
      .qcm-load-gauge-bar-track {
        height: 28px;
      }
      .qcm-load-gauge-bar-fill {

      }

    /* Navigation par onglets texte, intégrée à la page (demande du 27/08/2026,
       refonte complète : plus de carte blanche/pilules, "doit sembler
       appartenir naturellement à la page"). Découvrir/Ancrer/Relier sont de
       la navigation (texte + trait actif), pas des boutons d'action — à
       dessein très différents de Générer/Plus d'options plus bas. */
    .qcm-category-group {
      display: none;
      visibility: hidden;
      width: calc(100% + 24px);
      margin: 0 -12px 28px;
      justify-content: center;
      align-items: baseline;
      gap: 9px;
    }
    /* Scopé à ".qcm-panel:not(.qcm-panel-awaiting-content)" (pas juste
       ".is-layout-ready" seul) : visibility:visible sur un enfant repasse au-dessus
       du visibility:hidden d'un ancêtre, même si cet ancêtre (.qcm-panel.qcm-panel-
       awaiting-content) est encore caché en attente des données réseau (Mes QCM +
       jauge). is-layout-ready se pose dès la stabilisation des polices (~1 frame),
       bien avant la fin du fetch — sans ce double verrou, les onglets Découvrir/
       Ancrer/Relier (et leur doré/trait actif) apparaissaient seuls, flottants,
       avant le reste du panneau (demande du 30/08/2026, "titre ancrer relier et
       barre jaune qui apparaissent en premier"). */
    .qcm-panel:not(.qcm-panel-awaiting-content) .qcm-category-group.is-layout-ready {
      visibility: visible;
    }
    .qcm-category-group:has(#qcm-category-switcher.visible) {
      display: flex;
    }
    .qcm-slot-switcher {
      display: none;
    }
    .qcm-slot-switcher.visible {
      display: contents;
    }
    /* Retour secondaire placé après la question, tout en bas du cadre : il
       reste accessible sans concurrencer visuellement le contenu du QCM. */
    .qcm-learning-return-bottom {
      margin: 8px auto 0;
      text-align: center;
    }
    .qcm-learning-return-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-height: 32px;
      padding: 5px 8px;
      border: 1px solid #d1d5db;
      border-radius: 7px;
      background: transparent;
      color: #6b7280;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .qcm-learning-return-btn:hover,
    .qcm-learning-return-btn:focus-visible {
      background: rgba(36, 48, 56, 0.07);
      color: #243038;
    }
    .qcm-slot-btn {
      position: relative;
      width: auto;
      flex: 0 0 auto;
      padding: 6px 3px 10px;
      border: none;
      background: none;
      /* Noir dès que cliquable (comme .active juste en dessous) — le gris reste réservé au seul
         état :disabled, plus bas (demande du 26/08/2026). */
      color: #111827;
      font-family: "Barlow Condensed", Arial, sans-serif;
      font-size: 32px;
      font-weight: 600;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      white-space: nowrap;
      cursor: pointer;
    }
    /* Trait actif : court (proche de la largeur du mot, pas toute la
       largeur du segment) et dans l'orange déjà utilisé ailleurs sur Mnoria
       pour les actions de mémorisation (cf. .het-rubric-memorize-btn.is-active,
       style.css) — pas une nouvelle couleur. */
    .qcm-slot-btn.active {
      color: #111827;
      font-weight: 700;
    }
    .qcm-slot-btn.active::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: 0;
      transform: translateX(-50%);
      width: 60%;
      height: 3px;
      border-radius: 999px;
      background: #f5b642;
    }
    /* "← Découvrir" (retour rapide depuis un QCM en cours, cf.
       renderCategorySwitcher) : même famille texte, juste assez marqué pour
       rester identifiable comme cliquable, sans le trait actif (ce n'est pas
       réellement l'onglet ouvert). */
    .qcm-slot-btn.qcm-learning-back-btn {
      color: #243038;
      font-weight: 700;
    }
    /* Catégorie sans créneau prêt (ex. QCM actu/Culture générale pas encore
       généré) : visible pour montrer la mise en page normale plutôt que de
       la faire disparaître ou de rediriger automatiquement ailleurs, mais
       non cliquable. */
    .qcm-slot-btn:disabled {
      /* #c7ced3 était quasi invisible sur le fond clair de .qcm-panel, sans
         fond propre pour le faire ressortir comme avant (demande du
         27/08/2026, "je ne vois plus les boutons Ancrer et Relier"). */
      color: #9ca3af;
      cursor: not-allowed;
    }
    /* "Ancrer"/"Relier" mis en avant quand du nouveau contenu attend
       (isCategoryAvailable, cf. renderCategorySwitcher) : simple recoloration
       dans le même orange que le trait actif (cf. ci-dessus), jamais de fond —
       reste un onglet de navigation, pas un badge. Jamais posé sur l'onglet
       actif (cf. renderCategorySwitcher, qui n'ajoute cette classe que si
       !active). */
    .qcm-slot-btn-new {
      color: #e99a2e;
    }
    @media (max-width: 480px) {
      .qcm-category-group {
        width: calc(100% + 16px);
        margin-right: -8px;
        margin-left: -8px;
        gap: 8px;
      }
      .qcm-slot-btn {
        font-size: 20px;
        letter-spacing: 0.005em;
      }
    }
    /* "Mes acquis" rejoint la même rangée que Découvrir/Ancrer/Relier : les
       quatre destinations partagent désormais un seul niveau de navigation. */
    .qcm-mes-acquis-row {
      display: none;
      justify-content: center;
      width: 100%;
    }
    /* Même règle de visibilité que le switcher juste au-dessus
       (#qcm-category-switcher.visible, posée/retirée par renderCategorySwitcher) :
       masqué pendant le chargement initial, jamais affiché seul sans ses
       onglets Découvrir/Ancrer/Relier. */
    #qcm-category-switcher.visible + .qcm-mes-acquis-row {
      display: contents;
      margin: 0;
    }
    .qcm-mes-acquis-btn {
      display: inline-flex;
      width: auto;
      flex: 0 0 auto;
      align-items: center;
      justify-content: center;
      /* Espacement icône/texte contrôlé par gap (comme .mnoria-universal-menu-item,
         header-score-widget.js) plutôt qu'un espace texte brut entre </i> et le libellé — sa
         largeur dépend de la taille de police du bouton et devenait donc incohérente selon le
         viewport (demande du 27/08/2026, cf. <span> ajouté autour du libellé ci-dessous). */
      gap: 6px;
      /* Même padding que .qcm-slot-btn (dont le padding-bottom:8px laisse la place au liseret actif
         ::after ci-dessous, demande du 26/08/2026) plutôt que 2px 4px. */
      padding: 6px 3px 10px;
      position: relative;
      border: none;
      background: none;
      /* Noir par défaut — grisé seulement via :disabled ci-dessous (demande du
         30/08/2026, aucun acquis à afficher). */
      color: #111827;
      /* Même police ET même taille que Découvrir/Ancrer/Relier voisins (.qcm-slot-btn) — le
         font-family seul seul (26/08/2026) ne suffisait pas à rendre un aspect identique tant
         que la taille restait très inférieure (12.5px contre 16px). */
      font-family: "Barlow Condensed", Arial, sans-serif;
      font-size: 32px;
      font-weight: 600;
      /* Majuscules, comme les onglets Découvrir/Ancrer/Relier voisins (.qcm-slot-btn) —
         demande du 26/08/2026. */
      text-transform: uppercase;
      letter-spacing: 0.03em;
      white-space: nowrap;
      cursor: pointer;
    }
    /* Même taille que les onglets voisins Découvrir/Ancrer/Relier (.qcm-slot-btn, cf. son
       propre @media plus haut) sur mobile. Placée ICI, APRÈS la règle de base ci-dessus plutôt
       que dans le @media (max-width: 480px) de .qcm-slot-btn plus haut dans le fichier : à
       spécificité égale, l'ordre du fichier décide, et un override mobile placé avant la règle
       de base se faisait donc écraser par elle même sur petit écran (constaté le 27/08/2026). */
    @media (max-width: 480px) {
      .qcm-mes-acquis-btn {
        font-size: 20px;
        letter-spacing: 0.005em;
      }
    }
    @media (max-width: 360px) {
      .qcm-category-group {
        gap: 5px;
      }
      .qcm-slot-btn,
      .qcm-mes-acquis-btn {
        font-size: 17px;
      }
    }
    .qcm-mes-acquis-btn i {
      font-size: 11px;
    }
    .qcm-mes-acquis-btn:hover:not(.active):not(:disabled) {
      color: #516776;
    }
    .qcm-mes-acquis-btn.active {
      color: #111827;
      font-weight: 700;
    }
    /* Même liseret actif que Découvrir/Ancrer/Relier (.qcm-slot-btn.active::after) — demande du
       26/08/2026. */
    /* Même règle grisée que Ancrer/Relier (.qcm-slot-btn:disabled) quand il n'y a
       encore aucun acquis à afficher (demande du 30/08/2026). */
    .qcm-mes-acquis-btn:disabled {
      color: #9ca3af;
      cursor: not-allowed;
    }
    .qcm-mes-acquis-btn.active::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: 0;
      transform: translateX(-50%);
      width: 55%;
      height: 5px;
      border-radius: 999px;
      background: #f5b642;
      box-shadow: 0 1px 2px rgba(124, 74, 18, 0.2);
    }
    /* Bouton unique "Mémoriser" (demande du 27/08/2026) : même langage visuel
       que l'ancien "Générer" (bouton d'action plein, pas de la navigation) —
       remplace le champ + Générer + Plus d'options tant que non déplié. */
    .qcm-memorize-toggle {
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 8px;
      width: fit-content;
      max-width: min(100%, 320px);
      margin: 0 auto 20px;
      padding: 10px 22px;
      border: none;
      border-radius: 999px;
      background: #243038;
      color: #ffffff;
      font-size: 14px;
      font-weight: 700;
      line-height: 1.25;
      cursor: pointer;
    }
    .qcm-memorize-toggle:hover {
      background: #384852;
    }
    .qcm-custom-search {
      display: none;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      margin: 0 0 20px;
    }
    .qcm-custom-search.visible {
      display: flex;
    }
    .qcm-custom-search-input {
      flex: 1;
      flex-basis: 280px;
      min-width: 0;
      /* <textarea> plutôt qu'un <input> à une seule ligne (cf. 12/08/2026) :
         un placeholder/sujet trop long pour la largeur du champ passait à la
         ligne suivante au lieu de rester lisible en entier — jamais de
         coupure ni d'ellipsis, la hauteur s'adapte plutôt que le texte.
         Compact par défaut (desktop, largeur confortable, le placeholder
         tient sur une ligne) — agrandi seulement sur mobile ci-dessous, où
         il ne tient pas (cf. 13/08/2026 : trop haute sur desktop sinon).
         height:auto obligatoire : public/style.css impose "textarea{height:
         140px}" globalement (zones de commentaires) — height prime sur
         min-height, sans ce override le champ restait bloqué à 140px malgré
         min-height:44px (constaté le 13/08/2026, capture à l'appui : le
         bouton "Générer" s'étirait aussi en énorme cercle à côté, cf.
         align-items:stretch par défaut sur .qcm-custom-search). */
      height: auto;
      min-height: 26px;
      padding: 4px 14px;
      border: 1px solid #d1d5db;
      border-radius: 18px;
      background: #f9fafb;
      color: #1f2937;
      font-size: 14px;
      font-family: inherit;
      line-height: 1.4;
      resize: none;
    }
    .qcm-custom-search-input:focus {
      outline: none;
      border-color: #516776;
      background: #ffffff;
    }
    .qcm-custom-search-btn {
      flex-shrink: 0;
      padding: 6px 16px;
      border: none;
      border-radius: 999px;
      background: #243038;
      color: #ffffff;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }
    .qcm-custom-search-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    /* Conteneur du bouton "Mémoriser" + son menu déroulant (demande du
       27/08/2026) : autonome, placé avant le <form> qu'il révèle — plus
       imbriqué dans .qcm-custom-search comme l'ancien "Plus d'options". */
    .qcm-knowledge-add {
      position: relative;
      display: flex;
      justify-content: center;
      margin: 0 0 20px;
    }
    .qcm-knowledge-add-menu {
      position: absolute;
      z-index: 20;
      top: calc(100% + 4px);
      /* Centré sous le bouton "Mémoriser", lui-même centré (.qcm-knowledge-add,
         demande du 27/08/2026) — auparavant ancré à gauche (left:0), cohérent
         avec l'ancien bouton "Plus d'options" qui était lui aussi aligné à
         gauche. */
      left: 50%;
      transform: translateX(-50%);
      width: min(390px, calc(100vw - 48px));
      padding: 6px;
      border: 1px solid #d9dfe3;
      border-radius: 14px;
      background: #ffffff;
      box-shadow: 0 12px 30px rgba(36, 48, 56, 0.12);
    }
    .qcm-knowledge-add-menu[hidden] {
      display: none;
    }
    /* Dans la fenêtre "Commencer un nouvel apprentissage", la liste reprend
       les mêmes options mais n'est plus un menu déroulant ancré au bouton. */
    .qcm-knowledge-add-menu.qcm-knowledge-add-menu-dialog {
      position: static;
      width: 100%;
      padding: 0;
      border: 0;
      border-radius: 0;
      background: transparent;
      box-shadow: none;
      transform: none;
      box-sizing: border-box;
    }
    .qcm-knowledge-add-option {
      display: grid;
      grid-template-columns: 24px minmax(0, 1fr);
      gap: 0 9px;
      align-items: center;
      padding: 10px 11px;
      border-radius: 9px;
      color: #243038;
      text-decoration: none;
    }
    .qcm-knowledge-add-option:hover,
    .qcm-knowledge-add-option:focus-visible {
      outline: none;
      background: #eef2f5;
    }
    /* Contre le survol fantôme (demande du 30/08/2026, "un coup texte, un
       coup pdf" — option qui varie d'une ouverture à l'autre) : cette
       fenêtre s'ouvre pile sous le curseur resté immobile après le clic
       déclencheur, et sa liste d'options peut décaler verticalement selon
       qu'"Explorer" est visible ou non — l'option qui atterrit sous le
       curseur hérite alors d'un :hover que l'utilisateur n'a jamais
       déclenché lui-même. Cf. openKnowledgeAddWindow : la classe est posée à
       l'ouverture et retirée dès le premier vrai mouvement de souris/doigt. */
    .qcm-suppress-hover .qcm-knowledge-add-option:hover {
      background: transparent;
    }
    .qcm-knowledge-add-option i {
      grid-row: 1 / span 2;
      color: #516776;
      text-align: center;
    }
    .qcm-knowledge-add-option strong {
      font-size: 13px;
      line-height: 1.3;
    }
    .qcm-knowledge-add-option span {
      color: #6b7280;
      font-size: 12px;
      line-height: 1.35;
    }
    .qcm-custom-search-status {
      margin: -8px 0 20px;
      font-size: 13px;
      color: #6b7280;
      text-align: center;
    }
    .qcm-custom-search-status.is-error {
      color: #d64545;
    }
    /* "Camembert" qui se noircit en boucle pendant la génération (demande du
       13/08/2026, remplace un chiffré temps écoulé/compte à rebours écarté
       par l'utilisateur) : la durée réelle varie de quelques secondes à
       plusieurs minutes (sujet énumérable, cf. server.js
       NOTION_QUIZ_ENUMERABLE_MAX_ROUNDS) — plutôt que d'afficher un temps
       potentiellement faux, une boucle indéterminée qui montre juste "ça
       travaille" sans jamais prétendre savoir combien de temps il reste.
       conic-gradient mis à jour en JS (cf. startPieSpinner) plutôt qu'une
       animation CSS pure : évite @property, pas supporté partout. */
    .qcm-pie-spinner {
      width: 36px;
      height: 36px;
      margin: 4px auto 20px;
      border-radius: 50%;
      background: conic-gradient(#243038 0deg, #e2e6ea 0deg);
      box-shadow: inset 0 0 0 1px #d1d5db;
    }
    /* "Explorer" (demande du 13/08/2026, regroupé le 27/08/2026 avec "Ajouter
       des connaissances" dans un seul menu "Plus d'options" — cf.
       #qcm-knowledge-add-menu) : adopter un sujet déjà généré par un autre
       visiteur plutôt que de relancer une génération IA pour un sujet proche.
       Reprend le style .qcm-knowledge-add-option (bouton plutôt que lien) et
       ajoute un séparateur pour le distinguer des options d'import qui suivent. */
    .qcm-knowledge-add-option-btn {
      width: 100%;
      border: 0;
      background: none;
      font: inherit;
      text-align: left;
      cursor: pointer;
    }
    .qcm-knowledge-add-option-explore {
      margin-bottom: 4px;
      padding-bottom: 12px;
      border-bottom: 1px solid #eef1f3;
      border-radius: 9px 9px 0 0;
    }
    .qcm-explore-search-input {
      width: 100%;
      margin: 0 0 14px;
      padding: 10px 14px;
      border: 1px solid #d1d5db;
      border-radius: 999px;
      background: #f9fafb;
      color: #1f2937;
      font: inherit;
      font-size: 14px;
      box-sizing: border-box;
    }
    .qcm-explore-search-input:focus {
      outline: none;
      border-color: #516776;
      background: #ffffff;
    }
    /* Un peu plus large que le gabarit par défaut (480px), demande du
       30/08/2026 — davantage de place pour les sujets groupés par
       thématique. */
    .qcm-explore-modal {
      max-width: 620px;
    }
    /* position:relative (jamais fixed, contrairement à .qcm-fiche-overlay) :
       porte le dégradé "suite" générique (.scroll-fade-hint, cf. style.css,
       position:absolute) directement en enfant — la contrainte iOS Safari
       documentée plus haut (position:absolute dans un ancêtre position:fixed
       scrollable) ne s'applique pas ici, .qcm-explore-list-wrap n'est pas
       fixed. */
    .qcm-explore-list-wrap {
      position: relative;
    }
    .qcm-explore-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 70vh;
      overflow-y: auto;
    }
    .qcm-explore-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      background: #ffffff;
      font: inherit;
      text-align: left;
      cursor: pointer;
    }
    .qcm-explore-item:hover:not(:disabled),
    .qcm-explore-item:focus-visible:not(:disabled) {
      border-color: #516776;
      background: #f9fafb;
    }
    .qcm-explore-item:disabled {
      cursor: default;
      opacity: 0.6;
    }
    .qcm-explore-item-label {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
      font-size: 14px;
      font-weight: 700;
      color: #111827;
    }
    /* Nombre de questions (demande du 13/08/2026) : toujours affiché, même
       pour un sujet déjà dans la liste personnelle du visiteur (contrairement
       à .qcm-explore-item-meta, qui elle bascule selon cet état). */
    .qcm-explore-item-count {
      font-size: 12px;
      font-weight: 600;
      color: #6b7280;
    }
    /* Intitulé exact tapé par le créateur (demande du 13/08/2026) : distinct
       du titre au-dessus (item.label, reformulé par l'IA) — jamais en gras,
       contrairement au titre, pour rester clairement secondaire. */
    .qcm-explore-item-query {
      font-size: 12px;
      font-weight: 400;
      font-style: italic;
      color: #6b7280;
    }
    /* Intitulé de groupe par thématique (demande du 30/08/2026, "classés par
       thématique, la même que Ma mémoire") : même caractère typographique que
       .qcm-mesqcm-theme-toggle (thématiques de "Mes apprentissages"), en
       simple étiquette sans carte/fond ici — la liste "Explorer" reste plate,
       jamais repliable. */
    .qcm-explore-theme-heading {
      margin: 14px 0 2px;
      font-family: "Barlow Condensed", Arial, sans-serif;
      font-size: 18px;
      font-weight: 700;
      color: #111827;
    }
    .qcm-explore-theme-heading:first-child {
      margin-top: 0;
    }
    /* Confirmation avant génération IA (demande du 13/08/2026) : reprend le
       sujet + niveau choisis, pour éviter une génération lancée par erreur
       (sujet mal tapé, mauvais niveau cliqué) — même famille visuelle que les
       autres popups de cette page (.qcm-fiche-overlay/.qcm-fiche-modal). */
    .qcm-generate-confirm-text {
      margin: 0 0 8px;
      font-size: 15px;
      line-height: 1.5;
      color: #111827;
    }
    /* Même avertissement de durée que le message de génération en cours
       (setCustomSearchStatus, demande du 30/08/2026) : visible dès la
       confirmation, avant même de lancer l'appel IA. */
    .qcm-generate-confirm-hint {
      margin: 0 0 20px;
      font-size: 13px;
      line-height: 1.4;
      color: #6b7280;
    }
    .qcm-generate-confirm-actions {
      display: flex;
      gap: 10px;
    }
    .qcm-generate-confirm-cancel,
    .qcm-generate-confirm-ok {
      flex: 1;
      padding: 10px 16px;
      border-radius: 999px;
      font: inherit;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }
    .qcm-generate-confirm-cancel {
      border: 1px solid #d1d5db;
      background: #f9fafb;
      color: #243038;
    }
    .qcm-generate-confirm-cancel:hover {
      background: #eef3f6;
    }
    .qcm-generate-confirm-ok {
      border: none;
      background: #243038;
      color: #ffffff;
    }
    .qcm-generate-confirm-ok:hover {
      background: #1a262e;
    }
    .qcm-explore-item-meta {
      flex: 0 0 auto;
      font-size: 12px;
      font-weight: 700;
      color: #6b7280;
      white-space: nowrap;
    }
    @media (max-width: 480px) {
      /* "Générer" repasse sous la barre de recherche, en toute lettre avec son
         icône (demande du 27/08/2026 — le bouton icône seule à droite n'allait
         pas). */
      .qcm-custom-search {
        flex-direction: column;
        gap: 2px;
        margin-bottom: 10px;
      }
      .qcm-custom-search-btn {
        width: fit-content;
        padding: 8px 20px;
      }
      .qcm-knowledge-add-menu {
        width: min(100%, 390px);
        box-sizing: border-box;
      }
      .qcm-custom-search-input {
        /* flex-basis:280px (règle de base, pensée pour la ligne desktop) devient
           une HAUTEUR préférée de 280px une fois le conteneur en colonne ici
           (flex-basis suit l'axe principal, vertical en column) — c'est la
           vraie cause du cadre démesuré en mobile (bug trouvé le 27/08/2026,
           indépendant du souci Supabase du même jour). On la remet à auto. */
        flex-basis: auto;
        /* Assez haut pour laisser le placeholder ("Tape un sujet à mémoriser
           (ex. la photosynthèse)") s'afficher sur ses 2 lignes complètes en
           mobile, sans les couper (demande du 27/08/2026). */
        min-height: 44px;
        padding: 3px 12px;
        font-size: 13px;
      }
    }
    /* Barre de progression Découvrir/Ancrer/Relier (demande du 17/08/2026,
       étendue à Découvrir et élargie/embellie le 27/08/2026, cf.
       renderProgressIndicatorHtml) — centrée au-dessus de la question, sur
       les 3 catégories. */
    .qcm-progress-bar {
      position: relative;
      width: 100%;
      max-width: 680px;
      height: 20px;
      margin: 0 auto 8px;
      border-radius: 999px;
      background: #e3ddd2;
      border: 1px solid rgba(15, 23, 42, 0.06);
      box-shadow: inset 0 2px 4px rgba(15, 23, 42, 0.14);
      overflow: visible;
    }
    .qcm-progress-bar-fill {
      position: relative;
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, #5fc784, #2f7d4a);
      box-shadow:
        0 0 10px rgba(47, 125, 74, 0.5),
        inset 0 1px 1px rgba(255, 255, 255, 0.35);
      transition: width 0.35s ease;
      overflow: hidden;
      min-width: 20px;
    }
    /* Reflet glossy fixe en partie haute du remplissage. */
    .qcm-progress-bar-fill::before {
      content: "";
      position: absolute;
      inset: 1px 1px auto 1px;
      height: 40%;
      border-radius: 999px 999px 0 0;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.5), rgba(255, 255, 255, 0));
      pointer-events: none;
    }
    /* Balayage lumineux qui traverse la barre en boucle. */
    .qcm-progress-bar-fill::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(
        110deg,
        transparent 0%,
        rgba(255, 255, 255, 0) 35%,
        rgba(255, 255, 255, 0.55) 50%,
        rgba(255, 255, 255, 0) 65%,
        transparent 100%
      );
      background-size: 220% 100%;
      animation: qcm-progress-shine 2.6s ease-in-out infinite;
      pointer-events: none;
    }
    @keyframes qcm-progress-shine {
      0% { background-position: 140% 0; }
      60%, 100% { background-position: -60% 0; }
    }
    /* Fumée verte à la jonction remplissage/piste, demande du 30/08/2026:
       quelques volutes qui s'échappent vers le haut à chaque avancée de la
       barre. Positionnée sur .qcm-progress-bar (overflow:visible), pas sur
       .qcm-progress-bar-fill (overflow:hidden pour le balayage ci-dessus),
       pour ne pas être rognée en s'élevant au-dessus de la barre. left:pct%
       posé en inline par renderProgressIndicatorHtml, identique à la largeur
       du remplissage : l'élément est donc toujours neuf à chaque rendu de
       question (currentIndex change), ce qui relance l'animation CSS
       automatiquement sans JS dédié. */
    .qcm-progress-bar-smoke {
      position: absolute;
      top: 0;
      height: 100%;
      width: 0;
      pointer-events: none;
      z-index: 3;
    }
    .qcm-progress-bar-smoke-puff {
      position: absolute;
      top: 50%;
      left: 0;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(94, 210, 138, 1) 0%, rgba(94, 210, 138, 0.55) 45%, rgba(94, 210, 138, 0) 75%);
      filter: blur(1px);
      opacity: 0;
      animation: qcm-progress-smoke-rise 1500ms ease-out forwards;
    }
    .qcm-progress-bar-smoke-puff:nth-child(1) { width: 24px; height: 24px; --smoke-x: -11px; animation-delay: 0ms; }
    .qcm-progress-bar-smoke-puff:nth-child(2) { width: 19px; height: 19px; --smoke-x: 8px; animation-delay: 140ms; }
    .qcm-progress-bar-smoke-puff:nth-child(3) { width: 17px; height: 17px; --smoke-x: -6px; animation-delay: 280ms; }
    .qcm-progress-bar-smoke-puff:nth-child(4) { width: 14px; height: 14px; --smoke-x: 13px; animation-delay: 420ms; }
    .qcm-progress-bar-smoke-puff:nth-child(5) { width: 12px; height: 12px; --smoke-x: -15px; animation-delay: 560ms; }
    @keyframes qcm-progress-smoke-rise {
      0% { opacity: 0; transform: translate(calc(-50% + var(--smoke-x, 0px)), -50%) scale(0.4); }
      16% { opacity: 1; }
      55% { opacity: 0.65; }
      100% {
        opacity: 0;
        transform: translate(calc(-50% + var(--smoke-x, 0px) * 3), calc(-50% - 56px)) scale(2.2);
        filter: blur(4px);
      }
    }
    /* +1 furtif au milieu de l'écran à chaque bonne réponse (Ancrer/Relier,
       demande du 17/08/2026, agrandi + halo flouté le même jour) : apparaît
       puis disparaît seul, pas un compteur persistant. Position fixe (pas liée
       à la barre, ni au scroll), retiré du DOM par showProgressPlusOne() une
       fois l'animation terminée. */
    .qcm-progress-plus-one {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.6);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 18px 34px;
      border-radius: 999px;
      background: radial-gradient(circle, rgba(85, 201, 121, 0.44), rgba(85, 201, 121, 0));
      font-family: inherit;
      font-weight: 800;
      font-size: 96px;
      color: #179748;
      text-shadow:
        0 0 22px rgba(85, 201, 121, 0.95),
        0 0 55px rgba(85, 201, 121, 0.8),
        0 0 100px rgba(85, 201, 121, 0.6),
        0 0 160px rgba(23, 151, 72, 0.4);
      box-shadow:
        0 0 50px 16px rgba(85, 201, 121, 0.45),
        0 0 110px 40px rgba(23, 151, 72, 0.3);
      pointer-events: none;
      white-space: nowrap;
      z-index: 500;
      animation: qcm-progress-plus-one-pop 450ms ease forwards;
    }
    @keyframes qcm-progress-plus-one-pop {
      0% { opacity: 0; transform: translate(-50%, -50%) scale(0.5); filter: blur(6px); }
      12% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); filter: blur(0); }
      50% { opacity: 1; transform: translate(-50%, -50%) scale(1); filter: blur(0); }
      100% { opacity: 0; transform: translate(-50%, -50%) scale(1.25); filter: blur(4px); }
    }

    /* Nombre de questions du QCM associé à cette connaissance (demande du

    .qcm-mesqcm-question-count {

    /* Fenêtre de choix ouverte au clic sur le nom d'un apprentissage (cf.
       openMesQcmActionMenu) : "Consulter la fiche", "Faire/refaire le QCM"
       ou "Supprimer". Une vraie fenêtre modale centrée (.qcm-fiche-overlay/
       .qcm-fiche-modal, même gabarit que la fiche elle-même) plutôt qu'un

    .qcm-mesqcm-action-modal {

    /* Le bouton fermer (.qcm-fiche-close) suit le bord droit réel de la

       de padding de carte) devient ici 48px, cette variante ayant 28px de

    .qcm-mesqcm-action-modal .qcm-fiche-close {

    .qcm-mesqcm-action-menu-info {

    .qcm-mesqcm-action-menu-delete-link {

    /* Noès (intégration du 26/08/2026, retiré de la fiche complète le

    /* Cadre grand format dès le départ (demande du 30/08/2026, "je souhaite

       chargement") : même ratio pour l'état "en préparation", l'état
       d'erreur et la vidéo une fois prête — plus de saut de taille petit

    /* "À apprendre ensuite" — section compacte intégrée directement sous

    .qcm-learn-next-inline {

    /* Même espace qu'en bas de la section (demande du 30/08/2026) : le titre

    /* Juste le nom des sujets (demande du 30/08/2026) : flex-wrap +

    /* Proposition IA réellement nouvelle : un simple liseré discret — jamais

    .qcm-learn-next-inline-item.is-ai-proposal {

       pulsent doucement — jamais le sablier central utilisé ailleurs sur

    .qcm-learn-next-inline-skeleton-row {

    /* Corrigé des questions dans la fiche "Mes QCM" (cf.
       renderFicheQuestionCorrige) — lecture seule, jamais interactif : la

    .qcm-fiche-corrige-item {

    .qcm-fiche-corrige-num {

    .qcm-fiche-corrige-list {

    }
    .qcm-fiche-corrige-list li {

      background: none;

    .qcm-fiche-corrige-list li.is-correct {
      border-color: #1f9d55;
      background: #f0fdf4;
      color: #166534;
      font-weight: 600;
    }
    .qcm-fiche-corrige-explanation {
      margin: 0;
      font-size: 13px;
      color: #6b7280;
      line-height: 1.4;

    /* Fiche ouverte depuis "Mes apprentissages" : nom + détail pur du
       concept/mécanisme/citation/œuvre, même esprit que les cartes Éclairages
       sans reprendre leur mise en page riche (sources) ni tout ce qui relie
       l'élément à l'actualité du jour (déjà exclu côté serveur). L'image du
       concept/mécanisme/auteur/œuvre (sourceDetail.image), quand elle
       existe, est en revanche reprise telle quelle. */
    .qcm-fiche-overlay {
      position: fixed;
      inset: 0;
      z-index: 1000;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      /* max(20px, safe-area) plutôt qu'un padding fixe : en PWA standalone
         (encoche/île dynamique), un padding-top de 20px seul ne suffit pas à
         dégager la zone sûre — la croix de fermeture en haut de la fiche
         (.qcm-fiche-close) pouvait se retrouver sous le statut/l'encoche,
         invisible ou impossible à toucher. */
      padding: max(20px, env(safe-area-inset-top)) 20px max(20px, env(safe-area-inset-bottom));
      background: rgba(17, 24, 39, 0.55);
    }
    /* .scroll-fade-hint (générique, cf. style.css) est position:absolute —
       correct pour ses autres usages (imbriqué dans un cadre non-scrollable),
       mais pas ici où le parent scrollable EST l'élément position:fixed
       (.qcm-fiche-overlay) : sur iOS Safari un enfant absolute d'un tel
       parent ne reste pas fiablement épinglé pendant le défilement. Posé en
       position:fixed direct sur <body> à la place (cf. openMesQcmFiche), et
       recalé ici en largeur sur la fiche (max-width identique à
       .qcm-fiche-modal) — sinon le dégradé pleine largeur déborde des bords
       d'une fiche centrée plus étroite que l'écran.
       "bottom" décalé de env(safe-area-inset-bottom) plutôt que collé à 0 :
       en PWA standalone sur certains iPhones (X/XS/11/11 Pro), le compositeur
       WebKit ne peint rien dans les ~44 derniers px du bas de l'écran (limite
       matérielle déjà documentée, aucune technique CSS ne peint dans cette
       zone) — un élément à bottom:0 y devient invisible/coupé. Le décaler de
       la seule encoche/home-indicator réelle (env(safe-area-inset-bottom))
       le sort de cette zone morte, sans plus.
       Volontairement PAS --mnoria-safe-bottom (demande du 30/08/2026, "le
       bouton suite apparaît trop haut") : cette variable inclut aussi la
       compensation de barre d'outils mobile calculée pour positionner le
       dock flottant du site (.home-bottom-nav) — pertinente pour un dock
       ancré au bas d'une page, pas pour ce "suite ↓" posé au-dessus d'une
       fiche en plein écran sans dock, où elle ne faisait que le pousser
       inutilement plus haut que le vrai bas de l'écran. */
    .qcm-fiche-fade-hint {
      position: fixed;
      bottom: env(safe-area-inset-bottom, 0px);
      max-width: 480px;
      margin: 0 auto;
      z-index: 1001;
    }
    /* Centré sur min-height:100% (pas plus, sinon la fiche est centrée dans
       un cadre plus grand que l'écran et apparaît trop basse). Le débattement
       de scroll vers le bas vient du spacer .qcm-fiche-scroll-spacer placé
       APRÈS la fiche dans la colonne : il pousse le groupe (fiche + spacer)
       vers le haut à la centration, sans jamais faire descendre la fiche.
       Seul .qcm-fiche-overlay scrolle (cf. .qcm-fiche-modal plus bas, sans
       son propre overflow) : deux zones de scroll imbriquées se disputaient
       le geste tactile sur mobile et empêchaient d'atteindre le bas d'une
       fiche longue. */
    .qcm-fiche-overlay-inner {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100%;
    }
    .qcm-fiche-scroll-spacer {
      flex: 0 0 auto;
      width: 100%;
      height: 20px;
      pointer-events: none;
    }
    .qcm-fiche-modal {
      width: 100%;
      max-width: 480px;
      padding: 20px;
      border-radius: 12px;
      background: #ffffff;
      box-shadow: 0 20px 45px rgba(17, 24, 39, 0.25);
    }
    .qcm-fiche-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }
    /* Bandeau haut vide de contenu en flux (croix seule, position:fixed) —
       pas de marge à réserver en dessous. */
    .qcm-fiche-head-no-rubric {
      margin-bottom: 0;
    }
    .qcm-fiche-rubric {
      display: flex;
      align-items: center;
      gap: 6px;
      margin: 0;
      font-size: 13px;
      font-weight: 700;
      color: #516776;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }
    /* Variante posée sous la ligne thème/niveau/questions plutôt que dans le
       bandeau haut (demande du 30/08/2026) : centrée comme .qcm-fiche-name et
       .qcm-fiche-level-info juste au-dessus, au lieu de suivre le fil du
       bandeau haut (croix seule désormais, cf. .qcm-fiche-head-no-rubric).
       Plus petite/discrète que la variante bandeau (jamais en majuscule) et
       rapprochée de la ligne du dessus (demande du 30/08/2026). */
    .qcm-fiche-rubric-below {
      justify-content: center;
      margin: 0 0 14px;
      font-size: 13px;
      font-weight: 600;
      color: #6b7280;
      text-transform: none;
      letter-spacing: 0.02em;
    }
    /* position:fixed (demande du 30/08/2026, "la croix doit rester visible
       même en scrollant") : un essai précédent de sticky (13/08/2026) a été
       abandonné pour fixed pour la raison inverse — mais sticky s'est révélé
       ici inefficace sur une fiche longue (cas normal depuis la fusion
       Noès) : son "conteneur d'épinglage" est .qcm-fiche-head, haut d'une
       seule ligne, donc la croix ne reste épinglée que le temps de défiler
       CETTE ligne-là avant de repartir avec le reste du contenu — pas un
       vrai epinglage "toute la fiche".
       Le risque de l'essai fixed abandonné en 13/08/2026 (la croix restait
       collée au coin de l'écran, loin de la carte étroite et centrée sur un
       écran large) vient d'un simple "right" fixe en pixels qui ignore le
       centrage de .qcm-fiche-modal — remplacé ici par une formule qui suit
       le bord droit réel de la carte à toute largeur d'écran :
       - carte pleine largeur (viewport ≤ 480px carte + 2×20px de padding de
         .qcm-fiche-overlay, soit ≤ 520px) : la croix reste à 40px du bord
         droit (20px de padding d'overlay + 20px de padding de carte).
       - carte à sa largeur max (480px, centrée au-delà de 520px) :
         50% - 220px (moitié de la carte moins son padding de 20px) donne la
         même distance au bord droit RÉEL de la carte, qui progresse avec la
         largeur d'écran. max() choisit la bonne formule sans media query.
       Variante plus large (.qcm-knowledge-route-modal, 560px) : cf. son
       propre override juste en dessous. */
    .qcm-fiche-close {
      position: fixed;
      top: max(20px, env(safe-area-inset-top));
      right: max(40px, calc(50% - 220px));
      z-index: 1002;
      flex: 0 0 auto;
      width: 28px;
      height: 28px;
      border: none;
      border-radius: 999px;
      background: #eef3f6;
      color: #243038;
      font-size: 14px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(17, 24, 39, 0.18);
    }
    .qcm-knowledge-route-modal .qcm-fiche-close {
      right: max(40px, calc(50% - 260px));
    }
    /* Fenêtre d'import (Manuellement/Photo/PDF/Texte/Lien/YouTube, demande du
       27/08/2026, "toujours la même présentation") : leur page existante
       (views/photo-knowledge.html, déjà autonome et sans bandeau propre)
       chargée en iframe dans le même gabarit .qcm-fiche-modal que
       Générer/Explorer — juste un peu plus large pour lui laisser sa mise en
       page respirer. */
    .qcm-knowledge-route-modal {
      max-width: 560px;
    }
    .qcm-knowledge-route-frame {
      display: block;
      width: 100%;
      height: min(70vh, 640px);
      border: none;
      border-radius: 8px;
    }
    .qcm-fiche-name {
      margin: 0 0 4px;
      font-size: 22px;
      font-weight: 800;
      color: #111827;
      line-height: 1.3;
      text-align: center;
    }
    /* Niveau + nombre de questions, juste sous le titre (demande du
       30/08/2026, cf. renderFicheLevelInfo) — centré comme .qcm-fiche-name
       juste au-dessus. */
    .qcm-fiche-level-info {
      margin: 0 0 4px;
      font-size: 13px;
      font-weight: 700;
      color: #6b7280;
      text-align: center;
    }
    .qcm-fiche-meta {
      margin: 0 0 12px;
      font-size: 13px;
      font-weight: 600;
      color: #111827;
    }
    .qcm-fiche-image {
      margin: 0 auto 14px;
      max-width: 280px;
    }
    .qcm-fiche-image img {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 8px;
      border: 1px solid #e5e7eb;
    }
    .qcm-fiche-image figcaption {
      margin-top: 4px;
      font-size: 11px;
      color: #9ca3af;
      text-align: right;
    }
    .qcm-fiche-image figcaption a {
      color: #9ca3af;
    }
    .qcm-fiche-section-label {
      margin: 14px 0 4px;
      font-size: 13px;
      font-weight: 700;
      color: #243038;
      text-transform: uppercase;
      letter-spacing: 0.02em;
    }
    .qcm-fiche-explanation {
      margin: 0 0 4px;
      font-size: 14px;
      color: #4b5563;
      line-height: 1.5;
    }
    .qcm-fiche-explanation:first-of-type {
      margin-top: 0;
    }
    .qcm-fiche-bottom-close {
      display: block;
      width: 100%;
      margin: 18px 0 0;
      padding: 11px 16px;
      border: 1px solid #d7dde2;
      border-radius: 10px;
      background: #f3f6f4;
      color: #1f2933;
      font: inherit;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease;
    }
    .qcm-fiche-bottom-close:hover {
      background: #e9efec;
      border-color: #c6d0d8;
    }
    /* Badge cosmétique au-dessus de la question pour les formats
       vrai_faux/texte_a_trous : rend la variété de formats visible sans
       toucher au reste de la mise en page. */
    .qcm-type-badge {
      display: inline-block;
      margin: 0 0 8px;
      padding: 3px 10px;
      border-radius: 999px;
      background: #eef3f6;
      color: #243038;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }
    /* Boutons Facile/Moyen/Difficile (cf. wireDifficultyButtons, demande du
       13/08/2026) : remplacent "Valider" — valider et noter la difficulté
       ressentie en un seul geste, obligatoire pour passer à la suite.
       "Moyen" mis en avant visuellement (plus grand, couleur pleine) comme
       choix par défaut/neutre ; Facile/Difficile en retrait de part et
       d'autre. */
    .qcm-difficulty-wrap {
      margin: 16px 0 0;
    }
    .qcm-difficulty-label {
      margin: 0 0 6px;
      font-family: "Barlow Condensed", Arial, sans-serif;
      font-size: 13px;
      color: #8a97a3;
    }
    .qcm-difficulty-buttons {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .qcm-difficulty-btn {
      flex: 1;
      padding: 10px 8px;
      border: 1px solid #d1d5db;
      border-radius: 999px;
      background: #f9fafb;
      color: #516776;
      font-family: "Barlow Condensed", Arial, sans-serif;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      cursor: pointer;
    }
    .qcm-difficulty-btn:hover:not(:disabled) {
      border-color: #b8c2ca;
      background: #eef3f6;
    }
    .qcm-difficulty-btn:disabled {
      opacity: 0.45;
      cursor: default;
    }
    .qcm-difficulty-btn-moyen {
      flex: 1.3;
      padding: 12px 8px;
      border: none;
      background: #243038;
      color: #ffffff;
      font-size: 15px;
    }
    .qcm-difficulty-btn-moyen:hover:not(:disabled) {
      background: #384852;
    }
    /* Bouton "Ne plus me la demander" (cf. wireExcludeButton) : discret,
       en bas de carte sous "Valider ma réponse"/les propositions (jamais en
       haut, cf. demande du 13/08/2026 — pour ne pas laisser deviner qu'une
       question est "à écarter" avant même de l'avoir lue) — exclut la
       question courante des futures repasses ("Renforcement"), jamais de la
       session en cours. */
    .qcm-exclude-btn {
      display: block;
      margin: 10px auto 0;
      padding: 3px 10px;
      border: 1px solid #dbe2e7;
      border-radius: 999px;
      background: #ffffff;
      color: #7a8792;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.02em;
      cursor: pointer;
    }
    .qcm-exclude-btn:hover {
      border-color: #b8c2ca;
      color: #516776;
    }
    .qcm-exclude-btn:disabled {
      opacity: 0.6;
      cursor: default;
    }
    /* Marqueur "___" d'une question texte_a_trous, mis en valeur dans le
       texte de la question — jamais introduit avant l'échappement HTML
       (cf. renderChoiceQuestion), donc toujours sûr à afficher. */
    .qcm-blank {
      display: inline-block;
      min-width: 46px;
      padding: 0 4px;
      border-bottom: 2px solid #516776;
      color: #516776;
      font-weight: 700;
      text-align: center;
    }
    .qcm-assoc-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }
    .qcm-assoc-left {
      flex: 1 1 auto;
      padding: 10px 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      background: #f9fafb;
      color: #1f2937;
      font-size: 14px;
    }
    .qcm-assoc-select {
      flex: 1 1 auto;
      padding: 10px 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      background: #ffffff;
      color: #1f2937;
      font-size: 14px;
      cursor: pointer;
    }
    .qcm-assoc-select:disabled {
      cursor: default;
      opacity: 0.85;
    }
    .qcm-assoc-select.is-correct {
      border-color: #179748;
      background: #f0fdf4;
      color: #166534;
    }
    .qcm-assoc-select.is-wrong {
      border-color: #d64545;
      background: #fef2f2;
      color: #991b1b;
    }
    .qcm-assoc-correct-hint {
      flex: 1 1 auto;
      font-size: 12px;
      color: #137a3b;
    }
    /* Format "qcm_multi" : boutons à bascule (coche visible une fois
       sélectionné), même gabarit que .qcm-option-btn mais sans la barre de
       remplissage (les stats agrégées ne représentent pas un choix par
       option ici, cf. commentaire côté serveur — pas de %). */
    .qcm-multi-hint {
      /* Marge haute positive (pas négative) : cet indice suit tantôt la question
         (.qcm-question, déjà 18px de marge basse), tantôt le bouton "Réfléchis à ta
         réponse..." quand la question est gate (qcm-reveal-btn, sans marge basse) —
         une valeur négative le faisait chevaucher ce bouton. */
      margin: 8px 0 14px;
      color: #6b7280;
      font-size: 13px;
    }
    .qcm-option-btn-multi .qcm-option-row {
      justify-content: flex-start;
      gap: 10px;
    }
    .qcm-option-check {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 20px;
      height: 20px;
      border: 1.5px solid #d1d5db;
      border-radius: 5px;
      background: #ffffff;
      color: transparent;
      font-size: 12px;
      transition: border-color 0.15s ease, background 0.15s ease, color 0.15s ease;
    }
    .qcm-option-btn-multi.is-selected .qcm-option-check {
      border-color: #243038;
      background: #243038;
      color: #ffffff;
    }
    .qcm-option-btn-multi.answered.is-correct .qcm-option-check {
      border-color: #179748;
      background: #179748;
      color: #ffffff;
    }
    .qcm-option-btn-multi.answered.is-wrong-picked .qcm-option-check {
      border-color: #d64545;
      background: #d64545;
      color: #ffffff;
    }
    /* Format "ordre" : deux zones — la séquence choisie (numérotée) et les
       éléments encore disponibles — plutôt qu'un glisser-déposer. */
    .qcm-order-hint {
      margin: -12px 0 14px;
      color: #6b7280;
      font-size: 13px;
    }
    .qcm-order-chosen {
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-height: 12px;
      margin-bottom: 14px;
    }
    .qcm-order-pool {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 4px;
    }
    .qcm-order-chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      background: #f9fafb;
      color: #1f2937;
      font-size: 14px;
      text-align: left;
      cursor: pointer;
    }
    .qcm-order-chip:disabled {
      cursor: default;
    }
    .qcm-order-chip-chosen {
      width: 100%;
      background: #eef3f6;
      border-color: #516776;
    }
    .qcm-order-chip-num {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 20px;
      height: 20px;
      border-radius: 999px;
      background: #243038;
      color: #ffffff;
      font-size: 12px;
      font-weight: 700;
    }
    .qcm-order-chip-static {
      cursor: default;
    }
    .qcm-order-correct-label {
      margin: 0 0 2px;
      color: #137a3b;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    /* Session QCM immersive : les règles ci-dessous affinent uniquement la
       présentation des rendus existants. Aucun état ni événement ne dépend
       de ces sélecteurs. */
    #qcm-body {
      width: 100%;
      max-width: 720px;
      margin-inline: auto;
    }
    body:not(.qcm-in-session) #qcm-body {
      max-width: none;
    }
    .qcm-type-badge {
      margin-bottom: 12px;
      padding: 0;
      background: transparent;
      color: #8a97a3;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.06em;
    }
    .qcm-question {
      max-width: 680px;
      margin: 4px auto 28px;
      color: #17212a;
      font-family: "Barlow Condensed", Arial, sans-serif;
      font-size: clamp(21px, 2.7vw, 26px);
      font-weight: 700;
      line-height: 1.24;
      text-wrap: balance;
      animation: qcm-session-enter 160ms ease-out both;
    }
    .qcm-options {
      gap: 9px;
      animation: qcm-session-enter 160ms ease-out both;
    }
    .qcm-option-btn {
      min-height: 54px;
      padding: 14px 16px;
      border-color: #dce2e6;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.78);
      font-size: 15px;
      line-height: 1.4;
      transition: border-color 140ms ease, background 140ms ease, box-shadow 140ms ease, transform 140ms ease;
    }
    .qcm-option-btn:hover:not(:disabled) {
      border-color: #9eabb4;
      background: #f7f9fa;
      transform: translateY(-1px);
    }
    .qcm-option-btn:focus-visible,
    .qcm-order-chip:focus-visible,
    .qcm-difficulty-btn:focus-visible,
    .qcm-assoc-select:focus-visible,
    #qcm-reveal-btn:focus-visible {
      outline: 2px solid #516776;
      outline-offset: 2px;
    }
    .qcm-option-btn.is-selected:not(:disabled) {
      border-color: #516776;
      background: #f3f6f8;
      box-shadow: 0 0 0 2px rgba(81, 103, 118, 0.12);
    }
    .qcm-option-btn.is-correct {
      border-color: #55c979;
      background: #f0fdf4;
      box-shadow: inset 3px 0 0 #179748;
    }
    .qcm-option-btn.is-wrong-picked {
      border-color: #d79a9a;
      background: #fff7f7;
      box-shadow: inset 3px 0 0 #c85b5b;
    }
    .qcm-option-btn:disabled:not(.is-correct):not(.is-wrong-picked) {
      opacity: 0.68;
    }
    .qcm-feedback {
      margin: 22px auto 0;
      padding: 0;
      border-radius: 0;
      background: transparent;
      color: #4b5563;
      font-size: 15px;
      line-height: 1.55;
      text-align: left;
    }
    .qcm-feedback.visible {
      animation: qcm-session-enter 160ms ease-out both;
    }
    .qcm-feedback .qcm-feedback-verdict {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      margin: 0 0 10px;
      font-size: 13px;
    }
    .qcm-feedback .qcm-feedback-verdict::before {
      width: 7px;
      height: 7px;
      border-radius: 999px;
      background: currentColor;
      content: "";
    }
    .qcm-feedback-explanation {
      display: block;
      max-width: 640px;
    }
    .qcm-feedback-title {
      display: block;
      margin-bottom: 3px;
      color: #243038;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .qcm-feedback.is-correct .qcm-feedback-verdict { color: #137a3b; }
    .qcm-feedback.is-wrong .qcm-feedback-verdict { color: #a74444; }
    .qcm-difficulty-wrap {
      max-width: 520px;
      margin: 22px auto 0;
      transition: opacity 140ms ease;
    }
    .qcm-difficulty-label {
      margin-bottom: 9px;
      color: #6b7280;
      font-family: Arial, sans-serif;
      font-size: 13px;
      text-align: center;
    }
    .qcm-difficulty-buttons {
      justify-content: center;
      gap: 7px;
    }
    .qcm-difficulty-btn,
    .qcm-difficulty-btn-moyen {
      flex: 0 1 132px;
      min-height: 42px;
      padding: 9px 12px;
      font-family: Arial, sans-serif;
      font-size: 13px;
      letter-spacing: 0;
      text-transform: none;
    }
    /* Facile/Difficile : nettement plus opaques (demande du 27/08/2026, revenue
       sur la translucidité initiale — quasi pleins désormais). */
    .qcm-difficulty-btn {
      border: 1px solid #d7dde2;
      background: rgba(255, 255, 255, 0.97);
      color: #516776;
    }
    /* Moyen : bouton par défaut, rendu "noir et blanc" pour se distinguer
       visuellement de Facile/Difficile — quasi plein lui aussi (demande du
       27/08/2026). */
    .qcm-difficulty-btn-moyen {
      border: none;
      background: rgba(36, 48, 56, 0.97);
      color: #ffffff;
    }
    .qcm-difficulty-btn-moyen:hover:not(:disabled) {
      background: rgba(56, 72, 82, 0.99);
    }
    .qcm-difficulty-btn:disabled {
      opacity: 0.38;
    }
    #qcm-reveal-btn {
      margin: 6px auto 20px;
      padding: 9px 14px;
      border: 1px solid #d7dde2;
      background: rgba(255, 255, 255, 0.97);
      color: #516776;
      font-size: 13px;
      font-weight: 600;
      transition: background 140ms ease, border-color 140ms ease, color 140ms ease;
    }
    #qcm-reveal-btn:hover {
      border-color: #aeb9c1;
      background: #ffffff;
      color: #243038;
    }
    .qcm-next-btn:not(#qcm-reveal-btn) {
      min-height: 42px;
      margin-top: 22px;
      transition: background 140ms ease, transform 140ms ease;
    }
    .qcm-next-btn:not(#qcm-reveal-btn):hover {
      background: #384852;
      transform: translateY(-1px);
    }
    .qcm-exclude-btn {
      margin-top: 14px;
      border-color: transparent;
      background: transparent;
      font-weight: 600;
    }
    .qcm-assoc-row,
    .qcm-order-chosen,
    .qcm-order-pool {
      animation: qcm-session-enter 160ms ease-out both;
    }
    .qcm-assoc-left,
    .qcm-assoc-select,
    .qcm-order-chip {
      min-height: 48px;
      border-color: #dce2e6;
      border-radius: 10px;
    }
    @keyframes qcm-session-enter {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @media (max-width: 480px) {
      .qcm-panel {
        padding: 20px 16px 24px;
      }
      .qcm-mesqcm-group-title {
        margin: 0 -16px 8px;
        padding: 9px 16px;
      }
      .qcm-mesqcm-group--creating > .qcm-mesqcm-table-shell {
        width: calc(100% + 32px);
        margin-left: -16px;
        margin-right: -16px;
      }
      .qcm-mesqcm-group--inprogress > .qcm-mesqcm-paged-list .qcm-mesqcm-table-shell,
      .qcm-mesqcm-group--pending > .qcm-mesqcm-paged-list .qcm-mesqcm-table-shell {
        width: calc(100% + 32px);
        margin-left: -16px;
        margin-right: -16px;
      }
      .qcm-question {
        margin-bottom: 22px;
        font-size: clamp(20px, 5.8vw, 24px);
        line-height: 1.25;
      }
      .qcm-option-btn {
        min-height: 56px;
        padding: 14px;
      }
      .qcm-difficulty-buttons {
        gap: 6px;
      }
      .qcm-difficulty-btn,
      .qcm-difficulty-btn-moyen {
        min-width: 0;
        min-height: 44px;
        padding-inline: 8px;
        font-size: 12px;
      }
      .qcm-assoc-row {
        flex-direction: column;
        align-items: stretch;
        gap: 7px;
      }
      .qcm-assoc-left,
      .qcm-assoc-select,
      .qcm-assoc-correct-hint {
        width: 100%;
      }
      .qcm-order-chip {
        width: 100%;
      }
    }
    @media (prefers-reduced-motion: reduce) {
      .qcm-question,
      .qcm-options,
      .qcm-feedback.visible,
      .qcm-assoc-row,
      .qcm-order-chosen,
      .qcm-order-pool,
      .qcm-progress-plus-one,
      .qcm-progress-bar-fill::after,
      .qcm-progress-bar-smoke-puff {
        animation: none !important;
      }
      .qcm-option-btn,
      .qcm-progress-bar-fill,
      .qcm-difficulty-wrap,
      #qcm-reveal-btn,
      .qcm-next-btn {
        transition: none !important;
      }
    }
  </style>

    <!-- Contenu par défaut statique (pas posé par JS) : le cadre .qcm-panel est
