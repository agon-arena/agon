  // fait explicitement référence aux propositions elles-mêmes, impossible d'y
  // répondre sans les voir (constaté le 13/08/2026). D'abord corrigé par un
  // motif de texte détectant les tournures comparatives côté client : trop
  // fragile (ne couvre que quelques tournures françaises précises). Remplacé
  // par question.selfContained, un jugement explicite fait par l'IA
  // elle-même pour CHAQUE question à la génération (cf. server.js
  // buildQuestionFormatsPromptBlock) — absent (contenu généré avant ce
  // champ) vaut false : pas de rustine de repli, juste pas de gate tant que
  // le contenu n'a pas été régénéré avec ce champ.
  function needsRevealGate(type, answer, question) {
    if (answer || QCM_REVEAL_GATE_TYPES.indexOf(type) === -1) return false;
    return question.selfContained === true;
  }
  // Gradation de l'aide (audit pédagogique du 16/08/2026, "gradation de
  // l'aide") : réutilise TEL QUEL le mécanisme de gate ci-dessus (même
  // bouton, même comportement au clic, cf. wireRevealGate) — helpLevel ne
  // décide JAMAIS si on gate (ça reste needsRevealGate/selfContained,
  // inchangé), seulement le texte du bouton une fois qu'on gate. Calculé
  // côté serveur (cf. server.js stripQuestionForClient, lecture seule de
  // l'état FSRS — jamais recalculé ici) ; "guided" par repli si absent
  // (question jamais encore revue, ou plus ancienne que ce champ).
  // "guided" reprend mot pour mot le texte historique (comportement
  // par défaut inchangé, "aucune friction supplémentaire").
  var REVEAL_GATE_TEXT_BY_HELP_LEVEL = {
    guided: 'Réfléchis à ta réponse, puis affiche les propositions',
    intermediate: 'Essaie de répondre avant d’afficher les choix.',
    strong_recall: 'Retrouve la réponse de mémoire.'
  };
  function renderRevealGateHtml(helpLevel) {
    var text = REVEAL_GATE_TEXT_BY_HELP_LEVEL[helpLevel] || REVEAL_GATE_TEXT_BY_HELP_LEVEL.guided;
    return '<button type="button" class="qcm-next-btn visible" id="qcm-reveal-btn">' + escapeHtml(text) + '</button>';
  }
  function wireRevealGate(hiddenElIds) {
    var revealBtn = document.getElementById('qcm-reveal-btn');
    if (!revealBtn) return;
    revealBtn.addEventListener('click', function () {
      revealBtn.remove();
      hiddenElIds.forEach(function (id) {
        var el = document.getElementById(id);
        if (el) el.hidden = false;
      });
    });
  }

  // Boutons Facile/Moyen/Difficile (demande du 13/08/2026) : remplacent le
  // bouton "Valider" — cliquer dessus valide la réponse ET note la
  // difficulté ressentie en un seul geste, obligatoire pour passer à la
  // question suivante. Toujours au-dessus du bouton "Ne plus me la demander"
  // (cf. l'ordre d'insertion dans chaque renderXQuestion). Désactivés tant
  // que la réponse n'est pas prête à être soumise (mêmes conditions que
  // l'ancien bouton "Valider" : option sélectionnée, paires toutes
  // renseignées, etc.) — cf. setDifficultyButtonsEnabled.
  function renderDifficultyButtonsHtml(idPrefix, hidden) {
    // Libellé ajouté le 16/08/2026 (audit pédagogique) : les 3 boutons seuls
    // ne précisaient pas si le ressenti porte sur la question elle-même ou
    // sur la récupération de la réponse — pourtant seul ce second sens compte
    // pour FSRS (cf. mapMnoriaReviewToFsrsRating). Un texte contextuel plutôt
    // qu'un intitulé de bouton ambigu du type "Difficile" seul.
    return '<div class="qcm-difficulty-wrap" id="' + idPrefix + '-difficulty"' + (hidden ? ' hidden' : '') + '>' +
      '<p class="qcm-difficulty-label">Comment cela t’a semblé ?</p>' +
      '<div class="qcm-difficulty-buttons">' +
      '<button type="button" class="qcm-difficulty-btn" data-difficulty="difficile" disabled>Difficile</button>' +
      '<button type="button" class="qcm-difficulty-btn qcm-difficulty-btn-moyen" data-difficulty="moyen" disabled>Moyen</button>' +
      '<button type="button" class="qcm-difficulty-btn" data-difficulty="facile" disabled>Facile</button>' +
      '</div>' +
      '</div>';
  }

  function renderAnswerFeedbackHtml(answer) {
    var explanation = escapeHtml(answer.explanation || '');
    return '<span class="qcm-feedback-verdict">' + (answer.correct ? 'Correct' : 'À revoir') + '</span>' +
      (explanation ? '<span class="qcm-feedback-explanation"><span class="qcm-feedback-title">À retenir</span>' + explanation + '</span>' : '');
  }
  // `onSubmit(difficulty)` appelé au clic sur l'un des 3 boutons. Retourne
  // une fonction `setEnabled(bool)` à appeler quand la réponse devient
  // prête/plus prête à soumettre (remplace submitBtn.disabled = ...).
  function wireDifficultyButtons(idPrefix, onSubmit) {
    var container = document.getElementById(idPrefix + '-difficulty');
    var buttons = container ? container.querySelectorAll('.qcm-difficulty-btn') : [];
    buttons.forEach(function (btn) {
      btn.addEventListener('click', function () { onSubmit(btn.getAttribute('data-difficulty')); });
    });
    return function setEnabled(enabled) {
      buttons.forEach(function (btn) { btn.disabled = !enabled; });
    };
  }

  function wireExcludeButton(question) {
    var btn = document.getElementById('qcm-exclude-btn');
    if (!btn) return;
    // "Passer" (Découvrir, cf. renderExcludeButtonHtml) : simple avancée, jamais d'appel réseau
    // ni de confirmation — contrairement à l'exclusion définitive ci-dessous.
    if (currentCategory === 'mesqcm') {
      btn.onclick = goToNextQuestion;
      return;
    }
    if (!voterKey) return;
    btn.onclick = function () {
      // Confirmation avant retrait (demande du 13/08/2026) : contrairement au clic
      // "Mémoriser" ailleurs sur le site (optimiste, réversible), exclure une question
      // arrête définitivement de la reposer — même modale de confirmation que les
      // suppressions définitives du site (showDeleteConfirmModal, cf.
      // removeMesQcmItems plus bas, déjà chargée via script.min.js sur cette page).
      showDeleteConfirmModal({
        title: 'Ne plus jamais te reposer cette question ?',
        text: 'Elle ne te sera plus jamais reposée. Utile si elle te semble trop facile ou non pertinente.',
        onConfirm: function () {
          btn.disabled = true;
          btn.textContent = 'Retirée';

          // L'avancement ne doit jamais dépendre du temps de réponse réseau.
          // C'était particulièrement visible en Renforcement dans la PWA : si
          // l'upsert Supabase restait quelques secondes en attente, le bouton
          // affichait bien « Retirée » mais l'utilisateur restait bloqué sur la
          // question. On démarre donc l'enregistrement (avec keepalive pour
          // qu'il survive aussi à une fermeture de l'iframe), puis on affiche
          // immédiatement la question suivante, comme dans le QCM classique.
          var exclusionRequest = fetch('/api/daily-quiz/exclude-question', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ legacyKey: voterKey, questionId: question.id }),
            keepalive: true
          })
            .then(function (res) {
              if (!res.ok) throw new Error('HTTP ' + res.status);
              return res.json();
            })
            .then(function (data) {
              if (!data || data.ok !== true) throw new Error((data && data.error) || 'Réponse invalide');
            })
            .catch(function (error) {
              // L'échec éventuel est journalisé sans ramener l'utilisateur à
              // la question qu'il vient précisément de retirer.
              console.warn('[apprentissage] retrait de la question non enregistré :', error);
            });

          goToNextQuestion();
        }
      });
    };
  }

  // Image de fond pendant le QCM (demande du 18/08/2026, Découvrir/Ancrer/
  // Relier) : posée sur <body> (jamais .qcm-panel, qui reste opaque et donc
  // visuellement "par-dessus") avec un voile sombre superposé (linear-gradient
  // en premier plan du background-image) pour garder le texte du cadre
  // lisible quel que soit le cadrage/la luminosité de l'image. JSON.stringify
  // plutôt qu'une concaténation de guillemets : échappe correctement l'URL
  // pour un usage dans url(...) sans jamais casser la syntaxe CSS.
  // Repli (demande du 18/08/2026) quand la question n'a pas d'image propre —
  // ou quand la source trouvée est trop petite pour un fond plein écran sans
  // paraître floue une fois étirée (cf. MIN_BACKGROUND_IMAGE_WIDTH ci-dessous) :
  // la même texture que "Ma mémoire" (cf. MNORIA_TEXTURE_URL, public/mon-univers.js)
  // plutôt qu'un fond uni — jamais rechargée/retuilée comme sur mon-univers.js
  // (pas de caméra/zoom ici), juste l'asset statique en background-size:cover.
  var QCM_FALLBACK_BACKGROUND_IMAGE_URL = '/mnoria_master_4K_seamless_infini.webp?v=20260816-webp-lossy';
  // En-dessous de cette largeur réellement livrée (cf. lib/knowledge-image-search.js,
  // `width` calculé côté serveur), une image Wikipedia/Commons reste tout à
  // fait valable en petite illustration de fiche, mais deviendrait visiblement
  // floue étirée en fond plein écran (demande du 18/08/2026, "pas de mauvaise
  // qualité / trop zoomée") — repli sur la texture "Ma mémoire" dans ce cas
  // plutôt que d'afficher une image dégradée.
  // Largeur inconnue (anciens QCM générés avant ce champ) traitée comme
  // insuffisante, jamais comme acceptable par défaut — repli sûr sur la
  // texture plutôt qu'un pari sur une résolution qu'on ne connaît pas.
  var MIN_BACKGROUND_IMAGE_WIDTH = 1000;
  function applyQuestionBackgroundImage(question) {
    var img = question && question.image;
    var imageUrl = (img && img.url && img.width >= MIN_BACKGROUND_IMAGE_WIDTH)
      ? img.url
      : QCM_FALLBACK_BACKGROUND_IMAGE_URL;
    document.body.style.backgroundImage =
      'linear-gradient(rgba(16,24,32,0.72), rgba(16,24,32,0.72)), url(' + JSON.stringify(imageUrl) + ')';
    document.body.style.backgroundSize = 'cover';
    document.body.style.backgroundPosition = 'center';
    document.body.style.backgroundRepeat = 'no-repeat';
  }
  function clearQuestionBackgroundImage() {
    document.body.style.backgroundImage = '';
    document.body.style.backgroundSize = '';
    document.body.style.backgroundPosition = '';
    document.body.style.backgroundRepeat = '';
  }

  // Point d'entrée unique : dispatché selon le format de la question
  // courante. "association"/"qcm_multi"/"ordre" ont chacun une interaction
  // fondamentalement différente d'un choix unique et un rendu dédié ; les
  // autres formats (dont "intrus", identique à "qcm" question ×
  // 4 options) partagent le même rendu à options (renderChoiceQuestion).
  function renderQuestion() {
    signalIframeReady();
    var question = questions[currentIndex];
    applyQuestionBackgroundImage(question);
    var answer = (practiceMode ? practiceAnsweredByQuestionId : answeredByQuestionId)[question.id];
    var type = question.type || 'qcm';
    if (type === 'association') {
      renderAssociationQuestion(question, answer);
    } else if (type === 'qcm_multi') {
      renderMultiChoiceQuestion(question, answer);
    } else if (type === 'ordre') {
      renderOrderQuestion(question, answer);
    } else {
      renderChoiceQuestion(question, answer);
    }
  }

  // Partagé avec wireExcludeButton ci-dessus : après confirmation de "Ne plus
  // me la demander", on enchaîne aussi sur la question suivante (demande du
  // 13/08/2026 — "je reste bloqué sur la question" sans ça, contrairement au
  // reste du parcours QCM qui avance toujours après une action sur la
  // question en cours).
  function goToNextQuestion() {
    // Remonte en haut de la page à chaque changement de question (demande du
    // 17/08/2026) : .qcm-panel n'a pas de scroll propre, c'est la page (donc
    // window, y compris dans l'iframe d'accueil sur mobile) qui défile —
    // sans ça, après avoir lu l'explication d'une réponse plus bas, la
    // question suivante s'affichait déjà scrollée au lieu de repartir du
    // titre.
    window.scrollTo({ top: 0, behavior: 'smooth' });
    if (currentIndex === questions.length - 1) renderFinalScore();
    else { currentIndex += 1; renderQuestion(); }
  }
  function wireNextButton(nextBtn) {
    var isLast = currentIndex === questions.length - 1;
    nextBtn.textContent = isLast ? 'Voir mon score' : 'Question suivante';
    nextBtn.className = 'qcm-next-btn visible';
    nextBtn.onclick = goToNextQuestion;
  }

  function renderChoiceQuestion(question, answer) {
    var type = question.type || 'qcm';
    var questionHtml = type === 'texte_a_trous'
      ? escapeHtml(question.question).split(FILL_BLANK_MARKER).join('<span class="qcm-blank">' + FILL_BLANK_MARKER + '</span>')
      : escapeHtml(question.question);

    var html = '';
    html += renderProgressIndicatorHtml();
    html += renderOriginBadge(question) + renderTypeBadge(type);
    html += '<p class="qcm-question">' + questionHtml + '</p>';
    var gated = needsRevealGate(type, answer, question);
    if (gated) html += renderRevealGateHtml(question.helpLevel);
    html += '<div class="qcm-options" id="qcm-options"' + (gated ? ' hidden' : '') + '></div>';
    html += renderDifficultyButtonsHtml('qcm-choice', gated);
    html += renderExcludeButtonHtml();
    html += '<div class="qcm-feedback" id="qcm-feedback"></div>';
    html += '<button type="button" class="qcm-next-btn" id="qcm-next-btn"></button>';
    body.innerHTML = html;
    wireExcludeButton(question);
    if (gated) wireRevealGate(['qcm-options', 'qcm-choice-difficulty']);

    var optionsEl = document.getElementById('qcm-options');
    var selectedOptionIndex = null;
    var setDifficultyEnabled = wireDifficultyButtons('qcm-choice', function (difficulty) {
      if (selectedOptionIndex === null) return;
      submitChoiceAnswer(question, selectedOptionIndex, difficulty);
    });
    question.options.forEach(function (optionText, index) {
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'qcm-option-btn';
      btn.innerHTML =
        '<span class="qcm-option-fill"></span>' +
        '<span class="qcm-option-row">' +
        '<span class="qcm-option-label">' + escapeHtml(optionText) + '</span>' +
        '<span class="qcm-option-pct"></span>' +
        '</span>';
      btn.addEventListener('click', function () {
        selectedOptionIndex = index;
        optionsEl.querySelectorAll('.qcm-option-btn').forEach(function (optionBtn) {
          optionBtn.classList.remove('is-selected');
        });
        btn.classList.add('is-selected');
        setDifficultyEnabled(true);
      });
      optionsEl.appendChild(btn);
    });

    if (answer) applyChoiceAnswerState(question, answer);
  }

  function applyChoiceAnswerState(question, answer) {
    var optionsEl = document.getElementById('qcm-options');
    var buttons = optionsEl.querySelectorAll('.qcm-option-btn');
    var total = answer.totalAnswers || 0;
    var difficultyContainer = document.getElementById('qcm-choice-difficulty');
    if (difficultyContainer) difficultyContainer.hidden = true;
    buttons.forEach(function (btn, index) {
      btn.disabled = true;
      btn.classList.add('answered');
      var count = (answer.stats && answer.stats[index]) || 0;
      btn.querySelector('.qcm-option-fill').style.width = pct(count, total) + '%';
      btn.querySelector('.qcm-option-pct').textContent = pct(count, total) + '%';
      if (index === answer.correctIndex) btn.classList.add('is-correct');
      else if (index === answer.optionIndex) btn.classList.add('is-wrong-picked');
    });

    var feedback = document.getElementById('qcm-feedback');
    feedback.className = 'qcm-feedback visible ' + (answer.correct ? 'is-correct' : 'is-wrong');
    feedback.innerHTML = renderAnswerFeedbackHtml(answer);

    wireNextButton(document.getElementById('qcm-next-btn'));
  }

  function submitChoiceAnswer(question, optionIndex, difficulty) {
    var optionsEl = document.getElementById('qcm-options');
    var difficultyContainer = document.getElementById('qcm-choice-difficulty');
    if (difficultyContainer) difficultyContainer.querySelectorAll('.qcm-difficulty-btn').forEach(function (btn) { btn.disabled = true; });
    optionsEl.querySelectorAll('.qcm-option-btn').forEach(function (btn) { btn.disabled = true; });

    fetch(quizAnswerEndpoint(), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ voterKey: voterKey, questionId: question.id, optionIndex: optionIndex, difficulty: difficulty, slot: currentSlot, quizDate: currentQuizDate })
    })
      .then(function (res) { return res.json(); })
      .then(function (data) {
        if (data.error) throw new Error(data.error);
        recordAnsweredQuestion(question.id, data);
        applyChoiceAnswerState(question, data);
      })
      .catch(function () {
        optionsEl.querySelectorAll('.qcm-option-btn').forEach(function (btn) { btn.disabled = false; });
        if (difficultyContainer) difficultyContainer.querySelectorAll('.qcm-difficulty-btn').forEach(function (btn) { btn.disabled = false; });
      });
  }

  // ── Format "association" : relier chaque élément de question.lefts à
  // l'élément de question.rights qui lui correspond. Un <select> natif par
  // ligne plutôt qu'un glisser-déposer ou un système de clic-appariement :
  // aucune dépendance, tactile/clavier/lecteur d'écran gratuits, cohérent
  // avec le reste du site (vanilla JS, sans framework). ─────────────────
  function renderAssociationQuestion(question, answer) {
    var html = '';
    html += renderProgressIndicatorHtml();
    html += renderOriginBadge(question) + renderTypeBadge('association');
    html += '<p class="qcm-question">' + escapeHtml(question.question) + '</p>';
    html += '<div id="qcm-assoc-rows"></div>';
    html += '<div class="qcm-feedback" id="qcm-feedback"></div>';
    html += renderDifficultyButtonsHtml('qcm-assoc', false);
    html += renderExcludeButtonHtml();
    html += '<button type="button" class="qcm-next-btn" id="qcm-next-btn"></button>';
    body.innerHTML = html;
    wireExcludeButton(question);

    var rowsEl = document.getElementById('qcm-assoc-rows');
    var lefts = question.lefts || [];
    var rights = question.rights || [];
    var selects = lefts.map(function (leftText) {
      var row = document.createElement('div');
      row.className = 'qcm-assoc-row';
      var leftSpan = document.createElement('span');
      leftSpan.className = 'qcm-assoc-left';
      leftSpan.textContent = leftText;
      var select = document.createElement('select');
      select.className = 'qcm-assoc-select';
      var placeholder = document.createElement('option');
      placeholder.value = '';
      placeholder.textContent = 'Choisis…';
      select.appendChild(placeholder);
      rights.forEach(function (rightText) {
        var opt = document.createElement('option');
        opt.value = rightText;
        opt.textContent = rightText;
        select.appendChild(opt);
      });
      row.appendChild(leftSpan);
      row.appendChild(select);
      rowsEl.appendChild(row);
      return select;
    });

    var setDifficultyEnabled = wireDifficultyButtons('qcm-assoc', function (difficulty) {
      var pairsGuess = lefts.map(function (leftText, index) {
        return { left: leftText, right: selects[index].value };
      });
      submitAssociationAnswer(question, pairsGuess, selects, difficulty);
    });
    function updateSubmitEnabled() {
      setDifficultyEnabled(!selects.some(function (s) { return !s.value; }));
    }
    selects.forEach(function (select) {
      select.addEventListener('change', updateSubmitEnabled);
    });

    // Reprise de session (page rechargée après une réponse déjà envoyée) :
    // le serveur ne connaît que le verdict global (tout correct ou non, cf.
    // POST /answer), pas le choix exact fait pour chaque ligne à l'époque —
    // applyAssociationAnswerState gère ce cas en pré-remplissant chaque
    // <select> avec la bonne réponse plutôt qu'en essayant de deviner ce qui
    // avait été choisi.
    if (answer) applyAssociationAnswerState(question, answer, selects);
  }

  function submitAssociationAnswer(question, pairsGuess, selects, difficulty) {
    selects.forEach(function (s) { s.disabled = true; });
    var difficultyContainer = document.getElementById('qcm-assoc-difficulty');
    if (difficultyContainer) difficultyContainer.querySelectorAll('.qcm-difficulty-btn').forEach(function (btn) { btn.disabled = true; });

    fetch(quizAnswerEndpoint(), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ voterKey: voterKey, questionId: question.id, slot: currentSlot, quizDate: currentQuizDate, associationAnswer: pairsGuess, difficulty: difficulty })
    })
      .then(function (res) { return res.json(); })
      .then(function (data) {
        if (data.error) throw new Error(data.error);
        recordAnsweredQuestion(question.id, data);
        applyAssociationAnswerState(question, data, selects);
      })
      .catch(function () {
        selects.forEach(function (s) { s.disabled = false; });
        if (difficultyContainer) difficultyContainer.querySelectorAll('.qcm-difficulty-btn').forEach(function (btn) { btn.disabled = false; });
      });
  }

  // `selects` reflète soit un choix réel de l'utilisateur qui vient de
  // répondre (chaque <select> a une valeur, comparée à la bonne réponse),
  // soit une reprise de session où le serveur ne renvoie que le verdict
  // global (cf. commentaire dans renderAssociationQuestion) : dans ce
  // second cas chaque <select> est encore vide, on le pré-remplit alors
  // directement avec la bonne réponse plutôt que d'afficher un faux "raté"
  // sur une ligne où l'utilisateur n'a en réalité rien choisi ici.
  function applyAssociationAnswerState(question, answer, selects) {
    var lefts = question.lefts || [];
    var correctByLeft = {};
    (answer.pairs || []).forEach(function (p) { correctByLeft[p.left] = p.right; });

    selects.forEach(function (select, index) {
      var leftText = lefts[index];
      var correctRight = correctByLeft[leftText];
      var chosen = select.value;
      select.disabled = true;
      if (!chosen) {
        select.value = correctRight;
        return;
      }
      if (chosen === correctRight) {
        select.classList.add('is-correct');
      } else {
        select.classList.add('is-wrong');
        var hint = document.createElement('span');
        hint.className = 'qcm-assoc-correct-hint';
        hint.textContent = 'Bonne réponse : ' + correctRight;
        select.parentNode.appendChild(hint);
      }
    });

    var difficultyContainer = document.getElementById('qcm-assoc-difficulty');
    if (difficultyContainer) difficultyContainer.remove();

    var feedback = document.getElementById('qcm-feedback');
    feedback.className = 'qcm-feedback visible ' + (answer.correct ? 'is-correct' : 'is-wrong');
    feedback.innerHTML = renderAnswerFeedbackHtml(answer);

    wireNextButton(document.getElementById('qcm-next-btn'));
  }

  // ── Format "qcm_multi" : plusieurs bonnes réponses parmi 4-5 options —
  // boutons à bascule (pas de sélection immédiate comme "qcm", il faut
  // pouvoir cocher/décocher avant de valider) + bouton "Valider" dédié, même
  // principe que le bouton de "association" ci-dessus. ───────────────────
  function renderMultiChoiceQuestion(question, answer) {
    var html = '';
    html += renderProgressIndicatorHtml();
    html += renderOriginBadge(question) + renderTypeBadge('qcm_multi');
    html += '<p class="qcm-question">' + escapeHtml(question.question) + '</p>';
    var gated = needsRevealGate('qcm_multi', answer, question);
    if (gated) html += renderRevealGateHtml(question.helpLevel);
    html += '<p class="qcm-multi-hint">Plusieurs réponses sont correctes.</p>';
    html += '<div class="qcm-options" id="qcm-options"' + (gated ? ' hidden' : '') + '></div>';
    html += '<div class="qcm-feedback" id="qcm-feedback"></div>';
    html += renderDifficultyButtonsHtml('qcm-multi', gated);
    html += renderExcludeButtonHtml();
    html += '<button type="button" class="qcm-next-btn" id="qcm-next-btn"></button>';
    body.innerHTML = html;
    wireExcludeButton(question);
    if (gated) wireRevealGate(['qcm-options', 'qcm-multi-difficulty']);

    var optionsEl = document.getElementById('qcm-options');
    var selected = {};
    var setDifficultyEnabled = wireDifficultyButtons('qcm-multi', function (difficulty) {
      submitMultiChoiceAnswer(question, Object.keys(selected).map(Number), buttons, difficulty);
    });
    var buttons = question.options.map(function (optionText, index) {
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'qcm-option-btn qcm-option-btn-multi';
      btn.innerHTML =
        '<span class="qcm-option-row">' +
        '<span class="qcm-option-check" aria-hidden="true"><i class="fa-solid fa-check"></i></span>' +
        '<span class="qcm-option-label">' + escapeHtml(optionText) + '</span>' +
        '</span>';
      btn.addEventListener('click', function () {
        if (selected[index]) { delete selected[index]; btn.classList.remove('is-selected'); }
        else { selected[index] = true; btn.classList.add('is-selected'); }
        setDifficultyEnabled(!!Object.keys(selected).length);
      });
      optionsEl.appendChild(btn);
      return btn;
    });

    if (answer) applyMultiChoiceAnswerState(answer, buttons);
  }

  function submitMultiChoiceAnswer(question, optionIndexes, buttons, difficulty) {
    buttons.forEach(function (btn) { btn.disabled = true; });
    var difficultyContainer = document.getElementById('qcm-multi-difficulty');
    if (difficultyContainer) difficultyContainer.querySelectorAll('.qcm-difficulty-btn').forEach(function (btn) { btn.disabled = true; });

    fetch(quizAnswerEndpoint(), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ voterKey: voterKey, questionId: question.id, slot: currentSlot, quizDate: currentQuizDate, optionIndexes: optionIndexes, difficulty: difficulty })
    })
      .then(function (res) { return res.json(); })
      .then(function (data) {
        if (data.error) throw new Error(data.error);
        recordAnsweredQuestion(question.id, data);
        applyMultiChoiceAnswerState(data, buttons);
      })
      .catch(function () {
        buttons.forEach(function (btn) { btn.disabled = false; });
        if (difficultyContainer) difficultyContainer.querySelectorAll('.qcm-difficulty-btn').forEach(function (btn) { btn.disabled = false; });
      });
  }

  // Reprise de session : le serveur ne renvoie que le verdict global + la
  // vraie liste correctIndexes, jamais ce qui avait été coché à l'époque —
  // chaque bouton n'est donc marqué "correct" ou neutre qu'à partir de
  // correctIndexes, jamais "raté" individuellement lors d'une reprise (même
  // limite que "association", cf. applyAssociationAnswerState).
  function applyMultiChoiceAnswerState(answer, buttons) {
    var correctSet = {};
    (answer.correctIndexes || []).forEach(function (i) { correctSet[i] = true; });
    buttons.forEach(function (btn, index) {
      btn.disabled = true;
      btn.classList.add('answered');
      if (correctSet[index]) btn.classList.add('is-correct');
      else if (btn.classList.contains('is-selected')) btn.classList.add('is-wrong-picked');
    });

    var difficultyContainer = document.getElementById('qcm-multi-difficulty');
    if (difficultyContainer) difficultyContainer.remove();

    var feedback = document.getElementById('qcm-feedback');
    feedback.className = 'qcm-feedback visible ' + (answer.correct ? 'is-correct' : 'is-wrong');
    feedback.innerHTML = renderAnswerFeedbackHtml(answer);

    wireNextButton(document.getElementById('qcm-next-btn'));
  }

  // ── Format "ordre" : remettre 3-4 éléments dans leur ordre correct — tap
  // pour construire la séquence (pas de glisser-déposer, aucune dépendance,
  // tactile/clavier gratuits comme le <select> de "association") : chaque
  // tap sur un élément disponible l'ajoute à la séquence choisie, un tap sur
  // un élément déjà placé le retire (pour corriger sans tout recommencer). ─
  function renderOrderQuestion(question, answer) {
    var html = '';
    html += renderProgressIndicatorHtml();
    html += renderOriginBadge(question) + renderTypeBadge('ordre');
    html += '<p class="qcm-question">' + escapeHtml(question.question) + '</p>';
    html += '<p class="qcm-order-hint">Touche les éléments dans le bon ordre.</p>';
    html += '<div class="qcm-order-chosen" id="qcm-order-chosen"></div>';
    html += '<div class="qcm-order-pool" id="qcm-order-pool"></div>';
    html += '<div class="qcm-feedback" id="qcm-feedback"></div>';
    html += renderDifficultyButtonsHtml('qcm-order', false);
    html += renderExcludeButtonHtml();
    html += '<button type="button" class="qcm-next-btn" id="qcm-next-btn"></button>';
    body.innerHTML = html;
    wireExcludeButton(question);

    var poolEl = document.getElementById('qcm-order-pool');
    var chosenEl = document.getElementById('qcm-order-chosen');
    var items = question.items || [];
    var chosenOrder = [];
    var setDifficultyEnabled = wireDifficultyButtons('qcm-order', function (difficulty) {
      submitOrderAnswer(question, chosenOrder.slice(), poolEl, chosenEl, difficulty);
    });

    function renderChosen() {
      chosenEl.innerHTML = '';
      chosenOrder.forEach(function (text, i) {
        var chip = document.createElement('button');
        chip.type = 'button';
        chip.className = 'qcm-order-chip qcm-order-chip-chosen';
        chip.innerHTML = '<span class="qcm-order-chip-num">' + (i + 1) + '</span><span>' + escapeHtml(text) + '</span>';
        chip.addEventListener('click', function () {
          chosenOrder.splice(i, 1);
          renderChosen();
          renderPool();
        });
        chosenEl.appendChild(chip);
      });
      setDifficultyEnabled(chosenOrder.length === items.length);
    }

    function renderPool() {
      poolEl.innerHTML = '';
      items.forEach(function (text) {
        if (chosenOrder.indexOf(text) !== -1) return;
        var chip = document.createElement('button');
        chip.type = 'button';
        chip.className = 'qcm-order-chip';
        chip.textContent = text;
        chip.addEventListener('click', function () {
          chosenOrder.push(text);
          renderChosen();
          renderPool();
        });
        poolEl.appendChild(chip);
      });
    }
    renderPool();
    renderChosen();

    if (answer) applyOrderAnswerState(answer, poolEl, chosenEl, items);
  }

  function submitOrderAnswer(question, orderedItems, poolEl, chosenEl, difficulty) {
    var difficultyContainer = document.getElementById('qcm-order-difficulty');
    if (difficultyContainer) difficultyContainer.querySelectorAll('.qcm-difficulty-btn').forEach(function (btn) { btn.disabled = true; });
    poolEl.querySelectorAll('.qcm-order-chip').forEach(function (c) { c.disabled = true; });
    chosenEl.querySelectorAll('.qcm-order-chip').forEach(function (c) { c.disabled = true; });

    fetch(quizAnswerEndpoint(), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ voterKey: voterKey, questionId: question.id, slot: currentSlot, quizDate: currentQuizDate, orderedItems: orderedItems, difficulty: difficulty })
    })
      .then(function (res) { return res.json(); })
      .then(function (data) {
        if (data.error) throw new Error(data.error);
        recordAnsweredQuestion(question.id, data);
        applyOrderAnswerState(data, poolEl, chosenEl, question.items);
      })
      .catch(function () {
        if (difficultyContainer) difficultyContainer.querySelectorAll('.qcm-difficulty-btn').forEach(function (btn) { btn.disabled = false; });
        poolEl.querySelectorAll('.qcm-order-chip').forEach(function (c) { c.disabled = false; });
        chosenEl.querySelectorAll('.qcm-order-chip').forEach(function (c) { c.disabled = false; });
      });
  }

  // Affiche le bon ordre (révélé par le serveur une fois répondu) en lecture
  // seule plutôt que de comparer élément par élément à ce qui avait été
  // choisi — même limite de reprise de session que "association"/"qcm_multi" :
  // seul le verdict global est connu après un rechargement de page.
  function applyOrderAnswerState(answer, poolEl, chosenEl, fallbackItems) {
    var difficultyContainer = document.getElementById('qcm-order-difficulty');
    if (difficultyContainer) difficultyContainer.remove();
    var correctItems = answer.items || fallbackItems || [];
    poolEl.innerHTML = '';
    chosenEl.innerHTML = '<p class="qcm-order-correct-label">Bon ordre :</p>';
    correctItems.forEach(function (text, i) {
      var chip = document.createElement('div');
      chip.className = 'qcm-order-chip qcm-order-chip-chosen qcm-order-chip-static';
      chip.innerHTML = '<span class="qcm-order-chip-num">' + (i + 1) + '</span><span>' + escapeHtml(text) + '</span>';
      chosenEl.appendChild(chip);
    });

    var feedback = document.getElementById('qcm-feedback');
    feedback.className = 'qcm-feedback visible ' + (answer.correct ? 'is-correct' : 'is-wrong');
    feedback.innerHTML = renderAnswerFeedbackHtml(answer);

    wireNextButton(document.getElementById('qcm-next-btn'));
  }

  function renderFinalScore() {
    signalIframeReady();
    // Écran de score final : plus une question précise à l'image dédiée,
    // retour au fond uni (demande du 18/08/2026, même esprit que
    // applyQuestionBackgroundImage sur renderQuestion).
    clearQuestionBackgroundImage();
    // Série Ancrer/Relier terminée (jamais en "Refaire" : practiceMode ne persiste aucune
    // réponse, cf. POST /api/daily-quiz/practice-answer) : l'onglet doit perdre son doré +
    // reflet et redevenir grisé/non cliquable tout de suite (cf. .qcm-slot-btn-new,
    // renderCategorySwitcher). Demande du 17/08/2026 : NE PLUS dépendre uniquement d'un
    // aller-retour serveur (refreshSlotsStatus) pour ça — deux raisons concrètes observées :
    // 1) pour "Ancrer", la mise à jour FSRS de la toute dernière réponse tourne en tâche de
    //    fond APRÈS l'envoi de la réponse HTTP (cf. applyFsrsReviewForDailyQuizAnswer, "jamais
    //    sur le chemin critique") — un refreshSlotsStatus lancé immédiatement après pouvait
    //    donc encore lire l'ancien due_at et renvoyer available:true à tort ;
    // 2) pour "Relier", server.js ne vérifie même pas de file "due" mais seulement l'existence
    //    d'AU MOINS UN lien (hasCultureGeneraleComprehensionLinks) — cet onglet ne redevient
    //    donc jamais indisponible côté serveur une fois qu'un lien existe, peu importe qu'une
    //    série vienne d'être terminée.
    // On force donc ici, en local, available:false pour la catégorie qu'on vient de terminer
    // (jamais mesqcm, toujours disponible) — fiable à 100%, sans dépendre du serveur. AUCUN
    // refreshSlotsStatus derrière (retiré le 17/08/2026) : un premier essai en gardait un en
    // tâche de fond "pour détecter du contenu nouveau", mais sa réponse arrivait presque
    // toujours pendant que l'utilisateur lit encore son score — écrasant cet override local
    // par la réponse serveur (encore available:true pour les deux raisons ci-dessus) avant
    // même le clic sur "Terminé". Le prochain refreshSlotsStatus utile aura de toute façon
    // lieu tout seul dès le prochain vrai chargement (loadMesQcm/loadSlot).
    if (!practiceMode && slotsStatus && slotsStatus.slots && slotsStatus.slots[currentCategory]) {
      slotsStatus.slots[currentCategory].available = false;
      renderCategorySwitcher();
    }
    var answers = practiceMode ? practiceAnsweredByQuestionId : answeredByQuestionId;
    var total = questions.length;
    var correct = 0;
    questions.forEach(function (q) {
      var a = answers[q.id];
      if (a && a.correct) correct += 1;
    });
    // Les repasses de "Renforcement" ne comptent jamais pour le score
    // Gnosis (cf. server.js DAILY_QUIZ_GNOSIS_EXCLUDED_QUESTION_ID_PREFIXES) :
    // message dédié plutôt que la promesse habituelle d'un score qui ne
    // bougera pas. En mode "Refaire" (practiceMode), même logique : ce
    // score d'entraînement ne compte jamais pour l'ancrage (cf. POST
    // /api/daily-quiz/practice-answer, qui ne persiste jamais la réponse).
    var scoreHint = practiceMode
      ? 'Ce score d’entraînement ne compte pas — il ne modifie jamais ton ancrage ni tes vraies réponses du jour.'
      : (currentCategory === 'renforcement'
        ? 'Ces repasses ne comptent pas pour ton score Gnosis — elles font seulement progresser tes acquis vers leur validation définitive.'
        : (currentCategory === 'comprendre'
          ? 'Ce parcours ne compte pas pour ton score Gnosis ni pour l’ancrage — il vérifie uniquement ta compréhension des liens entre tes connaissances.'
          : 'Dans quelques instants, ton score Gnosis apparaîtra et te permettra de voir ton classement par rapport aux autres utilisateurs (disponible depuis le bandeau blanc en haut ou en bas).'));
    // Demande du 17/08/2026 : plus de "Refaire"/"Refaire les questions loupées" — un seul
    // bouton "Terminé", qui ramène toujours sur Découvrir.
    body.innerHTML =
      '<div class="qcm-final-score">' +
      '<i class="fa-solid fa-trophy"></i>' +
      '<div class="qcm-final-score-value">' + correct + ' / ' + total + '</div>' +
      '<div class="qcm-final-score-label">bonnes réponses aujourd’hui</div>' +
      '</div>' +
      '<p class="qcm-final-score-hint">' + scoreHint + '</p>' +
      '<div class="qcm-final-actions">' +
      '<button type="button" class="qcm-next-btn visible" id="qcm-finish-btn">Terminé</button>' +
      '</div>';

    document.getElementById('qcm-finish-btn').onclick = function () {
      practiceMode = false;
      if (currentSlot) window.history.replaceState({}, '', window.location.pathname);
      loadMesQcm();
    };
  }

  // Construit le HTML intérieur d'une fiche (.qcm-fiche-modal) : nom + détail
  // pur du concept/mécanisme/citation/œuvre/événement (sourceDetail, cf.
  // server.js extractCultureGeneraleItemDetail) — jamais la question du QCM
  // ni son rapprochement avec l'actualité du jour, déjà exclus côté serveur.
  // `extraHtml` est inséré après les sections du détail, avant le bouton de
  // fermeture — utilisé par la fiche "Mes apprentissages" pour y ajouter le
  // corrigé des questions (cf. openMesQcmFiche).
  // `themes` (optionnel) : pastilles de thématiques juste sous le nom, cf.
  // renderThemeTags — une connaissance peut en couvrir plusieurs.
  // `links` (optionnel) : connaissances reliées (cf. renderLinksSection), affichées après
  // le détail de la notion et avant extraHtml (le corrigé des questions sur "Mes
  // apprentissages" — vide ailleurs, ex. Éclairages).
  function buildFicheModalHtml(iconClass, rubricLabel, name, detail, extraHtml, themes, links) {
    var html =
      '<div class="qcm-fiche-modal">' +
      '<div class="qcm-fiche-head">' +
      '<p class="qcm-fiche-rubric"><i class="fa-solid ' + iconClass + '"></i> ' + escapeHtml(rubricLabel) + '</p>' +
      '<button type="button" class="qcm-fiche-close" aria-label="Fermer"><i class="fa-solid fa-xmark"></i></button>' +
      '</div>' +
      '<p class="qcm-fiche-name">' + escapeHtml(name) + '</p>' +
      renderThemeTags(themes);
    if (detail.meta) html += '<p class="qcm-fiche-meta">' + escapeHtml(detail.meta) + '</p>';
    if (/^https?:\/\//i.test(String(detail.sourceUrl || ''))) {
      html += '<p class="qcm-fiche-meta"><a href="' + escapeHtml(detail.sourceUrl) + '" target="_blank" rel="noopener noreferrer">Voir la page source</a></p>';
    }
    if (detail.sourceAuthor) {
      html += '<p class="qcm-fiche-meta">Chaîne : ' + escapeHtml(detail.sourceAuthor) + (detail.durationSeconds ? ' · ' + Math.ceil(Number(detail.durationSeconds) / 60) + ' min' : '') + '</p>';
    }
    if (detail.image && detail.image.url) {
      var img = detail.image;
      var captionText = 'Image : ' + (img.credit || (img.source === 'press' ? "source de l'actualité" : (img.source === 'wikimedia-commons' ? 'Wikimedia Commons' : 'Wikipedia')));
      html += '<figure class="qcm-fiche-image">' +
        '<img src="' + escapeHtml(img.url) + '" alt="' + escapeHtml(name) + '" loading="lazy" onerror="this.closest(\'.qcm-fiche-image\').remove();">' +
        (img.pageUrl
          ? '<figcaption><a href="' + escapeHtml(img.pageUrl) + '" target="_blank" rel="noopener noreferrer">' + escapeHtml(captionText) + '</a></figcaption>'
          : '<figcaption>' + escapeHtml(captionText) + '</figcaption>') +
        '</figure>';
    }
    (detail.sections || []).forEach(function (section) {
      if (section.label) html += '<h3 class="qcm-fiche-section-label">' + escapeHtml(section.label) + '</h3>';
      html += '<p class="qcm-fiche-explanation">' + escapeHtml(section.text) + '</p>';
    });
    html += renderLinksSection(links);
    if (extraHtml) html += extraHtml;
    html += '<button type="button" class="qcm-fiche-bottom-close">Fermer</button>';
    html += '</div>';
    return html;
  }

  // Ouvre une fiche à partir de son HTML intérieur déjà construit (cf.
  // buildFicheModalHtml) : overlay, dégradé "suite ↓", fermeture (croix, clic
  // hors modale, Échap, bouton du bas).
  function openFicheOverlay(modalHtml) {
    var overlay = document.createElement('div');
    overlay.className = 'qcm-fiche-overlay';
    overlay.innerHTML = '<div class="qcm-fiche-overlay-inner">' + modalHtml + '<div class="qcm-fiche-scroll-spacer" aria-hidden="true"></div></div>';
    document.body.appendChild(overlay);
    // Pas attachScrollFadeHint (générique) : il se base sur le bas de TOUTE la
    // zone de scroll, qui inclut ici .qcm-fiche-scroll-spacer (sombre, sous la
    // fiche) — le dégradé blanc y jurait sur le fond sombre et restait visible
    // bien après la fin du vrai contenu. On se base plutôt sur le bas réel de
    // .qcm-fiche-modal (la carte blanche) par rapport au viewport.
    var ficheModalEl = overlay.querySelector('.qcm-fiche-modal');
    var ficheFadeHint, updateFicheFadeHint, ficheFadeResizeObserver;
    if (ficheModalEl) {
      ficheFadeHint = document.createElement('div');
      // qcm-fiche-fade-hint : position:fixed direct sur <body>, pas un enfant
      // position:absolute de .qcm-fiche-overlay (position:fixed + overflow-y:
      // auto). Sur iOS Safari, un enfant absolute d'un conteneur fixed qui
      // scroll ne reste pas fiablement épinglé pendant le défilement — il
      // "scrolle avec" le contenu et finit ailleurs à l'écran (constaté :
      // "suite" coincé au milieu du texte au lieu du bas de l'écran).
      ficheFadeHint.className = 'scroll-fade-hint qcm-fiche-fade-hint is-hidden';
      ficheFadeHint.style.setProperty('--scroll-fade-color', '#ffffff');
      ficheFadeHint.innerHTML = '<span class="scroll-fade-hint-text">suite <span aria-hidden="true">↓</span></span>';
      document.body.appendChild(ficheFadeHint);
      ficheFadeHint.querySelector('.scroll-fade-hint-text').addEventListener('click', function (e) {
        e.stopPropagation();
        overlay.scrollBy({ top: overlay.clientHeight * 0.8, behavior: 'smooth' });
      });
      updateFicheFadeHint = function () {
        var rect = ficheModalEl.getBoundingClientRect();
        ficheFadeHint.classList.toggle('is-hidden', rect.bottom <= window.innerHeight + 4);
      };
      overlay.addEventListener('scroll', updateFicheFadeHint, { passive: true });
      window.addEventListener('resize', updateFicheFadeHint, { passive: true });
      requestAnimationFrame(updateFicheFadeHint);
      // Un seul rAF au moment de l'ouverture ne suffit pas : l'image de la
      // fiche (chargée en lazy) ou les polices peuvent encore agrandir la
      // fiche après ce premier calcul, laissant le dégradé dans le mauvais
      // état (affiché/masqué à tort) jusqu'au prochain scroll. Un
      // ResizeObserver sur la fiche elle-même le retient à jour à chaque
      // changement de sa hauteur réelle.
      if (typeof ResizeObserver === 'function') {
        ficheFadeResizeObserver = new ResizeObserver(updateFicheFadeHint);
        ficheFadeResizeObserver.observe(ficheModalEl);
      }
    }
    try { window.parent.postMessage({ type: 'mnoria:qcm-fiche-visibility', open: true }, '*'); } catch (e) {}
    function close() {
      overlay.remove();
      if (ficheFadeHint) ficheFadeHint.remove();
      document.removeEventListener('keydown', onKeydown);
      if (typeof updateFicheFadeHint === 'function') window.removeEventListener('resize', updateFicheFadeHint);
      if (ficheFadeResizeObserver) ficheFadeResizeObserver.disconnect();
      try { window.parent.postMessage({ type: 'mnoria:qcm-fiche-visibility', open: false }, '*'); } catch (e) {}
    }
    function onKeydown(e) {
      if (e.key === 'Escape') close();
    }
    overlay.addEventListener('click', function (e) {
      if (e.target === overlay || e.target.classList.contains('qcm-fiche-overlay-inner')) close();
    });
    overlay.querySelector('.qcm-fiche-close').addEventListener('click', close);
    overlay.querySelector('.qcm-fiche-bottom-close').addEventListener('click', close);
    // "Les liens" (cf. renderLinksSection) : ferme la fiche courante avant d'ouvrir la
    // fiche liée, plutôt que d'empiler les overlays.
    overlay.querySelectorAll('.qcm-fiche-link-item').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var type = btn.getAttribute('data-link-type');
        var sourceId = btn.getAttribute('data-link-source-id');
        var name = btn.getAttribute('data-link-name');
        close();
        openMesQcmFicheByLink(type, sourceId, name);
      });
    });
    document.addEventListener('keydown', onKeydown);
  }

  function setCustomSearchStatus(text, isError) {
    customSearchStatus.hidden = !text;
    customSearchStatus.textContent = text || '';
    customSearchStatus.classList.toggle('is-error', !!isError);
  }

  // Camembert qui se noircit en boucle pendant la génération (demande du
  // 13/08/2026) : la génération peut prendre "quelques secondes à plusieurs
  // minutes" (niveau Expert énumérable, cf. server.js
  // NOTION_QUIZ_ENUMERABLE_MAX_ROUNDS) — sans savoir laquelle à l'avance, un
  // temps affiché (écoulé ou compte à rebours) donnerait une indication
  // potentiellement trompeuse. Boucle indéterminée à la place : montre juste
  // "ça travaille" sans jamais prétendre connaître la durée réelle.
  var pieSpinnerId = null;
  var PIE_SPINNER_LOOP_MS = 2600;
  function stopPieSpinner() {
    if (pieSpinnerId) {
      clearInterval(pieSpinnerId);
      pieSpinnerId = null;
    }
    var el = document.getElementById('qcm-pie-spinner');
    if (el) el.hidden = true;
  }
  function startPieSpinner() {
    stopPieSpinner();
    var el = document.getElementById('qcm-pie-spinner');
    if (!el) return;
    el.hidden = false;
    var startedAt = Date.now();
    var tick = function () {
      var deg = ((Date.now() - startedAt) % PIE_SPINNER_LOOP_MS) / PIE_SPINNER_LOOP_MS * 360;
      el.style.background = 'conic-gradient(#243038 ' + deg + 'deg, #e2e6ea ' + deg + 'deg)';
    };
    tick();
    pieSpinnerId = setInterval(tick, 60);
  }

  function getPendingNotionQuizGenerations() {
    if (typeof window.mnoriaGetPendingNotionQuizGenerations === 'function') {
      return window.mnoriaGetPendingNotionQuizGenerations();
    }
    return [];
  }

  function pendingNotionQuizMessage(pending) {
    if (pending.length === 1) {
      return 'Génération du QCM « ' + pending[0].label + ' » en cours…';
    }
    return 'Génération de ' + pending.length + ' QCM en cours : ' + pending
      .map(function (item) { return '« ' + item.label + ' »'; })
      .join(', ') + '…';
  }

  function mesQcmListSignature(quizzes) {
    return (quizzes || []).map(function (quiz) { return quiz.slot + '|' + quiz.quizDate; }).sort().join('||');
  }

  // Réconcilie l'état optimiste déposé par Éclairages/Histoire avec la liste serveur. Dès que
  // le slot apparaît, le marqueur est supprimé ; tant qu'il manque, le même texte et le même
  // camembert tournant que la génération par barre de recherche restent visibles, nom compris.
  function syncPendingNotionQuizGenerations(quizzes) {
    var pending = getPendingNotionQuizGenerations();
    var availableSlots = {};
    (quizzes || []).forEach(function (quiz) { availableSlots[quiz.slot] = true; });
    pending.forEach(function (item) {
      if (availableSlots[item.slot] && typeof window.mnoriaFinishPendingNotionQuizGeneration === 'function') {
        window.mnoriaFinishPendingNotionQuizGeneration(item.slot);
      }
    });
    pending = getPendingNotionQuizGenerations();

    if (currentCategory !== 'mesqcm' || currentSlot || customSearchGenerationActive) return pending;
    if (!pending.length) {
      if (pendingNotionQuizStatusVisible) {
        pendingNotionQuizStatusVisible = false;
        setCustomSearchStatus('', false);
        stopPieSpinner();
      }
      if (pendingNotionQuizPollId) {
        clearTimeout(pendingNotionQuizPollId);
        pendingNotionQuizPollId = null;
      }
      return pending;
    }

    var statusWasVisible = pendingNotionQuizStatusVisible;
    pendingNotionQuizStatusVisible = true;
    setCustomSearchStatus(pendingNotionQuizMessage(pending), false);
    var spinnerEl = document.getElementById('qcm-pie-spinner');
    if (!statusWasVisible || !spinnerEl || spinnerEl.hidden) startPieSpinner();
    schedulePendingNotionQuizPoll();
    return pending;
  }

  function fetchLatestMesQcmList() {
    return fetch('/api/users/notion-quizzes?legacyKey=' + encodeURIComponent(voterKey), { cache: 'no-store' })
      .then(function (res) { return res.json(); })
      .then(function (data) {
        if (currentCategory !== 'mesqcm' || currentSlot) return;
        var quizzes = Array.isArray(data.quizzes) ? data.quizzes : [];
        var changed = mesQcmListSignature(quizzes) !== mesQcmListSignature(currentMesQcmQuizzes);
        syncPendingNotionQuizGenerations(quizzes);
        if (changed) renderMesQcmList(quizzes);
      });
  }

  function refreshPendingNotionQuizList(forceListRefresh) {
    if (currentCategory !== 'mesqcm' || currentSlot || customSearchGenerationActive || !voterKey) return;
    var pending = getPendingNotionQuizGenerations();
    if (!pending.length) {
      syncPendingNotionQuizGenerations(currentMesQcmQuizzes);
      if (forceListRefresh) fetchLatestMesQcmList().catch(function () {});
      return;
    }
    var slots = pending.map(function (item) { return item.slot; }).join(',');
    fetch('/api/users/notion-quizzes/generation-status?legacyKey=' + encodeURIComponent(voterKey) + '&slots=' + encodeURIComponent(slots), { cache: 'no-store' })
      .then(function (res) { return res.json(); })
      .then(function (data) {
        if (currentCategory !== 'mesqcm' || currentSlot) return;
        var ready = Array.isArray(data.ready) ? data.ready : [];
        if (!ready.length) {
          syncPendingNotionQuizGenerations(currentMesQcmQuizzes);
          return;
        }
        ready.forEach(function (item) {
          if (typeof window.mnoriaFinishPendingNotionQuizGeneration === 'function') {
            window.mnoriaFinishPendingNotionQuizGeneration(item.slot);
          }
        });
        return fetchLatestMesQcmList();
      })
      .catch(function () { schedulePendingNotionQuizPoll(); });
  }

  function schedulePendingNotionQuizPoll() {
    if (pendingNotionQuizPollId) clearTimeout(pendingNotionQuizPollId);
    if (!getPendingNotionQuizGenerations().length || currentCategory !== 'mesqcm' || currentSlot) {
      pendingNotionQuizPollId = null;
      return;
    }
    pendingNotionQuizPollId = setTimeout(function () {
      pendingNotionQuizPollId = null;
      refreshPendingNotionQuizList(false);
    }, 3000);
  }

  // Si la page d'origine reste vivante dans une autre iframe, sa réussite retire le marqueur
  // localStorage et déclenche cet événement : relire immédiatement plutôt que d'attendre le
  // prochain tour de polling.
  window.addEventListener('storage', function (event) {
    if (event.key !== 'mnoria_pending_notion_quizzes_v1') return;
    if (currentCategory === 'mesqcm' && !currentSlot) refreshPendingNotionQuizList(true);
  });

  // Récapitule sujet + niveau choisis avant de lancer la génération IA
  // (demande du 13/08/2026) : évite une génération partie par erreur (sujet
  // mal tapé, mauvais niveau cliqué dans showNotionQuizLevelPicker) — coûte
  // un appel IA (et, pour le niveau Expert, jusqu'à plusieurs minutes)
  // impossible à annuler une fois lancé. Même famille visuelle que les
  // autres popups de cette page (.qcm-fiche-overlay/.qcm-fiche-modal).
  function showGenerateConfirmModal(topic, level, onConfirm) {
    var levelMeta = (typeof NOTION_QUIZ_LEVEL_OPTIONS !== 'undefined' ? NOTION_QUIZ_LEVEL_OPTIONS : [])
      .filter(function (o) { return o.level === level; })[0];
    var levelName = levelMeta ? levelMeta.name : level;

    var overlay = document.createElement('div');
    overlay.className = 'qcm-fiche-overlay';
    overlay.innerHTML =
      '<div class="qcm-fiche-overlay-inner">' +
        '<div class="qcm-fiche-modal">' +
          '<div class="qcm-fiche-head">' +
            '<p class="qcm-fiche-rubric"><i class="fa-solid fa-wand-magic-sparkles"></i> Confirmer la génération</p>' +
            '<button type="button" class="qcm-fiche-close" aria-label="Fermer"><i class="fa-solid fa-xmark"></i></button>' +
          '</div>' +
          '<p class="qcm-generate-confirm-text">' + escapeHtml(topic) + ', niveau ' + escapeHtml(levelName) + '. Tu confirmes ?</p>' +
          '<div class="qcm-generate-confirm-actions">' +
            '<button type="button" class="qcm-generate-confirm-cancel">Annuler</button>' +
            '<button type="button" class="qcm-generate-confirm-ok">Confirmer</button>' +
          '</div>' +
        '</div>' +
      '</div>';
    document.body.appendChild(overlay);
    try { window.parent.postMessage({ type: 'mnoria:qcm-fiche-visibility', open: true }, '*'); } catch (e) {}

    function close() {
      overlay.remove();
      document.removeEventListener('keydown', onKeydown);

  // Barre de recherche libre "Mes apprentissages" (cf. server.js POST
  // /api/users/notion-quizzes/custom). Comme pour un clic "Mémoriser" sur
  // Éclairages/Ce jour dans l'Histoire, le sujet nommé et l'indicateur animé
  // restent visibles pendant la génération IA. Ici, la réponse ouvre ensuite
  // directement le QCM tout juste créé via loadSlot.
  // Niveau d'approfondissement toujours demandé avant génération (cf.
  // showNotionQuizLevelPicker, public/script.js — demande du 12/08/2026).
  function submitCustomTopic(e) {
    e.preventDefault();
    var topic = (customSearchInput.value || '').trim();
    if (topic.length < 3) {
      setCustomSearchStatus('Décris le sujet en au moins 3 caractères.', true);
      return;
    }
    if (!voterKey) {
      setCustomSearchStatus('Identifiant introuvable, recharge la page et réessaie.', true);
      return;
    }
    if (typeof showNotionQuizLevelPicker !== 'function') {
      setCustomSearchStatus('Génération impossible pour le moment, réessaie.', true);
      return;
    }
    showNotionQuizLevelPicker(function (level) {
      showGenerateConfirmModal(topic, level, function () {
        customSearchGenerationActive = true;
        customSearchBtn.disabled = true;
        customSearchInput.disabled = true;
        setCustomSearchStatus(
          level === 'exhaustif'
            ? 'Génération du QCM « ' + topic + ' » en cours — jusqu’à quelques minutes pour une liste à mémoriser en entier…'
            : 'Génération du QCM « ' + topic + ' » en cours…',
          false
        );
        startPieSpinner();

        fetch('/api/users/notion-quizzes/custom', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ legacyKey: voterKey, topic: topic, level: level })
        })
          .then(function (res) { return res.json().then(function (data) { return { status: res.status, data: data }; }); })
          .then(function (result) {
            customSearchGenerationActive = false;
            stopPieSpinner();
            customSearchBtn.disabled = false;
            customSearchInput.disabled = false;
            if (!result.data.ok) {
              setCustomSearchStatus(result.data.error || 'Génération impossible pour le moment.', true);
              return;
            }
            customSearchInput.value = '';
            setCustomSearchStatus('', false);
            loadSlot(result.data.slot, result.data.quizDate, result.data.label);
          })
          .catch(function () {
            customSearchGenerationActive = false;
            stopPieSpinner();
            customSearchBtn.disabled = false;
            customSearchInput.disabled = false;
            setCustomSearchStatus('Génération impossible pour le moment, réessaie.', true);
          });
        });
    });
  }
  customSearchForm.addEventListener('submit', submitCustomTopic);
  // <textarea> plutôt qu'un <input> (cf. 12/08/2026) : Entrée y insère une
  // ligne par défaut au lieu de soumettre le formulaire — on garde le
  // réflexe "Entrée = valider" tant que Shift n'est pas maintenu (qui reste
  // libre d'insérer un retour à la ligne volontaire).
  customSearchInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      customSearchForm.requestSubmit();
    }
  });

  // "Explorer les apprentissages disponibles" (demande du 13/08/2026) :
  // adopter un sujet libre déjà généré par un autre visiteur (cf. server.js
  // GET /api/users/notion-quizzes/explore) au lieu de relancer une
  // génération IA (submitCustomTopic ci-dessus) pour un sujet proche mais
  // formulé différemment. Même fenêtre modale que openMesQcmActionMenu
  // (.qcm-fiche-overlay/.qcm-fiche-modal) pour rester cohérent visuellement.
  var mesQcmExploreModalEls = null;

  function openMesQcmExploreModal() {
    closeMesQcmActionModal();
    closeMesQcmExploreModal();
    var modalHtml =
      '<div class="qcm-fiche-modal qcm-explore-modal">' +
        '<div class="qcm-fiche-head">' +
          '<p class="qcm-fiche-rubric"><i class="fa-solid fa-compass"></i> Apprentissages disponibles</p>' +
          '<button type="button" class="qcm-fiche-close" aria-label="Fermer"><i class="fa-solid fa-xmark"></i></button>' +
        '</div>' +
        '<input type="text" class="qcm-explore-search-input" id="qcm-explore-search-input" placeholder="Filtrer par sujet…">' +
        '<div class="qcm-explore-list-wrap"><div class="qcm-explore-list" id="qcm-explore-list"></div></div>' +
      '</div>';

    var overlay = document.createElement('div');
    overlay.className = 'qcm-fiche-overlay';
    overlay.innerHTML = '<div class="qcm-fiche-overlay-inner">' + modalHtml + '</div>';
    document.body.appendChild(overlay);

    overlay.addEventListener('click', function (e) {

    var searchInput = overlay.querySelector('#qcm-explore-search-input');
    var listWrapEl = overlay.querySelector('.qcm-explore-list-wrap');
    var listEl = overlay.querySelector('#qcm-explore-list');
    var ownedSlots = {};
    currentMesQcmQuizzes.forEach(function (q) { ownedSlots[q.slot] = true; });

    // "suite" + dégradé (demande du 13/08/2026, même habillage générique que
    // les autres listes/pages du site, cf. .scroll-fade-hint dans style.css)
    // signalant qu'il reste des sujets à découvrir plus bas dans la liste.
    // Contrairement à .qcm-fiche-fade-hint plus haut (posé directement sur
    // <body> à cause du parent position:fixed+scroll de la fiche),
    // .qcm-explore-list-wrap n'est PAS position:fixed : le positionnement
    // absolute générique fonctionne ici sans contournement.
    var exploreFadeHint = document.createElement('div');
    exploreFadeHint.className = 'scroll-fade-hint is-hidden';
    exploreFadeHint.style.setProperty('--scroll-fade-color', '#ffffff');
    exploreFadeHint.innerHTML = '<span class="scroll-fade-hint-text">suite <span aria-hidden="true">↓</span></span>';
    listWrapEl.appendChild(exploreFadeHint);
    exploreFadeHint.querySelector('.scroll-fade-hint-text').addEventListener('click', function (e) {
      e.stopPropagation();
      listEl.scrollBy({ top: listEl.clientHeight * 0.8, behavior: 'smooth' });
    });
    function updateExploreFadeHint() {
      var hasOverflow = listEl.scrollHeight > listEl.clientHeight + 2;
      var atBottom = listEl.scrollTop + listEl.clientHeight >= listEl.scrollHeight - 4;
      exploreFadeHint.classList.toggle('is-hidden', !hasOverflow || atBottom);
    }
    listEl.addEventListener('scroll', updateExploreFadeHint, { passive: true });

    function renderExploreList(items) {
      if (!items.length) {
        listEl.innerHTML = '<p class="qcm-state-message">Aucun sujet trouvé pour le moment.</p>';
        updateExploreFadeHint();
        return;
      }
      listEl.innerHTML = items.map(function (item) {
        var already = !!ownedSlots[item.slot];
        var metaText = already ? 'Déjà dans ta liste' : (item.userCount + ' visiteur' + (item.userCount > 1 ? 's' : ''));
        var count = Number(item.questionCount) || 0;
        var countText = count + ' question' + (count > 1 ? 's' : '');
        var queryHtml = item.searchTopic ? '<span class="qcm-explore-item-query">' + escapeHtml(item.searchTopic) + '</span>' : '';
        return '<button type="button" class="qcm-explore-item" data-slot="' + escapeHtml(item.slot) + '" data-quiz-date="' + escapeHtml(item.quizDate) + '"' + (already ? ' disabled' : '') + '>' +
          '<span class="qcm-explore-item-label">' + escapeHtml(item.label) + '<span class="qcm-explore-item-count">' + escapeHtml(countText) + '</span>' + queryHtml + '</span>' +
          '<span class="qcm-explore-item-meta">' + escapeHtml(metaText) + '</span>' +
        '</button>';
      }).join('');
      listEl.querySelectorAll('.qcm-explore-item:not(:disabled)').forEach(function (itemBtn) {
        itemBtn.addEventListener('click', function () {
          adoptExploreItem(itemBtn.getAttribute('data-slot'), itemBtn.getAttribute('data-quiz-date'), itemBtn);
        });
