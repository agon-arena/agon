<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <script src="/no-zoom.js?v=20260603" defer></script>
  <title>Apprentissage | agôn</title>
  <link rel="icon" type="image/png" href="/favicon-64.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icon-192-optimized.png">
  <meta name="theme-color" content="#243038">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Agôn">
  <link rel="stylesheet" href="/style.min.css?v=20260812-notion-level-picker-layout">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;700&display=swap">
  <link rel="stylesheet" href="/vendor/fontawesome/css/all.min.css">
  <script>
    if (window.self !== window.top) document.documentElement.classList.add('in-iframe');
    document.addEventListener('DOMContentLoaded', function(){
      if (window.self !== window.top) {
        document.body.classList.add('in-iframe');
      }
    });
  </script>
  <style>
    /* Garde-fou (bug constaté le 13/08/2026) : l'attribut hidden est ignoré
       dès qu'un élément porte une classe qui fixe elle-même son display
       (ex. .qcm-options { display:flex }, .qcm-next-btn.visible { display:
       block }) — même spécificité CSS que la règle native [hidden]{display:
       none}, donc la classe posée après dans la feuille de style l'emporte.
       Résultat concret : le bouton "Réfléchis à ta réponse" affichait les
       propositions juste en dessous au lieu de les cacher tant qu'on n'a pas
       cliqué (cf. wireRevealGate). !important au lieu d'une règle par
       élément affecté : plus sûr contre un futur cas similaire. */
    [hidden] {
      display: none !important;
    }
    /* Même bleu-gris foncé que le bandeau des bulles sur l'accueil (#243038).
       Posé à la fois sur html et body : html a déjà ce fond par défaut (cf.
       style.css ligne ~14068), mais sans hauteur de body qui couvre tout le
       viewport, une bande plus claire pouvait apparaître sous une carte courte. */
    html,
    html:has(body.page-qcm-du-jour) {
      background-color: #243038;
    }
    body.page-qcm-du-jour {
      min-height: 100vh;
      background-color: #243038;
    }
    /* html.in-iframe (pas body.in-iframe) : la classe est posée sur
       <html> de façon synchrone dès l'exécution de ce script (ligne ~21),
       avant même que <body> existe — alors que body.in-iframe n'est ajoutée
       qu'au DOMContentLoaded. Un sélecteur basé sur body.in-iframe faisait
       donc d'abord peindre le cadre avec les règles "hors iframe" (marge du
       haut bien plus grande, cf. .qcm-page-shell plus bas), qui ne se
       corrigeait qu'après coup — un saut visible du cadre vers le haut au
       chargement (constaté le 04/08/2026). */
    html.in-iframe body.page-qcm-du-jour {
      box-sizing: border-box;
      padding-bottom: 360px;
    }
    body.page-qcm-du-jour .topbar-inner {
      justify-content: center !important;
      padding: 2px 0 !important;
    }
    body.page-qcm-du-jour .home-brand-block {
      flex: 0 0 auto !important;
      margin-left: 0 !important;
    }
    body.page-qcm-du-jour .home-logo {
      width: 116px !important;
      transform: translateY(2px) !important;
    }
    body.page-qcm-du-jour .topbar > .agon-user-score-row,
    body.page-qcm-du-jour .topbar-inner > :not(.home-brand-block),
    body.page-qcm-du-jour .home-brand-block > :not(.home-brand-main) {
      display: none !important;
    }
    @media (max-width: 768px) {
      body.page-qcm-du-jour .home-logo {
        width: 74px !important;
      }
      body.page-qcm-du-jour .topbar-inner {
        padding: 0 !important;
      }
    }
    .qcm-page-shell {
      width: min(100% - 32px, 900px);
      margin: 112px auto 180px;
    }
    html.in-iframe .page-qcm-du-jour .qcm-page-shell {
      margin: 4px auto 0;
    }
    /* Doit rester APRÈS la règle ci-dessus (même sélecteur, donc même
       spécificité) : un margin-bottom placé avant un margin raccourci
       équivalent serait écrasé par lui, peu importe le media query. */
    @media (max-width: 768px) {
      /* Vraie zone scrollable en bas, sans pseudo-bandeau ajouté au DOM. */
      html.in-iframe body.page-qcm-du-jour {
        padding-bottom: clamp(360px, 42vh, 520px);
      }
    }
    @media (min-width: 769px) {
      .qcm-page-shell {
        width: min(100% - 64px, 1200px);
      }
    }
    .qcm-panel,
    .qcm-panel * {
      box-sizing: border-box;
    }
    .qcm-panel {
      position: relative;
      width: 100%;
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 24px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.18);
      font-family: Arial, Helvetica, sans-serif;
    }
    .qcm-panel h1 {
      margin: 0 0 4px;
      font-family: "Barlow Condensed", Arial, sans-serif;
      font-size: 34px;
      line-height: 1;
      color: #111827;
      text-align: center;
    }
    .qcm-panel .qcm-subtitle {
      margin: 0 0 16px;
      color: #6b7280;
      font-size: 14px;
      text-align: center;
    }
    .qcm-slot-switcher {
      display: none;
      justify-content: center;
      gap: 8px;
      margin: 0 0 20px;
    }
    .qcm-slot-switcher.visible {
      display: flex;
    }
    .qcm-slot-btn {
      padding: 6px 14px;
      border: 1px solid #d1d5db;
      border-radius: 999px;
      background: #f9fafb;
      color: #4b5563;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }
    .qcm-slot-btn.active {
      border-color: #243038;
      background: #243038;
      color: #ffffff;
    }
    .qcm-slot-btn.qcm-learning-back-btn {
      border-color: #516776;
      background: #ffffff;
      color: #243038;
    }
    /* Catégorie sans créneau prêt (ex. QCM actu/Culture générale pas encore
       généré) : visible pour montrer la mise en page normale plutôt que de
       la faire disparaître ou de rediriger automatiquement ailleurs, mais
       non cliquable. */
    .qcm-slot-btn:disabled {
      border-color: #e5e7eb;
      background: #f3f4f6;
      color: #9ca3af;
      cursor: not-allowed;
    }
    .qcm-custom-search {
      display: none;
      gap: 8px;
      margin: 0 0 20px;
    }
    .qcm-custom-search.visible {
      display: flex;
    }
    .qcm-custom-search-input {
      flex: 1;
      min-width: 0;
      /* <textarea> plutôt qu'un <input> à une seule ligne (cf. 12/08/2026) :
         un placeholder/sujet trop long pour la largeur du champ passait à la
         ligne suivante au lieu de rester lisible en entier — jamais de
         coupure ni d'ellipsis, la hauteur s'adapte plutôt que le texte. */
      min-height: 56px;
      padding: 10px 14px;
      border: 1px solid #d1d5db;
      border-radius: 18px;
      background: #f9fafb;
      color: #1f2937;
      font-size: 14px;
      font-family: inherit;
      line-height: 1.4;
      resize: none;
    }
    .qcm-custom-search-input:focus {
      outline: none;
      border-color: #516776;
      background: #ffffff;
    }
    .qcm-custom-search-btn {
      flex-shrink: 0;
      padding: 10px 16px;
      border: none;
      border-radius: 999px;
      background: #243038;
      color: #ffffff;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }
    .qcm-custom-search-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .qcm-custom-search-status {
      margin: -8px 0 20px;
      font-size: 13px;
      color: #6b7280;
      text-align: center;
    }
    .qcm-custom-search-status.is-error {
      color: #d64545;
    }
    @media (max-width: 480px) {
      .qcm-custom-search {
        flex-direction: column;
      }
      .qcm-custom-search-btn {
        width: 100%;
      }
    }
    .qcm-progress {
      margin: 0 0 16px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #516776;
    }
    .qcm-question {
      margin: 0 0 18px;
      font-size: 19px;
      font-weight: 600;
      color: #111827;
      line-height: 1.3;
    }
    .qcm-options {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .qcm-option-btn {
      position: relative;
      display: block;
      width: 100%;
      text-align: left;
      padding: 12px 14px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      background: #f9fafb;
      color: #1f2937;
      font-size: 15px;
      cursor: pointer;
      overflow: hidden;
      transition: border-color 0.15s ease, background 0.15s ease;
    }
    .qcm-option-btn:hover:not(:disabled) {
      border-color: #516776;
      background: #eef3f6;
    }
    .qcm-option-btn:disabled {
      cursor: default;
    }
    .qcm-option-btn.is-selected:not(:disabled) {
      border-color: #516776;
      background: #eef3f6;
      box-shadow: 0 0 0 2px rgba(81, 103, 118, 0.2);
    }
    .qcm-option-fill {
      position: absolute;
      inset: 0;
      width: 0%;
      background: rgba(81, 103, 118, 0.14);
      transition: width 0.4s ease;
      z-index: 0;
    }
    .qcm-option-label,
    .qcm-option-pct {
      position: relative;
      z-index: 1;
    }
    .qcm-option-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .qcm-option-pct {
      display: none;
      font-size: 13px;
      font-weight: 700;
      color: #516776;
      white-space: nowrap;
    }
    .qcm-option-btn.answered .qcm-option-pct {
      display: inline;
    }
    .qcm-option-btn.is-correct {
      border-color: #1f9d55;
      background: #f0fdf4;
    }
    .qcm-option-btn.is-correct .qcm-option-fill {
      background: rgba(31, 157, 85, 0.16);
    }
    .qcm-option-btn.is-wrong-picked {
      border-color: #d64545;
      background: #fef2f2;
    }
    .qcm-option-btn.is-wrong-picked .qcm-option-fill {
      background: rgba(214, 69, 69, 0.16);
    }
    .qcm-feedback {
      display: none;
      margin-top: 14px;
      padding: 12px 14px;
      border-radius: 8px;
      background: #f3f4f6;
      color: #374151;
      font-size: 14px;
      line-height: 1.4;
      text-align: center;
    }
    .qcm-feedback.visible {
      display: block;
    }
    .qcm-feedback .qcm-feedback-verdict {
      display: block;
      margin-bottom: 4px;
      font-weight: 700;
    }
    .qcm-feedback.is-correct .qcm-feedback-verdict { color: #1f9d55; }
    .qcm-feedback.is-wrong .qcm-feedback-verdict { color: #d64545; }
    .qcm-next-btn {
      display: none;
      margin: 16px auto 0;
      padding: 10px 18px;
      border: none;
      border-radius: 999px;
      background: #243038;
      color: #ffffff;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
    }
    .qcm-next-btn.visible {
      display: block;
    }
    .qcm-next-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }
    .qcm-final-actions {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 16px;
    }
    .qcm-final-actions .qcm-next-btn {
      margin: 0;
    }
    .qcm-state-message {
      color: #6b7280;
      font-size: 15px;
      line-height: 1.4;
    }
    .qcm-loading-hourglass {
      display: inline-block;
      width: 28px;
      height: 28px;
      margin-right: 7px;
      vertical-align: middle;
      object-fit: contain;
      animation: qcmHourglassSpin 0.9s linear infinite;
    }
    @keyframes qcmHourglassSpin { to { transform: rotate(360deg); } }
    .qcm-final-score {
      text-align: center;
      padding: 8px 0;
    }
    .qcm-final-score i {
      font-size: 32px;
      color: #f5b642;
      margin-bottom: 10px;
    }
    .qcm-final-score .qcm-final-score-value {
      font-family: "Barlow Condensed", Arial, sans-serif;
      font-size: 40px;
      color: #111827;
      line-height: 1;
      margin: 4px 0 6px;
    }
    .qcm-final-score .qcm-final-score-label {
      color: #6b7280;
      font-size: 14px;
    }
    .qcm-final-score-hint {
      margin: 14px auto 0;
      max-width: 420px;
      padding: 10px 14px;
      border-radius: 8px;
      background: #f3f4f6;
      color: #4b5563;
      font-size: 13px;
      line-height: 1.4;
    }
    /* Progression vers la mémorisation durable (4 bonnes réponses à
       intervalles croissants — 3j/7j/1mois, cf. server.js
       DAILY_QUIZ_ACQUIS_VALIDATION_STREAK), affichée sur "Mes apprentissages"
       (cf. renderMesQcmList) : une pastille "n / 4" tant que ce n'est pas
       acquis, un badge vert une fois validé. */
    .qcm-acquis-badge {
      flex: 0 0 auto;
      padding: 2px 9px;
      border-radius: 999px;
      background: #eef3f6;
      color: #516776;
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }
    .qcm-acquis-badge.is-validated {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: #1f9d55;
      color: #ffffff;
    }
    .qcm-acquis-badge.is-validated i {
      font-size: 11px;
    }
    /* Onglet "Mes QCM" : regroupé par thématique (cf. renderMesQcmList),
       une vraie rubrique titrée par thématique plutôt qu'un simple tableau
       plat — une connaissance à plusieurs thématiques apparaît sous
       chacune. */
    .qcm-mesqcm-group + .qcm-mesqcm-group {
      margin-top: 22px;
    }
    .qcm-mesqcm-group-title {
      margin: 0 0 6px;
      padding: 0 4px 8px;
      border-bottom: 2px solid #e5e7eb;
      font-family: "Barlow Condensed", Arial, sans-serif;
      font-size: 20px;
      font-weight: 700;
      color: #111827;
    }
    .qcm-mesqcm-group--pending > .qcm-mesqcm-group-title,
    .qcm-mesqcm-group--all > .qcm-mesqcm-group-title {
      color: #7c4a12;
      border-bottom-color: #f1cf98;
    }
    .qcm-mesqcm-theme-group + .qcm-mesqcm-theme-group {
      margin-top: 10px;
    }
    .qcm-mesqcm-theme-group {
      overflow: hidden;
      border: 1px solid #d9dfe3;
      border-radius: 12px;
      background: #ffffff;
    }
    .qcm-mesqcm-theme-toggle {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      margin: 0;
      padding: 13px 14px;
      border: none;
      background: #f7f9fa;
      color: #111827;
      font: inherit;
      font-family: "Barlow Condensed", Arial, sans-serif;
      font-size: 20px;
      font-weight: 700;
      text-align: left;
      cursor: pointer;
    }
    .qcm-mesqcm-theme-toggle:hover,
    .qcm-mesqcm-theme-toggle:focus-visible,
    .qcm-mesqcm-theme-group.is-open .qcm-mesqcm-theme-toggle {
      background: #eef3f6;
    }
    .qcm-mesqcm-theme-group.is-open .qcm-mesqcm-theme-toggle {
      border-bottom: 1px solid #d9dfe3;
    }
    .qcm-mesqcm-theme-count {
      flex: 0 0 auto;
      padding: 1px 8px;
      border-radius: 999px;
      background: #eef3f6;
      color: #516776;
      font-family: Arial, sans-serif;
      font-size: 12px;
      font-weight: 700;
    }
    .qcm-mesqcm-theme-chevron {
      flex: 0 0 auto;
      margin-left: auto;
      color: #9ca3af;
      font-size: 14px;
      transition: transform 0.15s ease;
    }
    .qcm-mesqcm-theme-action {
      flex: 0 0 auto;
      margin-left: auto;
      min-width: 62px;
      color: #6b7280;
      font-family: Arial, sans-serif;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      text-align: right;
    }
    .qcm-mesqcm-theme-action-open {
      display: none;
    }
    .qcm-mesqcm-theme-group.is-open .qcm-mesqcm-theme-action-open {
      display: inline;
    }
    .qcm-mesqcm-theme-group.is-open .qcm-mesqcm-theme-chevron {
      transform: rotate(90deg);
    }
    .qcm-mesqcm-theme-panel {
      display: none;
      padding: 14px 10px 10px;
    }
    .qcm-mesqcm-theme-group.is-open .qcm-mesqcm-theme-panel {
      display: block;
    }
    .qcm-mesqcm-theme-collapse {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
      margin-top: 16px;
      padding: 8px 0 0;
      border: none;
      background: none;
      color: #6b7280;
      font: inherit;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.02em;
      cursor: pointer;
    }
    .qcm-mesqcm-theme-collapse:hover,
    .qcm-mesqcm-theme-collapse:focus-visible {
      color: #243038;
    }
    .qcm-mesqcm-pagination {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-top: 14px;
    }
    .qcm-mesqcm-pagination-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 34px;
      height: 34px;
      padding: 0;
      border: 1px solid #d1d5db;
      border-radius: 50%;
      background: #ffffff;
      color: #243038;
      font-size: 13px;
      cursor: pointer;
    }
    .qcm-mesqcm-pagination-btn:disabled {
      color: #c4c9ce;
      border-color: #eceff1;
      cursor: default;
    }
    .qcm-mesqcm-pagination-label {
      min-width: 54px;
      color: #516776;
      font-size: 13px;
      font-weight: 700;
      text-align: center;
    }
    .qcm-mesqcm-paged-list {
      scroll-margin-top: 90px;
    }
    /* Tableau à l'intérieur de chaque rubrique — nom (ouvre/poursuit le
       QCM), progression "n / 4" vers la mémorisation durable, accès à la
       fiche de révision. overflow-x:auto sur le conteneur, jamais sur le
       panneau entier, pour rester utilisable sur mobile sans casser la mise
       en page du reste de la page. */
    .qcm-mesqcm-table-shell {
      position: relative;
      overflow: hidden;
    }
    .qcm-mesqcm-table-wrap {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-x: contain;
      scrollbar-width: thin;
    }
    /* Le dégradé rend visibles les colonnes situées hors écran. Il disparaît
       dès que le tableau est arrivé à son extrémité droite, puis réapparaît
       si l'utilisateur revient. */
    .qcm-mesqcm-table-scroll-hint {
      position: absolute;
      z-index: 4;
      top: 0;
      right: 0;
      bottom: 0;
      width: 48px;
      box-sizing: border-box;
      background: linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,0.88) 52%, #ffffff 82%);
      pointer-events: none;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.18s ease, visibility 0.18s ease;
    }
    .qcm-mesqcm-table-shell.has-right-overflow .qcm-mesqcm-table-scroll-hint {
      opacity: 1;
      visibility: visible;
    }
    .qcm-mesqcm-table-shell.has-left-overflow::before {
      content: '';
      position: absolute;
      z-index: 3;
      top: 0;
      bottom: 0;
      left: 0;
      width: 16px;
      background: linear-gradient(90deg, rgba(36,48,56,0.16), rgba(36,48,56,0));
      pointer-events: none;
    }
    .qcm-mesqcm-table {
      width: 100%;
      border-collapse: collapse;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 14px;
    }
    .qcm-mesqcm-td-check {
      width: 32px;
      padding-right: 0;
    }
    .qcm-mesqcm-row-checkbox,
    #qcm-mesqcm-select-all {
      width: 17px;
      height: 17px;
      cursor: pointer;
    }
    .qcm-mesqcm-bulk-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      margin: 0 0 14px;
      padding: 10px 14px;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      background: #f9fafb;
    }
    .qcm-mesqcm-bulk-selectall {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 700;
      color: #374151;
      cursor: pointer;
    }
    .qcm-mesqcm-bulk-delete-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      border: 1px solid #dc2626;
      border-radius: 999px;
      background: #ffffff;
      color: #dc2626;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }
    .qcm-mesqcm-bulk-delete-btn:hover:not(:disabled) {
      background: #fef2f2;
    }
    .qcm-mesqcm-bulk-delete-btn:disabled {

    }
    .qcm-mesqcm-table th {
      padding: 8px 10px;
      border-bottom: 1px solid #d1d5db;
      color: #6b7280;
      font-size: 12px;
      font-weight: 700;
      text-align: left;
      white-space: nowrap;
    }
    .qcm-mesqcm-state {
      display: inline-block;
      padding: 5px 9px;
      border-radius: 999px;
      background: #f3f4f6;
      color: #6b7280;
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }
    .qcm-mesqcm-state.is-realized {
      background: #dcfce7;
      color: #166534;
    }
    .qcm-mesqcm-name-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0;
      border: none;
      background: none;
      font: inherit;
      color: #111827;
      text-align: left;
      cursor: pointer;
    }
    .qcm-mesqcm-name-btn:hover {
      color: #243038;
      text-decoration: underline;
    }
    .qcm-mesqcm-name-btn i {
      flex: 0 0 auto;
      color: #516776;
    }
    /* Fenêtre de choix ouverte au clic sur le nom d'un apprentissage (cf.
       openMesQcmActionMenu) : "Consulter la fiche", "Faire/refaire le QCM"
       ou "Supprimer". Une vraie fenêtre modale centrée (.qcm-fiche-overlay/
       .qcm-fiche-modal, même gabarit que la fiche elle-même) plutôt qu'un
       petit menu ancré sous le bouton (demande du 13/08/2026 : "trop petit,
       on dirait un menu") — .qcm-mesqcm-action-menu-item/-info ci-dessous
       restent utilisées à l'intérieur de cette fenêtre. */
    .qcm-mesqcm-action-modal-name {
      margin: 0 0 12px;
      font-size: 17px;
      font-weight: 800;
      color: #111827;
    }
    /* Taux d'ancrage (demande du 13/08/2026) : rappelé en tête de la fenêtre
       de choix plutôt que seulement dans la colonne du tableau, désormais
       cachée derrière ce popup pour Fiche/QCM/Supprimer. */
    .qcm-mesqcm-action-menu-info {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 6px 12px 10px;
      margin-bottom: 4px;
      border-bottom: 1px solid #eef1f3;
      font-size: 13px;
      font-weight: 700;
      color: #6b7280;
    }
    .qcm-mesqcm-action-menu-item {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 10px 12px;
      border: none;
      border-radius: 8px;
      background: none;
      font: inherit;
      font-size: 14px;
      font-weight: 600;
      color: #111827;
      text-align: left;
      cursor: pointer;
    }
    .qcm-mesqcm-action-menu-item:hover,
    .qcm-mesqcm-action-menu-item:focus-visible {
      background: #f3f4f6;
    }
    .qcm-mesqcm-action-menu-item i {
      flex: 0 0 auto;
      width: 18px;
      text-align: center;
      color: #516776;
    }
    .qcm-mesqcm-action-menu-item-danger {
      color: #dc2626;
    }
    .qcm-mesqcm-action-menu-item-danger i {
      color: #dc2626;
    }
    .qcm-mesqcm-action-menu-item-danger:hover,
    .qcm-mesqcm-action-menu-item-danger:focus-visible {
      background: #fef2f2;
    }
    /* Retrait d'un apprentissage (cf. server.js POST
       /api/users/notion-quizzes/remove) — ne supprime que la ligne
       personnelle du visiteur, jamais le QCM partagé. Confirmation native
       (window.confirm) avant l'appel, même convention que les autres
       suppressions du site (cf. deleteDebate, deleteReport). */
    .qcm-mesqcm-delete-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      padding: 0;
      border: 1px solid #d1d5db;
      border-radius: 999px;
      background: #f9fafb;
      color: #6b7280;
      font-size: 13px;
      cursor: pointer;
    }
    .qcm-mesqcm-delete-btn:hover {
      background: #fef2f2;
      border-color: #dc2626;
      color: #dc2626;
    }
    /* Pastilles de thématiques (cf. renderThemeTags, server.js
       classifyCultureGeneraleThemesWithAI) — sous le nom dans le tableau
       "Mes QCM", sous le nom dans la fiche (cf. buildFicheModalHtml). */
    .qcm-mesqcm-themes {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin: 4px 0 0 24px;
    }
    .qcm-fiche-name + .qcm-mesqcm-themes {
      margin: 0 0 10px;
    }
    .qcm-mesqcm-theme-tag {
      padding: 2px 9px;
      border-radius: 999px;
      background: #eef3f6;
      color: #516776;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
    }
    /* "Les liens" (cf. renderLinksSection, server.js
       findAndStoreCultureGeneraleNotionLink) — connaissances déjà apprises
       reliées à celle-ci dans la fiche, cliquables pour ouvrir la fiche liée. */
    .qcm-fiche-links {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin: 0 0 14px;
    }
    .qcm-fiche-link-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border: 1px solid #e2e8ec;
      border-radius: 10px;
      background: #f8fafb;
      font-family: Arial, Helvetica, sans-serif;
      text-align: left;
      cursor: pointer;
    }
    .qcm-fiche-link-item:hover {
      border-color: #a8bcc7;
      background: #eef3f6;
    }
    .qcm-fiche-link-label {
      flex: none;
      padding: 2px 9px;
      border-radius: 999px;
      background: #dde8ee;
      color: #34505f;
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
    }
    .qcm-fiche-link-name {
      font-size: 14px;
      font-weight: 700;
      color: #1f2d33;
    }
    /* Corrigé des questions dans la fiche "Mes QCM" (cf.
       renderFicheQuestionCorrige) — lecture seule, jamais interactif : la
       bonne réponse est directement mise en évidence, contrairement au vrai
       QCM où elle n'est révélée qu'après réponse. */
    .qcm-fiche-corrige-item {
      margin-top: 18px;
      padding-top: 14px;
      border-top: 1px solid #eef1f3;
    }
    .qcm-fiche-corrige-num {
      margin: 0 0 4px;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      color: #9ca3af;
    }
    .qcm-fiche-corrige-question {
      margin: 0 0 8px;
      font-size: 15px;
      font-weight: 600;
      color: #111827;
      line-height: 1.35;
    }
    .qcm-fiche-corrige-list {
      margin: 0 0 8px;
      padding: 0;
      list-style: none;
    }
    .qcm-fiche-corrige-list li {
      padding: 7px 10px;
      margin-bottom: 5px;
      border: 1px solid #e5e7eb;
      border-radius: 6px;
      background: #f9fafb;
      color: #4b5563;
      font-size: 14px;
    }
    .qcm-fiche-corrige-list.qcm-fiche-corrige-ordered {
      list-style: decimal;
      padding-left: 20px;
    }
    .qcm-fiche-corrige-list.qcm-fiche-corrige-ordered li {
      padding: 2px 0;
      margin-bottom: 2px;
      border: none;
      background: none;
    }
    .qcm-fiche-corrige-list li.is-correct {
      border-color: #1f9d55;
      background: #f0fdf4;
      color: #166534;
      font-weight: 600;
    }
    .qcm-fiche-corrige-explanation {
      margin: 0;
      font-size: 13px;
      color: #6b7280;
      line-height: 1.4;
    }
    /* Fiche ouverte depuis "Mes apprentissages" : nom + détail pur du
       concept/mécanisme/citation/œuvre, même esprit que les cartes Éclairages
       sans reprendre leur mise en page riche (sources) ni tout ce qui relie
       l'élément à l'actualité du jour (déjà exclu côté serveur). L'image du
       concept/mécanisme/auteur/œuvre (sourceDetail.image), quand elle
       existe, est en revanche reprise telle quelle. */
    .qcm-fiche-overlay {
      position: fixed;
      inset: 0;
      z-index: 1000;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      /* max(20px, safe-area) plutôt qu'un padding fixe : en PWA standalone
         (encoche/île dynamique), un padding-top de 20px seul ne suffit pas à
         dégager la zone sûre — la croix de fermeture en haut de la fiche
         (.qcm-fiche-close) pouvait se retrouver sous le statut/l'encoche,
         invisible ou impossible à toucher. */
      padding: max(20px, env(safe-area-inset-top)) 20px max(20px, env(safe-area-inset-bottom));
      background: rgba(17, 24, 39, 0.55);
    }
    /* .scroll-fade-hint (générique, cf. style.css) est position:absolute —
       correct pour ses autres usages (imbriqué dans un cadre non-scrollable),
       mais pas ici où le parent scrollable EST l'élément position:fixed
       (.qcm-fiche-overlay) : sur iOS Safari un enfant absolute d'un tel
       parent ne reste pas fiablement épinglé pendant le défilement. Posé en
       position:fixed direct sur <body> à la place (cf. openMesQcmFiche), et
       recalé ici en largeur sur la fiche (max-width identique à
       .qcm-fiche-modal) — sinon le dégradé pleine largeur déborde des bords
       d'une fiche centrée plus étroite que l'écran.
       "bottom" décalé de env(safe-area-inset-bottom) plutôt que collé à 0 :
       en PWA standalone sur certains iPhones (X/XS/11/11 Pro), le compositeur
       WebKit ne peint rien dans les ~44 derniers px du bas de l'écran (limite
       matérielle déjà documentée, aucune technique CSS ne peint dans cette
       zone) — un élément à bottom:0 y devient invisible/coupé. Le décaler de
       la valeur fiable de la zone sûre (déjà utilisée par le dock flottant du
       site pour la même raison) le sort de cette zone morte. */
    /* bottom = exactement env(safe-area-inset-bottom), sans marge de confort
       supplémentaire : d'après le diagnostic déjà mené sur ces appareils
       (memory standalone-bottom-band-abandoned), le dock flottant du site est
       "déjà au plus bas affichable" à cette valeur précise — descendre
       davantage retomberait dans la zone que WebKit ne peint jamais en
       standalone. */
    .qcm-fiche-fade-hint {
      position: fixed;
      bottom: var(--agon-safe-bottom, env(safe-area-inset-bottom, 0px));
      max-width: 480px;
      margin: 0 auto;
      z-index: 1001;
    }
    /* Centré sur min-height:100% (pas plus, sinon la fiche est centrée dans
       un cadre plus grand que l'écran et apparaît trop basse). Le débattement
       de scroll vers le bas vient du spacer .qcm-fiche-scroll-spacer placé
       APRÈS la fiche dans la colonne : il pousse le groupe (fiche + spacer)
       vers le haut à la centration, sans jamais faire descendre la fiche.
       Seul .qcm-fiche-overlay scrolle (cf. .qcm-fiche-modal plus bas, sans
       son propre overflow) : deux zones de scroll imbriquées se disputaient
       le geste tactile sur mobile et empêchaient d'atteindre le bas d'une
       fiche longue. */
    .qcm-fiche-overlay-inner {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100%;
    }
    .qcm-fiche-scroll-spacer {
      flex: 0 0 auto;
      width: 100%;
      height: 20px;
      pointer-events: none;
    }
    .qcm-fiche-modal {
      width: 100%;
      max-width: 480px;
      padding: 20px;
      border-radius: 12px;
      background: #ffffff;
      box-shadow: 0 20px 45px rgba(17, 24, 39, 0.25);
    }
    .qcm-fiche-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }
    .qcm-fiche-rubric {
      display: flex;
      align-items: center;
      gap: 6px;
      margin: 0;
      font-size: 13px;
      font-weight: 700;
      color: #516776;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }
    /* position:fixed (pas un simple élément du flux dans .qcm-fiche-head) :
       la croix doit rester visible en haut à droite même en scrollant une
       fiche longue (demande du 13/08/2026) — .qcm-fiche-overlay est le
       conteneur qui scrolle (position:fixed + overflow-y:auto), un enfant du
       flux normal défile avec le reste de la carte. Retiré du flux par
       position:fixed, .qcm-fiche-head n'a donc plus qu'à afficher le libellé
       de rubrique (justify-content:space-between sans second élément reste
       sans effet visuel). Même principe que #debate-iframe-modal-close
       ailleurs sur le site (déjà position:fixed avec succès) — contrairement
       à .qcm-fiche-fade-hint plus haut, aucun souci connu ici : c'est
       position:absolute spécifiquement qui ne reste pas épinglé sur iOS
       Safari dans ce type de conteneur, pas position:fixed. */
    .qcm-fiche-close {
      position: fixed;
      top: max(20px, env(safe-area-inset-top));
      right: 20px;
      z-index: 1002;
      flex: 0 0 auto;
      width: 28px;
      height: 28px;
      border: none;
      border-radius: 999px;
      background: #eef3f6;
      color: #243038;
      font-size: 14px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(17, 24, 39, 0.18);
    }
    .qcm-fiche-name {
      margin: 0 0 4px;
      font-size: 18px;
      font-weight: 700;
      color: #111827;
      line-height: 1.3;
    }
    .qcm-fiche-meta {
      margin: 0 0 12px;
      font-size: 13px;
      font-weight: 600;
      color: #516776;
    }
    .qcm-fiche-image {
      margin: 0 auto 14px;
      max-width: 280px;
    }
    .qcm-fiche-image img {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 8px;
      border: 1px solid #e5e7eb;
    }
    .qcm-fiche-image figcaption {
      margin-top: 4px;
      font-size: 11px;
      color: #9ca3af;
      text-align: right;
    }
    .qcm-fiche-image figcaption a {
      color: #9ca3af;
    }
    .qcm-fiche-section-label {
      margin: 14px 0 4px;
      font-size: 13px;
      font-weight: 700;
      color: #243038;
      text-transform: uppercase;
      letter-spacing: 0.02em;
    }
    .qcm-fiche-explanation {
      margin: 0 0 4px;
      font-size: 14px;
      color: #4b5563;
      line-height: 1.5;
    }
    .qcm-fiche-explanation:first-of-type {
      margin-top: 0;
    }
    .qcm-fiche-bottom-close {
      display: block;
      width: 100%;
      margin: 18px 0 0;
      padding: 11px 16px;
      border: 1px solid #d7dde2;
      border-radius: 10px;
      background: #f3f6f4;
      color: #1f2933;
      font: inherit;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease;
    }
    .qcm-fiche-bottom-close:hover {
      background: #e9efec;
      border-color: #c6d0d8;
    }
    /* Badge cosmétique au-dessus de la question pour les formats
       vrai_faux/texte_a_trous : rend la variété de formats visible sans
       toucher au reste de la mise en page. */
    .qcm-type-badge {
      display: inline-block;
      margin: 0 0 8px;
      padding: 3px 10px;
      border-radius: 999px;
      background: #eef3f6;
      color: #243038;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }
    /* Badge d'origine (actu / culture générale) : distingue une question
       actualité d'une question culture générale une fois mélangées dans la
       même session (cf. fusion QCM actu + Culture Générale) — seules ces
       dernières alimentent Mon univers. */
    .qcm-origin-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      margin: 0 6px 8px 0;
      padding: 3px 10px;
      border-radius: 999px;
      background: #e9f1fb;
      color: #1e3a5f;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.02em;
    }
    /* Bouton "Ne plus me la demander" (cf. wireExcludeButton) : discret,
       même gabarit pilule que les badges voisins mais cliquable — exclut la
       question courante des futures repasses ("Renforcement"), jamais de la
       session en cours. */
    .qcm-exclude-btn {
      display: inline-block;
      float: right;
      margin: 0 0 8px;
      padding: 3px 10px;
      border: 1px solid #dbe2e7;
      border-radius: 999px;
      background: #ffffff;
      color: #7a8792;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.02em;
      cursor: pointer;
    }
    .qcm-exclude-btn:hover {
      border-color: #b8c2ca;
      color: #516776;
    }
    .qcm-exclude-btn:disabled {
      opacity: 0.6;
      cursor: default;
    }
    /* Marqueur "___" d'une question texte_a_trous, mis en valeur dans le
       texte de la question — jamais introduit avant l'échappement HTML
       (cf. renderChoiceQuestion), donc toujours sûr à afficher. */
    .qcm-blank {
      display: inline-block;
      min-width: 46px;
      padding: 0 4px;
      border-bottom: 2px solid #516776;
      color: #516776;
      font-weight: 700;
      text-align: center;
    }
    .qcm-assoc-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }
    .qcm-assoc-left {
      flex: 1 1 auto;
      padding: 10px 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      background: #f9fafb;
      color: #1f2937;
      font-size: 14px;
    }
    .qcm-assoc-select {
      flex: 1 1 auto;
      padding: 10px 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      background: #ffffff;
      color: #1f2937;
      font-size: 14px;
      cursor: pointer;
    }
    .qcm-assoc-select:disabled {
      cursor: default;
      opacity: 0.85;
    }
    .qcm-assoc-select.is-correct {
      border-color: #1f9d55;
      background: #f0fdf4;
      color: #166534;
    }
    .qcm-assoc-select.is-wrong {
      border-color: #d64545;
      background: #fef2f2;
      color: #991b1b;
    }
    .qcm-assoc-correct-hint {
      flex: 1 1 auto;
      font-size: 12px;
      color: #1f9d55;
    }
    /* Format "qcm_multi" : boutons à bascule (coche visible une fois
       sélectionné), même gabarit que .qcm-option-btn mais sans la barre de
       remplissage (les stats agrégées ne représentent pas un choix par
       option ici, cf. commentaire côté serveur — pas de %). */
    .qcm-multi-hint {
      margin: -12px 0 14px;
      color: #6b7280;
      font-size: 13px;
    }
    .qcm-option-btn-multi .qcm-option-row {
      justify-content: flex-start;
      gap: 10px;
    }
    .qcm-option-check {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 20px;
      height: 20px;
      border: 1.5px solid #d1d5db;
      border-radius: 5px;
      background: #ffffff;
      color: transparent;
      font-size: 12px;
      transition: border-color 0.15s ease, background 0.15s ease, color 0.15s ease;
    }
    .qcm-option-btn-multi.is-selected .qcm-option-check {
      border-color: #243038;
      background: #243038;
      color: #ffffff;
    }
    .qcm-option-btn-multi.answered.is-correct .qcm-option-check {
      border-color: #1f9d55;
      background: #1f9d55;
      color: #ffffff;
    }
    .qcm-option-btn-multi.answered.is-wrong-picked .qcm-option-check {
      border-color: #d64545;
      background: #d64545;
      color: #ffffff;
    }
    /* Format "ordre" : deux zones — la séquence choisie (numérotée) et les
       éléments encore disponibles — plutôt qu'un glisser-déposer. */
    .qcm-order-hint {
      margin: -12px 0 14px;
      color: #6b7280;
      font-size: 13px;
    }
    .qcm-order-chosen {
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-height: 12px;
      margin-bottom: 14px;
    }
    .qcm-order-pool {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 4px;
    }
    .qcm-order-chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      background: #f9fafb;
      color: #1f2937;
      font-size: 14px;
      text-align: left;
      cursor: pointer;
    }
    .qcm-order-chip:disabled {
      cursor: default;
    }
    .qcm-order-chip-chosen {
      width: 100%;
      background: #eef3f6;
      border-color: #516776;
    }
    .qcm-order-chip-num {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 20px;
      height: 20px;
      border-radius: 999px;
      background: #243038;
      color: #ffffff;
      font-size: 12px;
      font-weight: 700;
    }
    .qcm-order-chip-static {
      cursor: default;
    }
    .qcm-order-correct-label {
      margin: 0 0 2px;
      color: #6b7280;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }
  </style>

<body class="page-qcm-du-jour">
<header class="topbar">
  <div class="container topbar-inner topbar-home">
    <div class="home-brand-block">
      <div class="home-brand-main">
        <img src="/logo.jpeg" alt="Logo agôn" class="home-logo">
      </div>
    </div>
  </div>
</header>
<main class="qcm-page-shell">
  <section class="qcm-panel" id="qcm-panel" aria-live="polite">
    <h1><span id="qcm-title-text">Mes apprentissages</span></h1>
    <p class="qcm-subtitle" id="qcm-subtitle-text"></p>
    <div class="qcm-slot-switcher" id="qcm-category-switcher"></div>
    <form class="qcm-custom-search" id="qcm-custom-search" hidden>
      <textarea id="qcm-custom-search-input" class="qcm-custom-search-input" maxlength="150" rows="2"
        placeholder="Tape un sujet à mémoriser (ex. la photosynthèse)"></textarea>
      <button type="submit" class="qcm-custom-search-btn" id="qcm-custom-search-btn">
        <i class="fa-solid fa-wand-magic-sparkles" aria-hidden="true"></i> Générer
      </button>
    </form>
    <p class="qcm-custom-search-status" id="qcm-custom-search-status" hidden></p>
    <!-- Contenu par défaut statique (pas posé par JS) : le cadre .qcm-panel est
         stylé (fond blanc, ombre, coins arrondis) dès le parsing du HTML, avant
         toute exécution de script — sans ce sablier déjà présent dans le HTML
         source, la toute première peinture de la page montrait un cadre vide
         (juste le fond blanc, sans texte ni sablier) pendant l'intervalle avant
         que le script inline ne s'exécute et n'y écrive le vrai message de
         chargement (signalé le 12/08/2026, capture d'écran à l'appui — le cadre
         masqué par le parent iframe pendant .loading n'empêche pas ce même
         cadre vide d'apparaître si CE masquage lui-même a un accroc). -->
    <div id="qcm-body"><p class="qcm-state-message"><img src="/sablier-96.png" alt="" class="qcm-loading-hourglass" aria-hidden="true">Chargement en cours…</p></div>
  </section>
</main>
<script src="/script.min.js?v=20260812-score-100-mute" defer></script>
<script>
(function () {
  var body = document.getElementById('qcm-body');
  var titleText = document.getElementById('qcm-title-text');
  var subtitleText = document.getElementById('qcm-subtitle-text');
  var categorySwitcher = document.getElementById('qcm-category-switcher');
  var customSearchForm = document.getElementById('qcm-custom-search');
  var customSearchInput = document.getElementById('qcm-custom-search-input');
  var customSearchBtn = document.getElementById('qcm-custom-search-btn');
  var customSearchStatus = document.getElementById('qcm-custom-search-status');
  var voterKey = null;
  var questions = [];
  var answeredByQuestionId = {};
  var currentIndex = 0;
  var currentSlot = null;
  var currentQuizDate = null;
  var currentCategory = null;
  var slotsStatus = null;
  // Jeton incrémenté à chaque loadSlot/loadMesQcm : les callbacks async de
  // ces fonctions (fetch imbriqués, parfois lents) vérifient qu'ils sont
  // toujours le dernier appel en date avant de toucher au DOM. Sans ça, un
  // changement d'onglet pendant qu'une requête est encore en vol (ex. clic
  // sur un autre onglet avant que /results ait répondu pour l'onglet
  // précédent) laisse la réponse tardive écraser l'écran affiché entre-temps
  // — cf. le "flash" de l'écran de fin de QCM historiquement signalé.
  var loadToken = 0;

  // Signale au parent (bandeau bleu + sablier "Chargement en cours",
  // cf. showDebateIframeParentLoadingOverlay dans script.js) que du contenu
  // réel est affiché — jamais au DOMContentLoaded, sans quoi le bandeau
  // disparaît avant la fin des fetch (Mes QCM / QCM demandé) et laisse
  // apparaître un flash vide le temps que ce script inline prenne le relais.
  var iframeReadySignaled = false;
  function signalIframeReady() {
    if (iframeReadySignaled) return;
    iframeReadySignaled = true;
    // En page autonome (lien direct, nouvel onglet, lancement PWA), il n'y a
    // pas de parent à qui poster ce message : on signale directement au voile
    // de la page elle-même (cf. markPageArrivalLoadingOverlayReady dans
    // script.js, désormais bloqué en attente explicite pour /apprentissage)
    // que le vrai contenu est affiché, au lieu de le laisser disparaître au
    // bout d'un délai générique déconnecté du fetch réel.
    if (window.self === window.top) {
      if (typeof markPageArrivalLoadingOverlayReady === 'function') markPageArrivalLoadingOverlayReady();
      return;
    }
    try {
      window.parent.postMessage({ type: 'agon:debate-iframe-ready', pathname: location.pathname, href: location.href }, '*');
    } catch (e) {}
  }

  // Deux onglets de haut niveau : "Mes apprentissages" (les notions choisies
  // au clic sur "Mémoriser" dans Éclairages/Ce jour dans l'Histoire —
  // chacune un QCM indépendant et nommé, cf. server.js buildNotionQuestions,
  // slot "notion:{sourceType}:{sourceId}" ; regroupe aussi la banque de
  // notions déjà bien répondues, ex-onglet "Mes acquis" retiré le
  // 10/08/2026 car redondant avec cette liste) et "Renforcement des
  // connaissances" (pseudo-slot "renforcement", cf. server.js
  // DAILY_QUIZ_REINFORCEMENT_SLOT : uniquement les repasses de répétition
  // espacée dues aujourd'hui).
  // "mesqcm" n'a pas de créneau à vérifier côté serveur : toujours visible
  // (cf. isCategoryAvailable), liste son propre contenu plutôt que de
  // charger un QCM directement — voir loadMesQcm ci-dessous.
  var CATEGORY_ORDER = ['mesqcm', 'renforcement'];
  var CATEGORY_LABELS = { mesqcm: 'Mes apprentissages', renforcement: 'Renforcement' };
  var QCM_SUBTITLE_BY_CATEGORY = {
    mesqcm: "Les QCM que tu as choisi de mémoriser sur Éclairages et Ce jour dans l'Histoire — chacun alimente Ma mémoire une fois réussi.",
    renforcement: "Les questions de culture générale déjà répondues reviennent ici pour valider tes acquis durablement (4 bonnes réponses à intervalles croissants). Ne compte pas pour le score Gnosis."
  };
  // Rubrique d'origine (sourceType, cf. server.js buildCultureGeneraleQuestionsForToday)
  // de chaque question de culture générale — mêmes icônes/libellés que la
  // page Éclairages et "Ce jour dans l'Histoire", réutilisées par "Mes
  // apprentissages" (cf. renderMesQcmList et consorts).
  var ACQUIS_SOURCE_TYPE_META = {
    histoire: { icon: 'fa-clock-rotate-left', label: "Ce jour dans l'Histoire" },
    parallele: { icon: 'fa-landmark', label: 'Parallèle historique' },
    pensee: { icon: 'fa-brain', label: 'Pensée philosophique' },
    mecanisme: { icon: 'fa-people-group', label: 'Mécanisme sociologique' },
    concept: { icon: 'fa-shapes', label: 'Concept du jour' },
    citation: { icon: 'fa-quote-left', label: 'Citation du jour' },
    oeuvre: { icon: 'fa-palette', label: "Œuvre d'art du jour" },
    latin: { icon: 'fa-scroll', label: 'Mot latin du jour' },
    custom: { icon: 'fa-magnifying-glass', label: 'Sujet recherché' }
  };
  // "mesqcm" n'a pas de créneau à vérifier : toujours affiché, son propre
  // état vide gère le cas "rien encore" (cf. renderMesQcmEmpty).
  // "renforcement" dépend du pseudo-slot du même nom, personnalisé par
  // visiteur (cf. server.js DAILY_QUIZ_REINFORCEMENT_SLOT) — disponible
  // seulement s'il y a au moins une repasse due aujourd'hui pour ce visiteur.
  function isCategoryAvailable(category) {
    if (category === 'mesqcm') return true;
    return !!(slotsStatus.slots.renforcement && slotsStatus.slots.renforcement.available);
  }

  // Toujours les 3 boutons, même quand un créneau n'a pas
  // encore de contenu prêt : grisés (disabled) plutôt que masqués ou
  // remplacés par une redirection automatique, pour que la mise en page
  // reste la même qu'une fois prêt.
  // Barre de recherche libre : visible uniquement sur la liste "Mes
  // apprentissages" (jamais pendant un QCM en cours ni sur "Renforcement"),
  // appelé depuis renderCategorySwitcher qui tourne exactement quand
  // currentCategory/currentSlot changent.
  function updateCustomSearchVisibility() {
    var visible = currentCategory === 'mesqcm' && !currentSlot;
    // .hidden (propriété DOM, retire vraiment l'attribut) en plus de la classe : depuis
    // l'ajout de [hidden]{display:none !important} (garde-fou du 13/08/2026 plus haut dans ce
    // fichier), l'attribut hidden posé sur ce <form> dans le HTML l'emportait sur
    // .qcm-custom-search.visible{display:flex} (non !important) — la barre restait invisible
    // en permanence malgré la classe correctement posée, seul l'attribut compte désormais.
    customSearchForm.hidden = !visible;
    customSearchForm.classList.toggle('visible', visible);
    if (!visible) customSearchStatus.hidden = true;
  }

  function renderCategorySwitcher() {
    updateCustomSearchVisibility();
    categorySwitcher.className = 'qcm-slot-switcher visible';
    categorySwitcher.innerHTML = '';
    CATEGORY_ORDER.forEach(function (category) {
      var available = isCategoryAvailable(category);
      var isLearningBack = category === 'mesqcm' && currentCategory === 'mesqcm' && !!currentSlot;
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'qcm-slot-btn' + (category === currentCategory && !isLearningBack ? ' active' : '') + (isLearningBack ? ' qcm-learning-back-btn' : '');
      btn.textContent = isLearningBack ? '← Mes apprentissages' : CATEGORY_LABELS[category];
      if (!available) {
        btn.disabled = true;
      } else {
        btn.addEventListener('click', function () {
          if (category === currentCategory && !isLearningBack) return;
          if (category === 'mesqcm') {
            if (isLearningBack) window.history.replaceState({}, '', window.location.pathname);
            loadMesQcm();
            return;
          }
          loadSlot('renforcement', null, null);
        });
      }
      categorySwitcher.appendChild(btn);
    });
  }

  function escapeHtml(str) {
    var div = document.createElement('div');
    div.textContent = String(str == null ? '' : str);
    return div.innerHTML;
  }

  function renderMessage(text) {
    var isLoading = /^Chargement\b/i.test(String(text || ''));
    var loadingHtml = isLoading
      ? '<img src="/sablier-96.png" alt="" class="qcm-loading-hourglass" aria-hidden="true">'
      : '';
    body.innerHTML = '<p class="qcm-state-message">' + loadingHtml + escapeHtml(text) + '</p>';
    if (!isLoading) signalIframeReady();
  }

  function setParentIframeCloseVisible(visible) {
    if (window.self === window.top) return;
    try {
      var closeButton = window.parent.document.getElementById('debate-iframe-modal-close');
      if (!closeButton) return;
      closeButton.style.setProperty('display', visible ? 'flex' : 'none', 'important');
      closeButton.style.setProperty('opacity', visible ? '1' : '0', 'important');
      closeButton.style.setProperty('visibility', visible ? 'visible' : 'hidden', 'important');
      closeButton.style.setProperty('pointer-events', visible ? 'auto' : 'none', 'important');
      closeButton.setAttribute('aria-hidden', visible ? 'false' : 'true');
      closeButton.tabIndex = visible ? 0 : -1;
    } catch (e) {}
  }

  function pct(count, total) {
    if (!total) return 0;
    return Math.round((count / total) * 100);
  }

  // Libellés du badge cosmétique affiché au-dessus de la question pour les
  // formats autres que "qcm" classique — rend la variété de formats visible
  // sans rien changer d'autre à la mise en page.
  var QUESTION_TYPE_BADGE_LABELS = {
    vrai_faux: 'Vrai ou faux ?',
    texte_a_trous: 'Texte à trous',
    association: 'Association',
    intrus: "Trouve l'intrus",
    qcm_multi: 'Plusieurs réponses',
    ordre: "Remets dans l'ordre"
  };
  var FILL_BLANK_MARKER = '___';

  function renderTypeBadge(type) {
    var label = QUESTION_TYPE_BADGE_LABELS[type];
    return label ? '<span class="qcm-type-badge">' + escapeHtml(label) + '</span>' : '';
  }

  // Badge d'origine (actu / culture générale) affiché au-dessus de chaque
  // question, une fois les deux mélangées dans la même session (cf.
  // question.origin/sourceType renvoyés par server.js stripQuestionForClient) :
  // réutilise les icônes de rubrique (ACQUIS_SOURCE_TYPE_META) pour la
  // culture générale, un badge générique pour l'actu.
  function renderOriginBadge(question) {
    if (question.origin === 'culture_generale') {
      var meta = ACQUIS_SOURCE_TYPE_META[question.sourceType] || ACQUIS_SOURCE_TYPE_META.histoire;
      return '<span class="qcm-origin-badge"><i class="fa-solid ' + meta.icon + '"></i>' + escapeHtml(meta.label) + '</span>';
    }
    return '<span class="qcm-origin-badge"><i class="fa-solid fa-newspaper"></i>Actualité</span>';
  }

  // Retirer une question de ses futures repasses ("Renforcement") — l'utilisateur
  // la connaît déjà ou n'est plus intéressé (demande du 12/08/2026). N'affecte
  // jamais la session en cours (chaque question n'apparaît qu'une fois par
  // session de toute façon, cf. questions[currentIndex]) : seul le choix des
  // futures repasses en tient compte côté serveur (cf. server.js
  // fetchCultureGeneraleReviewInjectionForToday, filtré sur cette table).
  function renderExcludeButtonHtml() {
    return '<button type="button" class="qcm-exclude-btn" id="qcm-exclude-btn" title="Ne plus jamais me reposer cette question">Ne plus me la demander</button>';
  }
  // Laisser réfléchir avant d'afficher les propositions (demande du
  // 12/08/2026) — seulement pour les formats où il y a vraiment une réponse
  // à deviner avant de voir des choix (qcm, texte à trous, qcm à choix
  // multiples) : jamais vrai_faux (les 2 options sont triviales, connues
  // d'avance), ni intrus/association/ordre (les propositions SONT la
  // question, impossible d'y répondre sans les voir). Jamais réactivé sur
  // une question déjà répondue (answer truthy) : rien à deviner, juste à
  // relire le résultat.
  var QCM_REVEAL_GATE_TYPES = ['qcm', 'texte_a_trous', 'qcm_multi'];
  // Le format seul (qcm/texte_a_trous/qcm_multi) ne suffit pas à savoir si
  // une question est répondable sans voir les propositions — ex. "Lequel de
  // ces historiens n'a pas travaillé sur le Moyen Âge ?" est un "qcm" mais
  // fait explicitement référence aux propositions elles-mêmes, impossible d'y
  // répondre sans les voir (constaté le 13/08/2026). D'abord corrigé par un
  // motif de texte détectant les tournures comparatives côté client : trop
  // fragile (ne couvre que quelques tournures françaises précises). Remplacé
  // par question.selfContained, un jugement explicite fait par l'IA
  // elle-même pour CHAQUE question à la génération (cf. server.js
  // buildQuestionFormatsPromptBlock) — absent (contenu généré avant ce
  // champ) vaut false : pas de rustine de repli, juste pas de gate tant que
  // le contenu n'a pas été régénéré avec ce champ.
  function needsRevealGate(type, answer, question) {
    if (answer || QCM_REVEAL_GATE_TYPES.indexOf(type) === -1) return false;
    return question.selfContained === true;
  }
  function renderRevealGateHtml() {
    return '<button type="button" class="qcm-next-btn visible" id="qcm-reveal-btn">Réfléchis à ta réponse, puis affiche les propositions</button>';
  }
  function wireRevealGate(hiddenElIds) {
    var revealBtn = document.getElementById('qcm-reveal-btn');
    if (!revealBtn) return;
    revealBtn.addEventListener('click', function () {
      revealBtn.remove();
      hiddenElIds.forEach(function (id) {
        var el = document.getElementById(id);
        if (el) el.hidden = false;
      });
    });
  }

  function wireExcludeButton(question) {
    var btn = document.getElementById('qcm-exclude-btn');
    if (!btn || !voterKey) return;
    btn.onclick = function () {
      btn.disabled = true;
      btn.textContent = 'Retirée';
      fetch('/api/daily-quiz/exclude-question', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ legacyKey: voterKey, questionId: question.id })
      }).catch(function () {
        btn.disabled = false;
        btn.textContent = 'Ne plus me la demander';
      });
    };
  }

  // Point d'entrée unique : dispatché selon le format de la question
  // courante. "association"/"qcm_multi"/"ordre" ont chacun une interaction
  // fondamentalement différente d'un choix unique et un rendu dédié ; les
  // autres formats (dont "intrus", identique à "qcm" question ×
  // 4 options) partagent le même rendu à options (renderChoiceQuestion).
  function renderQuestion() {
    signalIframeReady();
    var question = questions[currentIndex];
    var answer = answeredByQuestionId[question.id];
    var type = question.type || 'qcm';
    if (type === 'association') {
      renderAssociationQuestion(question, answer);
    } else if (type === 'qcm_multi') {
      renderMultiChoiceQuestion(question, answer);
    } else if (type === 'ordre') {
      renderOrderQuestion(question, answer);
    } else {
      renderChoiceQuestion(question, answer);
    }
  }

  // Câblage partagé du bouton "Question suivante" / "Voir mon score",
  // identique quel que soit le format de question qui vient d'être répondu.
  function wireNextButton(nextBtn) {
    var isLast = currentIndex === questions.length - 1;
    nextBtn.textContent = isLast ? 'Voir mon score' : 'Question suivante';
    nextBtn.className = 'qcm-next-btn visible';
    nextBtn.onclick = function () {
      if (isLast) renderFinalScore();
      else { currentIndex += 1; renderQuestion(); }
    };
  }

  function renderChoiceQuestion(question, answer) {
    var type = question.type || 'qcm';
    var questionHtml = type === 'texte_a_trous'
      ? escapeHtml(question.question).split(FILL_BLANK_MARKER).join('<span class="qcm-blank">' + FILL_BLANK_MARKER + '</span>')
      : escapeHtml(question.question);

    var html = '';
    html += '<p class="qcm-progress">Question ' + (currentIndex + 1) + ' / ' + questions.length + '</p>';
    html += renderOriginBadge(question) + renderTypeBadge(type) + renderExcludeButtonHtml();
    html += '<p class="qcm-question">' + questionHtml + '</p>';
    var gated = needsRevealGate(type, answer, question);
    if (gated) html += renderRevealGateHtml();
    html += '<div class="qcm-options" id="qcm-options"' + (gated ? ' hidden' : '') + '></div>';
    html += '<button type="button" class="qcm-next-btn visible" id="qcm-choice-submit-btn" disabled' + (gated ? ' hidden' : '') + '>Valider ma réponse</button>';
    html += '<div class="qcm-feedback" id="qcm-feedback"></div>';
    html += '<button type="button" class="qcm-next-btn" id="qcm-next-btn"></button>';
    body.innerHTML = html;
    wireExcludeButton(question);
    if (gated) wireRevealGate(['qcm-options', 'qcm-choice-submit-btn']);

    var optionsEl = document.getElementById('qcm-options');
    var selectedOptionIndex = null;
    var submitBtn = document.getElementById('qcm-choice-submit-btn');
    question.options.forEach(function (optionText, index) {
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'qcm-option-btn';
      btn.innerHTML =
        '<span class="qcm-option-fill"></span>' +
        '<span class="qcm-option-row">' +
        '<span class="qcm-option-label">' + escapeHtml(optionText) + '</span>' +
        '<span class="qcm-option-pct"></span>' +
        '</span>';
      btn.addEventListener('click', function () {
        selectedOptionIndex = index;
        optionsEl.querySelectorAll('.qcm-option-btn').forEach(function (optionBtn) {
          optionBtn.classList.remove('is-selected');
        });
        btn.classList.add('is-selected');
        submitBtn.disabled = false;
      });
      optionsEl.appendChild(btn);
    });

    submitBtn.onclick = function () {
      if (selectedOptionIndex === null) return;
      submitChoiceAnswer(question, selectedOptionIndex);
    };

    if (answer) applyChoiceAnswerState(question, answer);
  }

  function applyChoiceAnswerState(question, answer) {
    var optionsEl = document.getElementById('qcm-options');
    var buttons = optionsEl.querySelectorAll('.qcm-option-btn');
    var total = answer.totalAnswers || 0;
    var submitBtn = document.getElementById('qcm-choice-submit-btn');
    if (submitBtn) submitBtn.className = 'qcm-next-btn';
    buttons.forEach(function (btn, index) {
      btn.disabled = true;
      btn.classList.add('answered');
      var count = (answer.stats && answer.stats[index]) || 0;
      btn.querySelector('.qcm-option-fill').style.width = pct(count, total) + '%';
      btn.querySelector('.qcm-option-pct').textContent = pct(count, total) + '%';
      if (index === answer.correctIndex) btn.classList.add('is-correct');
      else if (index === answer.optionIndex) btn.classList.add('is-wrong-picked');
    });

    var feedback = document.getElementById('qcm-feedback');
    feedback.className = 'qcm-feedback visible ' + (answer.correct ? 'is-correct' : 'is-wrong');
    feedback.innerHTML =
      '<span class="qcm-feedback-verdict">' + (answer.correct ? 'Bonne réponse !' : 'Raté !') + '</span>' +
      escapeHtml(answer.explanation || '');

    wireNextButton(document.getElementById('qcm-next-btn'));
  }

  function submitChoiceAnswer(question, optionIndex) {
    var optionsEl = document.getElementById('qcm-options');
    var submitBtn = document.getElementById('qcm-choice-submit-btn');
    if (submitBtn) submitBtn.disabled = true;
    optionsEl.querySelectorAll('.qcm-option-btn').forEach(function (btn) { btn.disabled = true; });

    fetch('/api/daily-quiz/answer', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ voterKey: voterKey, questionId: question.id, optionIndex: optionIndex, slot: currentSlot, quizDate: currentQuizDate })
    })
      .then(function (res) { return res.json(); })
      .then(function (data) {
        if (data.error) throw new Error(data.error);
        answeredByQuestionId[question.id] = data;
        applyChoiceAnswerState(question, data);
      })
      .catch(function () {
        optionsEl.querySelectorAll('.qcm-option-btn').forEach(function (btn) { btn.disabled = false; });
        if (submitBtn) submitBtn.disabled = false;
      });
  }

  // ── Format "association" : relier chaque élément de question.lefts à
  // l'élément de question.rights qui lui correspond. Un <select> natif par
  // ligne plutôt qu'un glisser-déposer ou un système de clic-appariement :
  // aucune dépendance, tactile/clavier/lecteur d'écran gratuits, cohérent
  // avec le reste du site (vanilla JS, sans framework). ─────────────────
  function renderAssociationQuestion(question, answer) {
    var html = '';
    html += '<p class="qcm-progress">Question ' + (currentIndex + 1) + ' / ' + questions.length + '</p>';
    html += renderOriginBadge(question) + renderTypeBadge('association') + renderExcludeButtonHtml();
    html += '<p class="qcm-question">' + escapeHtml(question.question) + '</p>';
    html += '<div id="qcm-assoc-rows"></div>';
    html += '<div class="qcm-feedback" id="qcm-feedback"></div>';
    html += '<button type="button" class="qcm-next-btn visible" id="qcm-assoc-submit-btn" disabled>Valider</button>';
    html += '<button type="button" class="qcm-next-btn" id="qcm-next-btn"></button>';
    body.innerHTML = html;
    wireExcludeButton(question);

    var rowsEl = document.getElementById('qcm-assoc-rows');
    var lefts = question.lefts || [];
    var rights = question.rights || [];
    var selects = lefts.map(function (leftText) {
      var row = document.createElement('div');
      row.className = 'qcm-assoc-row';
      var leftSpan = document.createElement('span');
      leftSpan.className = 'qcm-assoc-left';
      leftSpan.textContent = leftText;
      var select = document.createElement('select');
      select.className = 'qcm-assoc-select';
      var placeholder = document.createElement('option');
      placeholder.value = '';
      placeholder.textContent = 'Choisis…';
      select.appendChild(placeholder);
      rights.forEach(function (rightText) {
        var opt = document.createElement('option');
        opt.value = rightText;
        opt.textContent = rightText;
        select.appendChild(opt);
      });
      row.appendChild(leftSpan);
      row.appendChild(select);
      rowsEl.appendChild(row);
      return select;
    });

    var submitBtn = document.getElementById('qcm-assoc-submit-btn');
    function updateSubmitEnabled() {
      submitBtn.disabled = selects.some(function (s) { return !s.value; });
    }
    selects.forEach(function (select) {
      select.addEventListener('change', updateSubmitEnabled);
    });
    submitBtn.onclick = function () {
      var pairsGuess = lefts.map(function (leftText, index) {
        return { left: leftText, right: selects[index].value };
      });
      submitAssociationAnswer(question, pairsGuess, selects, submitBtn);
    };

    // Reprise de session (page rechargée après une réponse déjà envoyée) :
    // le serveur ne connaît que le verdict global (tout correct ou non, cf.
    // POST /answer), pas le choix exact fait pour chaque ligne à l'époque —
    // applyAssociationAnswerState gère ce cas en pré-remplissant chaque
    // <select> avec la bonne réponse plutôt qu'en essayant de deviner ce qui
    // avait été choisi.
    if (answer) applyAssociationAnswerState(question, answer, selects);
  }

  function submitAssociationAnswer(question, pairsGuess, selects, submitBtn) {
    selects.forEach(function (s) { s.disabled = true; });
    submitBtn.disabled = true;

    fetch('/api/daily-quiz/answer', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ voterKey: voterKey, questionId: question.id, slot: currentSlot, quizDate: currentQuizDate, associationAnswer: pairsGuess })
    })
      .then(function (res) { return res.json(); })
      .then(function (data) {
        if (data.error) throw new Error(data.error);
        answeredByQuestionId[question.id] = data;
        applyAssociationAnswerState(question, data, selects);
      })
      .catch(function () {
        selects.forEach(function (s) { s.disabled = false; });
        submitBtn.disabled = false;
      });
  }

  // `selects` reflète soit un choix réel de l'utilisateur qui vient de
  // répondre (chaque <select> a une valeur, comparée à la bonne réponse),
  // soit une reprise de session où le serveur ne renvoie que le verdict
  // global (cf. commentaire dans renderAssociationQuestion) : dans ce
  // second cas chaque <select> est encore vide, on le pré-remplit alors
  // directement avec la bonne réponse plutôt que d'afficher un faux "raté"
  // sur une ligne où l'utilisateur n'a en réalité rien choisi ici.
  function applyAssociationAnswerState(question, answer, selects) {
    var lefts = question.lefts || [];
    var correctByLeft = {};
    (answer.pairs || []).forEach(function (p) { correctByLeft[p.left] = p.right; });

    selects.forEach(function (select, index) {
      var leftText = lefts[index];
      var correctRight = correctByLeft[leftText];
      var chosen = select.value;
      select.disabled = true;
      if (!chosen) {
        select.value = correctRight;
        return;
      }
      if (chosen === correctRight) {
        select.classList.add('is-correct');
      } else {
        select.classList.add('is-wrong');
        var hint = document.createElement('span');
        hint.className = 'qcm-assoc-correct-hint';
        hint.textContent = 'Bonne réponse : ' + correctRight;
        select.parentNode.appendChild(hint);
      }
    });

    var submitBtn = document.getElementById('qcm-assoc-submit-btn');
    if (submitBtn) submitBtn.remove();

    var feedback = document.getElementById('qcm-feedback');
    feedback.className = 'qcm-feedback visible ' + (answer.correct ? 'is-correct' : 'is-wrong');
    feedback.innerHTML =
      '<span class="qcm-feedback-verdict">' + (answer.correct ? 'Bonne réponse !' : 'Raté !') + '</span>' +
      escapeHtml(answer.explanation || '');

    wireNextButton(document.getElementById('qcm-next-btn'));
  }

  // ── Format "qcm_multi" : plusieurs bonnes réponses parmi 4-5 options —
  // boutons à bascule (pas de sélection immédiate comme "qcm", il faut
  // pouvoir cocher/décocher avant de valider) + bouton "Valider" dédié, même
  // principe que le bouton de "association" ci-dessus. ───────────────────
  function renderMultiChoiceQuestion(question, answer) {
    var html = '';
    html += '<p class="qcm-progress">Question ' + (currentIndex + 1) + ' / ' + questions.length + '</p>';
    html += renderOriginBadge(question) + renderTypeBadge('qcm_multi') + renderExcludeButtonHtml();
    html += '<p class="qcm-question">' + escapeHtml(question.question) + '</p>';
    var gated = needsRevealGate('qcm_multi', answer, question);
    if (gated) html += renderRevealGateHtml();
    html += '<p class="qcm-multi-hint">Plusieurs réponses sont correctes.</p>';
    html += '<div class="qcm-options" id="qcm-options"' + (gated ? ' hidden' : '') + '></div>';
    html += '<div class="qcm-feedback" id="qcm-feedback"></div>';
    html += '<button type="button" class="qcm-next-btn visible" id="qcm-multi-submit-btn" disabled' + (gated ? ' hidden' : '') + '>Valider</button>';
    html += '<button type="button" class="qcm-next-btn" id="qcm-next-btn"></button>';
    body.innerHTML = html;
    wireExcludeButton(question);
    if (gated) wireRevealGate(['qcm-options', 'qcm-multi-submit-btn']);

    var optionsEl = document.getElementById('qcm-options');
    var submitBtn = document.getElementById('qcm-multi-submit-btn');
    var selected = {};
    var buttons = question.options.map(function (optionText, index) {
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'qcm-option-btn qcm-option-btn-multi';
      btn.innerHTML =
        '<span class="qcm-option-row">' +
        '<span class="qcm-option-check" aria-hidden="true"><i class="fa-solid fa-check"></i></span>' +
        '<span class="qcm-option-label">' + escapeHtml(optionText) + '</span>' +
        '</span>';
      btn.addEventListener('click', function () {
        if (selected[index]) { delete selected[index]; btn.classList.remove('is-selected'); }
        else { selected[index] = true; btn.classList.add('is-selected'); }
        submitBtn.disabled = !Object.keys(selected).length;
      });
      optionsEl.appendChild(btn);
      return btn;
    });

    submitBtn.onclick = function () {
      submitMultiChoiceAnswer(question, Object.keys(selected).map(Number), buttons, submitBtn);
    };

    if (answer) applyMultiChoiceAnswerState(answer, buttons);
  }

  function submitMultiChoiceAnswer(question, optionIndexes, buttons, submitBtn) {
    buttons.forEach(function (btn) { btn.disabled = true; });
    submitBtn.disabled = true;

    fetch('/api/daily-quiz/answer', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ voterKey: voterKey, questionId: question.id, slot: currentSlot, quizDate: currentQuizDate, optionIndexes: optionIndexes })
    })
      .then(function (res) { return res.json(); })
      .then(function (data) {
        if (data.error) throw new Error(data.error);
        answeredByQuestionId[question.id] = data;
        applyMultiChoiceAnswerState(data, buttons);
      })
      .catch(function () {
        buttons.forEach(function (btn) { btn.disabled = false; });
        submitBtn.disabled = false;
      });
  }

  // Reprise de session : le serveur ne renvoie que le verdict global + la
  // vraie liste correctIndexes, jamais ce qui avait été coché à l'époque —
  // chaque bouton n'est donc marqué "correct" ou neutre qu'à partir de
  // correctIndexes, jamais "raté" individuellement lors d'une reprise (même
  // limite que "association", cf. applyAssociationAnswerState).
  function applyMultiChoiceAnswerState(answer, buttons) {
    var correctSet = {};
    (answer.correctIndexes || []).forEach(function (i) { correctSet[i] = true; });
    buttons.forEach(function (btn, index) {
      btn.disabled = true;
      btn.classList.add('answered');
      if (correctSet[index]) btn.classList.add('is-correct');
      else if (btn.classList.contains('is-selected')) btn.classList.add('is-wrong-picked');
    });

    var submitBtn = document.getElementById('qcm-multi-submit-btn');
    if (submitBtn) submitBtn.remove();

    var feedback = document.getElementById('qcm-feedback');
    feedback.className = 'qcm-feedback visible ' + (answer.correct ? 'is-correct' : 'is-wrong');
    feedback.innerHTML =
      '<span class="qcm-feedback-verdict">' + (answer.correct ? 'Bonne réponse !' : 'Raté !') + '</span>' +
      escapeHtml(answer.explanation || '');

    wireNextButton(document.getElementById('qcm-next-btn'));
  }

  // ── Format "ordre" : remettre 3-4 éléments dans leur ordre correct — tap
  // pour construire la séquence (pas de glisser-déposer, aucune dépendance,
  // tactile/clavier gratuits comme le <select> de "association") : chaque
  // tap sur un élément disponible l'ajoute à la séquence choisie, un tap sur
  // un élément déjà placé le retire (pour corriger sans tout recommencer). ─
  function renderOrderQuestion(question, answer) {
    var html = '';
    html += '<p class="qcm-progress">Question ' + (currentIndex + 1) + ' / ' + questions.length + '</p>';
    html += renderOriginBadge(question) + renderTypeBadge('ordre') + renderExcludeButtonHtml();
    html += '<p class="qcm-question">' + escapeHtml(question.question) + '</p>';
    html += '<p class="qcm-order-hint">Touche les éléments dans le bon ordre.</p>';
    html += '<div class="qcm-order-chosen" id="qcm-order-chosen"></div>';
    html += '<div class="qcm-order-pool" id="qcm-order-pool"></div>';
    html += '<div class="qcm-feedback" id="qcm-feedback"></div>';
    html += '<button type="button" class="qcm-next-btn visible" id="qcm-order-submit-btn" disabled>Valider</button>';
    html += '<button type="button" class="qcm-next-btn" id="qcm-next-btn"></button>';
    body.innerHTML = html;
    wireExcludeButton(question);

    var poolEl = document.getElementById('qcm-order-pool');
    var chosenEl = document.getElementById('qcm-order-chosen');
    var submitBtn = document.getElementById('qcm-order-submit-btn');
    var items = question.items || [];
    var chosenOrder = [];

    function renderChosen() {
      chosenEl.innerHTML = '';
      chosenOrder.forEach(function (text, i) {
        var chip = document.createElement('button');
        chip.type = 'button';
        chip.className = 'qcm-order-chip qcm-order-chip-chosen';
        chip.innerHTML = '<span class="qcm-order-chip-num">' + (i + 1) + '</span><span>' + escapeHtml(text) + '</span>';
        chip.addEventListener('click', function () {
          chosenOrder.splice(i, 1);
          renderChosen();
          renderPool();
        });
        chosenEl.appendChild(chip);
      });
      submitBtn.disabled = chosenOrder.length !== items.length;
    }

    function renderPool() {
      poolEl.innerHTML = '';
      items.forEach(function (text) {
        if (chosenOrder.indexOf(text) !== -1) return;
        var chip = document.createElement('button');
        chip.type = 'button';
        chip.className = 'qcm-order-chip';
        chip.textContent = text;
        chip.addEventListener('click', function () {
          chosenOrder.push(text);
          renderChosen();
          renderPool();
        });
        poolEl.appendChild(chip);
      });
    }
    renderPool();
    renderChosen();

    submitBtn.onclick = function () {
      submitOrderAnswer(question, chosenOrder.slice(), poolEl, chosenEl, submitBtn);
    };

    if (answer) applyOrderAnswerState(answer, poolEl, chosenEl, submitBtn, items);
  }

  function submitOrderAnswer(question, orderedItems, poolEl, chosenEl, submitBtn) {
    submitBtn.disabled = true;
    poolEl.querySelectorAll('.qcm-order-chip').forEach(function (c) { c.disabled = true; });
    chosenEl.querySelectorAll('.qcm-order-chip').forEach(function (c) { c.disabled = true; });

    fetch('/api/daily-quiz/answer', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ voterKey: voterKey, questionId: question.id, slot: currentSlot, quizDate: currentQuizDate, orderedItems: orderedItems })
    })
      .then(function (res) { return res.json(); })
      .then(function (data) {
        if (data.error) throw new Error(data.error);
        answeredByQuestionId[question.id] = data;
        applyOrderAnswerState(data, poolEl, chosenEl, submitBtn, question.items);
      })
      .catch(function () {
        submitBtn.disabled = false;
        poolEl.querySelectorAll('.qcm-order-chip').forEach(function (c) { c.disabled = false; });
        chosenEl.querySelectorAll('.qcm-order-chip').forEach(function (c) { c.disabled = false; });
      });
  }

  // Affiche le bon ordre (révélé par le serveur une fois répondu) en lecture
  // seule plutôt que de comparer élément par élément à ce qui avait été
  // choisi — même limite de reprise de session que "association"/"qcm_multi" :
  // seul le verdict global est connu après un rechargement de page.
  function applyOrderAnswerState(answer, poolEl, chosenEl, submitBtn, fallbackItems) {
    if (submitBtn) submitBtn.remove();
    var correctItems = answer.items || fallbackItems || [];
    poolEl.innerHTML = '';
    chosenEl.innerHTML = '<p class="qcm-order-correct-label">Bon ordre :</p>';
    correctItems.forEach(function (text, i) {
      var chip = document.createElement('div');
      chip.className = 'qcm-order-chip qcm-order-chip-chosen qcm-order-chip-static';
      chip.innerHTML = '<span class="qcm-order-chip-num">' + (i + 1) + '</span><span>' + escapeHtml(text) + '</span>';
      chosenEl.appendChild(chip);
    });

    var feedback = document.getElementById('qcm-feedback');
    feedback.className = 'qcm-feedback visible ' + (answer.correct ? 'is-correct' : 'is-wrong');
    feedback.innerHTML =
      '<span class="qcm-feedback-verdict">' + (answer.correct ? 'Bonne réponse !' : 'Raté !') + '</span>' +
      escapeHtml(answer.explanation || '');

    wireNextButton(document.getElementById('qcm-next-btn'));
  }

  function renderFinalScore() {
    signalIframeReady();
    var total = questions.length;
    var correct = 0;
    questions.forEach(function (q) {
      var a = answeredByQuestionId[q.id];
      if (a && a.correct) correct += 1;
    });
    // Les repasses de "Renforcement" ne comptent jamais pour le score
    // Gnosis (cf. server.js DAILY_QUIZ_GNOSIS_EXCLUDED_QUESTION_ID_PREFIXES) :
    // message dédié plutôt que la promesse habituelle d'un score qui ne
    // bougera pas.
    var scoreHint = currentCategory === 'renforcement'
      ? 'Ces repasses ne comptent pas pour ton score Gnosis — elles font seulement progresser tes acquis vers leur validation définitive.'
