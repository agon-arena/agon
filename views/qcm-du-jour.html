<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <script src="/no-zoom.js?v=20260603" defer></script>
  <title>QCM du jour | agôn</title>
  <link rel="icon" type="image/png" href="/favicon-64.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icon-192-optimized.png">
  <meta name="theme-color" content="#243038">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Agôn">
  <link rel="stylesheet" href="/style.min.css?v=20260724-menucompact">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;700&display=swap">
  <link rel="stylesheet" href="/vendor/fontawesome/css/all.min.css">
  <script>
    if (window.self !== window.top) document.documentElement.classList.add('in-iframe');
    document.addEventListener('DOMContentLoaded', function(){
      if (window.self !== window.top) {
        document.body.classList.add('in-iframe');
        try { window.parent.postMessage({ type: 'agon:debate-iframe-ready', pathname: location.pathname, href: location.href }, '*'); } catch (e) {}
      }
    });
  </script>
  <style>
    /* Même bleu-gris foncé que le bandeau des bulles sur l'accueil (#243038).
       Posé à la fois sur html et body : html a déjà ce fond par défaut (cf.
       style.css ligne ~14068), mais sans hauteur de body qui couvre tout le
       viewport, une bande plus claire pouvait apparaître sous une carte courte. */
    html,
    html:has(body.page-qcm-du-jour) {
      background-color: #243038;
    }
    body.page-qcm-du-jour {
      min-height: 100vh;
      background-color: #243038;
    }
    body.page-qcm-du-jour.in-iframe {
      box-sizing: border-box;
      padding-bottom: 360px;
    }
    .page-qcm-du-jour .topbar-inner {
      justify-content: center;
      padding: 2px 0;
    }
    .page-qcm-du-jour .home-brand-block {
      flex: 0 0 auto;
      margin-left: 0;
    }
    .page-qcm-du-jour .home-logo {
      width: 110px;
    }
    @media (max-width: 768px) {
      .page-qcm-du-jour .home-logo {
        width: 70px;
      }
      .page-qcm-du-jour .topbar-inner {
        padding: 0;
      }
    }
    .qcm-page-shell {
      width: min(100% - 32px, 900px);
      margin: 112px auto 180px;
    }
    .page-qcm-du-jour.in-iframe .qcm-page-shell {
      margin: 20px auto 0;
    }
    /* Doit rester APRÈS la règle ci-dessus (même sélecteur, donc même
       spécificité) : un margin-bottom placé avant un margin raccourci
       équivalent serait écrasé par lui, peu importe le media query. */
    @media (max-width: 768px) {
      /* Vraie zone scrollable en bas, sans pseudo-bandeau ajouté au DOM. */
      body.page-qcm-du-jour.in-iframe {
        padding-bottom: clamp(360px, 42vh, 520px);
      }
    }
    @media (min-width: 769px) {
      .qcm-page-shell {
        width: min(100% - 64px, 1200px);
      }
    }
    .qcm-panel,
    .qcm-panel * {
      box-sizing: border-box;
    }
    .qcm-panel {
      position: relative;
      width: 100%;
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 24px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.18);
      font-family: Arial, Helvetica, sans-serif;
    }
    .qcm-panel h1 {
      margin: 0 0 4px;
      font-family: "Barlow Condensed", Arial, sans-serif;
      font-size: 34px;
      line-height: 1;
      color: #111827;
      text-align: center;
    }
    .qcm-panel .qcm-subtitle {
      margin: 0 0 16px;
      color: #6b7280;
      font-size: 14px;
      text-align: center;
    }
    .qcm-slot-switcher {
      display: none;
      justify-content: center;
      gap: 8px;
      margin: 0 0 20px;
    }
    .qcm-slot-switcher.visible {
      display: flex;
    }
    .qcm-slot-btn {
      padding: 6px 14px;
      border: 1px solid #d1d5db;
      border-radius: 999px;
      background: #f9fafb;
      color: #4b5563;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }
    .qcm-slot-btn.active {
      border-color: #243038;
      background: #243038;
      color: #ffffff;
    }
    .qcm-progress {
      margin: 0 0 16px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #516776;
    }
    .qcm-question {
      margin: 0 0 18px;
      font-size: 19px;
      font-weight: 600;
      color: #111827;
      line-height: 1.3;
    }
    .qcm-options {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .qcm-option-btn {
      position: relative;
      display: block;
      width: 100%;
      text-align: left;
      padding: 12px 14px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      background: #f9fafb;
      color: #1f2937;
      font-size: 15px;
      cursor: pointer;
      overflow: hidden;
      transition: border-color 0.15s ease, background 0.15s ease;
    }
    .qcm-option-btn:hover:not(:disabled) {
      border-color: #516776;
      background: #eef3f6;
    }
    .qcm-option-btn:disabled {
      cursor: default;
    }
    .qcm-option-fill {
      position: absolute;
      inset: 0;
      width: 0%;
      background: rgba(81, 103, 118, 0.14);
      transition: width 0.4s ease;
      z-index: 0;
    }
    .qcm-option-label,
    .qcm-option-pct {
      position: relative;
      z-index: 1;
    }
    .qcm-option-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .qcm-option-pct {
      display: none;
      font-size: 13px;
      font-weight: 700;
      color: #516776;
      white-space: nowrap;
    }
    .qcm-option-btn.answered .qcm-option-pct {
      display: inline;
    }
    .qcm-option-btn.is-correct {
      border-color: #1f9d55;
      background: #f0fdf4;
    }
    .qcm-option-btn.is-correct .qcm-option-fill {
      background: rgba(31, 157, 85, 0.16);
    }
    .qcm-option-btn.is-wrong-picked {
      border-color: #d64545;
      background: #fef2f2;
    }
    .qcm-option-btn.is-wrong-picked .qcm-option-fill {
      background: rgba(214, 69, 69, 0.16);
    }
    .qcm-feedback {
      display: none;
      margin-top: 14px;
      padding: 12px 14px;
      border-radius: 8px;
      background: #f3f4f6;
      color: #374151;
      font-size: 14px;
      line-height: 1.4;
      text-align: center;
    }
    .qcm-feedback.visible {
      display: block;
    }
    .qcm-feedback .qcm-feedback-verdict {
      display: block;
      margin-bottom: 4px;
      font-weight: 700;
    }
    .qcm-feedback.is-correct .qcm-feedback-verdict { color: #1f9d55; }
    .qcm-feedback.is-wrong .qcm-feedback-verdict { color: #d64545; }
    .qcm-next-btn {
      display: none;
      margin: 16px auto 0;
      padding: 10px 18px;
      border: none;
      border-radius: 999px;
      background: #243038;
      color: #ffffff;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
    }
    .qcm-next-btn.visible {
      display: block;
    }
    .qcm-final-actions {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 16px;
    }
    .qcm-final-actions .qcm-next-btn {
      margin: 0;
    }
    .qcm-final-actions .qcm-btn-secondary {
      background: #f3f4f6;
      color: #374151;
    }
    .qcm-state-message {
      color: #6b7280;
      font-size: 15px;
      line-height: 1.4;
    }
    .qcm-final-score {
      text-align: center;
      padding: 8px 0;
    }
    .qcm-final-score i {
      font-size: 32px;
      color: #f5b642;
      margin-bottom: 10px;
    }
    .qcm-final-score .qcm-final-score-value {
      font-family: "Barlow Condensed", Arial, sans-serif;
      font-size: 40px;
      color: #111827;
      line-height: 1;
      margin: 4px 0 6px;
    }
    .qcm-final-score .qcm-final-score-label {
      color: #6b7280;
      font-size: 14px;
    }
    .qcm-final-score-hint {
      margin: 14px auto 0;
      max-width: 420px;
      padding: 10px 14px;
      border-radius: 8px;
      background: #f3f4f6;
      color: #4b5563;
      font-size: 13px;
      line-height: 1.4;
    }
    /* Badge cosmétique au-dessus de la question pour les formats
       vrai_faux/texte_a_trous : rend la variété de formats visible sans
       toucher au reste de la mise en page. */
    .qcm-type-badge {
      display: inline-block;
      margin: 0 0 8px;
      padding: 3px 10px;
      border-radius: 999px;
      background: #eef3f6;
      color: #243038;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }
    /* Marqueur "___" d'une question texte_a_trous, mis en valeur dans le
       texte de la question — jamais introduit avant l'échappement HTML
       (cf. renderChoiceQuestion), donc toujours sûr à afficher. */
    .qcm-blank {
      display: inline-block;
      min-width: 46px;
      padding: 0 4px;
      border-bottom: 2px solid #516776;
      color: #516776;
      font-weight: 700;
      text-align: center;
    }
    .qcm-assoc-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }
    .qcm-assoc-left {
      flex: 1 1 auto;
      padding: 10px 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      background: #f9fafb;
      color: #1f2937;
      font-size: 14px;
    }
    .qcm-assoc-select {
      flex: 1 1 auto;
      padding: 10px 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      background: #ffffff;
      color: #1f2937;
      font-size: 14px;
      cursor: pointer;
    }
    .qcm-assoc-select:disabled {
      cursor: default;
      opacity: 0.85;
    }
    .qcm-assoc-select.is-correct {
      border-color: #1f9d55;
      background: #f0fdf4;
      color: #166534;
    }
    .qcm-assoc-select.is-wrong {
      border-color: #d64545;
      background: #fef2f2;
      color: #991b1b;
    }
    .qcm-assoc-correct-hint {
      flex: 1 1 auto;
      font-size: 12px;
      color: #1f9d55;
    }
  </style>
</head>
<body class="page-qcm-du-jour">
<header class="topbar">
  <div class="container topbar-inner topbar-home">
    <div class="home-brand-block">
      <div class="home-brand-main">
        <img src="/logo.jpeg" alt="Logo agôn" class="home-logo">
      </div>
    </div>
  </div>
</header>
<main class="qcm-page-shell">
  <section class="qcm-panel" id="qcm-panel" aria-live="polite">
    <h1><i class="fa-solid fa-circle-question"></i> <span id="qcm-title-text">QCM du jour</span></h1>
    <p class="qcm-subtitle" id="qcm-subtitle-text">Teste-toi sur l'actualité du jour, en 10 questions.</p>
    <div class="qcm-slot-switcher" id="qcm-category-switcher"></div>
    <div class="qcm-slot-switcher" id="qcm-slot-switcher"></div>
    <div id="qcm-body">
      <p class="qcm-state-message">Chargement du QCM du jour…</p>
    </div>
  </section>
</main>
<script src="/script.min.js?v=20260727-fontready" defer></script>
<script>
(function () {
  var body = document.getElementById('qcm-body');
  var titleText = document.getElementById('qcm-title-text');
  var subtitleText = document.getElementById('qcm-subtitle-text');
  var categorySwitcher = document.getElementById('qcm-category-switcher');
  var slotSwitcher = document.getElementById('qcm-slot-switcher');
  var voterKey = null;
  var questions = [];
  var answeredByQuestionId = {};
  var currentIndex = 0;
  var currentSlot = null;
  var currentCategory = null;
  var slotsStatus = null;

  // Trois onglets de haut niveau : "QCM actu" (matin/soir, actualité du
  // jour), "QCM culture générale" (un seul créneau combiné culture_generale,
  // cf. server.js fetchCultureGeneraleQuizCandidates) et "QCM révision"
  // (d'anciennes questions de culture générale piochées au hasard, cf.
  // server.js generateResampledDailyQuiz — ne compte pas pour le score
  // Gnosis, cf. QCM_SUBTITLE_BY_CATEGORY et renderFinalScore ci-dessous).
  // Le sélecteur de créneaux existant (#qcm-slot-switcher) ne montre plus
  // que les créneaux de la catégorie active, comme sous-choix — reste
  // masqué pour "histoire"/"revision" tant qu'elles ne contiennent qu'un
  // seul créneau chacune.
  var CATEGORY_BY_SLOT = {
    morning: 'actu',
    evening: 'actu',
    culture_generale: 'histoire',
    revision: 'revision'
  };
  var CATEGORY_ORDER = ['actu', 'histoire', 'revision'];
  var CATEGORY_LABELS = { actu: 'QCM actu', histoire: 'QCM Culture Générale', revision: 'QCM Révision' };
  var QCM_SUBTITLE_BY_CATEGORY = {
    actu: "Teste-toi sur l'actualité du jour, en 10 questions.",
    histoire: "Teste-toi sur l'histoire et les éclairages du jour.",
    revision: "D'anciennes questions de culture générale, piochées au hasard — ne compte pas pour ton score Gnosis."
  };

  function availableSlotKeysInCategory(category) {
    return Object.keys(slotsStatus.slots).filter(function (k) {
      return slotsStatus.slots[k].available && CATEGORY_BY_SLOT[k] === category;
    });
  }

  // Préférence au sein d'une catégorie : le soir prime sur le matin (déjà le
  // cas avant), sinon le premier créneau disponible dans l'ordre déclaré.
  function pickDefaultSlotForCategory(category) {
    var keys = availableSlotKeysInCategory(category);
    if (category === 'actu' && keys.indexOf('evening') !== -1) return 'evening';
    if (category === 'actu' && keys.indexOf('morning') !== -1) return 'morning';
    return keys[0] || null;
  }

  function renderCategorySwitcher() {
    var availableCategories = CATEGORY_ORDER.filter(function (c) { return availableSlotKeysInCategory(c).length > 0; });
    if (availableCategories.length < 2) {
      categorySwitcher.className = 'qcm-slot-switcher';
      categorySwitcher.innerHTML = '';
      return;
    }
    categorySwitcher.className = 'qcm-slot-switcher visible';
    categorySwitcher.innerHTML = '';
    CATEGORY_ORDER.forEach(function (category) {
      if (availableCategories.indexOf(category) === -1) return;
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'qcm-slot-btn' + (category === currentCategory ? ' active' : '');
      btn.textContent = CATEGORY_LABELS[category];
      btn.addEventListener('click', function () {
        if (category === currentCategory) return;
        var slotToLoad = pickDefaultSlotForCategory(category);
        if (!slotToLoad) return;
        loadSlot(slotToLoad);
      });
      categorySwitcher.appendChild(btn);
    });
  }

  function escapeHtml(str) {
    var div = document.createElement('div');
    div.textContent = String(str == null ? '' : str);
    return div.innerHTML;
  }

  function renderMessage(text) {
    body.innerHTML = '<p class="qcm-state-message">' + escapeHtml(text) + '</p>';
  }

  function pct(count, total) {
    if (!total) return 0;
    return Math.round((count / total) * 100);
  }

  // Libellés du badge cosmétique affiché au-dessus de la question pour les
  // formats autres que "qcm" classique — rend la variété de formats visible
  // sans rien changer d'autre à la mise en page.
  var QUESTION_TYPE_BADGE_LABELS = {
    vrai_faux: 'Vrai ou faux ?',
    texte_a_trous: 'Texte à trous',
    association: 'Association'
  };
  var FILL_BLANK_MARKER = '___';

  function renderTypeBadge(type) {
    var label = QUESTION_TYPE_BADGE_LABELS[type];
    return label ? '<span class="qcm-type-badge">' + escapeHtml(label) + '</span>' : '';
  }

  // Point d'entrée unique : dispatché selon le format de la question
  // courante. "association" a une interaction fondamentalement différente
  // (appariement, pas un choix unique) et un rendu dédié ; les 3 autres
  // formats partagent le même rendu à options (renderChoiceQuestion), la
  // boucle sur question.options étant déjà générique (2 ou 4 options).
  function renderQuestion() {
    var question = questions[currentIndex];
    var answer = answeredByQuestionId[question.id];
    if ((question.type || 'qcm') === 'association') {
      renderAssociationQuestion(question, answer);
    } else {
      renderChoiceQuestion(question, answer);
    }
  }

  // Câblage partagé du bouton "Question suivante" / "Voir mon score",
  // identique quel que soit le format de question qui vient d'être répondu.
  function wireNextButton(nextBtn) {
    var isLast = currentIndex === questions.length - 1;
    nextBtn.textContent = isLast ? 'Voir mon score' : 'Question suivante';
    nextBtn.className = 'qcm-next-btn visible';
    nextBtn.onclick = function () {
      if (isLast) renderFinalScore();
      else { currentIndex += 1; renderQuestion(); }
    };
  }

  function renderChoiceQuestion(question, answer) {
    var type = question.type || 'qcm';
    var questionHtml = type === 'texte_a_trous'
      ? escapeHtml(question.question).split(FILL_BLANK_MARKER).join('<span class="qcm-blank">' + FILL_BLANK_MARKER + '</span>')
      : escapeHtml(question.question);

    var html = '';
    html += '<p class="qcm-progress">Question ' + (currentIndex + 1) + ' / ' + questions.length + '</p>';
    html += renderTypeBadge(type);
    html += '<p class="qcm-question">' + questionHtml + '</p>';
    html += '<div class="qcm-options" id="qcm-options"></div>';
    html += '<div class="qcm-feedback" id="qcm-feedback"></div>';
    html += '<button type="button" class="qcm-next-btn" id="qcm-next-btn"></button>';
    body.innerHTML = html;

    var optionsEl = document.getElementById('qcm-options');
    question.options.forEach(function (optionText, index) {
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'qcm-option-btn';
      btn.innerHTML =
        '<span class="qcm-option-fill"></span>' +
        '<span class="qcm-option-row">' +
        '<span class="qcm-option-label">' + escapeHtml(optionText) + '</span>' +
        '<span class="qcm-option-pct"></span>' +
        '</span>';
      btn.addEventListener('click', function () { submitChoiceAnswer(question, index); });
      optionsEl.appendChild(btn);
    });

    if (answer) applyChoiceAnswerState(question, answer);
  }

  function applyChoiceAnswerState(question, answer) {
    var optionsEl = document.getElementById('qcm-options');
    var buttons = optionsEl.querySelectorAll('.qcm-option-btn');
    var total = answer.totalAnswers || 0;
    buttons.forEach(function (btn, index) {
      btn.disabled = true;
      btn.classList.add('answered');
      var count = (answer.stats && answer.stats[index]) || 0;
      btn.querySelector('.qcm-option-fill').style.width = pct(count, total) + '%';
      btn.querySelector('.qcm-option-pct').textContent = pct(count, total) + '%';
      if (index === answer.correctIndex) btn.classList.add('is-correct');
      else if (index === answer.optionIndex) btn.classList.add('is-wrong-picked');
    });

    var feedback = document.getElementById('qcm-feedback');
    feedback.className = 'qcm-feedback visible ' + (answer.correct ? 'is-correct' : 'is-wrong');
    feedback.innerHTML =
      '<span class="qcm-feedback-verdict">' + (answer.correct ? 'Bonne réponse !' : 'Raté !') + '</span>' +
      escapeHtml(answer.explanation || '');

    wireNextButton(document.getElementById('qcm-next-btn'));
  }

  function submitChoiceAnswer(question, optionIndex) {
    var optionsEl = document.getElementById('qcm-options');
    optionsEl.querySelectorAll('.qcm-option-btn').forEach(function (btn) { btn.disabled = true; });

    fetch('/api/daily-quiz/answer', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ voterKey: voterKey, questionId: question.id, optionIndex: optionIndex, slot: currentSlot })
    })
      .then(function (res) { return res.json(); })
      .then(function (data) {
        if (data.error) throw new Error(data.error);
        answeredByQuestionId[question.id] = data;
        applyChoiceAnswerState(question, data);
      })
      .catch(function () {
        optionsEl.querySelectorAll('.qcm-option-btn').forEach(function (btn) { btn.disabled = false; });
      });
  }

  // ── Format "association" : relier chaque élément de question.lefts à
  // l'élément de question.rights qui lui correspond. Un <select> natif par
  // ligne plutôt qu'un glisser-déposer ou un système de clic-appariement :
  // aucune dépendance, tactile/clavier/lecteur d'écran gratuits, cohérent
  // avec le reste du site (vanilla JS, sans framework). ─────────────────
  function renderAssociationQuestion(question, answer) {
    var html = '';
    html += '<p class="qcm-progress">Question ' + (currentIndex + 1) + ' / ' + questions.length + '</p>';
    html += renderTypeBadge('association');
    html += '<p class="qcm-question">' + escapeHtml(question.question) + '</p>';
    html += '<div id="qcm-assoc-rows"></div>';
    html += '<div class="qcm-feedback" id="qcm-feedback"></div>';
    html += '<button type="button" class="qcm-next-btn visible" id="qcm-assoc-submit-btn" disabled>Valider</button>';
    html += '<button type="button" class="qcm-next-btn" id="qcm-next-btn"></button>';
    body.innerHTML = html;

    var rowsEl = document.getElementById('qcm-assoc-rows');
    var lefts = question.lefts || [];
    var rights = question.rights || [];
    var selects = lefts.map(function (leftText) {
      var row = document.createElement('div');
      row.className = 'qcm-assoc-row';
      var leftSpan = document.createElement('span');
      leftSpan.className = 'qcm-assoc-left';
      leftSpan.textContent = leftText;
      var select = document.createElement('select');
      select.className = 'qcm-assoc-select';
      var placeholder = document.createElement('option');
      placeholder.value = '';
      placeholder.textContent = 'Choisis…';
      select.appendChild(placeholder);
      rights.forEach(function (rightText) {
        var opt = document.createElement('option');
        opt.value = rightText;
        opt.textContent = rightText;
        select.appendChild(opt);
      });
      row.appendChild(leftSpan);
      row.appendChild(select);
      rowsEl.appendChild(row);
      return select;
    });

    var submitBtn = document.getElementById('qcm-assoc-submit-btn');
    function updateSubmitEnabled() {
      submitBtn.disabled = selects.some(function (s) { return !s.value; });
    }
    selects.forEach(function (select) {
      select.addEventListener('change', updateSubmitEnabled);
    });
    submitBtn.onclick = function () {
      var pairsGuess = lefts.map(function (leftText, index) {
        return { left: leftText, right: selects[index].value };
      });
      submitAssociationAnswer(question, pairsGuess, selects, submitBtn);
    };

    // Reprise de session (page rechargée après une réponse déjà envoyée) :
    // le serveur ne connaît que le verdict global (tout correct ou non, cf.
    // POST /answer), pas le choix exact fait pour chaque ligne à l'époque —
    // applyAssociationAnswerState gère ce cas en pré-remplissant chaque
    // <select> avec la bonne réponse plutôt qu'en essayant de deviner ce qui
    // avait été choisi.
    if (answer) applyAssociationAnswerState(question, answer, selects);
  }

  function submitAssociationAnswer(question, pairsGuess, selects, submitBtn) {
    selects.forEach(function (s) { s.disabled = true; });
    submitBtn.disabled = true;

    fetch('/api/daily-quiz/answer', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ voterKey: voterKey, questionId: question.id, slot: currentSlot, associationAnswer: pairsGuess })
    })
      .then(function (res) { return res.json(); })
      .then(function (data) {
        if (data.error) throw new Error(data.error);
        answeredByQuestionId[question.id] = data;
        applyAssociationAnswerState(question, data, selects);
      })
      .catch(function () {
        selects.forEach(function (s) { s.disabled = false; });
        submitBtn.disabled = false;
      });
  }

  // `selects` reflète soit un choix réel de l'utilisateur qui vient de
  // répondre (chaque <select> a une valeur, comparée à la bonne réponse),
  // soit une reprise de session où le serveur ne renvoie que le verdict
  // global (cf. commentaire dans renderAssociationQuestion) : dans ce
  // second cas chaque <select> est encore vide, on le pré-remplit alors
  // directement avec la bonne réponse plutôt que d'afficher un faux "raté"
  // sur une ligne où l'utilisateur n'a en réalité rien choisi ici.
  function applyAssociationAnswerState(question, answer, selects) {
    var lefts = question.lefts || [];
    var correctByLeft = {};
    (answer.pairs || []).forEach(function (p) { correctByLeft[p.left] = p.right; });

    selects.forEach(function (select, index) {
      var leftText = lefts[index];
      var correctRight = correctByLeft[leftText];
      var chosen = select.value;
      select.disabled = true;
      if (!chosen) {
        select.value = correctRight;
        return;
      }
      if (chosen === correctRight) {
        select.classList.add('is-correct');
      } else {
        select.classList.add('is-wrong');
        var hint = document.createElement('span');
        hint.className = 'qcm-assoc-correct-hint';
        hint.textContent = 'Bonne réponse : ' + correctRight;
        select.parentNode.appendChild(hint);
      }
    });

    var submitBtn = document.getElementById('qcm-assoc-submit-btn');
    if (submitBtn) submitBtn.remove();

    var feedback = document.getElementById('qcm-feedback');
    feedback.className = 'qcm-feedback visible ' + (answer.correct ? 'is-correct' : 'is-wrong');
    feedback.innerHTML =
      '<span class="qcm-feedback-verdict">' + (answer.correct ? 'Bonne réponse !' : 'Raté !') + '</span>' +
      escapeHtml(answer.explanation || '');

    wireNextButton(document.getElementById('qcm-next-btn'));
  }

  function renderFinalScore() {
    var total = questions.length;
    var correct = 0;
    questions.forEach(function (q) {
      var a = answeredByQuestionId[q.id];
      if (a && a.correct) correct += 1;
    });
    // Le QCM Révision recycle d'anciennes questions déjà posées : pas un
    // test de connaissances fraîchement acquises, donc explicitement exclu
    // du score Gnosis côté serveur (cf. DAILY_QUIZ_GNOSIS_EXCLUDED_SLOTS) —
    // on le redit ici plutôt que de laisser croire au message habituel.
    var scoreHint = currentCategory === 'revision'
      ? 'Ce QCM Révision ne compte pas pour ton score Gnosis — c\'est juste l\'occasion de retester d\'anciennes questions.'
      : 'Dans quelques instants, ton score Gnosis apparaîtra et te permettra de voir ton classement par rapport aux autres utilisateurs (disponible depuis le bandeau blanc en haut ou en bas).';
    body.innerHTML =
      '<div class="qcm-final-score">' +
      '<i class="fa-solid fa-trophy"></i>' +
      '<div class="qcm-final-score-value">' + correct + ' / ' + total + '</div>' +
      '<div class="qcm-final-score-label">bonnes réponses aujourd’hui</div>' +
      '</div>' +
      '<p class="qcm-final-score-hint">' + scoreHint + '</p>' +
      '<div class="qcm-final-actions">' +
      '<button type="button" class="qcm-next-btn visible qcm-btn-secondary" id="qcm-restart-btn">Recommencer</button>' +
      '<button type="button" class="qcm-next-btn visible" id="qcm-done-btn">Terminé</button>' +
      '</div>';

    // Les réponses du jour sont verrouillées côté serveur (une seule par
    // question et par voterKey) : "Recommencer" repart de la question 1 pour
    // les revoir, sans pouvoir les changer, plutôt qu'un vrai reset.
    document.getElementById('qcm-restart-btn').onclick = function () {
      currentIndex = 0;
      renderQuestion();
    };
    // "Terminé" : ferme la modale iframe (même mécanisme que la croix), ou
    // repart vers l'accueil si la page est ouverte hors iframe (accès direct
    // à /qcm-du-jour).
    document.getElementById('qcm-done-btn').onclick = function () {
      if (window.self !== window.top) {
        try { window.parent.postMessage({ type: 'agon:close-debate-modal' }, '*'); } catch (e) {}
      } else {
        location.href = '/';
      }
    };
  }

  function renderSlotSwitcher() {
    var availableKeys = availableSlotKeysInCategory(currentCategory);
    if (availableKeys.length < 2) {
      slotSwitcher.className = 'qcm-slot-switcher';
      slotSwitcher.innerHTML = '';
      return;
    }
    slotSwitcher.className = 'qcm-slot-switcher visible';
    slotSwitcher.innerHTML = '';
    availableKeys.forEach(function (slotKey) {
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'qcm-slot-btn' + (slotKey === currentSlot ? ' active' : '');
      btn.textContent = slotsStatus.slots[slotKey].label;
      btn.addEventListener('click', function () {
        if (slotKey === currentSlot) return;
        loadSlot(slotKey);
      });
      slotSwitcher.appendChild(btn);
    });
  }

  function loadSlot(slotKey) {
    currentSlot = slotKey;
    currentCategory = CATEGORY_BY_SLOT[slotKey] || currentCategory;
    currentIndex = 0;
    questions = [];
    answeredByQuestionId = {};
    titleText.textContent = (slotsStatus.slots[slotKey] && slotsStatus.slots[slotKey].label) || 'QCM du jour';
    if (subtitleText) subtitleText.textContent = QCM_SUBTITLE_BY_CATEGORY[currentCategory] || QCM_SUBTITLE_BY_CATEGORY.actu;
    renderCategorySwitcher();
    renderSlotSwitcher();
    renderMessage('Chargement du QCM…');

    fetch('/api/daily-quiz/today?slot=' + encodeURIComponent(slotKey), { cache: 'no-store' })
      .then(function (res) { return res.json(); })
      .then(function (data) {
        questions = Array.isArray(data.questions) ? data.questions : [];
        if (!questions.length) {
          renderMessage('Ce QCM n’est pas encore prêt, reviens un peu plus tard.');
          return;
        }
        if (!voterKey) {
          currentIndex = 0;
          renderQuestion();
          return;
        }
        fetch('/api/daily-quiz/results?voterKey=' + encodeURIComponent(voterKey) + '&slot=' + encodeURIComponent(slotKey), { cache: 'no-store' })
          .then(function (res) { return res.json(); })
          .then(function (data) {
            (data.answers || []).forEach(function (a) { answeredByQuestionId[a.questionId] = a; });
            var firstUnanswered = questions.findIndex(function (q) { return !answeredByQuestionId[q.id]; });
            if (firstUnanswered === -1) {
              renderFinalScore();
            } else {
              currentIndex = firstUnanswered;
              renderQuestion();
            }
          })
          .catch(function () { currentIndex = 0; renderQuestion(); });
      })
      .catch(function () {
        renderMessage('Impossible de charger ce QCM pour le moment.');
      });
  }

  function init() {
    voterKey = typeof getKey === 'function' ? getKey() : null;

    fetch('/api/daily-quiz/status', { cache: 'no-store' })
      .then(function (res) { return res.json(); })
      .then(function (statusData) {
        slotsStatus = statusData && statusData.slots ? statusData : { slots: {}, defaultSlot: null };
        var params = new URLSearchParams(location.search);
        var requestedSlot = params.get('slot');
        var slotToLoad = (requestedSlot && slotsStatus.slots[requestedSlot] && slotsStatus.slots[requestedSlot].available)
          ? requestedSlot
          : slotsStatus.defaultSlot;
        if (!slotToLoad) {
          renderMessage('Le QCM du jour n’est pas encore prêt, reviens un peu plus tard.');
          return;
        }
        loadSlot(slotToLoad);
      })
      .catch(function () {
        renderMessage('Impossible de charger le QCM du jour pour le moment.');
      });
  }

  // getKey() est défini dans script.min.js : ce script inline n'est pas
  // concerné par l'attribut defer (ignoré sans src), il s'exécute donc avant
  // que script.min.js n'ait fini de charger — on attend DOMContentLoaded,
  // qui n'arrive qu'une fois tous les scripts deferred exécutés.
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function () {
      init();
      attachPageScrollFadeHint('#ffffff');
    });
  } else {
    init();
    attachPageScrollFadeHint('#ffffff');
  }
})();
</script>
</body>
</html>
