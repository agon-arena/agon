    function fetchAndRenderExplore(search) {
      listEl.innerHTML = '<p class="qcm-state-message"><img src="/sablier-96.png" alt="" class="qcm-loading-hourglass" aria-hidden="true">Chargement…</p>';
      updateExploreFadeHint();
      fetch('/api/users/notion-quizzes/explore' + (search ? '?search=' + encodeURIComponent(search) : ''))
        .then(function (res) { return res.json(); })
        .then(function (data) { renderExploreList(Array.isArray(data.items) ? data.items : []); })
        .catch(function () {
          listEl.innerHTML = '<p class="qcm-state-message">Impossible de charger la liste pour le moment.</p>';
          updateExploreFadeHint();
        });
    }

    function adoptExploreItem(slot, quizDate, itemBtn) {
      itemBtn.disabled = true;
      fetch('/api/users/notion-quizzes/adopt', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ legacyKey: voterKey, slot: slot, quizDate: quizDate })
      })
        .then(function (res) { return res.json(); })
        .then(function (data) {
          if (!data.ok) { itemBtn.disabled = false; return; }
          closeMesQcmExploreModal();
          loadMesQcm();
        })
        .catch(function () { itemBtn.disabled = false; });
    }

    var exploreSearchDebounce = null;
    searchInput.addEventListener('input', function () {
      clearTimeout(exploreSearchDebounce);
      exploreSearchDebounce = setTimeout(function () { fetchAndRenderExplore(searchInput.value.trim()); }, 300);
    });

    fetchAndRenderExplore('');
  }
  exploreBtn.addEventListener('click', openMesQcmExploreModal);
  if (mesAcquisBtn) mesAcquisBtn.addEventListener('click', function () {
    if (currentCategory === 'mesacquis') return;
    loadMesAcquis();
  });

  // Jauge de charge d'apprentissage (demande du 17/08/2026, cf. server.js
  // GET /api/users/learning-load + lib/spaced-repetition/learning-load.js
  // pour tout le calcul — ce bloc ne fait que l'afficher). Visible
  // uniquement sur "Découvrir" (appelée depuis loadMesQcm), jamais pendant
  // un QCM en cours ni sur Ancrer/Relier (cf. hideLoadGauge dans loadSlot).
  // "Charge de mémorisation" (demande du 17/08/2026), plus clair que le
  // simple "Charge" — précise qu'il s'agit du rythme des repasses à venir,
  // pas d'une charge générale de l'appli.
  var LOAD_GAUGE_LEVEL_META = {
    calm: { label: 'Charge de mémorisation calme', minRatio: 0, maxRatio: 0.5 },
    moderate: { label: 'Charge de mémorisation modérée', minRatio: 0.5, maxRatio: 1.0 },
    busy: { label: 'Charge de mémorisation élevée', minRatio: 1.0, maxRatio: 1.75 },
    overloaded: { label: 'Surcharge de mémorisation', minRatio: 1.75, maxRatio: 2.75 }
  };
  var LOAD_GAUGE_LEVEL_ORDER = ['calm', 'moderate', 'busy', 'overloaded'];

  // Repère "Idéal" sur le cadran (demande du 17/08/2026) : un rythme
  // confortable de repasses/jour, pas un seuil d'alerte — 12 tombe dans la
  // zone "modérée" (cf. LOAD_GAUGE_LEVEL_META), bien avant que le plafond
  // quotidien (LOAD_GAUGE_DAILY_CAP, dupliqué de
  // DAILY_QUIZ_ACQUIS_REVIEW_MAX_PER_DAY côté serveur, même logique que les
  // seuils déjà dupliqués ici) ne bascule la jauge en "élevée". Fixe : ne
  // dépend jamais de la charge réelle affichée par l'aiguille.
  var LOAD_GAUGE_DAILY_CAP = 20;
  var LOAD_GAUGE_IDEAL_QUESTIONS = 12;

  // Même calcul d'angle que l'aiguille (cf. renderLoadGauge), factorisé pour
  // être réutilisable par le repère "Idéal" ci-dessous sans dupliquer la
  // logique de zone/progress.
  function ratioToGaugeAngleDeg(ratio) {
    var level = LOAD_GAUGE_LEVEL_ORDER[0];
    for (var i = LOAD_GAUGE_LEVEL_ORDER.length - 1; i >= 0; i--) {
      if (ratio >= LOAD_GAUGE_LEVEL_META[LOAD_GAUGE_LEVEL_ORDER[i]].minRatio) {
        level = LOAD_GAUGE_LEVEL_ORDER[i];
        break;
      }
    }
    var meta = LOAD_GAUGE_LEVEL_META[level];
    var levelIndex = LOAD_GAUGE_LEVEL_ORDER.indexOf(level);
    var span = meta.maxRatio - meta.minRatio;
    var progress = span > 0 ? Math.max(0, Math.min(1, (ratio - meta.minRatio) / span)) : 1;
    return -90 + levelIndex * 45 + progress * 45;
  }

  (function initLoadGaugeIdealMarker() {
    var tick = document.getElementById('qcm-load-gauge-ideal-tick');
    var label = document.getElementById('qcm-load-gauge-ideal-label');
    if (!tick && !label) return;
    var angleDeg = ratioToGaugeAngleDeg(LOAD_GAUGE_IDEAL_QUESTIONS / LOAD_GAUGE_DAILY_CAP);
    if (tick) tick.setAttribute('transform', 'rotate(' + angleDeg + ' 100 100)');
    if (label) {
      var angleRad = angleDeg * Math.PI / 180;
      var r = 96;
      label.setAttribute('x', 100 + r * Math.sin(angleRad));
      label.setAttribute('y', 100 - r * Math.cos(angleRad));
    }
  })();

  function hideLoadGauge() {
    loadGaugeToken++;
    if (loadGaugeEl) {
      loadGaugeEl.classList.remove('visible');
      // .hidden ET la classe : une règle globale [hidden]{display:none !important}
      // (cf. .mnoria-tribunes-btn[hidden] plus haut dans ce projet, même piège) bat
      // toujours .qcm-load-gauge.visible{display:flex} tant que l'attribut reste
      // posé — poser seulement la classe n'aurait aucun effet visuel à l'affichage.
      loadGaugeEl.hidden = true;
    }
  }

  function renderLoadGauge(gauge) {
    if (!loadGaugeEl || !gauge) return;
    loadGaugeEl.hidden = false;
    var meta = LOAD_GAUGE_LEVEL_META[gauge.level] || LOAD_GAUGE_LEVEL_META.calm;
    var levelIndex = LOAD_GAUGE_LEVEL_ORDER.indexOf(gauge.level);
    if (levelIndex < 0) levelIndex = 0;
    // Chaque palier occupe un quart égal du cadran (0-45-90-135-180°), quelle
    // que soit la largeur réelle de sa plage de ratio — un cadran à 4 zones
    // de tailles très inégales (cf. seuils) serait moins lisible qu'à
    // tailles égales ; seule la position DANS le quart reflète le ratio réel.
    var span = meta.maxRatio - meta.minRatio;
    var progress = span > 0 ? Math.max(0, Math.min(1, (gauge.ratio - meta.minRatio) / span)) : 1;
    var angleDeg = -90 + levelIndex * 45 + progress * 45;
    if (loadGaugeNeedle) loadGaugeNeedle.style.transform = 'rotate(' + angleDeg + 'deg)';
    if (loadGaugeLabel) loadGaugeLabel.textContent = meta.label;
    if (loadGaugeCaption) {
      if (gauge.peakLoad > 0 && gauge.peakDayIndex >= 0) {
        var when = gauge.peakDayIndex === 0 ? "aujourd'hui" : (gauge.peakDayIndex === 1 ? 'demain' : 'dans ' + gauge.peakDayIndex + ' jours');
        loadGaugeCaption.textContent = 'Pic estimé : ' + gauge.peakLoad + ' question' + (gauge.peakLoad > 1 ? 's' : '') + ' ' + when + '.';
      } else {
        loadGaugeCaption.textContent = 'Aucune repasse programmée pour l’instant.';
      }
    }
    loadGaugeEl.classList.add('visible');
  }

  function fetchAndRenderLoadGauge() {
    if (!voterKey) { hideLoadGauge(); return; }
    var myToken = ++loadGaugeToken;
    fetch('/api/users/learning-load?legacyKey=' + encodeURIComponent(voterKey), { cache: 'no-store' })
      .then(function (res) { return res.json(); })
      .then(function (data) {
        if (myToken !== loadGaugeToken) return;
        if (!data || data.error) { hideLoadGauge(); return; }
        renderLoadGauge(data);
      })
      .catch(function () {
        if (myToken === loadGaugeToken) hideLoadGauge();
      });
  }

  // Pas un créneau à charger (cf. isCategoryAvailable) : liste les QCM que ce
  // visiteur a choisi de mémoriser (cf. server.js GET /api/users/notion-quizzes),
  // un clic sur l'un d'eux ouvre le vrai QCM via loadSlot.
  function loadMesQcm() {
    clearQuestionBackgroundImage();
    setParentIframeCloseVisible(true);
    // Demande du 17/08/2026 : croix du cadre aussi sur la liste "Découvrir"
    // elle-même (pas seulement une fois DANS un QCM précis), comme elle
    // apparaît déjà sur "Ancrer"/"Relier" dès leur chargement (cf. loadSlot,
    // setPanelCloseVisible(true) une fois les questions chargées). Son clic
    // ferme directement l'iframe plutôt que de "revenir" à Découvrir — cf.
    // le onclick de #qcm-panel-close plus haut, qui distingue ce cas.
    setPanelCloseVisible(true);
    var myToken = ++loadToken;
    currentCategory = 'mesqcm';
    currentSlot = null;
    currentQuizDate = null;
    titleText.textContent = CATEGORY_LABELS.mesqcm;
    if (subtitleText) subtitleText.textContent = QCM_SUBTITLE_BY_CATEGORY.mesqcm;
    renderCategorySwitcher();
    fetchAndRenderLoadGauge();

    if (!voterKey) {
      renderMesQcmEmpty();
      return;
    }
    renderMessage('Chargement de tes QCM…');
    fetch('/api/users/notion-quizzes?legacyKey=' + encodeURIComponent(voterKey), { cache: 'no-store' })
      .then(function (res) { return res.json(); })
      .then(function (data) {
        if (myToken !== loadToken) return;
        var quizzes = Array.isArray(data.quizzes) ? data.quizzes : [];
        syncPendingNotionQuizGenerations(quizzes);
        renderMesQcmList(quizzes);
      })
      .catch(function () {
        if (myToken === loadToken) renderMessage('Impossible de charger tes QCM pour le moment.');
      });
  }

  function renderMesQcmEmpty() {
    renderMessage("Tu n'as encore mémorisé aucune notion — tape un sujet ci-dessus, ou clique sur « Mémoriser » n'importe où sur le site pour commencer.");
  }

  // Une seule pastille : la thématique principale qui pilote également le
  // classement de la connaissance dans "Mes apprentissages". Le slice est
  // une défense côté client pour les réponses encore mises en cache dans un
  // ancien format multithématique.
  function renderThemeTags(themes) {
    if (!Array.isArray(themes) || !themes.length) return '';
    return '<div class="qcm-mesqcm-themes">' +
      themes.slice(0, 1).map(function (t) { return '<span class="qcm-mesqcm-theme-tag">' + escapeHtml(t) + '</span>'; }).join('') +
      '</div>';
  }

  // "Les liens" (cf. server.js findAndStoreCultureGeneraleNotionLink) : connaissances déjà
  // apprises reliées à celle-ci (ex. "Voltaire" ↔ "Les Lumières"), un lien pédagogique
  // direct expliqué en 2-5 mots. Cliquer ouvre la fiche liée (cf. openFicheOverlay, qui
  // câble le clic sur .qcm-fiche-link-item). Tableau vide (aucun lien détecté, ou pas
  // encore) : rien affiché plutôt qu'une section vide visible.
  function renderLinksSection(links) {
    if (!Array.isArray(links) || !links.length) return '';
    return '<h3 class="qcm-fiche-section-label">Les liens</h3>' +
      '<div class="qcm-fiche-links">' +
      links.map(function (l) {
        return '<button type="button" class="qcm-fiche-link-item" data-link-type="' + escapeHtml(l.type) + '" data-link-source-id="' + escapeHtml(l.sourceId) + '" data-link-name="' + escapeHtml(l.name) + '">' +
          '<span class="qcm-fiche-link-label">' + escapeHtml(l.label) + '</span>' +
          '<span class="qcm-fiche-link-name">' + escapeHtml(l.name) + '</span>' +
          '</button>';
      }).join('') +
      '</div>';
  }

  // Un tableau (nom + progression) pour une liste de QCM déjà filtrée —
  // `allQuizzes` sert uniquement à retrouver l'index d'origine
  // (data-mesqcm-index), pour que le câblage des clics reste unique même
  // quand un même QCM apparaît dans plusieurs rubriques (cf. renderMesQcmList).
  // Cliquer sur le nom ouvre directement la fiche (openMesQcmFiche) — plus de
  // bouton "Fiche" dédié à côté (demande du 12/08/2026, redondant).
  // Clé stable d'un apprentissage à travers ses éventuels doublons d'affichage
  // (un même QCM apparaît dans "En attente de réalisation" ET dans chacune de
  // ses rubriques thématiques, cf. renderMesQcmList) : slot+date identifie le
  // QCM de façon unique côté serveur (cf. /api/users/notion-quizzes/remove).
  function getMesQcmRowKey(q) {
    return q.slot + '|' + q.quizDate;
  }

  function renderMesQcmTableHtml(list, allQuizzes) {
    var html = '<div class="qcm-mesqcm-table-shell">';
    html += '<div class="qcm-mesqcm-table-wrap" tabindex="0" role="region" aria-label="Tableau défilable horizontalement">';
    html += '<table class="qcm-mesqcm-table">';
    html += '<thead><tr><th>Apprentissage</th><th>État</th><th>Ancrage</th><th></th><th></th></tr></thead><tbody>';
    list.forEach(function (q) {
      var index = allQuizzes.indexOf(q);
      var meta = ACQUIS_SOURCE_TYPE_META[q.sourceType] || ACQUIS_SOURCE_TYPE_META.histoire;
      var progressPct = Math.max(0, Math.min(100, Number(q.progressPct) || 0));
      var badgeHtml = q.validated
        ? '<span class="qcm-acquis-badge is-validated"><i class="fa-solid fa-circle-check"></i> Acquis</span>'
        : '<span class="qcm-acquis-badge">' + progressPct + '%</span>';
      var questionCount = Number(q.questionCount) || 0;
      var stateHtml = q.realized
        ? '<span class="qcm-mesqcm-state is-realized">Réalisé</span>'
        : (q.inProgress
          ? '<span class="qcm-mesqcm-state is-inprogress">En cours (' + (Number(q.answeredCount) || 0) + '/' + questionCount + ')</span>'
          : '<span class="qcm-mesqcm-state">En attente de réalisation</span>');
      html += '<tr>';
      html += '<td><button type="button" class="qcm-mesqcm-name-btn" data-mesqcm-index="' + index + '">';
      html += '<i class="fa-solid ' + meta.icon + '" aria-hidden="true"></i><span>' + escapeHtml(q.label || meta.label) + '</span>';
      if (questionCount) html += '<span class="qcm-mesqcm-question-count">(' + questionCount + (questionCount > 1 ? ' questions' : ' question') + ')</span>';
      html += '</button></td>';
      html += '<td>' + stateHtml + '</td>';
      html += '<td>' + badgeHtml + '</td>';
      html += '<td><button type="button" class="qcm-mesqcm-delete-btn" data-mesqcm-delete-index="' + index + '" aria-label="Supprimer cet apprentissage" title="Supprimer"><i class="fa-solid fa-trash-can"></i></button></td>';
      html += '<td class="qcm-mesqcm-td-check"><input type="checkbox" class="qcm-mesqcm-row-checkbox" data-mesqcm-key="' + escapeHtml(getMesQcmRowKey(q)) + '" aria-label="Sélectionner ' + escapeHtml(q.label || meta.label) + '"></td>';
      html += '</tr>';
    });
    html += '</tbody></table></div>';
    html += '<div class="qcm-mesqcm-table-scroll-hint" aria-hidden="true"></div></div>';
    return html;
  }

  var MES_QCM_PAGE_SIZE = 10;

  // Dix connaissances maximum à la fois dans chaque liste. Les autres
  // restent accessibles par les flèches et le numéro de page placés sous le
  // tableau, sans recharger la page ni perdre l'accordéon ouvert.
  function renderMesQcmPaginatedTablesHtml(list, allQuizzes) {
    var pageCount = Math.max(1, Math.ceil(list.length / MES_QCM_PAGE_SIZE));
    var html = '<div class="qcm-mesqcm-paged-list" data-page-count="' + pageCount + '" data-current-page="0">';
    for (var pageIndex = 0; pageIndex < pageCount; pageIndex += 1) {
      var pageItems = list.slice(pageIndex * MES_QCM_PAGE_SIZE, (pageIndex + 1) * MES_QCM_PAGE_SIZE);
      html += '<div class="qcm-mesqcm-page" data-page-index="' + pageIndex + '"' + (pageIndex ? ' hidden' : '') + '>';
      html += renderMesQcmTableHtml(pageItems, allQuizzes);
      html += '</div>';
    }
    if (pageCount > 1) {
      html += '<nav class="qcm-mesqcm-pagination" aria-label="Pages des connaissances">';
      html += '<button type="button" class="qcm-mesqcm-pagination-btn is-previous" aria-label="Page précédente" disabled><i class="fa-solid fa-chevron-left" aria-hidden="true"></i></button>';
      html += '<span class="qcm-mesqcm-pagination-label"><span class="qcm-mesqcm-current-page">1</span> / ' + pageCount + '</span>';
      html += '<button type="button" class="qcm-mesqcm-pagination-btn is-next" aria-label="Page suivante"><i class="fa-solid fa-chevron-right" aria-hidden="true"></i></button>';
      html += '</nav>';
    }
    html += '</div>';
    return html;
  }

  function syncMesQcmTableScrollHint(shell) {
    var scroller = shell && shell.querySelector('.qcm-mesqcm-table-wrap');
    if (!scroller) return;
    var hasOverflow = scroller.scrollWidth > scroller.clientWidth + 2;
    var atEnd = scroller.scrollLeft + scroller.clientWidth >= scroller.scrollWidth - 4;
    shell.classList.toggle('has-right-overflow', hasOverflow && !atEnd);
    shell.classList.toggle('has-left-overflow', hasOverflow && scroller.scrollLeft > 3);
  }

  function refreshMesQcmVisibleTableHints(scope) {
    requestAnimationFrame(function () {
      (scope || body).querySelectorAll('.qcm-mesqcm-table-shell').forEach(syncMesQcmTableScrollHint);
    });
  }

  function initMesQcmTableScrollHints() {
    body.querySelectorAll('.qcm-mesqcm-table-shell').forEach(function (shell) {
      var scroller = shell.querySelector('.qcm-mesqcm-table-wrap');
      if (!scroller) return;
      scroller.addEventListener('scroll', function () { syncMesQcmTableScrollHint(shell); }, { passive: true });
      if (typeof ResizeObserver === 'function') {
        var resizeObserver = new ResizeObserver(function () { syncMesQcmTableScrollHint(shell); });
        resizeObserver.observe(scroller);
        resizeObserver.observe(scroller.querySelector('.qcm-mesqcm-table'));
      }
      requestAnimationFrame(function () { syncMesQcmTableScrollHint(shell); });
    });
  }

  function initMesQcmPagination() {
    body.querySelectorAll('.qcm-mesqcm-paged-list').forEach(function (pagedList) {
      var pageCount = Number(pagedList.getAttribute('data-page-count')) || 1;
      var previousBtn = pagedList.querySelector('.qcm-mesqcm-pagination-btn.is-previous');
      var nextBtn = pagedList.querySelector('.qcm-mesqcm-pagination-btn.is-next');
      var pageLabel = pagedList.querySelector('.qcm-mesqcm-current-page');

      function showPage(requestedPage, moveToTop) {
        var pageIndex = Math.max(0, Math.min(pageCount - 1, requestedPage));
        pagedList.setAttribute('data-current-page', String(pageIndex));
        pagedList.querySelectorAll('.qcm-mesqcm-page').forEach(function (page) {
          page.hidden = Number(page.getAttribute('data-page-index')) !== pageIndex;
        });
        if (previousBtn) previousBtn.disabled = pageIndex === 0;
        if (nextBtn) nextBtn.disabled = pageIndex === pageCount - 1;
        if (pageLabel) pageLabel.textContent = String(pageIndex + 1);
        refreshMesQcmVisibleTableHints(pagedList);
        if (moveToTop) requestAnimationFrame(function () {
          pagedList.scrollIntoView({ behavior: 'smooth', block: 'start' });
        });
      }

      if (previousBtn) previousBtn.addEventListener('click', function () {
        showPage((Number(pagedList.getAttribute('data-current-page')) || 0) - 1, true);
      });
      if (nextBtn) nextBtn.addEventListener('click', function () {
        showPage((Number(pagedList.getAttribute('data-current-page')) || 0) + 1, true);
      });
    });
  }

  function initMesQcmThemeMenus() {
    body.querySelectorAll('.qcm-mesqcm-theme-toggle').forEach(function (toggle) {
      toggle.addEventListener('click', function () {
        var group = toggle.closest('.qcm-mesqcm-theme-group');
        var isOpen = group.classList.toggle('is-open');
        toggle.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
        if (isOpen) refreshMesQcmVisibleTableHints(group);
      });
    });
    body.querySelectorAll('.qcm-mesqcm-theme-collapse').forEach(function (collapseBtn) {
      collapseBtn.addEventListener('click', function () {
        var group = collapseBtn.closest('.qcm-mesqcm-theme-group');
        var toggle = group && group.querySelector('.qcm-mesqcm-theme-toggle');
        if (!group || !toggle) return;
        group.classList.remove('is-open');
        toggle.setAttribute('aria-expanded', 'false');
        requestAnimationFrame(function () {
          toggle.scrollIntoView({ behavior: 'smooth', block: 'center' });
          try { toggle.focus({ preventScroll: true }); } catch (_) { toggle.focus(); }
        });
      });
    });
  }

  // Dans chaque rubrique : les apprentissages encore à réaliser restent en
  // tête, puis chaque groupe d'état est classé alphabétiquement en français.
  function compareMesQcmByStateThenName(a, b) {
    var aRealized = !!a.realized;
    var bRealized = !!b.realized;
    if (aRealized !== bRealized) return aRealized ? 1 : -1;
    var aMeta = ACQUIS_SOURCE_TYPE_META[a.sourceType] || ACQUIS_SOURCE_TYPE_META.histoire;
    var bMeta = ACQUIS_SOURCE_TYPE_META[b.sourceType] || ACQUIS_SOURCE_TYPE_META.histoire;
    return String(a.label || aMeta.label || '').localeCompare(String(b.label || bMeta.label || ''), 'fr', {
      sensitivity: 'base',
      numeric: true
    });
  }

  // Regroupé par thématique principale (cf. server.js
  // getPrimaryNotionQuizTheme) avec de vraies rubriques repliables, plutôt
  // qu'un simple tableau plat — chaque connaissance n'apparaît que dans UNE
  // rubrique thématique. "Autres" regroupe les QCM sans thématique
  // résolue (classification pas encore faite ou échouée), toujours en
  // dernier. Une rubrique prioritaire "En attente de réalisation" regroupe
  // tout en haut, une seule fois, les QCM non réalisés. Les rubriques
  // thématiques restent ensuite triées par ordre alphabétique, fermées par
  // défaut et paginées par groupes de dix. À l'intérieur d'une rubrique : le
  // nom (ouvre/poursuit le QCM, cf. loadSlot), la progression
  // vers la mémorisation durable ("n / 4", répétition espacée, cf.
  // computeCultureGeneraleStreaks côté serveur) et un accès à sa fiche
  // (détail de la notion + corrigé complet des questions, cf.
  // openMesQcmFiche).
  // Câblage partagé entre renderMesQcmList (Découvrir, "En attente" seulement) et
  // renderMesAcquisList ("Mes acquis", cf. loadMesAcquis) : mêmes tableaux paginés
  // (renderMesQcmPaginatedTablesHtml), mêmes interactions (fiche, suppression, sélection
  // groupée), juste une composition différente de sections.
  function wireMesQcmListInteractions(quizzes) {
    signalIframeReady();
    initMesQcmPagination();
    initMesQcmTableScrollHints();
    initMesQcmThemeMenus();
    initMesQcmBulkSelection(quizzes);

    body.querySelectorAll('[data-mesqcm-index]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var q = quizzes[Number(btn.getAttribute('data-mesqcm-index'))];
        openMesQcmActionMenu(btn, q, quizzes);
      });
    });
    body.querySelectorAll('[data-mesqcm-delete-index]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var q = quizzes[Number(btn.getAttribute('data-mesqcm-delete-index'))];
        removeMesQcmItem(q, quizzes, btn);
      });
    });
  }

  var MESQCM_BULK_BAR_HTML = '<div class="qcm-mesqcm-bulk-bar" id="qcm-mesqcm-bulk-bar">' +
    '<label class="qcm-mesqcm-bulk-selectall"><input type="checkbox" id="qcm-mesqcm-select-all"> Tout cocher</label>' +
    '<button type="button" class="qcm-mesqcm-bulk-delete-btn" id="qcm-mesqcm-bulk-delete-btn" disabled>' +
    '<i class="fa-solid fa-trash-can"></i> Supprimer la sélection</button>' +
    '</div>';

  // Découvrir (demande du 16/08/2026, complétée le 17/08/2026) : "Mes
  // apprentissages en cours" (des questions déjà répondues, mais pas
  // toutes — cf. q.inProgress côté serveur) au-dessus de "En attente de
  // réalisation" (jamais commencés) — "Tous mes apprentissages" (classé par
  // thématique) reste dans "Mes acquis", cf. renderMesAcquisList/loadMesAcquis.
  function renderMesQcmList(quizzes) {
    currentMesQcmQuizzes = quizzes;
    if (!quizzes.length) { renderMesQcmEmpty(); return; }

    var pendingQuizzes = quizzes.filter(function (q) { return !q.realized; })
      .slice()
      .sort(compareMesQcmByStateThenName);
    var inProgressQuizzes = pendingQuizzes.filter(function (q) { return q.inProgress; });
    var notStartedQuizzes = pendingQuizzes.filter(function (q) { return !q.inProgress; });

    var html = MESQCM_BULK_BAR_HTML;
    html += '<div class="qcm-mesqcm-groups">';
    if (inProgressQuizzes.length) {
      html += '<section class="qcm-mesqcm-group qcm-mesqcm-group--inprogress">';
      html += '<h2 class="qcm-mesqcm-group-title">Mes apprentissages en cours</h2>';
      html += renderMesQcmPaginatedTablesHtml(inProgressQuizzes, quizzes);
      html += '</section>';
    }
    if (notStartedQuizzes.length) {
      html += '<section class="qcm-mesqcm-group qcm-mesqcm-group--pending">';
      html += '<h2 class="qcm-mesqcm-group-title">En attente de réalisation</h2>';
      html += renderMesQcmPaginatedTablesHtml(notStartedQuizzes, quizzes);
      html += '</section>';
    }
    if (!pendingQuizzes.length) {
      html += '<p class="qcm-state-message">Rien en attente — retrouve tes apprentissages déjà réalisés dans « Mes acquis ».</p>';
    }
    html += '</div>';
    body.innerHTML = html;
    wireMesQcmListInteractions(quizzes);
  }

  function renderMesAcquisEmpty() {
    renderMessage("Tu n'as encore rien réalisé — les apprentissages que tu termines apparaîtront ici, classés par thématique.");
  }

  // "Mes acquis" : tous les apprentissages (réalisés ou non), classés par thématique — même
  // contenu que l'ancienne section "Tous mes apprentissages" de Découvrir, déplacé ici le
  // 16/08/2026.
  function renderMesAcquisList(quizzes) {
    currentMesQcmQuizzes = quizzes;
    if (!quizzes.length) { renderMesAcquisEmpty(); return; }

    var byTheme = {};
    var untagged = [];
    quizzes.forEach(function (q) {
      // Rubrique dédiée plutôt que "Autres" : un lien "comprendre" n'a jamais de thématique
      // résolue (getPrimaryNotionQuizTheme côté serveur, propre aux QCM issus d'un débat) —
      // sans ce cas particulier, ces liens se retrouveraient noyés dans "Autres" au lieu
      // d'apparaître sous leur propre rubrique (demande du 16/08/2026).
      var primaryTheme = q.sourceType === 'comprendre'
        ? ACQUIS_SOURCE_TYPE_META.comprendre.label
        : (Array.isArray(q.themes) ? q.themes.filter(Boolean)[0] : null);
      if (!primaryTheme) { untagged.push(q); return; }
      (byTheme[primaryTheme] = byTheme[primaryTheme] || []).push(q);
    });
    var themeNames = Object.keys(byTheme).sort(function (a, b) { return a.localeCompare(b, 'fr', { sensitivity: 'base' }); });
    if (untagged.length) { byTheme['Autres'] = untagged; themeNames.push('Autres'); }

    // Sélection groupée (demande du 12/08/2026) : une seule case "Tout cocher" pour toute la
    // page, pas une par table — la sélection est tenue par clé plutôt que par ligne (cf.
    // getMesQcmRowKey/initMesQcmBulkSelection).
    var html = MESQCM_BULK_BAR_HTML;
    html += '<div class="qcm-mesqcm-groups">';
    html += '<section class="qcm-mesqcm-group qcm-mesqcm-group--all">';
    html += '<h2 class="qcm-mesqcm-group-title">Tous mes apprentissages</h2>';
    themeNames.forEach(function (theme) {
      var themeQuizzes = byTheme[theme].slice().sort(compareMesQcmByStateThenName);
      html += '<section class="qcm-mesqcm-theme-group">';
      html += '<button type="button" class="qcm-mesqcm-theme-toggle" aria-expanded="false">';
      html += '<span>' + escapeHtml(theme) + '</span>';
      html += '<span class="qcm-mesqcm-theme-count">' + themeQuizzes.length + '</span>';
      html += '<span class="qcm-mesqcm-theme-action"><span class="qcm-mesqcm-theme-action-open">Masquer</span></span>';
      html += '<i class="fa-solid fa-chevron-right qcm-mesqcm-theme-chevron" aria-hidden="true"></i>';
      html += '</button>';
      html += '<div class="qcm-mesqcm-theme-panel">';
      html += renderMesQcmPaginatedTablesHtml(themeQuizzes, quizzes);
      html += '<button type="button" class="qcm-mesqcm-theme-collapse"><i class="fa-solid fa-chevron-up" aria-hidden="true"></i> Masquer</button>';
      html += '</div>';
      html += '</section>';
    });
    html += '</section>';
    html += '</div>';
    body.innerHTML = html;
    wireMesQcmListInteractions(quizzes);
  }

  // Même source de données que Découvrir (GET /api/users/notion-quizzes) : pas de nouvelle
  // route côté serveur, juste une composition d'affichage différente (cf. renderMesAcquisList).
  function loadMesAcquis() {
    clearQuestionBackgroundImage();
    setParentIframeCloseVisible(true);
    setPanelCloseVisible(false);
    hideLoadGauge();
    var myToken = ++loadToken;
    currentCategory = 'mesacquis';
    currentSlot = null;
    currentQuizDate = null;
    titleText.textContent = 'Mes acquis';
    if (subtitleText) subtitleText.textContent = 'Tout ce que tu as déjà appris, classé par thématique.';
    renderCategorySwitcher();

    if (!voterKey) {
      renderMesAcquisEmpty();
      return;
    }
    renderMessage('Chargement de tes acquis…');
    fetch('/api/users/notion-quizzes?legacyKey=' + encodeURIComponent(voterKey), { cache: 'no-store' })
      .then(function (res) { return res.json(); })
      .then(function (data) {
        if (myToken !== loadToken) return;
        var quizzes = Array.isArray(data.quizzes) ? data.quizzes : [];
        renderMesAcquisList(quizzes);
      })
      .catch(function () {
        if (myToken === loadToken) renderMessage('Impossible de charger tes acquis pour le moment.');
      });
  }

  // Retire un ou plusieurs apprentissages de la liste personnelle (jamais le
  // QCM partagé, cf. server.js POST /api/users/notion-quizzes/remove) — même
  // modale de confirmation que les autres suppressions définitives du site
  // (showDeleteConfirmModal, cf. deleteComment/deleteArgument/deleteDebate
  // dans script.min.js, déjà chargé sur cette page), ré-affiche la liste
  // sans les items une fois le retrait confirmé côté serveur (jamais
  // optimiste : suppression définitive, contrairement au clic "Mémoriser"
  // ailleurs sur le site). Une requête par item (pas de route batch côté
  // serveur) mais en parallèle : la sélection groupée reste plafonnée à une
  // page de tableau (10, cf. MES_QCM_PAGE_SIZE), largement sous la limite de
  // débit de la route.
  function removeMesQcmItem(q, quizzes, btn) {
    removeMesQcmItems([q], quizzes, btn);
  }

  function removeMesQcmItems(selectedQuizzes, quizzes, btn) {
    if (!selectedQuizzes.length || !voterKey) return;
    var count = selectedQuizzes.length;
    showDeleteConfirmModal({
      title: count > 1 ? 'Supprimer ces ' + count + ' apprentissages ?' : 'Supprimer cet apprentissage ?',
      text: 'Cette suppression est définitive.',
      onConfirm: function () {
        btn.disabled = true;
        Promise.all(selectedQuizzes.map(function (q) {
          return fetch('/api/users/notion-quizzes/remove', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ legacyKey: voterKey, slot: q.slot, quizDate: q.quizDate })
          })
            .then(function (res) { return res.json(); })
            .then(function (data) { return data.ok ? q : null; })
            .catch(function () { return null; });
        })).then(function (results) {
          var anyRemoved = false;
          results.forEach(function (removed) {
            if (!removed) return;
            anyRemoved = true;
            var index = quizzes.indexOf(removed);
            if (index !== -1) quizzes.splice(index, 1);
          });
          if (anyRemoved) renderMesQcmList(quizzes);
          else btn.disabled = false;
        });
      }
    });
  }

  // Barre de sélection groupée au-dessus des rubriques (cf. renderMesQcmList) :
  // toutes les cases (y compris celles d'apprentissages dupliqués entre "En
  // attente" et une rubrique thématique, cf. getMesQcmRowKey) sont déjà dans
  // le DOM au moment de cet appel — pas de pagination réseau, seulement des
  // pages masquées (cf. renderMesQcmPaginatedTablesHtml) — donc "Tout cocher"
  // porte bien sur l'ensemble de la liste, pages/rubriques repliées incluses.
  function initMesQcmBulkSelection(quizzes) {
    var selectAllCheckbox = document.getElementById('qcm-mesqcm-select-all');
    var deleteBtn = document.getElementById('qcm-mesqcm-bulk-delete-btn');
    if (!selectAllCheckbox || !deleteBtn) return;
    var rowCheckboxes = Array.prototype.slice.call(body.querySelectorAll('.qcm-mesqcm-row-checkbox'));
    if (!rowCheckboxes.length) return;

    function selectedKeySet() {
      var keys = {};
      rowCheckboxes.forEach(function (cb) { if (cb.checked) keys[cb.getAttribute('data-mesqcm-key')] = true; });
      return keys;
    }

    function updateBulkBarState() {
      var selectedCount = Object.keys(selectedKeySet()).length;
      deleteBtn.disabled = selectedCount === 0;
      deleteBtn.innerHTML = '<i class="fa-solid fa-trash-can"></i> Supprimer la sélection' + (selectedCount ? ' (' + selectedCount + ')' : '');
      var allChecked = rowCheckboxes.every(function (cb) { return cb.checked; });
      selectAllCheckbox.checked = allChecked;
      selectAllCheckbox.indeterminate = !allChecked && selectedCount > 0;
    }

    rowCheckboxes.forEach(function (cb) {
      cb.addEventListener('change', function () {
        var key = cb.getAttribute('data-mesqcm-key');
        rowCheckboxes.forEach(function (other) {
          if (other !== cb && other.getAttribute('data-mesqcm-key') === key) other.checked = cb.checked;
        });
        updateBulkBarState();
      });
    });

    selectAllCheckbox.addEventListener('change', function () {
      var checked = selectAllCheckbox.checked;
      rowCheckboxes.forEach(function (cb) { cb.checked = checked; });
      updateBulkBarState();
    });

    deleteBtn.addEventListener('click', function () {
      var keys = selectedKeySet();
      var selectedQuizzes = quizzes.filter(function (q) { return keys[getMesQcmRowKey(q)]; });
      removeMesQcmItems(selectedQuizzes, quizzes, deleteBtn);
    });

    updateBulkBarState();
  }

  // Corrigé d'une question dans la fiche "Mes QCM" — jamais interactif
  // (lecture seule, contrairement au vrai QCM) : la bonne réponse est
  // directement mise en évidence (cf. .is-correct), avec son explication.
  function renderFicheQuestionCorrige(q, index) {
    var type = q.type || 'qcm';
    var html = '<div class="qcm-fiche-corrige-item">';
    html += '<p class="qcm-fiche-corrige-num">Question ' + (index + 1) + '</p>';
    var questionText = type === 'texte_a_trous'
      ? escapeHtml(q.question).split(FILL_BLANK_MARKER).join('<span class="qcm-blank">' + FILL_BLANK_MARKER + '</span>')
      : escapeHtml(q.question);
    html += '<p class="qcm-fiche-corrige-question">' + questionText + '</p>';

    if (type === 'association') {
      html += '<ul class="qcm-fiche-corrige-list">';
      (q.pairs || []).forEach(function (p) {
        html += '<li class="is-correct">' + escapeHtml(p.left) + ' → ' + escapeHtml(p.right) + '</li>';
      });
      html += '</ul>';
    } else if (type === 'ordre') {
      html += '<ol class="qcm-fiche-corrige-list qcm-fiche-corrige-ordered">';
      (q.items || []).forEach(function (it) {
        html += '<li class="is-correct">' + escapeHtml(it) + '</li>';
      });
      html += '</ol>';
    } else if (type === 'qcm_multi') {
      var correctSet = {};
      (q.correctIndexes || []).forEach(function (i) { correctSet[i] = true; });
      html += '<ul class="qcm-fiche-corrige-list">';
      (q.options || []).forEach(function (opt, i) {
        html += '<li' + (correctSet[i] ? ' class="is-correct"' : '') + '>' + escapeHtml(opt) + '</li>';
      });
      html += '</ul>';
    } else {
      html += '<ul class="qcm-fiche-corrige-list">';
      (q.options || []).forEach(function (opt, i) {
        html += '<li' + (i === q.correctIndex ? ' class="is-correct"' : '') + '>' + escapeHtml(opt) + '</li>';
      });
      html += '</ul>';
    }

    if (q.explanation) html += '<p class="qcm-fiche-corrige-explanation">' + escapeHtml(q.explanation) + '</p>';
    html += '</div>';
    return html;
  }

  // Clic sur le nom d'un apprentissage dans le tableau "Mes apprentissages" :
  // trois actions possibles (Fiche / QCM / Supprimer) plus le taux d'ancrage,
  // dans une vraie fenêtre modale centrée (même gabarit que la fiche,
  // .qcm-fiche-overlay/.qcm-fiche-modal) — pas un petit menu ancré sous le
  // bouton (demande du 13/08/2026 : "trop petit, on dirait un menu"). Un seul
  // popup ouvert à la fois (closeMesQcmActionModal le ferme au préalable).
  var mesQcmActionModalEls = null;
  function closeMesQcmActionModal() {
    if (!mesQcmActionModalEls) return;
    mesQcmActionModalEls.overlay.remove();
    document.removeEventListener('keydown', mesQcmActionModalEls.onKeydown);
    try { window.parent.postMessage({ type: 'mnoria:qcm-fiche-visibility', open: false }, '*'); } catch (e) {}
    mesQcmActionModalEls = null;
  }
  function openMesQcmActionMenu(btn, q, quizzes) {
    closeMesQcmActionModal();
    var meta = ACQUIS_SOURCE_TYPE_META[q.sourceType] || ACQUIS_SOURCE_TYPE_META.histoire;
    var doLabel = q.realized ? 'Refaire le QCM' : (q.inProgress ? 'Continuer le QCM' : 'Faire le QCM');
    var progressPct = Math.max(0, Math.min(100, Number(q.progressPct) || 0));
    var ancrageBadgeHtml = q.validated
      ? '<span class="qcm-acquis-badge is-validated"><i class="fa-solid fa-circle-check"></i> Acquis</span>'
      : '<span class="qcm-acquis-badge">' + progressPct + '%</span>';

    var modalHtml =
      '<div class="qcm-fiche-modal qcm-mesqcm-action-modal">' +
        '<div class="qcm-fiche-head">' +
          '<p class="qcm-fiche-rubric"><i class="fa-solid ' + meta.icon + '"></i> ' + escapeHtml(meta.label) + '</p>' +
          '<button type="button" class="qcm-fiche-close" aria-label="Fermer"><i class="fa-solid fa-xmark"></i></button>' +
        '</div>' +
        '<p class="qcm-mesqcm-action-modal-name">' + escapeHtml(q.label || meta.label) + '</p>' +
        '<div class="qcm-mesqcm-action-menu-info"><span>Ancrage</span>' + ancrageBadgeHtml + '</div>' +
        '<button type="button" class="qcm-mesqcm-action-menu-item" data-action="fiche"><i class="fa-solid fa-file-lines"></i> Consulter la fiche</button>' +
        '<button type="button" class="qcm-mesqcm-action-menu-item" data-action="quiz"><i class="fa-solid fa-play"></i> ' + escapeHtml(doLabel) + '</button>' +
        '<button type="button" class="qcm-mesqcm-action-menu-item qcm-mesqcm-action-menu-item-danger" data-action="delete"><i class="fa-solid fa-trash-can"></i> Supprimer</button>' +
      '</div>';

    var overlay = document.createElement('div');
    overlay.className = 'qcm-fiche-overlay';
    overlay.innerHTML = '<div class="qcm-fiche-overlay-inner">' + modalHtml + '</div>';
    document.body.appendChild(overlay);
    try { window.parent.postMessage({ type: 'mnoria:qcm-fiche-visibility', open: true }, '*'); } catch (e) {}

    function onKeydown(e) { if (e.key === 'Escape') closeMesQcmActionModal(); }
    overlay.addEventListener('click', function (e) {
      if (e.target === overlay || e.target.classList.contains('qcm-fiche-overlay-inner')) closeMesQcmActionModal();
    });
    document.addEventListener('keydown', onKeydown);
    overlay.querySelector('.qcm-fiche-close').addEventListener('click', closeMesQcmActionModal);
    overlay.querySelector('[data-action="fiche"]').addEventListener('click', function () {
      closeMesQcmActionModal();
      openMesQcmFiche(q);
    });
    overlay.querySelector('[data-action="quiz"]').addEventListener('click', function () {
      closeMesQcmActionModal();
      // Choix de l'ordre dès le premier lancement (demande du 13/08/2026,
      // jusqu'ici réservé à "Refaire") — même popup, même style.
      showQuizOrderPicker(function (shuffled) {
        loadSlot(q.slot, q.quizDate, q.label, shuffled);
      });
    });
    overlay.querySelector('[data-action="delete"]').addEventListener('click', function () {
      closeMesQcmActionModal();
      removeMesQcmItem(q, quizzes, btn);
    });

    mesQcmActionModalEls = { overlay: overlay, onKeydown: onKeydown };
  }

  // Fiche d'un QCM de notion (cf. server.js GET /api/users/notion-quizzes/fiche) :
  // détail pur de la notion (nom, image, explication), suivi du corrigé
  // complet de ses questions — jamais filtré par ce que ce visiteur précis
  // a déjà répondu, la fiche sert de support de révision.
  var mesQcmFicheToken = 0;
  function openMesQcmFicheFromUrl(url, fallbackLabel) {
    var myToken = ++mesQcmFicheToken;
    fetch(url, { cache: 'no-store' })
      .then(function (res) { return res.json(); })
      .then(function (data) {
        if (myToken !== mesQcmFicheToken) return;
        if (data.error) throw new Error(data.error);
        var meta = ACQUIS_SOURCE_TYPE_META[data.sourceType] || ACQUIS_SOURCE_TYPE_META.histoire;
        var detail = data.sourceDetail || { meta: null, sections: [] };
        var corrigeHtml = '<h3 class="qcm-fiche-section-label">Questions et réponses</h3>';
        (data.questions || []).forEach(function (q, i) { corrigeHtml += renderFicheQuestionCorrige(q, i); });
        openFicheOverlay(buildFicheModalHtml(meta.icon, meta.label, data.label || fallbackLabel || meta.label, detail, corrigeHtml, data.themes, data.links));
      })
      .catch(function () {
        if (myToken !== mesQcmFicheToken) return;
        openFicheOverlay(buildFicheModalHtml('fa-circle-exclamation', 'Fiche', fallbackLabel || 'Cette notion', { meta: null, sections: [{ label: null, text: 'Impossible de charger la fiche pour le moment.' }] }, ''));
      });
  }
  function openMesQcmFiche(quiz) {
    openMesQcmFicheFromUrl('/api/users/notion-quizzes/fiche?slot=' + encodeURIComponent(quiz.slot) + '&date=' + encodeURIComponent(quiz.quizDate) + '&legacyKey=' + encodeURIComponent(voterKey || ''), quiz.label);
  }
  // Ouvre la fiche d'une connaissance liée (cf. renderLinksSection) : retrouvée par son
  // identité (type, sourceId) plutôt que par (slot, date), qui peuvent différer de la
  // fiche d'origine (autre date de génération, autre niveau).
  function openMesQcmFicheByLink(type, sourceId, fallbackName) {
    openMesQcmFicheFromUrl('/api/users/notion-quizzes/fiche?linkType=' + encodeURIComponent(type) + '&linkSourceId=' + encodeURIComponent(sourceId) + '&legacyKey=' + encodeURIComponent(voterKey || ''), fallbackName);
  }

  // `quizDate` : un QCM de notion vit sous sa date de création, jamais
  // forcément aujourd'hui (cf. server.js resolveDailyQuizRequestDate) — null
  // pour "renforcement", toujours calculé sur aujourd'hui côté serveur.
  // `label` : nom de la notion (ex. "Crise de Cuba"), affiché comme titre à
  // la place de "Connaissances" générique.
  function loadSlot(slotKey, quizDate, label, shuffled) {
    // Efface tout de suite l'image du QCM précédent (demande du 18/08/2026) :
    // sinon elle resterait affichée en fond le temps du fetch ci-dessous,
    // avant que renderQuestion() ne pose la bonne (ou aucune).
    clearQuestionBackgroundImage();
    setParentIframeCloseVisible(false);
    // La jauge n'a de sens que sur la liste "Découvrir" elle-même (cf.
    // fetchAndRenderLoadGauge dans loadMesQcm) — jamais pendant un QCM en
    // cours (Ancrer/Relier/un apprentissage précis), où subtitleText change
    // de sens sans lien avec la charge à venir.
    hideLoadGauge();
    var myToken = ++loadToken;
    currentSlot = slotKey;
    currentQuizDate = quizDate || null;
    currentCategory = slotKey === 'renforcement'
      ? 'renforcement'
      : (slotKey === 'comprendre' ? 'comprendre' : 'mesqcm');
    currentIndex = 0;
    questions = [];
    answeredByQuestionId = {};
    qcmCorrectStreakCount = 0;
    // Nouveau QCM chargé : jamais en mode "Refaire" hérité d'une session
    // précédente, sinon de vraies réponses cesseraient à tort d'être
    // enregistrées (cf. quizAnswerEndpoint).
    practiceMode = false;
    practiceAnsweredByQuestionId = {};
    setPanelCloseVisible(false);
    // QCM_INITIAL_TITLE_BY_CATEGORY (Ancrer/Relier) plutôt que CATEGORY_LABELS (le nom de
    // l'onglet) : évite le flash "Ancrer" -> "Renforcement des connaissances" une fois le
    // fetch résolu plus bas (demande du 17/08/2026) — le vrai titre du QCM est déjà connu
    // sans attendre la réponse serveur pour ces deux catégories. CATEGORY_LABELS reste le
    // repli pour "mesqcm" (toujours accompagné d'un vrai `label` en pratique) et tout autre cas.
    titleText.textContent = label || QCM_INITIAL_TITLE_BY_CATEGORY[currentCategory] || CATEGORY_LABELS[currentCategory] || 'Apprentissage';
    if (subtitleText) subtitleText.textContent = QCM_SUBTITLE_BY_CATEGORY[currentCategory] || '';
    renderCategorySwitcher();
    renderMessage('Chargement du QCM…');

    var dateParam = currentQuizDate ? '&date=' + encodeURIComponent(currentQuizDate) : '';
    fetch('/api/daily-quiz/today?slot=' + encodeURIComponent(slotKey) + dateParam + (voterKey ? '&voterKey=' + encodeURIComponent(voterKey) : ''), { cache: 'no-store' })
      .then(function (res) { return res.json(); })
      .then(function (data) {
        if (myToken !== loadToken) return;
        questions = Array.isArray(data.questions) ? data.questions : [];
        originalQuestions = questions.slice();
        if (shuffled) questions = shuffleArrayCopy(questions);
        if (data.label && !label) titleText.textContent = data.label;
        if (!questions.length) {
          renderMessage(currentCategory === 'renforcement'
            ? 'Aucune repasse due aujourd’hui — reviens plus tard.'
            : (currentCategory === 'comprendre'
              ? 'Aucun QCM de compréhension disponible pour le moment.'
              : 'Ce QCM est introuvable.'));
          return;
        }
        // Croix du cadre visible dès qu'un vrai QCM démarre (demande du
        // 13/08/2026, jusqu'ici réservée à "Refaire") — pas seulement en
        // pratique : quitter en cours de route doit être possible dès le
        // premier passage aussi.
        setPanelCloseVisible(true);
        if (!voterKey) {
          currentIndex = 0;
          renderQuestion();
          return;
        }
        fetch('/api/daily-quiz/results?voterKey=' + encodeURIComponent(voterKey) + '&slot=' + encodeURIComponent(slotKey) + dateParam, { cache: 'no-store' })
          .then(function (res) { return res.json(); })
          .then(function (data) {
            if (myToken !== loadToken) return;
            (data.answers || []).forEach(function (a) { answeredByQuestionId[a.questionId] = a; });
            var firstUnanswered = questions.findIndex(function (q) { return !answeredByQuestionId[q.id]; });
            if (firstUnanswered === -1) {
              renderFinalScore();
            } else {
              currentIndex = firstUnanswered;
              renderQuestion();
            }
          })
          .catch(function () { if (myToken === loadToken) { currentIndex = 0; renderQuestion(); } });
      })
      .catch(function () {
        if (myToken === loadToken) renderMessage('Impossible de charger ce QCM pour le moment.');
      });
  }

  // Extrait de init() (demande du 17/08/2026) : réutilisée après une série d'Ancrer/Relier
  // terminée (cf. renderFinalScore) pour que le bouton perde son doré + reflet (cf.
  // .qcm-slot-btn-new) et redevienne grisé/non cliquable dès que plus rien n'y est dû —
  // slotsStatus était sinon figé sur son état d'avant la série pour le reste de la session
  // (renderCategorySwitcher le relit tel quel, jamais de refetch après coup jusqu'ici).
  function refreshSlotsStatus() {
    return fetch('/api/daily-quiz/status' + (voterKey ? '?voterKey=' + encodeURIComponent(voterKey) : ''), { cache: 'no-store' })
      .then(function (res) { return res.json(); })
      .then(function (statusData) {
        slotsStatus = statusData && statusData.slots ? statusData : { slots: {} };
      })
      .catch(function () {
        slotsStatus = { slots: {} };
      });
  }

  function init() {
    voterKey = typeof getKey === 'function' ? getKey() : null;

    refreshSlotsStatus().then(function () {
        // Lien direct depuis "Faire le QCM" (Éclairages/Ce jour dans
        // l'Histoire) juste après un clic sur "Mémoriser" : ouvre ce QCM de
        // notion précis plutôt que la liste "Mes QCM". Sans ce paramètre
        // (accès normal via le bouton "Connaissances"), "Mes QCM" reste
        // l'onglet ouvert par défaut — rien d'automatique au-delà.
        var params = new URLSearchParams(window.location.search);
        var requestedSlot = params.get('slot');
        if (requestedSlot && requestedSlot.indexOf('notion:') === 0) {
          loadSlot(requestedSlot, params.get('date'), params.get('label'));
          return;
        }
        loadMesQcm();
      });
  }

  // getKey() est défini dans script.min.js : ce script inline n'est pas
  // concerné par l'attribut defer (ignoré sans src), il s'exécute donc avant
  // que script.min.js n'ait fini de charger — on attend DOMContentLoaded,
  // qui n'arrive qu'une fois tous les scripts deferred exécutés.
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function () {
      init();
      attachPageScrollFadeHint('#ffffff', { contentEndSelector: '.qcm-panel' });
    });
  } else {
    init();
    attachPageScrollFadeHint('#ffffff', { contentEndSelector: '.qcm-panel' });
  }
})();
</script>
</body>
</html>
