  <style>
    /* La page autonome est elle-même la surface d'exploration : un glissement tactile déplace
       la mémoire. Cette surcharge ne s'applique jamais à la mémoire intégrée à l'accueil, qui
       conserve son `touch-action: pan-y` et donc son scroll de page natif. */
    #mnoria-universe-cloud .universe-zoom-viewport {
      touch-action: none;
    }

    /* Véritable mode plein écran de Ma mémoire : la page dédiée n'est pas un nouveau gabarit
       contenant le cadre, elle EST le cadre. Ces règles sont strictement limitées à
       page-memory-only afin de ne jamais affecter /contributions ni l'intégration de la mémoire
       sur l'accueil. */
    html:has(body.page-memory-only),
    body.page-memory-only {
      width: 100%;
      height: 100vh;
      min-height: 100vh;
      margin: 0;
      overflow: hidden;
      background: #020610;
    }
    @supports (height: 100lvh) {
      html:has(body.page-memory-only),
      body.page-memory-only {
        height: 100lvh;
        min-height: 100lvh;
      }
    }
    /* 100lvh (hauteur MAXIMALE, barre d'adresse rétractée) plutôt que 100dvh (hauteur
       réellement visible) : quand la barre d'adresse est affichée (Safari mobile hors PWA
       installée, ou juste après le lancement), le cadre se mesurait plus grand que l'espace
       réellement visible, poussant la minicarte ancrée en bas hors de l'écran (demande du
       01/09/2026, "toujours trop bas : il faut vraiment le mettre sur l'écran" — même bug
       déjà rencontré et corrigé pour .mnoria-tag-trends-section/.mnoria-memoire-frame sur
       l'accueil). 100dvh en repli, après 100lvh dans l'ordre des règles pour gagner via la
       cascade sur les navigateurs qui le supportent. */
    @supports (height: 100dvh) {
      html:has(body.page-memory-only),
      body.page-memory-only {
        height: 100dvh;
        min-height: 100dvh;
      }
    }
    /* Le gabarit partagé porte aussi les classes Notifications. Les
       correctifs globaux standalone de cette page ajoutent un calque blanc
       dans la safe-area basse ; en mode mémoire seule il recouvrirait la
       scène plein écran. La texture étoilée remplit déjà toute la hauteur. */
    body.page-memory-only::before,
    body.page-memory-only::after {
      content: none !important;
      display: none !important;
    }
    body.page-memory-only > .topbar {
      display: none !important;
    }
    body.page-memory-only #memory-page-main {
      position: fixed;
      inset: 0 0 auto;
      z-index: 1;
      width: 100vw !important;
      max-width: none !important;
      height: 100vh;
      margin: 0 !important;
      padding: 0 !important;
      overflow: hidden;
    }
    @supports (height: 100lvh) {
      body.page-memory-only #memory-page-main {
        height: 100lvh;
      }
    }
    /* Même correctif que body.page-memory-only plus haut (100dvh plutôt que 100lvh). */
    @supports (height: 100dvh) {
      body.page-memory-only #memory-page-main {
        height: 100dvh;
      }
    }
    body.page-memory-only #memory-page-main > h1,
    body.page-memory-only #memory-page-main > .universe-subtitle {
      display: none !important;
    }
    body.page-memory-only #mnoria-universe-cloud.mnoria-tag-trends-cloud {
      position: absolute;
      inset: 0;
      width: 100% !important;
      max-width: none !important;
      height: 100% !important;
      min-height: 100% !important;
      margin: 0 !important;
      border: 0 !important;
      border-radius: 0 !important;
    }
    body.page-memory-only #mnoria-universe-cloud.mnoria-tag-trends-cloud::before,
    body.page-memory-only #mnoria-universe-cloud.mnoria-tag-trends-cloud::after,
    body.page-memory-only #mnoria-universe-cloud .universe-zoom-viewport {
      inset: 0 !important;
      border-radius: 0 !important;
    }
    body.page-memory-only #mnoria-universe-cloud .universe-zoom-background {
      border: 0 !important;
      border-radius: 0 !important;
    }
    /* En plein écran mobile, la minicarte (bottom:8px fixe, style.css) se retrouvait trop
       près du bord réel de l'écran — trop bas, parfois contre la zone d'encoche/geste iOS
       (demande du 01/09/2026, "en mobile : il est trop bas"). Relevée avec une marge de
       sécurité liée à env(safe-area-inset-bottom), comme les autres éléments plein écran de
       cette page (.universe-exit-fullscreen, #universe-breadcrumb). Pas besoin de scoper à
       une media query mobile : env(safe-area-inset-bottom) vaut 0 sur desktop, donc max(12px,
       0px) redonne exactement la même valeur que l'ancien bottom:12px de base là-bas. */
    body.page-memory-only #mnoria-universe-cloud .universe-minimap {
      bottom: max(12px, env(safe-area-inset-bottom, 0px)) !important;
    }
    /* Les contrôles sont enfants directs du grand cadre alors que la mini-carte est enfant du
       viewport. Une fois les anciens insets supprimés en plein écran, ils doivent reprendre les
       offsets réels de la mini-carte : même côté (`left`, minicarte passée en bas à gauche le
       01/09/2026), même largeur, et 6px juste au-dessus — recalculé dynamiquement (calc) pour
       suivre le bottom ci-dessus, désormais lié à la safe-area plutôt qu'une valeur fixe. */
    body.page-memory-only #mnoria-universe-cloud > .universe-minimap__zoom-controls {
      left: 12px !important;
      bottom: calc(max(12px, env(safe-area-inset-bottom, 0px)) + 92px + 6px) !important;
      width: 128px !important;
    }
    body.page-memory-only #universe-breadcrumb {
      position: fixed;
      z-index: 220;
      top: max(18px, env(safe-area-inset-top, 0px));
      left: max(20px, env(safe-area-inset-left, 0px));
      /* Le bouton "Quitter le plein écran" est passé en bas à droite le
         01/09/2026 (avant : même coin haut-droit, d'où la marge réservée
         ici) : plus de risque de chevauchement avec le fil d'Ariane, donc
         plus besoin de lui réserver un espace à droite. */
      right: max(20px, env(safe-area-inset-right, 0px));
      width: auto;
      margin: 0;
      pointer-events: none;
    }
    body.page-memory-only #universe-breadcrumb button {
      pointer-events: auto;
      padding: 5px 8px;
      border-radius: 999px;
      background: rgba(5, 16, 25, 0.64);
      color: rgba(239, 246, 250, 0.9);

      -webkit-backdrop-filter: blur(6px);
    }

      z-index: 210;
      inset: 50% auto auto 50%;
      transform: translate(-50%, -50%);
      margin: 0;
    }
    /* Bandeau dégradé "suite ↓" (fiche d'un astre/nœud de connaissance,
       cf. mon-univers.js) : retiré en plein écran (demande du 30/08/2026,
       "je n'en veux pas") — jamais affiché, même si la liste déborde. */
    body.page-memory-only .universe-star-panel__scroll-hint {

    /* En bas à droite (demande du 01/09/2026, déplacé depuis en haut à droite, même coin

    body.page-memory-only .universe-exit-fullscreen {

      line-height: 1;

      backdrop-filter: blur(5px);

    }
    body.page-memory-only .universe-exit-fullscreen:hover,
    body.page-memory-only .universe-exit-fullscreen:focus-visible {

      border-color: rgba(255, 255, 255, 0.8);

    }
    @media (max-width: 640px) {
      body.page-memory-only #mnoria-universe-cloud .universe-minimap {
        bottom: max(8px, env(safe-area-inset-bottom, 0px)) !important;
      }
      body.page-memory-only #mnoria-universe-cloud > .universe-minimap__zoom-controls {
        left: 8px !important;
        bottom: calc(max(8px, env(safe-area-inset-bottom, 0px)) + 76px + 6px) !important;
        width: 106px !important;
      }
      body.page-memory-only .universe-exit-fullscreen {

        right: max(12px, env(safe-area-inset-right, 0px));
        padding: 6px 8px;
        font-size: 9.5px;
      }
    }

    /* Fond étoilé de la page déplacé dans style.css (body.page-mon-univers) : ce simple

    /* Info-bulle du graphique volontairement laissée sombre (comme un tooltip natif) :
       reste lisible et bien distincte, qu'elle flotte sur fond blanc ou sombre. */
    .notes-evolution-tooltip {
      position: absolute;
      background: #243038;

  </style>

<script>
(function() {
  if (location.pathname !== "/contributions") return;
  // Icône spirale (volute grecque) du score Logos — même SVG que la constante
  // MNORIA_LOGOS_ICON de script.js.
  const MNORIA_LOGOS_ICON = '<i class="mnoria-logos-icon" aria-hidden="true"><svg viewBox="2 0 21 21" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 11a1 1 0 0 1 1 1a2 2 0 0 1-2 2a3 3 0 0 1-3-3a4 4 0 0 1 4-4a5 5 0 0 1 5 5a6 6 0 0 1-6 6a7 7 0 0 1-7-7a8 8 0 0 1 8-8a9 9 0 0 1 9 9"/></svg></i>';

  function esc(value) {
    return String(value == null ? "" : value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  // Number(null) vaut 0 en JS : un champ serveur explicitement `null` (pas de
  // score) ne doit pas être lu comme un vrai 0.
  function numOrNull(value) {
    if (value === null || value === undefined) return null;
    var n = Number(value);
    return Number.isFinite(n) ? n : null;
  }

  // Affichage FR (virgule) d'un pourcentage borné à 1 décimale (0,1 % / 99,9 %
  // aux extrêmes, cf. buildPercentileScoreMap côté serveur).
  function formatPct(n) {
    if (n === null || n === undefined || !Number.isFinite(Number(n))) return "";
    return Number(n).toLocaleString("fr-FR", { minimumFractionDigits: 0, maximumFractionDigits: 1 });
  }

  function formatDate(iso) {
    if (!iso) return "";
    try {
      return new Date(iso).toLocaleDateString("fr-FR", { day: "numeric", month: "long", year: "numeric" });
    } catch (e) {
      return "";
    }
  }

  function setCount(id, n) {
    var el = document.getElementById(id);
    if (el) el.textContent = String(n);
  }

  function renderEmpty(container, message) {
    container.innerHTML = '<div class="empty-state">' + esc(message) + '</div>';
  }

  var LOADING_SABLIER_HTML = '<div class="empty-state contributions-loading"><img src="/sablier-96.png" alt="" class="contributions-loading-spinner"></div>';

  function renderLoading(container) {
    container.innerHTML = LOADING_SABLIER_HTML;
  }

  var PAGE_SIZE = 5;

  function renderPaginated(container, items, renderItem, emptyMessage) {
    if (!items.length) return renderEmpty(container, emptyMessage);
    var pages = Math.ceil(items.length / PAGE_SIZE);
    var page = 0;

    function draw() {
      var slice = items.slice(page * PAGE_SIZE, (page + 1) * PAGE_SIZE);
      var html = slice.map(renderItem).join("");
      if (pages > 1) {
        html += '<div class="contributions-pager">' +
          '<button type="button" class="contributions-pager-btn" data-dir="-1" aria-label="Page précédente"' + (page === 0 ? ' disabled' : '') + '><i class="fa-solid fa-chevron-left"></i></button>' +
          '<span class="contributions-pager-info">' + (page + 1) + ' / ' + pages + '</span>' +
          '<button type="button" class="contributions-pager-btn" data-dir="1" aria-label="Page suivante"' + (page === pages - 1 ? ' disabled' : '') + '><i class="fa-solid fa-chevron-right"></i></button>' +
        '</div>';
      }
      container.innerHTML = html;
      if (pages > 1) {
        container.querySelectorAll(".contributions-pager-btn").forEach(function(btn) {
          btn.addEventListener("click", function(event) {
            event.preventDefault();
            page = Math.min(pages - 1, Math.max(0, page + Number(btn.getAttribute("data-dir"))));
            draw();
          });
        });
      }
    }

    draw();
  }

  function debateItemHtml(d) {
    return '<a class="contribution-item" href="/debate?id=' + encodeURIComponent(d.id) + '">' +
      '<p class="contribution-title">' + esc(d.question) + '</p>' +
      '<div class="contribution-meta">' +
        '<span class="contribution-badge"><span class="mnoria-arena-icon" aria-hidden="true"></span> ' + (d.type === "open" ? "Arène libre" : "Pour / Contre") + '</span>' +
        (d.category ? '<span>' + esc(d.category) + '</span>' : '') +
        '<span>' + esc(formatDate(d.created_at)) + '</span>' +
      '</div>' +
    '</a>';
  }

  function argumentItemHtml(a) {
    var votes = Number(a.votes) || 0;
    return '<a class="contribution-item" href="/debate?id=' + encodeURIComponent(a.debate_id) + '">' +
      '<p class="contribution-title">' + esc(a.title || "(sans titre)") + '</p>' +
      (a.body ? '<p class="contribution-subtitle">' + esc(a.body) + '</p>' : '') +
      '<div class="contribution-meta">' +
        '<span class="contribution-badge"><i class="fa-solid fa-bolt"></i> ' + votes + ' voix</span>' +
        (a.debate_question ? '<span>dans « ' + esc(a.debate_question) + ' »</span>' : '') +
        '<span>' + esc(formatDate(a.created_at)) + '</span>' +
      '</div>' +
    '</a>';
  }

  function noteItemHtml(a) {
    return '<a class="contribution-item" href="/debate?id=' + encodeURIComponent(a.debate_id) + '">' +
      '<p class="contribution-title">' + esc(a.title || "(sans titre)") + '</p>' +
      '<div class="contribution-meta">' +
        '<span class="contribution-badge">' + MNORIA_LOGOS_ICON + ' ' + (Number(a.ai_score) || 0) + '/100</span>' +
        (a.ai_category ? '<span>' + esc(a.ai_category) + '</span>' : '') +
        (a.debate_question ? '<span>dans « ' + esc(a.debate_question) + ' »</span>' : '') +
        '<span>' + esc(formatDate(a.created_at)) + '</span>' +
      '</div>' +
    '</a>';
  }

  function commentItemHtml(c) {
    var inner =
      '<p class="contribution-subtitle">' + esc(c.content) + '</p>' +
      '<div class="contribution-meta">' +
        (c.argument_title ? '<span>sous « ' + esc(c.argument_title) + ' »</span>' : '') +
        (c.debate_question ? '<span>dans « ' + esc(c.debate_question) + ' »</span>' : '') +
        '<span>' + esc(formatDate(c.created_at)) + '</span>' +
      '</div>';
    if (c.debate_id) {
      return '<a class="contribution-item" href="/debate?id=' + encodeURIComponent(c.debate_id) + '">' + inner + '</a>';
    }
    return '<div class="contribution-item">' + inner + '</div>';
  }

  function voteItemHtml(v) {
    var count = Number(v.vote_count) || 0;
    var inner =
      '<p class="contribution-title">' + esc(v.argument_title || "(idée supprimée)") + '</p>' +
      '<div class="contribution-meta">' +
        '<span class="contribution-badge"><i class="fa-solid fa-bolt"></i> ' + count + (count > 1 ? ' voix données' : ' voix donnée') + '</span>' +
        (v.debate_question ? '<span>dans « ' + esc(v.debate_question) + ' »</span>' : '') +
        '<span>' + esc(formatDate(v.created_at)) + '</span>' +
      '</div>';
    if (v.debate_id) {
      return '<a class="contribution-item" href="/debate?id=' + encodeURIComponent(v.debate_id) + '">' + inner + '</a>';
    }
    return '<div class="contribution-item">' + inner + '</div>';
  }

  // ===== Évolution des notes IA (modale graphique) =====
  var SERIES_COLOR = "#2563eb";   // même bleu d'accent que le reste de la page (badges, bouton)
  var SURFACE = "#ffffff";        // liseré des points = fond du panneau (harmonisation 27/08/2026)
  var GRID = "#e5e7eb";
  var TEXT_MUTED = "#6b7280";
  var TEXT_PRIMARY = "#111827";

  function shortDate(iso) {
    try {
      return new Date(iso).toLocaleDateString("fr-FR", { day: "numeric", month: "short", year: "2-digit" });
    } catch (e) { return ""; }
  }

  function setupNotesEvolution(notedIdeas) {
    var actions = document.getElementById("contributions-notes-actions");
    var btn = document.getElementById("notes-evolution-btn");
    var overlay = document.getElementById("notes-evolution-overlay");
    var closeBtn = document.getElementById("notes-evolution-close");
    if (!actions || !btn || !overlay || !closeBtn) return;

    // L'évolution n'a de sens qu'à partir de 2 idées notées.
    var points = notedIdeas.slice().sort(function(a, b) {
      return new Date(a.created_at) - new Date(b.created_at);
    });
    if (points.length < 2) return;

    actions.style.display = "block";
    btn.onclick = function() {
      overlay.classList.add("open");
      drawNotesEvolutionChart(points);
    };
    closeBtn.onclick = function() { overlay.classList.remove("open"); };
    overlay.addEventListener("click", function(e) {
      if (e.target === overlay) overlay.classList.remove("open");
    });
  }

  function drawNotesEvolutionChart(points) {
    var svg = document.getElementById("notes-evolution-chart");
    var tooltip = document.getElementById("notes-evolution-tooltip");
    var subtitle = document.getElementById("notes-evolution-subtitle");
    if (!svg || !tooltip) return;

    var W = 340, H = 240;
    var M = { top: 18, right: 16, bottom: 30, left: 32 };
    var innerW = W - M.left - M.right;
    var innerH = H - M.top - M.bottom;

    function xAt(i) {
      return points.length === 1 ? M.left + innerW / 2 : M.left + (innerW * i) / (points.length - 1);
    }
    function yAt(score) { return M.top + innerH * (1 - (Number(score) || 0) / 100); }

    if (subtitle) {
      subtitle.textContent = points.length + " idées notées · " + shortDate(points[0].created_at) + " → " + shortDate(points[points.length - 1].created_at);
    }

    var ns = "http://www.w3.org/2000/svg";
    function el(tag, attrs) {
      var node = document.createElementNS(ns, tag);
      for (var k in attrs) node.setAttribute(k, attrs[k]);
      return node;
    }

    svg.textContent = "";

    // Grille horizontale : hairline pleine, discrète
    [0, 25, 50, 75, 100].forEach(function(tick) {
      var y = yAt(tick);
      svg.appendChild(el("line", { x1: M.left, y1: y, x2: W - M.right, y2: y, stroke: GRID, "stroke-width": 1 }));
      var label = el("text", { x: M.left - 6, y: y + 3.5, "text-anchor": "end", fill: TEXT_MUTED, "font-size": 10 });
      label.textContent = String(tick);
      svg.appendChild(label);
    });

    // Libellés de temps aux extrémités
    var startLabel = el("text", { x: M.left, y: H - 10, "text-anchor": "start", fill: TEXT_MUTED, "font-size": 10 });
    startLabel.textContent = shortDate(points[0].created_at);
    svg.appendChild(startLabel);
    var endLabel = el("text", { x: W - M.right, y: H - 10, "text-anchor": "end", fill: TEXT_MUTED, "font-size": 10 });
    endLabel.textContent = shortDate(points[points.length - 1].created_at);
    svg.appendChild(endLabel);

    // Ligne 2px, jointures rondes
    var d = points.map(function(pt, i) {
      return (i === 0 ? "M" : "L") + xAt(i).toFixed(1) + " " + yAt(pt.ai_score).toFixed(1);
    }).join(" ");
    svg.appendChild(el("path", {
      d: d, fill: "none", stroke: SERIES_COLOR, "stroke-width": 2,
      "stroke-linecap": "round", "stroke-linejoin": "round"
    }));

    // Marqueurs ≥8px avec anneau de surface (2px)
    var markers = [];
    points.forEach(function(pt, i) {
      var dot = el("circle", {
        cx: xAt(i), cy: yAt(pt.ai_score), r: 4.5,
        fill: SERIES_COLOR, stroke: SURFACE, "stroke-width": 2
      });
      svg.appendChild(dot);
      markers.push(dot);
    });

    // Étiquettes directes sélectives : première et dernière note (jamais toutes)
    [[0, "start"], [points.length - 1, "end"]].forEach(function(pair) {
      var i = pair[0];
      var label = el("text", {
        x: xAt(i), y: yAt(points[i].ai_score) - 9, "text-anchor": pair[1] === "start" && i === 0 ? "start" : "end",
        fill: TEXT_PRIMARY, "font-size": 11, "font-weight": 700
      });
      label.textContent = String(points[i].ai_score);
      svg.appendChild(label);
    });

    // Survol / toucher : point le plus proche → tooltip
    var activeIndex = -1;
    function setActive(i) {
      if (i === activeIndex) return;
      if (markers[activeIndex]) markers[activeIndex].setAttribute("r", 4.5);
      activeIndex = i;
      var pt = points[i];
      markers[i].setAttribute("r", 6);
      tooltip.querySelector(".tt-title").textContent = pt.title || "(sans titre)";
      tooltip.querySelector(".tt-meta").textContent = pt.ai_score + "/100 · " + shortDate(pt.created_at);
      var rect = svg.getBoundingClientRect();
      var px = (xAt(i) / W) * rect.width;
      var py = (yAt(pt.ai_score) / H) * rect.height;
      tooltip.style.display = "block";
      tooltip.style.left = Math.max(0, Math.min(rect.width - 150, px - 60)) + "px";
      tooltip.style.top = Math.max(0, py - tooltip.offsetHeight - 14) + "px";
    }
    function clearActive() {
      if (markers[activeIndex]) markers[activeIndex].setAttribute("r", 4.5);
      activeIndex = -1;
      tooltip.style.display = "none";
    }
    function onPointer(e) {
      var rect = svg.getBoundingClientRect();
      var clientX = e.touches && e.touches.length ? e.touches[0].clientX : e.clientX;
      var x = ((clientX - rect.left) / rect.width) * W;
      var best = 0, bestDist = Infinity;
      points.forEach(function(pt, i) {
        var dist = Math.abs(xAt(i) - x);
        if (dist < bestDist) { bestDist = dist; best = i; }
      });
      setActive(best);
    }
    svg.onmousemove = onPointer;
    svg.ontouchstart = onPointer;
    svg.ontouchmove = onPointer;
    svg.onmouseleave = clearActive;
  }

  // Scores Doxa (voix reçues) / Logos (notes IA) — même endpoint que le
  // widget de la topbar, affichés ici en cartes fixes plutôt qu'en popup.
  function renderScores(key) {
    var container = document.getElementById("contributions-scores");
    if (!container) return;

    // Detail au clic ré-activé le 20/08/2026 (cf. plus bas, fin de renderCards)
    // — réutilise showUserScoreModal (script.js), seul appelant restant depuis la
    // suppression de la notification "Ton score a évolué" le 26/08/2026.

    // Une carte par axe systématiquement, verrouillée (fond grisé, valeur
    // "—") tant que le score n'existe pas encore, plutôt que de la faire
    // disparaître : on voit d'un coup d'œil sur quoi on n'a pas encore été
    // évalué, pas seulement sur quoi on l'a été.
    function scoreCardHtml(iconHtml, label, score, unlockedHint, lockedHint, tabKey, explainText) {
      if (score !== null) {
        return '<div class="contributions-score-card" data-score-tab="' + tabKey + '">' +
          '<p class="contributions-score-card-title">' + iconHtml + ' ' + label + '</p>' +
          '<p class="contributions-score-card-value">Top ' + formatPct(score) + '%</p>' +
          '<p class="contributions-score-card-hint">' + unlockedHint + '</p>' +
          '<p class="contributions-score-card-explain">' + esc(explainText) + '</p>' +
        '</div>';
      }
      return '<div class="contributions-score-card contributions-score-card-locked" data-score-tab="' + tabKey + '">' +
        '<p class="contributions-score-card-title">' + iconHtml + ' ' + label + '</p>' +
        '<p class="contributions-score-card-value contributions-score-card-value-locked">—</p>' +
        '<p class="contributions-score-card-hint">' + esc(lockedHint) + '</p>' +
        '<p class="contributions-score-card-explain">' + esc(explainText) + '</p>' +
      '</div>';
    }

    function renderCards(data) {
      var d = data || {};
      var votesScoreRaw = numOrNull(d.votesScore);
      var notesScoreRaw = numOrNull(d.notesScore);
      var gnosisScoreRaw = numOrNull(d.gnosisScore);
      // 1 décimale (pas d'arrondi entier) : préserve les bornes 0,1 / 99,9 des
      // extrêmes posées côté serveur.
      var votesScore = votesScoreRaw === null ? null : Math.round(votesScoreRaw * 10) / 10;
      var notesScore = notesScoreRaw === null ? null : Math.round(notesScoreRaw * 10) / 10;
      var gnosisScore = gnosisScoreRaw === null ? null : Math.round(gnosisScoreRaw * 10) / 10;
      var votesValue = numOrNull(d.votesValue);
      var votesAveragePerIdea = numOrNull(d.votesAveragePerIdea);
      var notesValue = numOrNull(d.notesValue);
      var notesIdeaCount = numOrNull(d.notesIdeaCount);
      var gnosisAnswered = numOrNull(d.gnosisAnswered);
      var gnosisCorrect = numOrNull(d.gnosisCorrect);
      var noesisScoreRaw = numOrNull(d.noesisScore);
      var noesisScore = noesisScoreRaw === null ? null : Math.round(noesisScoreRaw * 10) / 10;
      var relierAnswered = numOrNull(d.relierAnswered);
      var relierCorrect = numOrNull(d.relierCorrect);

      container.classList.remove("contributions-scores-empty");
      container.innerHTML =
        // Demande du 17/08/2026 : moyenne de voix reçues PAR IDÉE, en plus du
        // score sur 100 (votesScore, inchangé) et du total brut déjà affiché.
        scoreCardHtml(
          '<i class="fa-solid fa-bolt"></i>', 'Doxa', votesScore,
          (votesValue !== null && votesAveragePerIdea !== null)
            ? esc(votesAveragePerIdea.toLocaleString("fr-FR") + " voix/idée en moyenne (" + votesValue.toLocaleString("fr-FR") + " au total)")
            : "Voix récoltées sur tes idées",
          "Pas encore évalué : poste une idée pour débloquer ce score.",
          "doxa",
          "Classement parmi les contributeurs ayant posté un volume d'idées similaire au tien."
        ) +
        // Demande du 17/08/2026 : nombre d'idées notées à côté de la moyenne
        // (notesValue, déjà affichée) et du score sur 100 (notesScore,
        // inchangé) — même principe que votesAveragePerIdea/votesIdeaCount
        // pour Doxa juste au-dessus.
        scoreCardHtml(
          MNORIA_LOGOS_ICON, 'Logos', notesScore,
          (notesValue !== null && notesIdeaCount !== null)
            ? esc("Moyenne de " + notesValue.toLocaleString("fr-FR") + "/100 sur " + notesIdeaCount.toLocaleString("fr-FR") + (notesIdeaCount > 1 ? " idées notées" : " idée notée"))
            : "Qualité de tes idées, notée par l'IA",
          "Pas encore évalué : poste une idée pour débloquer ce score.",
          "logos",
          "Classement parmi les contributeurs ayant un volume similaire d'idées notées par l'IA."
        ) +
        // Gnosis (redéfini le 17/08/2026 : ex-"Ancrage", justesse aux repasses
        // "Ancrer" — plus l'ancienne justesse sur contenu frais, cf. server.js
        // computeUserScores) — même format que les autres : "Top X%" et le
        // compte brut en dessous.
        scoreCardHtml(
          '<i class="fa-solid fa-brain"></i>', 'Gnosis', gnosisScore,
          (gnosisAnswered !== null && gnosisCorrect !== null && gnosisAnswered > 0)
            ? esc(Math.round(gnosisCorrect / gnosisAnswered * 100) + "% de réussite en Ancrer")
            : "Justesse aux repasses",
          "Pas encore évalué : réponds à des repasses dans Ancrer pour débloquer ce score.",
          "gnosis",
          "Classement parmi tous les contributeurs ayant répondu à au moins une repasse en Ancrer."
        ) +
        // Noesis (demande du 17/08/2026) : compréhension des liens, QCM "Relier" — même
        // format que Gnosis ("Top X%", un classement percentile). A désormais son propre
        // onglet dans la modale détaillée aussi (cf. plus bas, ajouté le 20/08/2026).
        scoreCardHtml(
          '<i class="fa-solid fa-link"></i>', 'Noesis', noesisScore,
          (relierAnswered !== null && relierCorrect !== null && relierAnswered > 0)
            ? esc(Math.round(relierCorrect / relierAnswered * 100) + "% de réussite en Relier")
            : "Compréhension des liens entre connaissances",
          "Pas encore évalué : réponds dans Relier pour débloquer ce score.",
          "noesis",
          "Classement parmi tous les contributeurs ayant répondu à au moins une question en Relier."
        );

      // Réactive le détail au clic sur une carte (demande du 20/08/2026, revient
      // sur la suppression du 17/08/2026 — cette fois avec un onglet Noesis en
      // plus, absent de la modale à l'époque) : réutilise la même modale que le
      // badge de la topbar (showUserScoreModal, script.js), jamais reconstruite
      // ici en double.
      if (typeof showUserScoreModal === "function") {
        var tierLabelValue = String(d.tierLabel || "").trim();
        var tierValue = numOrNull(d.tier);
        var tierCountValue = numOrNull(d.tierCount);
        var modalStats = {
          votesTotalUsers: numOrNull(d.votesTotalUsers),
          notesTotalUsers: numOrNull(d.notesTotalUsers),
          gnosisTotalUsers: numOrNull(d.gnosisTotalUsers),
          noesisTotalUsers: numOrNull(d.noesisTotalUsers),
          votesTierUsers: numOrNull(d.votesTierUsers),
          notesTierUsers: numOrNull(d.notesTierUsers),
          votesValue: votesValue,
          notesValue: notesValue,
          gnosisAnswered: gnosisAnswered,
          gnosisCorrect: gnosisCorrect,
          relierAnswered: relierAnswered,
          relierCorrect: relierCorrect
        };
        container.querySelectorAll(".contributions-score-card[data-score-tab]").forEach(function(card) {
          card.style.cursor = "pointer";
          card.addEventListener("click", function() {
            showUserScoreModal(
              votesScore, notesScore, gnosisScore, noesisScore,
              tierLabelValue, modalStats, tierValue, tierCountValue,
              card.dataset.scoreTab
            );
          });
        });
      }
    }

    if (!key) {
      renderCards(null);
      return;
    }

    fetch("/api/my-score?key=" + encodeURIComponent(key))
      .then(function(r) { return r.ok ? r.json() : null; })
      .then(function(data) {
        if (!data) throw new Error("no data");
        renderCards(data);
      })
      .catch(function() {
        container.classList.add("contributions-scores-empty");
        container.innerHTML =
          '<div class="contributions-score-card">' +
            '<p class="contributions-score-card-title"><i class="fa-solid fa-bolt"></i> Doxa, Logos &amp; Gnosis</p>' +
            '<p class="contributions-score-card-hint">Impossible de charger tes scores pour l\'instant.</p>' +
          '</div>';
      });
  }

  function load() {
    var debatesEl = document.getElementById("contributions-debates");
    var argumentsEl = document.getElementById("contributions-arguments");
    var commentsEl = document.getElementById("contributions-comments");
    var votesEl = document.getElementById("contributions-votes");
    var notesEl = document.getElementById("contributions-notes");
    if (!debatesEl || !argumentsEl || !commentsEl || !votesEl || !notesEl) return;

    var key = null;
    try { key = localStorage.getItem("key"); } catch (e) {}
    renderScores(key);
    if (!key) {
      renderEmpty(debatesEl, "Tu n'as pas encore ouvert d'arène.");
      renderEmpty(argumentsEl, "Tu n'as pas encore proposé d'idée.");
      renderEmpty(commentsEl, "Tu n'as pas encore commenté d'idée.");
      renderEmpty(votesEl, "Tu n'as pas encore soutenu d'idée avec tes voix.");
      renderEmpty(notesEl, "Aucune de tes idées n'a encore été évaluée par l'IA.");
      return;
    }

    fetch("/api/my-contributions?key=" + encodeURIComponent(key))
      .then(function(r) {
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.json();
      })
      .then(function(data) {
        renderPaginated(debatesEl, data.debates || [], debateItemHtml, "Tu n'as pas encore ouvert d'arène.");
        renderPaginated(argumentsEl, data.arguments || [], argumentItemHtml, "Tu n'as pas encore proposé d'idée.");
        var notedIdeas = (data.arguments || []).filter(function(a) { return a.ai_score != null; })
          .sort(function(x, y) { return (Number(y.ai_score) || 0) - (Number(x.ai_score) || 0); });
        renderPaginated(notesEl, notedIdeas, noteItemHtml, "Aucune de tes idées n'a encore été évaluée par l'IA.");
        setCount("contributions-notes-count", notedIdeas.length);
        setupNotesEvolution(notedIdeas);
        renderPaginated(commentsEl, data.comments || [], commentItemHtml, "Tu n'as pas encore commenté d'idée.");
        renderPaginated(votesEl, data.votes || [], voteItemHtml, "Tu n'as pas encore soutenu d'idée avec tes voix.");
        setCount("contributions-debates-count", (data.debates || []).length);
        setCount("contributions-arguments-count", (data.arguments || []).length);
        setCount("contributions-comments-count", (data.comments || []).length);
        setCount("contributions-votes-count", (data.votes || []).length);
      })
      .catch(function() {
        var message = "Impossible de charger tes contributions. Réessaie dans un instant.";
        renderEmpty(debatesEl, message);
        renderEmpty(argumentsEl, message);
        renderEmpty(commentsEl, message);
        renderEmpty(votesEl, message);
        renderEmpty(notesEl, message);
      });
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", load);
  } else {
    load();
  }
})();
</script>

  window.addEventListener("load", notifyMonUniversIframeReady);
})();
