  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@200;300;400;600;700;800&family=Cormorant+Garamond:wght@400;500;600&family=Libre+Baskerville:wght@400;700&family=Oswald:wght@500;600;700;800;900&display=swap">
  <link rel="stylesheet" href="/vendor/fontawesome/css/all.min.css">
  <script>if (window.self !== window.top) document.documentElement.classList.add('in-iframe'); document.addEventListener('DOMContentLoaded', function(){ if (window.self !== window.top) document.body.classList.add('in-iframe'); });</script>
  <style>
    /* Fond étoilé de la page déplacé dans style.css (body.page-mon-univers) : ce simple
       `body { ... }` ici était systématiquement écrasé par la règle plus spécifique
       body.page-mon-univers { background-color: #243038; } de style.css, quel que soit
       l'ordre de chargement (spécificité CSS, pas l'ordre qui décide) — cf. style.css pour la
       vraie règle en vigueur. */
    .page-notifications .topbar-inner,
    .page-notifications-mobile .topbar-inner {
      justify-content: center;
    }
    .page-notifications .home-brand-block,
    .page-notifications-mobile .home-brand-block {
      flex: 0 0 auto;
    }
    .page-notifications .topbar-actions,
    .page-notifications-mobile .topbar-actions {
      position: absolute;
      right: 16px;
    }
    /* Même bandeau que /eclairages : logo seul, centré et mêmes dimensions. */
    body.page-contributions .topbar {
      height: auto !important;
      min-height: 0 !important;
      max-height: none !important;
      padding-bottom: 0 !important;
    }
    body.page-contributions .topbar-inner.topbar-home {
      display: flex !important;
      justify-content: center !important;
      height: auto !important;
      min-height: 0 !important;
      max-height: none !important;
      padding: 2px 0 !important;
      gap: 0 !important;
    }
    body.page-contributions .home-brand-block {
      flex: 0 0 auto !important;
      width: auto !important;
      margin-left: 0 !important;
      justify-content: center !important;
    }
    body.page-contributions .home-logo {
      width: 116px !important;
      height: auto !important;
      max-height: 116px !important;
      transform: translateY(2px) !important;
    }
    body.page-contributions .topbar-message,
    body.page-contributions .topbar > .agon-user-score-row {
      display: none !important;
    }
    /* Flèche de fermeture/retour : .page-mon-univers (style.css) masque tout
       ce qui n'est pas le logo dans le bandeau — on réintroduit .topbar-actions
       ici. Mon univers n'est jamais ouvert dans la modale iframe (bulles
       incompatibles avec ce rendu), donc pas de vrai #debate-iframe-modal-close
       ici : on reproduit son visuel exact (bouton rond, bas-gauche, même
       dégradé/couleurs) plutôt que le petit bouton carré en haut à droite
       utilisé par défaut sur desktop pour .mobile-back-button. */
    body.page-mon-univers .topbar-inner.topbar-home > .topbar-actions {
      display: flex !important;
    }
    body.page-mon-univers .debate-nav-row,
    body.page-mon-univers .back-link {
      display: none !important;
    }
    body.page-mon-univers .mobile-back-button {
      display: flex !important;
      position: fixed !important;
      top: auto !important;
      bottom: calc(5vh + 78px) !important;
      left: 26px !important;
      right: auto !important;
      z-index: 10000 !important;
      align-items: center;
      justify-content: center;
      width: auto !important;
      height: auto !important;
      min-width: 0 !important;
      min-height: 0 !important;
      padding: 10px 20px !important;
      border-radius: 999px !important;
      border-width: 3px !important;
      border-color: transparent !important;
      background:
        linear-gradient(rgba(26,39,47,0.94), rgba(26,39,47,0.94)) padding-box,
        linear-gradient(to bottom, #f3f4f6 0%, #d1d5db 42%, #111827 58%, #111827 100%) border-box !important;
      color: #e5edf3 !important;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.22) !important;
      cursor: pointer;
      font-size: 16px;
    }
    body.page-mon-univers .mobile-back-button:hover {
      background:
        linear-gradient(rgba(17,24,39,0.98), rgba(17,24,39,0.98)) padding-box,
        linear-gradient(to bottom, #f3f4f6 0%, #d1d5db 42%, #111827 58%, #111827 100%) border-box !important;
      color: #ffffff !important;
    }
    /* Ouvert dans la modale iframe (comme les autres pages) : le vrai bouton
       #debate-iframe-modal-close du parent fait déjà ce travail, on masque
       notre imitation pour ne pas en avoir deux. Spécificité (html+body+2
       classes) > la règle ci-dessus (body+2 classes), gagne quel que soit
       l'ordre. */
    html.in-iframe body.page-mon-univers .mobile-back-button {
      display: none !important;
    }
    @media (max-width: 768px) {
      body.page-contributions .topbar-inner.topbar-home {
        padding: 0 !important;
      }
      body.page-contributions .home-logo {
        width: 74px !important;
        max-height: 74px !important;
      }
    }
    .home-bottom-nav { display: none !important; }

    /* Deux pages autonomes partagent ce gabarit sans mélanger leurs contenus. */
    body.page-memory-only #scores-contributions-page,
    body.page-memory-only #notes-evolution-overlay {
      display: none !important;
    }
    body.page-contributions-only #memory-page-main {
      display: none !important;
    }
    body.page-contributions-only #scores-contributions-page {
      margin-top: 26px;
      margin-bottom: 110px;
    }

    /* Textes sur fond sombre — même habillage que la page notifications */
    .page-contributions .section-header h3 {
      color: #e8e8e8;
    }
    .page-contributions .section-header-home {
      justify-content: center;
      text-align: center;
    }
    .page-contributions .contributions-accordion {
      background: #2e3d47;
      border: 1px solid #3a4a55;
      border-radius: 14px;
      margin-bottom: 12px;
      overflow: hidden;
    }
    .page-contributions .contributions-accordion summary {
      list-style: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 15px 16px;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .page-contributions .contributions-accordion summary::-webkit-details-marker {
      display: none;
    }
    .page-contributions .contributions-accordion-label {
      color: #e8e8e8;
      font-size: 16px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 9px;
    }
    .page-contributions .contributions-count {
      color: #9cc3f0;
      background: #1e3a5f;
      border-radius: 999px;
      padding: 1px 9px;
      font-size: 12px;
      font-weight: 700;
      min-width: 18px;
      text-align: center;
    }
    .page-contributions .contributions-count:empty {
      display: none;
    }
    .page-contributions .contributions-accordion-chevron {
      color: #7a8a94;
      font-size: 13px;
      transition: transform 0.18s ease;
      flex: 0 0 auto;
    }
    .page-contributions .contributions-accordion[open] .contributions-accordion-chevron {
      transform: rotate(180deg);
    }
    .page-contributions .contributions-accordion-body {
      padding: 2px 12px 12px;
      border-top: 1px solid #3a4a55;
      padding-top: 12px;
    }
    .page-contributions .contribution-item {
      display: block;
      color: #e8e8e8;
      background: #243038;
      border: 1px solid #3a4a55;
      border-radius: 12px;
      padding: 13px 15px;
      margin-bottom: 10px;
      text-decoration: none;
      transition: background 0.12s ease;
    }
    .page-contributions .contribution-item:hover {
      background: #2a3843;
    }
    .page-contributions .contribution-item:last-child {
      margin-bottom: 2px;
    }
    .page-contributions .contribution-title {
      color: #e8e8e8;
      font-weight: 700;
      font-size: 15px;
      margin: 0 0 4px;
      line-height: 1.35;
    }
    .page-contributions .contribution-subtitle {
      color: #a0b0bb;
      font-size: 13px;
      margin: 0 0 6px;
      line-height: 1.45;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .page-contributions .contribution-meta {
      color: #7a8a94;
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .page-contributions .contribution-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: #1e3a5f;
      color: #9cc3f0;
      border-radius: 999px;
      padding: 2px 9px;
      font-size: 11px;
      font-weight: 700;
    }
    .page-contributions .contributions-pager {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 4px 0 2px;
    }
    .page-contributions .contributions-pager-btn {
      width: 32px;
      height: 32px;
      border-radius: 999px;
      border: 1px solid #3a4a55;
      background: #243038;
      color: #e8e8e8;
      font-size: 12px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .page-contributions .contributions-pager-btn:disabled {
      opacity: 0.35;
      cursor: default;
    }
    .page-contributions .contributions-pager-info {
      color: #a0b0bb;
      font-size: 13px;
      font-weight: 700;
      min-width: 44px;
      text-align: center;
    }
    .notes-evolution-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #1e3a5f;
      color: #9cc3f0;
      border: 1px solid #2c4d78;
      border-radius: 999px;
      padding: 8px 16px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }
    .notes-evolution-btn:hover {
      background: #234570;
    }
    #notes-evolution-overlay {
      position: fixed;
      inset: 0;
      z-index: 100000;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(3px);
      -webkit-backdrop-filter: blur(3px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      box-sizing: border-box;
    }
    #notes-evolution-overlay.open {
      display: flex;
    }
    .notes-evolution-panel {
      position: relative;
      width: min(100%, 420px);
      background: #2e3d47;
      border: 1px solid #3a4a55;
      border-radius: 18px;
      padding: 20px 16px 16px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
      box-sizing: border-box;
    }
    .notes-evolution-title {
      color: #e8e8e8;
      font-size: 16px;
      font-weight: 800;
      margin: 0 34px 2px 4px;
    }
    .notes-evolution-subtitle {
      color: #7a8a94;
      font-size: 12px;
      margin: 0 0 12px 4px;
    }
    .notes-evolution-close {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      border: 1px solid #3a4a55;
      background: #243038;
      color: #a0b0bb;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #notes-evolution-chart {
      width: 100%;
      display: block;
      touch-action: pan-y;
    }
    .notes-evolution-tooltip {
      position: absolute;
      background: #243038;
      border: 1px solid #3a4a55;
      border-radius: 10px;
      padding: 8px 11px;
      pointer-events: none;
      display: none;
      max-width: 210px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.35);
    }
    .notes-evolution-tooltip .tt-title {
      color: #e8e8e8;
      font-size: 12px;
      font-weight: 700;
      margin: 0 0 3px;
      overflow: hidden;
      text-overflow: ellipsis;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }
    .notes-evolution-tooltip .tt-meta {
      color: #a0b0bb;
      font-size: 11px;
      margin: 0;
    }
    .page-contributions .empty-state {
      color: #a0b0bb;
      background: #243038;
      border: 1px dashed #3a4a55;
      border-radius: 12px;
      padding: 14px 16px;
      font-size: 13.5px;
    }
    .page-contributions .empty-state.contributions-loading {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 22px 16px;
    }
    .contributions-loading-spinner {
      width: 30px;
      height: 30px;
      object-fit: contain;
      animation: createSubmitSpin 0.8s linear infinite;
    }
    .contributions-scores {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(96px, 1fr));
      gap: 10px;
      margin-bottom: 14px;
    }
    .contributions-scores.contributions-scores-empty {
      grid-template-columns: 1fr;
    }
    .contributions-score-card {
      background: #2e3d47;
      border: 1px solid #3a4a55;
      border-radius: 14px;
      padding: 14px 15px;
      text-align: center;
    }
    .contributions-score-card-title {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      color: #e8e8e8;
      font-weight: 700;
      font-size: 14px;
      margin: 0 0 4px;
    }
    .contributions-score-card-title i { color: #9cc3f0; font-size: 13px; }
    .contributions-score-card-value {
      color: #9cc3f0;
      font-size: 20px;
      font-weight: 800;
      margin: 0 0 2px;
    }
    .contributions-score-card-hint {
      color: #a0b0bb;
      font-size: 12px;
      margin: 0;
      line-height: 1.4;
    }
    .contributions-scores-empty .contributions-score-card-title i { color: #f0c96a; }
    .contributions-score-card-locked {
      opacity: 0.7;
    }
    .contributions-score-card-locked .contributions-score-card-title i,
    .contributions-score-card-locked .contributions-score-card-title .agon-logos-icon {
      color: #7a8a94;
    }
    .contributions-score-card-value-locked {
      color: #7a8a94;
    }

    /* Bloc "Mon univers" (bulles) inséré après la section "Mes scores et
       contributions" ci-dessus : .universe-page-shell est prévu pour être
       seul sur la page (marge du haut pensée pour dégager le bandeau) — ici
       il la suit déjà, donc marge resserrée. */
    .universe-page-shell.universe-page-shell--embedded {
      margin-top: 6px;
      margin-bottom: 30px;
    }
    @media (max-width: 640px) {
      .universe-page-shell.universe-page-shell--embedded {
        margin-top: 2px;
      }
    }

    /* Même habillage que le titre "Mes scores et contributions" (.section-header h3,
       cf. style.css) : les deux titres de la page doivent avoir la même identité. */
    .universe-page-shell h1 {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.01em;
      color: #e8e8e8;
      text-align: center;
      margin-bottom: 10px;
    }
    .universe-subtitle {
      text-align: center;
    }
    /* Le bouton "Retour" (remonter d'un niveau dans les bulles) n'était visible
       qu'en dessous de 640px (cf. style.css) — on le garde visible à toutes
       les tailles pour qu'il soit toujours facile à retrouver après un clic
       sur une bulle. */
    .universe-back-btn.is-visible {
      display: flex !important;
      width: fit-content;
      margin-top: 14px !important;
      margin-bottom: 0 !important;
      margin-left: auto !important;
      margin-right: auto !important;
    }
    /* Fil d'Ariane centré, comme le titre et le sous-titre au-dessus — sinon
       "Retour" + le fil restent collés à gauche sous un titre centré. */
    .universe-breadcrumb {
      justify-content: center;
    }
  </style>
  <script src="/header-score-widget.min.js?v=20260815-all-header-scores-v1" defer></script>
</head>

<script>
  (function() {
    var contributionsOnly = location.pathname === "/contributions";
    document.body.classList.add(contributionsOnly ? "page-contributions-only" : "page-memory-only");
    if (contributionsOnly) document.title = "Scores et contributions | agôn";
  })();
</script>

<main class="universe-page-shell universe-page-shell--embedded" id="memory-page-main">
  <h1>Ma mémoire</h1>
  <p class="universe-subtitle">Les connaissances acquises en répondant correctement aux QCM d'actualité.</p>

  <nav id="universe-breadcrumb" class="universe-breadcrumb" aria-label="Fil d'Ariane de l'univers"></nav>

  <div id="agon-universe-cloud" class="agon-tag-trends-cloud"></div>

  <button type="button" id="universe-back-btn" class="universe-back-btn" aria-label="Revenir au niveau précédent">
    <i class="fa-solid fa-arrow-left" aria-hidden="true"></i> Retour
  </button>

  <div id="universe-status" class="universe-status" role="status" aria-live="polite" hidden></div>

  <div id="universe-star-panel" class="universe-star-panel" hidden>
    <div id="universe-star-panel-backdrop" class="universe-star-panel__backdrop"></div>
    <div class="universe-star-panel__box" role="dialog" aria-modal="true" aria-labelledby="universe-star-panel-title">
      <div class="universe-star-panel__header">
        <h2 id="universe-star-panel-title" class="universe-star-panel__title"></h2>
        <button type="button" id="universe-star-panel-close" class="universe-star-panel__close" aria-label="Fermer la liste">
          <i class="fa-solid fa-xmark" aria-hidden="true"></i>
        </button>
      </div>
      <ul id="universe-star-panel-list" class="universe-star-panel__list"></ul>
    </div>
  </div>
</main>

<div id="notes-evolution-overlay" aria-modal="true" role="dialog" aria-label="Évolution de mes notes IA">
  <div class="notes-evolution-panel">
    <button type="button" class="notes-evolution-close" id="notes-evolution-close" aria-label="Fermer">✕</button>
    <p class="notes-evolution-title">Évolution de mes notes IA</p>
    <p class="notes-evolution-subtitle" id="notes-evolution-subtitle"></p>
    <div style="position:relative;">
      <svg id="notes-evolution-chart" viewBox="0 0 340 240" role="img" aria-label="Courbe des notes IA dans le temps"></svg>
      <div class="notes-evolution-tooltip" id="notes-evolution-tooltip">
        <p class="tt-title"></p>
        <p class="tt-meta"></p>
      </div>
    </div>
  </div>
</div>

<script>
(function() {
  if (location.pathname !== "/contributions") return;
  // Icône spirale (volute grecque) du score Logos — même SVG que la constante
  // AGON_LOGOS_ICON de script.js.
  const AGON_LOGOS_ICON = '<i class="agon-logos-icon" aria-hidden="true"><svg viewBox="2 0 21 21" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 11a1 1 0 0 1 1 1a2 2 0 0 1-2 2a3 3 0 0 1-3-3a4 4 0 0 1 4-4a5 5 0 0 1 5 5a6 6 0 0 1-6 6a7 7 0 0 1-7-7a8 8 0 0 1 8-8a9 9 0 0 1 9 9"/></svg></i>';

  function esc(value) {
    return String(value == null ? "" : value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  // Number(null) vaut 0 en JS : un champ serveur explicitement `null` (pas de
  // score) ne doit pas être lu comme un vrai 0.
  function numOrNull(value) {
    if (value === null || value === undefined) return null;
    var n = Number(value);
    return Number.isFinite(n) ? n : null;
  }

  // Affichage FR (virgule) d'un pourcentage borné à 1 décimale (0,1 % / 99,9 %
  // aux extrêmes, cf. buildPercentileScoreMap côté serveur).
  function formatPct(n) {
    if (n === null || n === undefined || !Number.isFinite(Number(n))) return "";
    return Number(n).toLocaleString("fr-FR", { minimumFractionDigits: 0, maximumFractionDigits: 1 });
  }

  function formatDate(iso) {
    if (!iso) return "";
    try {
      return new Date(iso).toLocaleDateString("fr-FR", { day: "numeric", month: "long", year: "numeric" });
    } catch (e) {
      return "";
    }
  }

  function setCount(id, n) {
    var el = document.getElementById(id);
    if (el) el.textContent = String(n);
  }

  function renderEmpty(container, message) {
    container.innerHTML = '<div class="empty-state">' + esc(message) + '</div>';
  }

  var LOADING_SABLIER_HTML = '<div class="empty-state contributions-loading"><img src="/sablier-96.png" alt="" class="contributions-loading-spinner"></div>';

  function renderLoading(container) {
    container.innerHTML = LOADING_SABLIER_HTML;
  }

  var PAGE_SIZE = 5;

  function renderPaginated(container, items, renderItem, emptyMessage) {
    if (!items.length) return renderEmpty(container, emptyMessage);
    var pages = Math.ceil(items.length / PAGE_SIZE);
    var page = 0;

    function draw() {
      var slice = items.slice(page * PAGE_SIZE, (page + 1) * PAGE_SIZE);
      var html = slice.map(renderItem).join("");
      if (pages > 1) {
        html += '<div class="contributions-pager">' +
          '<button type="button" class="contributions-pager-btn" data-dir="-1" aria-label="Page précédente"' + (page === 0 ? ' disabled' : '') + '><i class="fa-solid fa-chevron-left"></i></button>' +
          '<span class="contributions-pager-info">' + (page + 1) + ' / ' + pages + '</span>' +
          '<button type="button" class="contributions-pager-btn" data-dir="1" aria-label="Page suivante"' + (page === pages - 1 ? ' disabled' : '') + '><i class="fa-solid fa-chevron-right"></i></button>' +
        '</div>';
      }
      container.innerHTML = html;
      if (pages > 1) {
        container.querySelectorAll(".contributions-pager-btn").forEach(function(btn) {
          btn.addEventListener("click", function(event) {
            event.preventDefault();
            page = Math.min(pages - 1, Math.max(0, page + Number(btn.getAttribute("data-dir"))));
            draw();
          });
        });
      }
    }

    draw();
  }

  function debateItemHtml(d) {
    return '<a class="contribution-item" href="/debate?id=' + encodeURIComponent(d.id) + '">' +
      '<p class="contribution-title">' + esc(d.question) + '</p>' +
      '<div class="contribution-meta">' +
        '<span class="contribution-badge"><span class="agon-arena-icon" aria-hidden="true"></span> ' + (d.type === "open" ? "Arène libre" : "Pour / Contre") + '</span>' +
        (d.category ? '<span>' + esc(d.category) + '</span>' : '') +
        '<span>' + esc(formatDate(d.created_at)) + '</span>' +
      '</div>' +
    '</a>';
  }

  function argumentItemHtml(a) {
    var votes = Number(a.votes) || 0;
    return '<a class="contribution-item" href="/debate?id=' + encodeURIComponent(a.debate_id) + '">' +
      '<p class="contribution-title">' + esc(a.title || "(sans titre)") + '</p>' +
      (a.body ? '<p class="contribution-subtitle">' + esc(a.body) + '</p>' : '') +
      '<div class="contribution-meta">' +
        '<span class="contribution-badge"><i class="fa-solid fa-bolt"></i> ' + votes + ' voix</span>' +
        (a.debate_question ? '<span>dans « ' + esc(a.debate_question) + ' »</span>' : '') +
        '<span>' + esc(formatDate(a.created_at)) + '</span>' +
      '</div>' +
    '</a>';
  }

  function noteItemHtml(a) {
    return '<a class="contribution-item" href="/debate?id=' + encodeURIComponent(a.debate_id) + '">' +
      '<p class="contribution-title">' + esc(a.title || "(sans titre)") + '</p>' +
      '<div class="contribution-meta">' +
        '<span class="contribution-badge">' + AGON_LOGOS_ICON + ' ' + (Number(a.ai_score) || 0) + '/100</span>' +
        (a.ai_category ? '<span>' + esc(a.ai_category) + '</span>' : '') +
        (a.debate_question ? '<span>dans « ' + esc(a.debate_question) + ' »</span>' : '') +
        '<span>' + esc(formatDate(a.created_at)) + '</span>' +
      '</div>' +
    '</a>';
  }

  function commentItemHtml(c) {
    var inner =
      '<p class="contribution-subtitle">' + esc(c.content) + '</p>' +
      '<div class="contribution-meta">' +
        (c.argument_title ? '<span>sous « ' + esc(c.argument_title) + ' »</span>' : '') +
        (c.debate_question ? '<span>dans « ' + esc(c.debate_question) + ' »</span>' : '') +
        '<span>' + esc(formatDate(c.created_at)) + '</span>' +
      '</div>';
    if (c.debate_id) {
      return '<a class="contribution-item" href="/debate?id=' + encodeURIComponent(c.debate_id) + '">' + inner + '</a>';
    }
    return '<div class="contribution-item">' + inner + '</div>';
  }

  function voteItemHtml(v) {
    var count = Number(v.vote_count) || 0;
    var inner =
      '<p class="contribution-title">' + esc(v.argument_title || "(idée supprimée)") + '</p>' +
      '<div class="contribution-meta">' +
        '<span class="contribution-badge"><i class="fa-solid fa-bolt"></i> ' + count + (count > 1 ? ' voix données' : ' voix donnée') + '</span>' +
        (v.debate_question ? '<span>dans « ' + esc(v.debate_question) + ' »</span>' : '') +
        '<span>' + esc(formatDate(v.created_at)) + '</span>' +
      '</div>';
    if (v.debate_id) {
      return '<a class="contribution-item" href="/debate?id=' + encodeURIComponent(v.debate_id) + '">' + inner + '</a>';
    }
    return '<div class="contribution-item">' + inner + '</div>';
  }

  // ===== Évolution des notes IA (modale graphique) =====
  var SERIES_COLOR = "#3987e5";   // slot 1 sombre, validé ≥3:1 sur #2e3d47
  var SURFACE = "#2e3d47";
  var GRID = "#3a4a55";
  var TEXT_MUTED = "#7a8a94";
  var TEXT_PRIMARY = "#e8e8e8";

  function shortDate(iso) {
    try {
      return new Date(iso).toLocaleDateString("fr-FR", { day: "numeric", month: "short", year: "2-digit" });
    } catch (e) { return ""; }
  }

  function setupNotesEvolution(notedIdeas) {
    var actions = document.getElementById("contributions-notes-actions");
    var btn = document.getElementById("notes-evolution-btn");
    var overlay = document.getElementById("notes-evolution-overlay");
    var closeBtn = document.getElementById("notes-evolution-close");
    if (!actions || !btn || !overlay || !closeBtn) return;

    // L'évolution n'a de sens qu'à partir de 2 idées notées.
    var points = notedIdeas.slice().sort(function(a, b) {
      return new Date(a.created_at) - new Date(b.created_at);
    });
    if (points.length < 2) return;

    actions.style.display = "block";
    btn.onclick = function() {
      overlay.classList.add("open");
      drawNotesEvolutionChart(points);
    };
    closeBtn.onclick = function() { overlay.classList.remove("open"); };
    overlay.addEventListener("click", function(e) {
      if (e.target === overlay) overlay.classList.remove("open");
    });
  }

  function drawNotesEvolutionChart(points) {
    var svg = document.getElementById("notes-evolution-chart");
    var tooltip = document.getElementById("notes-evolution-tooltip");
    var subtitle = document.getElementById("notes-evolution-subtitle");
    if (!svg || !tooltip) return;

    var W = 340, H = 240;
    var M = { top: 18, right: 16, bottom: 30, left: 32 };
    var innerW = W - M.left - M.right;
    var innerH = H - M.top - M.bottom;

    function xAt(i) {
      return points.length === 1 ? M.left + innerW / 2 : M.left + (innerW * i) / (points.length - 1);
    }
    function yAt(score) { return M.top + innerH * (1 - (Number(score) || 0) / 100); }

    if (subtitle) {
      subtitle.textContent = points.length + " idées notées · " + shortDate(points[0].created_at) + " → " + shortDate(points[points.length - 1].created_at);
    }

    var ns = "http://www.w3.org/2000/svg";
    function el(tag, attrs) {
      var node = document.createElementNS(ns, tag);
      for (var k in attrs) node.setAttribute(k, attrs[k]);
      return node;
    }

    svg.textContent = "";

    // Grille horizontale : hairline pleine, discrète
    [0, 25, 50, 75, 100].forEach(function(tick) {
      var y = yAt(tick);
      svg.appendChild(el("line", { x1: M.left, y1: y, x2: W - M.right, y2: y, stroke: GRID, "stroke-width": 1 }));
      var label = el("text", { x: M.left - 6, y: y + 3.5, "text-anchor": "end", fill: TEXT_MUTED, "font-size": 10 });
      label.textContent = String(tick);
      svg.appendChild(label);
    });

    // Libellés de temps aux extrémités
    var startLabel = el("text", { x: M.left, y: H - 10, "text-anchor": "start", fill: TEXT_MUTED, "font-size": 10 });
    startLabel.textContent = shortDate(points[0].created_at);
    svg.appendChild(startLabel);
    var endLabel = el("text", { x: W - M.right, y: H - 10, "text-anchor": "end", fill: TEXT_MUTED, "font-size": 10 });
    endLabel.textContent = shortDate(points[points.length - 1].created_at);
    svg.appendChild(endLabel);

    // Ligne 2px, jointures rondes
    var d = points.map(function(pt, i) {
      return (i === 0 ? "M" : "L") + xAt(i).toFixed(1) + " " + yAt(pt.ai_score).toFixed(1);
    }).join(" ");
    svg.appendChild(el("path", {
      d: d, fill: "none", stroke: SERIES_COLOR, "stroke-width": 2,
      "stroke-linecap": "round", "stroke-linejoin": "round"
    }));

    // Marqueurs ≥8px avec anneau de surface (2px)
    var markers = [];
    points.forEach(function(pt, i) {
      var dot = el("circle", {
        cx: xAt(i), cy: yAt(pt.ai_score), r: 4.5,
        fill: SERIES_COLOR, stroke: SURFACE, "stroke-width": 2
      });
      svg.appendChild(dot);
      markers.push(dot);
    });

    // Étiquettes directes sélectives : première et dernière note (jamais toutes)
    [[0, "start"], [points.length - 1, "end"]].forEach(function(pair) {
      var i = pair[0];
      var label = el("text", {
        x: xAt(i), y: yAt(points[i].ai_score) - 9, "text-anchor": pair[1] === "start" && i === 0 ? "start" : "end",
        fill: TEXT_PRIMARY, "font-size": 11, "font-weight": 700
      });
      label.textContent = String(points[i].ai_score);
      svg.appendChild(label);
    });

    // Survol / toucher : point le plus proche → tooltip
    var activeIndex = -1;
    function setActive(i) {
      if (i === activeIndex) return;
      if (markers[activeIndex]) markers[activeIndex].setAttribute("r", 4.5);
      activeIndex = i;
      var pt = points[i];
      markers[i].setAttribute("r", 6);
      tooltip.querySelector(".tt-title").textContent = pt.title || "(sans titre)";
      tooltip.querySelector(".tt-meta").textContent = pt.ai_score + "/100 · " + shortDate(pt.created_at);
      var rect = svg.getBoundingClientRect();
      var px = (xAt(i) / W) * rect.width;
      var py = (yAt(pt.ai_score) / H) * rect.height;
      tooltip.style.display = "block";
      tooltip.style.left = Math.max(0, Math.min(rect.width - 150, px - 60)) + "px";
      tooltip.style.top = Math.max(0, py - tooltip.offsetHeight - 14) + "px";
    }
    function clearActive() {
      if (markers[activeIndex]) markers[activeIndex].setAttribute("r", 4.5);
      activeIndex = -1;
      tooltip.style.display = "none";
    }
    function onPointer(e) {
      var rect = svg.getBoundingClientRect();
      var clientX = e.touches && e.touches.length ? e.touches[0].clientX : e.clientX;
      var x = ((clientX - rect.left) / rect.width) * W;
      var best = 0, bestDist = Infinity;
      points.forEach(function(pt, i) {
        var dist = Math.abs(xAt(i) - x);
        if (dist < bestDist) { bestDist = dist; best = i; }
      });
      setActive(best);
    }
    svg.onmousemove = onPointer;
    svg.ontouchstart = onPointer;
    svg.ontouchmove = onPointer;
    svg.onmouseleave = clearActive;
  }

  // Scores Rhetor (voix reçues) / Logos (notes IA) — même endpoint que le
  // widget de la topbar, affichés ici en cartes fixes plutôt qu'en popup.
  function renderScores(key) {
    var container = document.getElementById("contributions-scores");
    if (!container) return;

    var modalArgs = null; // rempli une fois les données connues, lu au clic
    container.style.cursor = "pointer";
    container.setAttribute("role", "button");
    container.setAttribute("aria-label", "Voir le détail de mes scores");
    container.addEventListener("click", function(event) {
      if (!modalArgs || typeof window.showUserScoreModal !== "function") return;
      var card = event.target.closest(".contributions-score-card");
      var initialTab = (card && card.getAttribute("data-score-tab")) || "rhetor";
      window.showUserScoreModal(
        modalArgs.votesScore, modalArgs.notesScore, modalArgs.gnosisScore,
        modalArgs.tierLabel, modalArgs.stats, modalArgs.tier, modalArgs.tierCount,
        modalArgs.gnosisTierLabel, modalArgs.gnosisTier, modalArgs.gnosisTierCount,
        initialTab
      );
    });

    // Une carte par axe systématiquement, verrouillée (fond grisé, valeur
    // "—") tant que le score n'existe pas encore, plutôt que de la faire
    // disparaître : on voit d'un coup d'œil sur quoi on n'a pas encore été
    // évalué, pas seulement sur quoi on l'a été.
    function scoreCardHtml(iconHtml, label, score, unlockedHint, lockedHint, tabKey) {
      if (score !== null) {
        return '<div class="contributions-score-card" data-score-tab="' + tabKey + '">' +
          '<p class="contributions-score-card-title">' + iconHtml + ' ' + label + '</p>' +
          '<p class="contributions-score-card-value">Top ' + formatPct(score) + '%</p>' +
          '<p class="contributions-score-card-hint">' + unlockedHint + '</p>' +
        '</div>';
      }
      return '<div class="contributions-score-card contributions-score-card-locked" data-score-tab="' + tabKey + '">' +
        '<p class="contributions-score-card-title">' + iconHtml + ' ' + label + '</p>' +
        '<p class="contributions-score-card-value contributions-score-card-value-locked">—</p>' +
        '<p class="contributions-score-card-hint">' + esc(lockedHint) + '</p>' +
      '</div>';
    }

    function renderCards(data) {
      var d = data || {};
      var votesScoreRaw = numOrNull(d.votesScore);
      var notesScoreRaw = numOrNull(d.notesScore);
      var gnosisScoreRaw = numOrNull(d.gnosisScore);
      // 1 décimale (pas d'arrondi entier) : préserve les bornes 0,1 / 99,9 des
      // extrêmes posées côté serveur.
      var votesScore = votesScoreRaw === null ? null : Math.round(votesScoreRaw * 10) / 10;
      var notesScore = notesScoreRaw === null ? null : Math.round(notesScoreRaw * 10) / 10;
      var gnosisScore = gnosisScoreRaw === null ? null : Math.round(gnosisScoreRaw * 10) / 10;
      var votesValue = numOrNull(d.votesValue);
      var notesValue = numOrNull(d.notesValue);
      var gnosisAnswered = numOrNull(d.gnosisAnswered);
      var gnosisCorrect = numOrNull(d.gnosisCorrect);

      container.classList.remove("contributions-scores-empty");
      container.innerHTML =
        scoreCardHtml(
          '<i class="fa-solid fa-bolt"></i>', 'Rhetor', votesScore,
          votesValue !== null ? esc(votesValue.toLocaleString("fr-FR") + (votesValue > 1 ? " voix reçues" : " voix reçue")) : "Voix récoltées sur tes idées",
          "Pas encore évalué : poste une idée pour débloquer ce score.",
          "rhetor"
        ) +
        scoreCardHtml(
          AGON_LOGOS_ICON, 'Logos', notesScore,
          notesValue !== null ? esc("Moyenne de " + notesValue.toLocaleString("fr-FR") + "/100") : "Qualité de tes idées, notée par l'IA",
          "Pas encore évalué : poste une idée pour débloquer ce score.",
          "logos"
        ) +
        scoreCardHtml(
          '<i class="fa-solid fa-brain"></i>', 'Gnosis', gnosisScore,
          (gnosisAnswered !== null && gnosisCorrect !== null) ? esc(gnosisCorrect + "/" + gnosisAnswered + " bonnes réponses au QCM") : "Justesse au QCM",
          "Pas encore évalué : réponds dans Apprentissage pour débloquer ce score.",
          "gnosis"
        );

      modalArgs = {
        votesScore: votesScore,
        notesScore: notesScore,
        gnosisScore: gnosisScore,
        tierLabel: d.tierLabel || "",
        stats: d,
        tier: d.tier,
        tierCount: d.tierCount,
        gnosisTierLabel: d.gnosisTierLabel || "",
        gnosisTier: d.gnosisTier,
        gnosisTierCount: d.gnosisTierCount
      };
    }

    if (!key) {
      renderCards(null);
      return;
    }

    fetch("/api/my-score?key=" + encodeURIComponent(key))
      .then(function(r) { return r.ok ? r.json() : null; })
      .then(function(data) {
        if (!data) throw new Error("no data");
        renderCards(data);
      })
      .catch(function() {
        container.classList.add("contributions-scores-empty");
        container.innerHTML =
          '<div class="contributions-score-card">' +
            '<p class="contributions-score-card-title"><i class="fa-solid fa-bolt"></i> Rhetor, Logos &amp; Gnosis</p>' +
            '<p class="contributions-score-card-hint">Impossible de charger tes scores pour l\'instant.</p>' +
          '</div>';
        modalArgs = null;
      });
  }

  function load() {
    var debatesEl = document.getElementById("contributions-debates");
    var argumentsEl = document.getElementById("contributions-arguments");
    var commentsEl = document.getElementById("contributions-comments");
    var votesEl = document.getElementById("contributions-votes");
    var notesEl = document.getElementById("contributions-notes");
    if (!debatesEl || !argumentsEl || !commentsEl || !votesEl || !notesEl) return;

    var key = null;
    try { key = localStorage.getItem("key"); } catch (e) {}
    renderScores(key);
    if (!key) {
      renderEmpty(debatesEl, "Tu n'as pas encore ouvert d'arène.");
      renderEmpty(argumentsEl, "Tu n'as pas encore proposé d'idée.");
      renderEmpty(commentsEl, "Tu n'as pas encore commenté d'idée.");
      renderEmpty(votesEl, "Tu n'as pas encore soutenu d'idée avec tes voix.");
      renderEmpty(notesEl, "Aucune de tes idées n'a encore été évaluée par l'IA.");
      return;
    }

    fetch("/api/my-contributions?key=" + encodeURIComponent(key))
      .then(function(r) {
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.json();
      })
      .then(function(data) {
        renderPaginated(debatesEl, data.debates || [], debateItemHtml, "Tu n'as pas encore ouvert d'arène.");
        renderPaginated(argumentsEl, data.arguments || [], argumentItemHtml, "Tu n'as pas encore proposé d'idée.");
        var notedIdeas = (data.arguments || []).filter(function(a) { return a.ai_score != null; })
          .sort(function(x, y) { return (Number(y.ai_score) || 0) - (Number(x.ai_score) || 0); });
        renderPaginated(notesEl, notedIdeas, noteItemHtml, "Aucune de tes idées n'a encore été évaluée par l'IA.");
        setCount("contributions-notes-count", notedIdeas.length);
        setupNotesEvolution(notedIdeas);
        renderPaginated(commentsEl, data.comments || [], commentItemHtml, "Tu n'as pas encore commenté d'idée.");
        renderPaginated(votesEl, data.votes || [], voteItemHtml, "Tu n'as pas encore soutenu d'idée avec tes voix.");
        setCount("contributions-debates-count", (data.debates || []).length);
        setCount("contributions-arguments-count", (data.arguments || []).length);
        setCount("contributions-comments-count", (data.comments || []).length);
        setCount("contributions-votes-count", (data.votes || []).length);
      })
      .catch(function() {
        var message = "Impossible de charger tes contributions. Réessaie dans un instant.";
        renderEmpty(debatesEl, message);
        renderEmpty(argumentsEl, message);
        renderEmpty(commentsEl, message);
        renderEmpty(votesEl, message);
        renderEmpty(notesEl, message);
      });
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", load);
  } else {
    load();
  }
})();
</script>

<script>
(function() {
  if (window.self === window.top) return;
  function notifyMonUniversIframeReady() {
    var isContributions = location.pathname === "/contributions";
    window.__agonPageArrivalReady = true;
    try {
      window.parent.postMessage({
        type: "agon:debate-iframe-ready",
