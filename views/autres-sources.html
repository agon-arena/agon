    @media (max-width: 520px) {

  <script>
    // Les autres pages du site posent ce marqueur pour signaler qu'elles sont bien
    // arrivées ; autres-sources.html ne le faisait pas, ce qui peut faire croire au
    // parent (modale iframe) que le chargement est resté bloqué alors que la page est
    // affichée — et masquer titre + filtres derrière l'overlay "chargement plus long
    // que prévu" (cf. resolveStuckDebateIframeParentLoading côté script.js).
    window.__agonPageArrivalReady = true;
    if (window.self !== window.top) document.documentElement.classList.add('in-iframe');
    document.addEventListener('DOMContentLoaded', function(){
      if (window.self !== window.top) {
        document.body.classList.add('in-iframe');
        try { window.parent.postMessage({ type: 'agon:debate-iframe-ready', pathname: location.pathname, href: location.href }, '*'); } catch (e) {}
      }
    });
  </script>

<script>
(function() {
  var list = document.getElementById('tribunes-list');
  if (!list) return;

  var allArticles = [];
  var currentFilter = 'mixed';
  var currentMedia = '';
  var currentType = '';
  var initialHeaderScrollRestored = false;

  // Thématique dérivée du champ orientation (ex. "gauche / investigation" -> investigation),
  // dont le deuxième segment décrit souvent un genre éditorial plutôt qu'un positionnement
  // politique. Classement approximatif par mots-clés (premier qui matche gagne) : les
  // sources sans second segment (ex. simplement "droite") n'ont pas de thématique.
  var THEME_RULES = [
    { key: 'investigation', label: 'Investigation', match: ['investigation', 'enquête'] },
    { key: 'ecologie', label: 'Écologie', match: ['écolog', 'ecolog'] },
    { key: 'economie', label: 'Économie', match: ['économi', 'economi'] },
    { key: 'international', label: 'International / Géopolitique', match: ['international', 'géopolitique', 'geopolitique'] },
    { key: 'medias', label: 'Critique des médias', match: ['critique médias', 'critique medias'] },
    { key: 'societe', label: 'Société', match: ['société', 'societe', 'social'] },
    { key: 'debats', label: 'Débats / Entretiens', match: ['débat', 'debat', 'entretien', 'interview'] },
    { key: 'idees', label: 'Idées / Analyse', match: ['idées', 'idees', 'analyse', 'pédagogie', 'pedagogie', 'chronique'] },
    { key: 'identitaire', label: 'Identitaire / Nouvelle droite', match: ['identitaire', 'nouvelle droite', 'réinformation', 'reinformation'] },
    { key: 'conservateur', label: 'Conservateur / Souverainiste', match: ['conservat', 'souverainis', 'catholique'] },
    { key: 'complotiste', label: 'Complotiste', match: ['complotiste'] },
    { key: 'militant', label: 'Militant', match: ['militant', 'radical', 'antifascisme', 'altermondialiste', 'libertaire'] },
    { key: 'local', label: 'Local / Régional', match: ['local', 'régional', 'regional', 'bretagne'] },
    { key: 'satire', label: 'Satire', match: ['satir'] },
    { key: 'culture', label: 'Culture', match: ['culture'] },
    { key: 'jeunesse', label: 'Jeunesse', match: ['jeunesse'] }
  ];
  var THEME_LABEL_BY_KEY = {};
  THEME_RULES.forEach(function(rule) { THEME_LABEL_BY_KEY[rule.key] = rule.label; });

  function themeClass(orientation) {
    var o = String(orientation || '').toLowerCase();
    for (var i = 0; i < THEME_RULES.length; i++) {
      var rule = THEME_RULES[i];
      for (var j = 0; j < rule.match.length; j++) {
        if (o.indexOf(rule.match[j]) !== -1) return rule.key;
      }
    }
    return '';
  }

  function escapeHtml(text) {
    return String(text == null ? '' : text)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#039;');
  }

  function orientationClass(orientation) {
    var o = String(orientation || '').toLowerCase();
    if (o.indexOf('gauche') !== -1 || o.indexOf('ecolog') !== -1 || o.indexOf('écolog') !== -1) return 'left';
    if (o.indexOf('droite') !== -1) return 'right';
    return 'center';
  }

  // Lecture des vidéos "Autres sources" directement dans la page, sans quitter le site.
  // Purement client (iframe YouTube) : ne touche jamais Supabase, ne coûte donc rien sur
  // le budget Disk IO/egress de la base — seul le clic charge le player, pas le rendu de
  // la liste (pas d'iframe préchargée pour chaque carte).
  function getYouTubeVideoId(url) {
    if (!url) return '';
    try {
      var parsed = new URL(url);
      var hostname = parsed.hostname.replace(/^www\./, '').toLowerCase();
      if (hostname === 'youtu.be') {
        return parsed.pathname.split('/').filter(Boolean)[0] || '';
      }
      if (hostname === 'youtube.com' || hostname === 'm.youtube.com') {
        if (parsed.pathname === '/watch') return parsed.searchParams.get('v') || '';
        var parts = parsed.pathname.split('/').filter(Boolean);
        if (parts.length && ['embed', 'shorts', 'live'].indexOf(parts[0]) !== -1) return parts[1] || '';
      }
      return '';
    } catch (e) {
      return '';
    }
  }

  var videoModal = document.getElementById('tribunes-video-modal');
  var videoModalFrameWrap = document.getElementById('tribunes-video-modal-frame-wrap');
  var videoModalClose = document.getElementById('tribunes-video-modal-close');

  function openVideoModal(videoId) {
    if (!videoId || !videoModal || !videoModalFrameWrap) return;
    var iframe = document.createElement('iframe');
    iframe.src = 'https://www.youtube-nocookie.com/embed/' + encodeURIComponent(videoId) + '?autoplay=1&rel=0&modestbranding=1&playsinline=1';
    iframe.allow = 'autoplay; encrypted-media; picture-in-picture';
    iframe.allowFullscreen = true;
    iframe.title = 'Lecteur vidéo';
    videoModalFrameWrap.innerHTML = '';
    videoModalFrameWrap.appendChild(iframe);
    videoModal.classList.add('open');
    document.body.classList.add('index-background-suspended');
  }

  function closeVideoModal() {
    if (!videoModal) return;
    videoModal.classList.remove('open');
    // Vide l'iframe pour arrêter réellement la lecture (masquer seul laisserait le son tourner).
    if (videoModalFrameWrap) videoModalFrameWrap.innerHTML = '';
    document.body.classList.remove('index-background-suspended');
  }

  if (videoModalClose) videoModalClose.addEventListener('click', closeVideoModal);
  if (videoModal) {
    videoModal.addEventListener('click', function(event) {
      if (event.target === videoModal) closeVideoModal();
    });
  }
  document.addEventListener('keydown', function(event) {
    if (event.key === 'Escape' && videoModal && videoModal.classList.contains('open')) closeVideoModal();
  });

  function formatDate(iso) {
    try {
      return new Date(iso).toLocaleString('fr-FR', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
    } catch (e) {
      return '';
    }
  }

  function formatDateMachine(iso) {
    try {
      var date = new Date(iso);
      return Number.isNaN(date.getTime()) ? '' : date.toISOString();
    } catch (e) {
      return '';
    }
  }

  function formatBadgeDate(iso) {
    try {
      var date = new Date(iso);
      if (Number.isNaN(date.getTime())) return '';
      return date.toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit', year: '2-digit' });
    } catch (e) {
      return '';
    }
  }

  // Même seuil que isDebateNew() côté script.js (9h depuis publication).
  var NEW_BADGE_DURATION_MS = 9 * 60 * 60 * 1000;

  function isArticleNew(article) {
    var t = article.published_at ? new Date(article.published_at).getTime() : 0;
    return t > 0 && (Date.now() - t) < NEW_BADGE_DURATION_MS;
  }

  function renderItem(article) {
    var badge = article.orientation
      ? '<span class="tribunes-badge ' + orientationClass(article.orientation) + '">' + escapeHtml(article.orientation) + '</span>'
      : '';
    var summary = article.summary ? '<p class="tribunes-summary">' + escapeHtml(article.summary) + '</p>' : '';
    var newBadge = isArticleNew(article)
      ? '<div class="debate-card-top-badges"><div class="debate-card-new-badge">Nouveau</div></div>'
      : '';
    var dateBadgeLabel = formatBadgeDate(article.published_at);
    var dateIso = formatDateMachine(article.published_at);
    var videoId = article.type === 'youtube' ? getYouTubeVideoId(article.link) : '';
    var videoAttr = videoId ? ' data-video-id="' + escapeHtml(videoId) + '"' : '';
    var playBadge = videoId ? '<div class="tribunes-play-badge" aria-hidden="true"></div>' : '';
    var titleClick = videoId
      ? ' onclick="event.preventDefault(); openVideoModal(this.dataset.videoId)"'
      : '';
    return '' +
      '<li class="tribunes-item" data-link="' + escapeHtml(article.link) + '"' + videoAttr + ' role="link" tabindex="0">' +
        '<div class="tribunes-thumb tribunes-thumb-loading">' +
          newBadge +
          (dateBadgeLabel ? '<time class="tribunes-image-date" datetime="' + escapeHtml(dateIso) + '">' + escapeHtml(dateBadgeLabel) + '</time>' : '') +
          playBadge +
          '<div class="tribunes-thumb-loader" aria-label="Chargement de l’image">' +
            '<img class="tribunes-thumb-loader-img" src="/sablier-96.png" alt="">' +
            '<span>Chargement de l’image…</span>' +
          '</div>' +
          '<img class="tribunes-thumb-img" loading="lazy" decoding="async" alt="">' +
        '</div>' +
        '<div class="tribunes-item-body">' +
          '<div class="tribunes-meta">' +
            '<div class="tribunes-meta-main">' +
              '<strong>' + escapeHtml(article.source) + '</strong>' + badge +
            '</div>' +
          '</div>' +
          '<a class="tribunes-title" href="' + escapeHtml(article.link) + '"' + videoAttr + (videoId ? '' : ' target="_blank" rel="noopener noreferrer"') + titleClick + '>' + escapeHtml(article.title) + '</a>' +
          summary +
          '<div class="tribunes-arena-actions">' +
            '<a class="tribunes-arena-btn" href="' + createArenaHref(article) + '" onclick="event.preventDefault(); openDebateIframeModal(this.getAttribute(\'href\'))"><span class="agon-arena-icon" aria-hidden="true"></span> Ouvrir une arène</a>' +
          '</div>' +
        '</div>' +
      '</li>';
  }

  // Le champ "Sujet de l'arène" est limité à 110 caractères côté Agôn — un titre plus
  // long serait tronqué silencieusement. On coupe nous-mêmes avec une ellipse visible,
  // pour que l'utilisateur comprenne que ce n'est pas le titre exact de l'article et
  // pense à le retoucher si besoin (il peut tout modifier une fois sur /create).
  function truncateWithEllipsis(text, maxLen) {
    if (text.length <= maxLen) return text;
    return text.slice(0, maxLen - 1).trim() + '…';
  }

  // Ouvre /create pré-rempli (titre + lien source) avec possibilité de tout modifier —
  // le visiteur choisit lui-même le type d'arène (libre/positions) et peut changer
  // n'importe quel champ avant de publier. Voir le script de pré-remplissage dans create.html.
  function createArenaHref(article) {
    var params = new URLSearchParams();
    if (article.title) params.set('question', truncateWithEllipsis(article.title, 110));
    if (article.link) params.set('source_url', article.link);
    params.set('community', '1');
    var preview = article.source_preview || {};
    var sourceImage = article.source_image || preview.image || preview.imageUrl || preview.thumbnail || '';
    var sourceTitle = preview.title || article.title || '';
    var sourceSite = preview.siteName || preview.domain || article.source || '';
    var sourceDescription = preview.description || article.summary || '';
    if (sourceImage) params.set('source_image', String(sourceImage).slice(0, 1200));
    if (sourceTitle) params.set('source_title', String(sourceTitle).slice(0, 500));
    if (sourceSite) params.set('source_site', String(sourceSite).slice(0, 200));
    if (sourceDescription) params.set('source_description', String(sourceDescription).slice(0, 500));
    return '/create?' + params.toString();
  }

  function shouldIgnoreCardOpen(target) {
    return Boolean(target && target.closest('a, button, input, select, textarea'));
  }

  function openCardArticle(card) {
    if (!card || !card.dataset) return;
    if (card.dataset.videoId) { openVideoModal(card.dataset.videoId); return; }
    var link = card.dataset.link;
    if (!link) return;
    window.open(link, '_blank', 'noopener,noreferrer');
  }

  function attachCardLinkHandlers() {
    list.querySelectorAll('.tribunes-item[data-link]').forEach(function(card) {
      card.addEventListener('click', function(event) {
        if (shouldIgnoreCardOpen(event.target)) return;
        openCardArticle(card);
      });
      card.addEventListener('keydown', function(event) {
        if (shouldIgnoreCardOpen(event.target)) return;
        if (event.key !== 'Enter' && event.key !== ' ') return;
        event.preventDefault();
        openCardArticle(card);
      });
    });
  }

  function attachCarouselArrows() {
    list.querySelectorAll('.tribunes-carousel-arrow').forEach(function(btn) {
      btn.addEventListener('click', function() {
        var row = document.getElementById(btn.dataset.row);
        if (!row) return;
        var amount = Math.max(240, Math.round(row.clientWidth * 0.9));
        row.scrollBy({ left: btn.classList.contains('tribunes-carousel-arrow-left') ? -amount : amount, behavior: 'smooth' });
        scheduleCarouselStateUpdate(row);
      });
    });
    list.querySelectorAll('.tribunes-row-jump-start').forEach(function(btn) {
      btn.addEventListener('click', function() {
        var row = document.getElementById(btn.dataset.row);
        if (!row) return;
        row.scrollTo({ left: 0, behavior: 'smooth' });
        scheduleCarouselStateUpdate(row);
      });
    });
    list.querySelectorAll('.tribunes-carousel').forEach(function(row) {
      row.__tribunesControls = collectCarouselControls(row);
      row.addEventListener('scroll', function() { scheduleCarouselStateUpdate(row); }, { passive: true });
      updateCarouselArrowState(row);
      syncCarouselDots(row);
    });
  }

  function collectCarouselControls(row) {
    var section = row && row.closest('.tribunes-theme-section');
    if (!section || !row.id) return null;
    var selector = '[data-row="' + cssEscape(row.id) + '"]';
    return {
      section: section,
      arrows: Array.prototype.slice.call(section.querySelectorAll('.tribunes-carousel-arrow' + selector)),
      jumpButtons: Array.prototype.slice.call(section.querySelectorAll('.tribunes-row-jump-start' + selector)),
      dots: section.querySelector('.tribunes-carousel-dots' + selector)
    };
  }

  function scheduleCarouselStateUpdate(row) {
    if (!row) return;
    if (row.__tribunesScrollRaf) return;
    row.__tribunesScrollRaf = requestAnimationFrame(function() {
      row.__tribunesScrollRaf = 0;
      updateCarouselArrowState(row);
    });
  }

  function updateCarouselArrowState(row) {
    if (!row || !row.id) return;
    var controls = row.__tribunesControls || collectCarouselControls(row);
    row.__tribunesControls = controls;
    var section = controls && controls.section ? controls.section : (row.closest('.tribunes-theme-section') || list);
    var maxScrollLeft = Math.max(0, row.scrollWidth - row.clientWidth);
    var scrollLeft = Math.min(Math.max(0, row.scrollLeft), maxScrollLeft);
    var edgeTolerance = 12;
    var canScroll = maxScrollLeft > edgeTolerance;
    var isAtStart = scrollLeft <= edgeTolerance;
    var isAtEnd = maxScrollLeft - scrollLeft <= edgeTolerance;
    section.classList.toggle('tribunes-row-can-scroll', canScroll);
    section.classList.toggle('tribunes-row-at-start', !canScroll || isAtStart);
    section.classList.toggle('tribunes-row-at-end', !canScroll || isAtEnd);
    (controls && controls.arrows ? controls.arrows : []).forEach(function(btn) {
      var hideLeft = btn.classList.contains('tribunes-carousel-arrow-left') && (!canScroll || isAtStart);
      var hideRight = btn.classList.contains('tribunes-carousel-arrow-right') && (!canScroll || isAtEnd);
      btn.classList.toggle('is-hidden', hideLeft || hideRight);
      btn.setAttribute('aria-hidden', hideLeft || hideRight ? 'true' : 'false');
      btn.tabIndex = hideLeft || hideRight ? -1 : 0;
    });
    (controls && controls.jumpButtons ? controls.jumpButtons : []).forEach(function(btn) {
      var hidden = !canScroll || isAtStart;
      btn.classList.toggle('is-hidden', hidden);
      btn.setAttribute('aria-hidden', hidden ? 'true' : 'false');
      btn.tabIndex = hidden ? -1 : 0;
    });
    syncCarouselDots(row, { lightweight: true });
  }

  function updateAllCarouselArrowStates() {
    list.querySelectorAll('.tribunes-carousel').forEach(updateCarouselArrowState);
  }

  var allCarouselStateRaf = 0;
  function scheduleAllCarouselArrowStates() {
    if (allCarouselStateRaf) return;
    allCarouselStateRaf = requestAnimationFrame(function() {
      allCarouselStateRaf = 0;
      updateAllCarouselArrowStates();
    });
  }

  window.addEventListener('resize', scheduleAllCarouselArrowStates, { passive: true });

  function syncCarouselDots(row, options) {
    if (!row || !row.id) return;
    var section = row.closest('.tribunes-theme-section');
    if (!section) return;
    options = options || {};
    var controls = row.__tribunesControls || collectCarouselControls(row);
    row.__tribunesControls = controls;
    var dots = controls && controls.dots ? controls.dots : section.querySelector('.tribunes-carousel-dots[data-row="' + cssEscape(row.id) + '"]');
    var cards = [];
    if (!options.lightweight || !dots) cards = Array.prototype.slice.call(row.querySelectorAll('.tribunes-item'));
    var cardCount = Number(row.dataset.carouselTotal || 0) || Number(dots && dots.dataset.count || 0) || cards.length;
    var maxScrollLeft = Math.max(0, row.scrollWidth - row.clientWidth);
    if (cardCount <= 1 || maxScrollLeft <= 12) {
      if (dots) dots.style.display = 'none';
      return;
    }
    if (!dots) return;
    dots.style.display = '';
    var dotCount = Math.min(10, Math.max(2, cardCount));
    if (Number(dots.dataset.count || '0') !== dotCount) {
      dots.dataset.count = String(dotCount);
      dots.innerHTML = '';
      for (var i = 0; i < dotCount; i += 1) {
        var dot = document.createElement('button');
        dot.type = 'button';
        dot.className = 'tribunes-carousel-dot';
        dot.setAttribute('aria-label', 'Aller à la page ' + (i + 1));
        dot.dataset.index = String(i);
        dot.addEventListener('click', function() {
          var index = Number(this.dataset.index || '0');
          var currentMaxScrollLeft = Math.max(0, row.scrollWidth - row.clientWidth);
          var targetLeft = dotCount <= 1 ? 0 : Math.round(index * currentMaxScrollLeft / (dotCount - 1));
          row.scrollTo({ left: targetLeft, behavior: 'smooth' });
          scheduleCarouselStateUpdate(row);
        });
        dots.appendChild(dot);
      }
      var dotEls = Array.prototype.slice.call(dots.querySelectorAll('.tribunes-carousel-dot'));
      if (dotCount >= 4) {
        dotEls[dotCount - 1].classList.add('tribunes-carousel-dot--fade-3', 'tribunes-carousel-dot--pill');
        if (dotCount >= 5) dotEls[dotCount - 2].classList.add('tribunes-carousel-dot--fade-2');
        if (dotCount >= 6) dotEls[dotCount - 3].classList.add('tribunes-carousel-dot--fade-1');
      }
    }
    var scrollLeft = Math.min(Math.max(0, row.scrollLeft), maxScrollLeft);
    var activeIndex = maxScrollLeft > 12 ? Math.round(scrollLeft / maxScrollLeft * (dotCount - 1)) : 0;
    if (dots.dataset.activeIndex === String(activeIndex)) return;
    dots.dataset.activeIndex = String(activeIndex);
    dots.querySelectorAll('.tribunes-carousel-dot').forEach(function(dot, index) {
      dot.classList.toggle('is-active', index === activeIndex);
    });
  }

  // Regroupe par thématique (dérivée de l'orientation, cf. themeClass) : les thématiques
  // nommées d'abord (les plus fournies en premier), puis un carrousel "Actualité générale"
  // pour tout le reste — la majorité des sources généralistes n'ont pas de second segment
  // dans leur orientation (juste "généraliste", "régional"...), donc pas de thématique
  // détectable ; ce carrousel fourre-tout reste volontairement le plus gros.
  function groupByTheme(articles) {
    var buckets = {};
    var order = [];
    articles.forEach(function(a) {
      var key = themeClass(a.orientation) || '_general';
      if (!buckets[key]) { buckets[key] = []; order.push(key); }
      buckets[key].push(a);
    });
    var namedKeys = order.filter(function(k) { return k !== '_general'; });
    namedKeys.sort(function(a, b) { return buckets[b].length - buckets[a].length; });
    var groups = namedKeys.map(function(k) { return { key: k, label: THEME_LABEL_BY_KEY[k], items: buckets[k] }; });
    if (buckets._general) groups.push({ key: '_general', label: 'Actualité générale', items: buckets._general });
    return groups;
  }

  function renderThemeSection(group) {
    var rowId = 'tribunes-row-' + group.key;
    return '' +
      '<section class="tribunes-theme-section">' +
        '<div class="tribunes-theme-heading">' +
          '<button type="button" class="tribunes-row-jump-start is-hidden" data-row="' + rowId + '" aria-label="Revenir au premier article">«</button>' +
          '<button type="button" class="tribunes-carousel-arrow tribunes-carousel-arrow-left tribunes-heading-arrow tribunes-heading-arrow-left" data-row="' + rowId + '" aria-label="Articles précédents">‹</button>' +
          '<h2>' + escapeHtml(group.label) + '</h2>' +
          '<button type="button" class="tribunes-carousel-arrow tribunes-carousel-arrow-right tribunes-heading-arrow tribunes-heading-arrow-right" data-row="' + rowId + '" aria-label="Articles suivants">›</button>' +
        '</div>' +
        '<div class="tribunes-carousel-wrap">' +
          '<button type="button" class="tribunes-carousel-arrow tribunes-carousel-arrow-left" data-row="' + rowId + '" aria-label="Articles précédents"><i class="fa-solid fa-chevron-left"></i></button>' +
          '<ul class="tribunes-carousel" id="' + rowId + '">' +
            group.items.map(renderItem).join('') +
          '</ul>' +
          '<button type="button" class="tribunes-carousel-arrow tribunes-carousel-arrow-right" data-row="' + rowId + '" aria-label="Articles suivants"><i class="fa-solid fa-chevron-right"></i></button>' +
        '</div>' +
        '<div class="tribunes-carousel-dots" data-row="' + rowId + '" aria-hidden="true"></div>' +
      '</section>';
  }

  function render(articles) {
    if (previewObserver) {
      previewObserver.disconnect();
      previewObserver = null;
    }
    if (!articles.length) {
      list.innerHTML = '<p class="tribunes-empty">' + (currentFilter === 'mixed' ? 'Aucun article pour le moment.' : 'Aucun article de ce côté pour le moment.') + '</p>';
      return;
    }
    var articleByLink = {};
    articles.forEach(function(a) { if (a.link) articleByLink[a.link] = a; });

    list.innerHTML = groupByTheme(articles).map(renderThemeSection).join('');
    attachCardLinkHandlers();
    attachCarouselArrows();
    requestAnimationFrame(updateAllCarouselArrowStates);
    setTimeout(updateAllCarouselArrowStates, 120);

    list.querySelectorAll('.tribunes-item[data-link]').forEach(function(card) {
      var article = articleByLink[card.dataset.link];
      if (article) observeForPreview(card, article);
    });
  }

  // Vignette Open Graph par article, via le système de preview de liens déjà utilisé
  // pour les sources de débats (/api/link-preview, cache disque côté serveur — aucun
  // impact Supabase). Chargement paresseux au scroll (IntersectionObserver) plutôt
  // qu'au rendu : avec des carrousels qui peuvent contenir des dizaines de cartes par
  // thématique, tout précharger d'un coup gaspillerait des requêtes vers /api/link-preview
  // (limite 120 req/min/IP) et vers les sites d'origine pour des cartes jamais vues.
  var previewObserver = null;
  var previewCacheByLink = {};
  var previewRequestByLink = {};

  function observeForPreview(card, article) {
    card.__article = article;
    if (Object.prototype.hasOwnProperty.call(previewCacheByLink, article.link)) {
      applyPreviewToCard(article, previewCacheByLink[article.link], card);
      return;
    }
    if (article.source_preview) {
      previewCacheByLink[article.link] = article.source_preview;
      applyPreviewToCard(article, article.source_preview, card);
      return;
    }
    if (!('IntersectionObserver' in window)) { fetchPreviewFor(article); return; }
    if (!previewObserver) {
      previewObserver = new IntersectionObserver(function(entries) {
        entries.forEach(function(entry) {
          if (!entry.isIntersecting) return;
          previewObserver.unobserve(entry.target);
          if (entry.target.__article) fetchPreviewFor(entry.target.__article);
        });
      }, { rootMargin: '300px' });
    }
    previewObserver.observe(card);
  }

  function fetchPreviewFor(article) {
    if (!article.link) return;
    var link = article.link;
    if (Object.prototype.hasOwnProperty.call(previewCacheByLink, link)) {
      applyPreviewToCard(article, previewCacheByLink[link]);
      return;
    }
    if (previewRequestByLink[link]) {
      previewRequestByLink[link].then(function(preview) {
        applyPreviewToCard(article, preview);
      });
      return;
    }
    previewRequestByLink[link] = fetch('/api/link-preview', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ url: link })
    })
      .then(function(res) { return res.ok ? res.json() : null; })
      .then(function(data) {
        var preview = data && data.preview ? data.preview : null;
        previewCacheByLink[link] = preview;
        return preview;
      })
      .catch(function() {
        previewCacheByLink[link] = null;
        return null;
      })
      .then(function(preview) {
        delete previewRequestByLink[link];
        applyPreviewToCard(article, preview);
        return preview;
      });
  }

  function applyPreviewToCard(article, preview, card) {
    if (!article || !article.link) return;
    var li = card || list.querySelector('[data-link="' + cssEscape(article.link) + '"]');
    if (preview) {
      article.source_preview = preview;
      article.source_image = preview.image || '';
      var arenaBtn = li && li.querySelector('.tribunes-arena-btn');
      if (arenaBtn) arenaBtn.href = createArenaHref(article);
    }
    if (!li) return;
    var thumb = li.querySelector('.tribunes-thumb');
    if (!thumb) return;
    if (!preview || !preview.image) {
      thumb.style.display = 'none';
      return;
    }
    var img = thumb.querySelector('.tribunes-thumb-img');
    if (!img) {
      thumb.style.display = 'none';
      return;
    }
    thumb.style.display = '';
    if (img.dataset.src === preview.image && thumb.classList.contains('tribunes-thumb-loaded')) return;
    img.dataset.src = preview.image;
    thumb.classList.add('tribunes-thumb-loading');
    thumb.classList.remove('tribunes-thumb-loaded');
    img.onload = function() {
      thumb.classList.remove('tribunes-thumb-loading');
      thumb.classList.add('tribunes-thumb-loaded');
    };
    img.onerror = function() { thumb.style.display = 'none'; };
    img.src = preview.image;
  }

  function cssEscape(value) {
    return window.CSS && CSS.escape ? CSS.escape(value) : String(value).replace(/["\\]/g, '\\$&');
  }

  function articlesInScope() {
    return currentFilter === 'mixed'
      ? allArticles
      : allArticles.filter(function(article) { return orientationClass(article.orientation) === currentFilter; });
  }

  // Listes déroulantes (média / thématique) construites à partir des articles de
  // l'orientation actuellement sélectionnée — repeuplées à chaque changement de filtre
  // gauche/général/droite pour ne jamais proposer une option hors du groupe affiché
  // (général = tout, sans distinction). Le filtre type (article/vidéo) est fixe, pas besoin
  // de le repeupler.
  var mediaFilterEl = document.getElementById('tribunes-media-filter');
  var typeFilterEl = document.getElementById('tribunes-type-filter');

  function populateSelectFromValues(selectEl, values, currentValue, defaultLabel, labelFor) {
    if (!selectEl) return currentValue;
    if (values.indexOf(currentValue) === -1) currentValue = '';
    selectEl.innerHTML = '<option value="">' + defaultLabel + '</option>' +
      values.map(function(value) {
        var label = labelFor ? labelFor(value) : value;
        return '<option value="' + escapeHtml(value) + '"' + (value === currentValue ? ' selected' : '') + '>' + escapeHtml(label) + '</option>';
      }).join('');
    selectEl.disabled = values.length === 0;
    return currentValue;
  }

  function populateMediaFilter() {
    var mediaNames = Array.from(new Set(
      articlesInScope().map(function(a) { return a.source; }).filter(Boolean)
    )).sort(function(a, b) { return a.localeCompare(b, 'fr'); });
    currentMedia = populateSelectFromValues(mediaFilterEl, mediaNames, currentMedia, 'Tous les médias');
  }

  function computeFiltered() {
    var filtered = articlesInScope();
    if (currentMedia) filtered = filtered.filter(function(article) { return article.source === currentMedia; });
    if (currentType) filtered = filtered.filter(function(article) { return article.type === currentType; });
    return filtered;
  }

  function applyFilter() {
    populateMediaFilter();
    render(computeFiltered());
  }

  function restoreInitialHeaderPosition() {
    if (initialHeaderScrollRestored) return;
    initialHeaderScrollRestored = true;
    requestAnimationFrame(function() {
      requestAnimationFrame(function() {
        window.scrollTo({ top: 0, left: 0, behavior: 'auto' });
      });
    });
  }

  var switchEl = document.getElementById('tribunes-filter-switch');
  if (switchEl) {
    switchEl.addEventListener('click', function(event) {
      var btn = event.target.closest('[data-filter]');
      if (!btn) return;
      currentFilter = btn.dataset.filter;
      currentMedia = '';
      switchEl.querySelectorAll('.tribunes-filter-segment').forEach(function(seg) {
        seg.classList.toggle('tribunes-filter-segment-active', seg === btn);
      });
      applyFilter();
    });
  }

  [mediaFilterEl, typeFilterEl].forEach(function(el) {
    if (!el) return;
    el.addEventListener('change', function() {
      currentMedia = mediaFilterEl.value;
      currentType = typeFilterEl.value;
      render(computeFiltered());
    });
  });

  fetch('/api/opinion-articles', { cache: 'no-store' })
    .then(function(res) { return res.ok ? res.json() : Promise.reject(); })
    .then(function(data) { allArticles = Array.isArray(data.articles) ? data.articles : []; applyFilter(); restoreInitialHeaderPosition(); })
    .catch(function() { list.innerHTML = '<li class="tribunes-empty">Erreur de chargement.</li>'; });
})();
</script>
</body>
</html>
