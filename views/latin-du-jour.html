  <script>
    if (window.self !== window.top) document.documentElement.classList.add('in-iframe');
    document.addEventListener('DOMContentLoaded', function(){
      if (window.self !== window.top) {
        document.body.classList.add('in-iframe');
        try { window.parent.postMessage({ type: 'mnoria:debate-iframe-ready', pathname: location.pathname, href: location.href }, '*'); } catch (e) {}
      }
    });
  </script>
  <style>
    /* Même bleu-gris foncé que le bandeau des bulles sur l'accueil (#243038),
       posé sur html et body (cf. qcm-du-jour.html pour la justification). */
    html:has(body.page-latin-du-jour) {
      background-color: #243038;
    }
    body.page-latin-du-jour {
      min-height: 100vh;
      background-color: #243038;
    }
    .page-latin-du-jour .topbar-inner {
      justify-content: center;
      padding: 2px 0;
    }
    .page-latin-du-jour .home-brand-block {
      flex: 0 0 auto;
      margin-left: 0;
    }
    .page-latin-du-jour .home-logo {
      width: 110px;
    }
    @media (max-width: 768px) {
      .page-latin-du-jour .home-logo {
        width: 70px;
      }
      .page-latin-du-jour .topbar-inner {
        padding: 0;
      }
    }
    .ld-page-shell {
      width: min(100% - 32px, 900px);
      margin: 112px auto 48px;
    }
    /* html.in-iframe (pas body.in-iframe, ajoutée seulement au DOMContentLoaded
       — cf. qcm-du-jour.html pour le détail) : évite que le cadre apparaisse
       d'abord avec la marge "hors iframe" avant de sauter à sa position. */
    html.in-iframe .page-latin-du-jour .ld-page-shell {
      /* Marge basse un peu plus généreuse que le haut : laisse un peu de
         mou pour scroller légèrement au-delà du bas du contenu plutôt que
         de s'arrêter pile dessus. */
      margin: 20px auto 60px;
    }
    @media (min-width: 769px) {
      .ld-page-shell {
        width: min(100% - 64px, 1200px);
      }
    }
    .ld-panel,
    .ld-panel * {
      box-sizing: border-box;
    }
    .ld-panel {
      position: relative;
      width: 100%;
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 24px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.18);
      font-family: Arial, Helvetica, sans-serif;
    }
    .ld-panel:focus {
      outline: none;
    }
    .ld-panel h1 {
      margin: 0 0 4px;
      font-family: "Barlow Condensed", Arial, sans-serif;
      font-size: 34px;
      line-height: 1;
      color: #111827;
      text-align: center;
    }
    .ld-panel .ld-subtitle {
      margin: 0 0 8px;
      color: #6b7280;
      font-size: 14px;
      text-align: center;
    }
    /* Menu discret "jours précédents" : un simple lien texte, pas un bouton
       proéminent — la consultation de l'historique reste secondaire par
       rapport au mot latin du jour, qui doit rester la première chose vue. */
    .ld-history {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      text-align: center;
      margin: 0 0 48px;
    }
    .ld-history-toggle {
      display: block;
      width: fit-content;
      margin: 0 auto;
      border: none;
      background: none;
      padding: 4px 6px;
      color: #6b7280;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.02em;
      cursor: pointer;
    }
    .ld-history-toggle:hover {
      color: #243038;
      text-decoration: underline;
    }
    .ld-history-panel {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 8px;
    }
    .ld-history-panel[hidden] {
      display: none;
    }
    .ld-history-date {
      padding: 6px 10px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 13px;
      color: #374151;
    }
    .ld-history-arrow {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 26px;
      height: 26px;
      padding: 0;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      background: #f9fafb;
      color: #374151;
      font-size: 12px;
      cursor: pointer;
    }
    .ld-history-arrow:hover:not(:disabled) {
      background: #eef3f6;
    }
    .ld-history-arrow:disabled {
      opacity: 0.35;
      cursor: default;
    }
    .ld-history-today {
      padding: 6px 12px;
      border: 1px solid #d1d5db;
      border-radius: 999px;
      background: #f9fafb;
      color: #374151;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }
    .ld-history-today:hover {
      background: #eef3f6;
    }
    /* En pratique une seule expression par jour (jamais un nombre fixe côté
       affichage) : la première n'a pas de marge/séparateur au-dessus, les
       suivantes si — pour marquer clairement où commence chaque expression
       indépendante. */
    .ld-latin + .ld-latin {
      margin-top: 28px;
      padding-top: 24px;
      border-top: 1px solid #e5e7eb;
    }
    .ld-latin-count {
      margin: 0 0 6px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #9ca3af;
      text-align: center;
    }
    .ld-phrase-block {
      margin: 0 0 20px;
      padding: 18px 20px;
      border-left: 4px solid #f5b642;
      background: #f9fafb;
      border-radius: 0 8px 8px 0;
    }
    .ld-phrase-block p {
      margin: 0;
      font-family: "Barlow Condensed", Arial, sans-serif;
      font-size: 26px;
      font-style: italic;
      line-height: 1.3;
      color: #111827;
    }
    .ld-phrase-block .ld-translation {
      margin-top: 8px;
      font-style: normal;
      font-size: 15px;
      font-weight: 700;
      color: #6b7280;
    }
    /* Honnêteté sur la provenance (phrase_origin, cf. lib/latin-du-jour.js) :
       une expression composée pour l'occasion ne doit jamais donner
       l'impression d'être une citation ancienne — ce badge le dit
       explicitement plutôt que de le laisser deviner. */
    .ld-origin-badge {
      display: inline-block;
      margin: 0 0 10px;
      padding: 3px 10px;
      border-radius: 999px;
      background: #eef3f6;
      color: #243038;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }
    .ld-section {
      margin: 0 0 20px;
    }
    .ld-section h2 {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0 0 8px;
      font-family: "Barlow Condensed", Arial, sans-serif;
      font-size: 19px;
      font-weight: 700;
      color: #243038;
      letter-spacing: 0.01em;
    }
    .ld-section h2 i {
      font-size: 15px;
      color: #f5b642;
    }
    .ld-section p {
      margin: 0;
      color: #374151;
      font-size: 15px;
      line-height: 1.55;
    }
    /* Décomposition mot par mot (grammar_breakdown) : le cœur pédagogique de
       la rubrique (cf. lib/latin-du-jour.js) — une liste plutôt qu'un
       paragraphe, pour que chaque mot reste repérable au premier coup d'œil. */
    .ld-grammar-list {
      margin: 0;
      padding: 0;
      list-style: none;
    }
    .ld-grammar-list li {
      margin: 0 0 12px;
      padding-left: 14px;
      border-left: 2px solid #e5e7eb;
    }
    .ld-grammar-list li:last-child {
      margin-bottom: 0;
    }
    .ld-grammar-word {
      display: block;
      margin-bottom: 2px;
      font-family: "Barlow Condensed", Arial, sans-serif;
      font-weight: 700;
      font-style: italic;
      font-size: 16px;
      color: #243038;
    }
    .ld-grammar-note {
      margin: 0;
      color: #374151;
      font-size: 14px;
      line-height: 1.5;
    }
    .ld-sources {
      margin-top: 24px;
      padding: 14px 16px;
      border-radius: 8px;
      background: #f9fafb;
      border: 1px dashed #d1d5db;
    }
    .ld-sources-label {
      display: flex;
      align-items: center;
      gap: 6px;
      margin: 0 0 8px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #b45309;
    }
    .ld-sources ul {
      margin: 0;
      padding: 0 0 0 18px;
      color: #6b7280;
      font-size: 13px;
      line-height: 1.6;
    }
    .ld-sources a {
      color: #243038;
    }
    .ld-no-sources {
      margin: 0;
      color: #9ca3af;
      font-size: 13px;
      font-style: italic;
    }
    /* Même police condensée que le h1 de cette page (Barlow Condensed, déjà
       chargée plus haut) plutôt qu'une police système générique — cohérent avec les
       autres écrans techniques Mnoria harmonisés. */
    .ld-state-message {
      font-family: "Barlow Condensed", Arial, sans-serif;
      font-weight: 700;
      color: #6b7280;
      font-size: 15px;
      line-height: 1.4;
    }
    #ld-body {
      padding-top: 24px;
    }
  </style>

<body class="page-latin-du-jour">
<header class="topbar topbar--mnoria-uniform">
  <div class="container topbar-inner topbar-home">
    <div class="home-brand-block">
      <div class="home-brand-main">
        <img src="/mnoria-logo-dark.png?v=20260815-visible-v2" alt="Logo mnoria" class="home-logo home-logo--mnoria" width="2172" height="724">
      </div>
    </div>
  </div>
</header>
<main class="ld-page-shell">
  <section class="ld-panel" id="ld-panel" tabindex="-1" aria-live="polite">
    <h1><i class="fa-solid fa-scroll"></i> <span id="ld-title-text">Mot latin du jour</span></h1>
    <p class="ld-subtitle">Un mot ou une courte expression en latin en écho à l'actualité du jour, avec sa traduction et son sens.</p>

    <div class="ld-history">
      <button type="button" class="ld-history-toggle" id="ld-history-toggle" aria-expanded="false" aria-controls="ld-history-panel">
        <i class="fa-solid fa-calendar-days"></i> Voir un jour précédent
      </button>
      <div class="ld-history-panel" id="ld-history-panel" hidden>
        <button type="button" class="ld-history-arrow" id="ld-history-prev" aria-label="Jour précédent">
          <i class="fa-solid fa-chevron-left"></i>
        </button>
        <input type="date" class="ld-history-date" id="ld-history-date" aria-label="Choisir une date précédente">
        <button type="button" class="ld-history-arrow" id="ld-history-next" aria-label="Jour suivant">
          <i class="fa-solid fa-chevron-right"></i>
        </button>
        <button type="button" class="ld-history-today" id="ld-history-today" hidden>Revenir à aujourd'hui</button>
      </div>
    </div>

    <div id="ld-body">
      <p class="ld-state-message">Chargement…</p>
    </div>
  </section>
</main>
<script src="/script.min.js?v=20260830-startup-loader-gate" defer></script>
<script>
(function () {
  var body = document.getElementById('ld-body');
  var panel = document.getElementById('ld-panel');
  var titleText = document.getElementById('ld-title-text');
  var historyToggle = document.getElementById('ld-history-toggle');
  var historyPanel = document.getElementById('ld-history-panel');
  var historyDateInput = document.getElementById('ld-history-date');
  var historyTodayBtn = document.getElementById('ld-history-today');
  var historyPrevBtn = document.getElementById('ld-history-prev');
  var historyNextBtn = document.getElementById('ld-history-next');
  var pollTimer = null;
  var pollAttempts = 0;
  var MAX_POLL_ATTEMPTS = 5;
  var POLL_INTERVAL_MS = 4000;
  // null = vue "aujourd'hui" (celle qui sondage tant que "generating") ;
  // sinon AAAA-MM-JJ = date consultée dans l'historique (jamais sondée : une
  // date passée ne repasse pas de "generating" à autre chose tout seule).
  var viewedDateKey = null;

  function escapeHtml(str) {
    var div = document.createElement('div');
    div.textContent = String(str == null ? '' : str);
    return div.innerHTML;
  }

  function renderLoading() {
    body.innerHTML = '<p class="ld-state-message">Chargement du mot latin du jour…</p>';
  }

  function renderGenerating() {
    body.innerHTML = '<p class="ld-state-message">Le mot latin du jour est en cours de préparation, ça ne devrait plus être long…</p>';
  }

  function renderInsufficient(reason) {
    var intro = viewedDateKey
      ? 'Aucune expression latine pertinente n’a pu être établie avec confiance ce jour-là.'
      : 'Aucune expression latine pertinente n’a pu être établie avec confiance aujourd’hui.';
    body.innerHTML =
      '<p class="ld-state-message">' + intro + '</p>' +
      (reason ? '<p class="ld-state-message">' + escapeHtml(reason) + '</p>' : '');
  }

  function renderNotFound() {
    body.innerHTML = '<p class="ld-state-message">Aucun mot latin du jour n’a été généré ce jour-là.</p>';
  }

  function renderError() {
    body.innerHTML = '<p class="ld-state-message">Impossible de charger le mot latin du jour pour le moment. Réessaie un peu plus tard.</p>';
  }

  var ORIGIN_BADGE_LABELS = {
    article: "Reprise du sujet d'actualité",
    attested: 'Expression latine attestée',
    composed: "Traduction composée pour l'occasion"
  };

  function renderOneLatin(latin, index, total) {
    var sources = Array.isArray(latin.sources) ? latin.sources : [];
    // Aucune des références n'a de lien vérifié (l'IA n'a pas de recherche
    // documentaire réelle, cf. lib/latin-du-jour.js) : on l'affiche
    // clairement comme indicatif plutôt que comme une source cliquable fiable.
    var hasVerifiedLink = sources.some(function (s) { return !!s.url; });
    var sourcesLabel = sources.length && !hasVerifiedLink ? 'Références indicatives' : 'Sources';
    var sourcesHtml = sources.length
      ? '<ul>' + sources.map(function (s) {
          var label = [s.title, s.author, s.publisher, s.year].filter(Boolean).join(' — ');
          var text = escapeHtml(label || s.title || '');
          return s.url
            ? '<li><a href="' + escapeHtml(s.url) + '" target="_blank" rel="noopener noreferrer">' + text + '</a></li>'
            : '<li>' + text + '</li>';
        }).join('') + '</ul>'
      : '<p class="ld-no-sources">Aucune source détaillée disponible pour cette expression.</p>';

    var countLabel = total > 1
      ? '<p class="ld-latin-count">Expression ' + (index + 1) + ' / ' + total + '</p>'
      : '';

    var grammarItems = Array.isArray(latin.grammar_breakdown) ? latin.grammar_breakdown : [];
    var grammarHtml = grammarItems.length
      ? '<div class="ld-section">' +
        '<h2><i class="fa-solid fa-graduation-cap"></i> Un peu de grammaire</h2>' +
        '<ul class="ld-grammar-list">' + grammarItems.map(function (g) {
          return '<li><span class="ld-grammar-word">' + escapeHtml(g.word) + '</span><p class="ld-grammar-note">' + escapeHtml(g.note) + '</p></li>';
        }).join('') + '</ul>' +
        '</div>'
      : '';

    var originLabel = ORIGIN_BADGE_LABELS[latin.phrase_origin] || '';

    return (
      '<article class="ld-latin">' +
      countLabel +
      (originLabel ? '<span class="ld-origin-badge">' + escapeHtml(originLabel) + '</span>' : '') +
      '<div class="ld-phrase-block">' +
      '<p>« ' + escapeHtml(latin.latin_phrase) + ' »</p>' +
      '<p class="ld-translation">' + escapeHtml(latin.literal_translation) + '</p>' +
      '</div>' +
      '<div class="ld-section">' +
      '<h2><i class="fa-solid fa-newspaper"></i> Le lien avec l\'actualité</h2>' +
      '<p>' + escapeHtml(latin.news_connection) + '</p>' +
      '</div>' +
      '<div class="ld-section">' +
      '<h2><i class="fa-solid fa-book-open"></i> Sens et usage</h2>' +
      '<p>' + escapeHtml(latin.explanation) + '</p>' +
      '</div>' +
      grammarHtml +
      '<div class="ld-sources">' +
      '<p class="ld-sources-label"><i class="fa-solid fa-book"></i> ' + escapeHtml(sourcesLabel) + '</p>' +
      sourcesHtml +
      '</div>' +
      '</article>'
    );
  }

  function renderPublished(content) {
    var latins = Array.isArray(content.latins) ? content.latins : [];
    if (!latins.length) { renderError(); return; }
    body.innerHTML = latins.map(function (l, i) { return renderOneLatin(l, i, latins.length); }).join('');
  }

  function stopPolling() {
    if (pollTimer) { clearTimeout(pollTimer); pollTimer = null; }
  }

  // Le backend ne fait jamais plus d'un appel IA par jour (verrouillé côté
  // Supabase, cf. lib/latin-du-jour.js) : si la génération est déjà en
  // cours quand cette page s'ouvre, on repasse simplement voir l'état un peu
  // plus tard, sans jamais déclencher nous-mêmes de génération.
  function handleResult(data) {
    var status = data && data.status;
    if (status === 'published' && data.content) {
      stopPolling();
      renderPublished(data.content);
    } else if (status === 'insufficient') {
      stopPolling();
      renderInsufficient(data.reason);
    } else if (status === 'not_found') {
      stopPolling();
      renderNotFound();
    } else if (status === 'generating') {
      renderGenerating();
      pollAttempts += 1;
      // Une date déjà passée ne redevient jamais "generating" toute seule
      // (getByDate ne déclenche jamais de génération) : le sondage ne
      // concerne que la vue "aujourd'hui".
      if (!viewedDateKey && pollAttempts < MAX_POLL_ATTEMPTS) {
        pollTimer = setTimeout(loadToday, POLL_INTERVAL_MS);
      } else {
        renderError();
      }
    } else {
      stopPolling();
      renderError();
    }
  }

  function loadToday() {
    viewedDateKey = null;
    if (titleText) titleText.textContent = 'Mot latin du jour';
    if (historyTodayBtn) historyTodayBtn.hidden = true;
    updateHistoryArrowsState();
    fetch('/api/latin-du-jour/today', { cache: 'no-store' })
      .then(function (res) { return res.json(); })
      .then(handleResult)
      .catch(function () {
        stopPolling();
        renderError();
      });
  }

  // Consultation d'un jour précédent (menu discret) : jamais de sondage
  // "generating" en boucle, jamais de déclenchement de génération — une
  // simple lecture (cf. GET /api/latin-du-jour/:date, lecture seule).
  function loadHistoricalDate(dateKey) {
    stopPolling();
    pollAttempts = 0;
    viewedDateKey = dateKey;
    if (titleText) titleText.textContent = 'Mot latin du ' + formatFrenchDate(dateKey);
    if (historyTodayBtn) historyTodayBtn.hidden = false;
    updateHistoryArrowsState();
    renderLoading();
    fetch('/api/latin-du-jour/' + encodeURIComponent(dateKey), { cache: 'no-store' })
      .then(function (res) { return res.json(); })
      .then(handleResult)
      .catch(function () {
        renderError();
      });
  }

  function formatFrenchDate(dateKey) {
    var parts = String(dateKey || '').split('-');
    if (parts.length !== 3) return dateKey;
    var months = ['janvier', 'février', 'mars', 'avril', 'mai', 'juin', 'juillet', 'août', 'septembre', 'octobre', 'novembre', 'décembre'];
    var month = months[Number(parts[1]) - 1];
    return month ? (Number(parts[2]) + ' ' + month + ' ' + parts[0]) : dateKey;
  }

  // Même logique que parisDateKey() côté serveur : "aujourd'hui" doit rester
  // cohérent avec le reste du site, pas l'heure locale du visiteur.
  function getParisDateKey() {
    var parts = new Intl.DateTimeFormat('en-CA', {
      timeZone: 'Europe/Paris', year: 'numeric', month: '2-digit', day: '2-digit'
    }).formatToParts(new Date());
    var get = function (type) { var p = parts.filter(function (x) { return x.type === type; })[0]; return p ? p.value : ''; };
    return get('year') + '-' + get('month') + '-' + get('day');
  }

  function shiftDateKey(dateKey, deltaDays) {
    var parts = String(dateKey || '').split('-').map(Number);
    var d = new Date(Date.UTC(parts[0], parts[1] - 1, parts[2]));
    d.setUTCDate(d.getUTCDate() + deltaDays);
    var pad = function (n) { return n < 10 ? '0' + n : String(n); };
    return d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1) + '-' + pad(d.getUTCDate());
  }

  // Flèches désactivées au-delà d'aujourd'hui (pas de "futur") et, quand la
  // borne min est connue (cf. ensureHistoryDatesLoaded), avant le jour le
  // plus ancien disponible — bornes larges, pas de liste exhaustive.
  function updateHistoryArrowsState() {
    var refDateKey = viewedDateKey || getParisDateKey();
    var todayKey = getParisDateKey();
    if (historyNextBtn) historyNextBtn.disabled = refDateKey >= todayKey;
    if (historyPrevBtn) {
      var min = historyDateInput && historyDateInput.min;
      historyPrevBtn.disabled = !!min && refDateKey <= min;
    }
  }

  function navigateHistory(deltaDays) {
    var refDateKey = viewedDateKey || getParisDateKey();
    var targetDateKey = shiftDateKey(refDateKey, deltaDays);
    var todayKey = getParisDateKey();
    if (targetDateKey > todayKey) return;
    if (historyDateInput && historyDateInput.min && targetDateKey < historyDateInput.min) return;
    if (targetDateKey === todayKey) {
      if (historyDateInput) historyDateInput.value = '';
      loadToday();
    } else {
      if (historyDateInput) historyDateInput.value = targetDateKey;
      loadHistoricalDate(targetDateKey);
    }
  }

  var historyDatesLoaded = false;
  function ensureHistoryDatesLoaded() {
    if (historyDatesLoaded) return;
    historyDatesLoaded = true;
    fetch('/api/latin-du-jour/dates', { cache: 'no-store' })
      .then(function (res) { return res.json(); })
      .then(function (data) {
        var dates = Array.isArray(data && data.dates) ? data.dates : [];
        if (!dates.length || !historyDateInput) return;
        // Bornes larges (min/max) plutôt qu'une liste exhaustive à cocher :
        // reste discret, une date sans contenu affiche simplement "aucun mot
        // latin ce jour-là" (cf. renderNotFound) plutôt que de bloquer.
        historyDateInput.max = dates[0];
        historyDateInput.min = dates[dates.length - 1];
        updateHistoryArrowsState();
      })
      .catch(function () {});
  }

  if (historyToggle && historyPanel) {
    historyToggle.addEventListener('click', function () {
      var isHidden = historyPanel.hidden;
      historyPanel.hidden = !isHidden;
      historyToggle.setAttribute('aria-expanded', isHidden ? 'true' : 'false');
      if (isHidden) ensureHistoryDatesLoaded();
    });
  }
  if (historyDateInput) {
    historyDateInput.addEventListener('change', function () {
      var value = historyDateInput.value;
      if (value) loadHistoricalDate(value);
    });
  }
  if (historyTodayBtn) {
    historyTodayBtn.addEventListener('click', function () {
      if (historyDateInput) historyDateInput.value = '';
      loadToday();
    });
  }
  if (historyPrevBtn) {
    historyPrevBtn.addEventListener('click', function () { navigateHistory(-1); });
  }
  if (historyNextBtn) {
    historyNextBtn.addEventListener('click', function () { navigateHistory(1); });
  }

  function closeModal() {
    if (window.self !== window.top) {
      try { window.parent.postMessage({ type: 'mnoria:close-debate-modal' }, '*'); } catch (e) {}
    } else {
      location.href = '/';
    }
  }

  // Échap ferme la modale iframe : le keydown posé par le parent
  // (script.js) écoute sur son propre document, qui ne reçoit pas les
  // événements clavier une fois le focus passé dans cette iframe — on
  // reproduit donc ici le même mécanisme que le bouton de fermeture.
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') closeModal();
  });

  function init() {
    renderLoading();
    // Premier (et seul, hors "generating") fetch déclenché ici, au chargement
    // de CETTE page — elle-même chargée uniquement à l'ouverture de la
    // modale iframe (openDebateIframeModal) : rien ne part depuis l'accueil.
    // Le menu "jours précédents" ne déclenche sa propre requête qu'à
    // l'ouverture du menu (ensureHistoryDatesLoaded), pas avant.
    loadToday();
    // Focus initial sur le panneau : rend la fermeture au clavier (Échap)
    // immédiatement fonctionnelle sans clic préalable de l'utilisateur dans
    // l'iframe, et donne un point d'entrée cohérent aux lecteurs d'écran.
    if (panel && typeof panel.focus === 'function') panel.focus();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function () {
      init();
      if (typeof attachPageScrollFadeHint === 'function') attachPageScrollFadeHint('#ffffff', { contentEndSelector: '.ld-panel' });
    });
  } else {
    init();
    if (typeof attachPageScrollFadeHint === 'function') attachPageScrollFadeHint('#ffffff', { contentEndSelector: '.ld-panel' });
  }
})();
</script>
