<main class="contact-page-shell">
  <section class="contact-panel" aria-labelledby="contact-title">
    <h1 id="contact-title">Contact</h1>
    <form id="contact-form" class="contact-form">
      <label>
        <span>Nom</span>
        <input type="text" id="contact-name" autocomplete="name" required>
      </label>
      <label>
        <span>Email</span>
        <input type="email" id="contact-email" autocomplete="email" required>
      </label>
      <label>
        <span>Message</span>
        <textarea id="contact-message" rows="7" required></textarea>
      </label>
      <button type="submit" class="contact-submit-btn"><i class="fa-regular fa-paper-plane"></i><span>Envoyer</span></button>
    </form>
  </section>
</main>

<script src="/script.min.js?v=20260903-notion-quiz-failed-notif" defer></script>
<script>
document.getElementById('contact-form')?.addEventListener('submit', async function(event) {
  event.preventDefault();
  var btn = this.querySelector('button[type="submit"]');
  var name = document.getElementById('contact-name')?.value.trim() || '';
  var email = document.getElementById('contact-email')?.value.trim() || '';
  var message = document.getElementById('contact-message')?.value.trim() || '';
  btn.disabled = true;
  btn.querySelector('span').textContent = 'Envoi…';
  try {
    var res = await fetch('/api/contact', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, email, message })
    });
    if (res.ok) {
      btn.querySelector('span').textContent = 'Envoyé ✓';
      document.getElementById('contact-form').reset();
    } else {
      btn.disabled = false;
      btn.querySelector('span').textContent = 'Erreur, réessaie';
    }
  } catch(e) {
    btn.disabled = false;
    btn.querySelector('span').textContent = 'Erreur, réessaie';
  }
});
</script>
