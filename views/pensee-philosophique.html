  <style>
    /* Même bleu-gris foncé que le bandeau des bulles sur l'accueil (#243038),
       posé sur html et body (cf. qcm-du-jour.html pour la justification). */
    html:has(body.page-pensee-philosophique) {

    body.page-pensee-philosophique {

    .page-pensee-philosophique .topbar-inner {
      justify-content: center;
      padding: 2px 0;
    }
    .page-pensee-philosophique .home-brand-block {
      flex: 0 0 auto;
      margin-left: 0;
    }
    .page-pensee-philosophique .home-logo {

    }
    @media (max-width: 768px) {

      }
      .page-pensee-philosophique .topbar-inner {

      }
    }
    .pp-page-shell {
      width: min(100% - 32px, 900px);
      margin: 112px auto 48px;
    }
    .page-pensee-philosophique.in-iframe .pp-page-shell {
      /* Marge basse un peu plus généreuse que le haut : laisse un peu de
         mou pour scroller légèrement au-delà du bas du contenu plutôt que
         de s'arrêter pile dessus. */
      margin: 20px auto 60px;
    }
    @media (min-width: 769px) {
      .pp-page-shell {
        width: min(100% - 64px, 1200px);
      }
    }
    .pp-panel,
    .pp-panel * {
      box-sizing: border-box;
    }
    .pp-panel {
      position: relative;
      width: 100%;
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 24px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.18);
      font-family: Arial, Helvetica, sans-serif;
    }
    .pp-panel:focus {
      outline: none;
    }
    .pp-panel h1 {
      margin: 0 0 4px;
      font-family: "Barlow Condensed", Arial, sans-serif;
      font-size: 34px;
      line-height: 1;
      color: #111827;
      text-align: center;
    }
    .pp-panel .pp-subtitle {
      margin: 0 0 8px;
      color: #6b7280;
      font-size: 14px;
      text-align: center;
    }
    /* Menu discret "jours précédents" : un simple lien texte, pas un bouton
       proéminent — la consultation de l'historique reste secondaire par
       rapport à la pensée du jour, qui doit rester la première chose vue. */
    .pp-history {
      width: 100%;
      text-align: center;
      margin: 0 0 48px;
    }
    .pp-history-toggle {
      display: block;
      width: fit-content;
      margin: 0 auto;
      border: none;
      background: none;
      padding: 4px 6px;
      color: #6b7280;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.02em;
      cursor: pointer;
    }
    .pp-history-toggle:hover {
      color: #243038;
      text-decoration: underline;
    }
    .pp-history-panel {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 8px;
    }
    .pp-history-panel[hidden] {
      display: none;
    }
    .pp-history-date {
      padding: 6px 10px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 13px;
      color: #374151;
    }
    .pp-history-arrow {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 26px;
      height: 26px;
      padding: 0;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      background: #f9fafb;
      color: #374151;
      font-size: 12px;
      cursor: pointer;
    }
    .pp-history-arrow:hover:not(:disabled) {
      background: #eef3f6;
    }
    .pp-history-arrow:disabled {
      opacity: 0.35;
      cursor: default;
    }
    .pp-history-today {
      padding: 6px 12px;
      border: 1px solid #d1d5db;
      border-radius: 999px;
      background: #f9fafb;
      color: #374151;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }
    .pp-history-today:hover {
      background: #eef3f6;
    }
    /* 1 à 3 pensées possibles le même jour (jamais un nombre fixe) : la
       première n'a pas de marge/séparateur au-dessus, les suivantes si —
       pour marquer clairement où commence chaque pensée indépendante. */
    .pp-pensee + .pp-pensee {

    .pp-pensee-count {

    .pp-section {

    <h1><i class="fa-solid fa-brain"></i> <span id="pp-title-text">Pensée philosophique du jour</span></h1>
    <p class="pp-subtitle">Un événement d'actualité éclairé par une idée philosophique.</p>

    <div class="pp-history">

        <i class="fa-solid fa-calendar-days"></i> Voir un jour précédent
      </button>

<script src="/script.min.js?v=20260724-citationdujour" defer></script>
<script>
(function () {
  var body = document.getElementById('pp-body');
  var panel = document.getElementById('pp-panel');
  var titleText = document.getElementById('pp-title-text');
  var historyToggle = document.getElementById('pp-history-toggle');
  var historyPanel = document.getElementById('pp-history-panel');
  var historyDateInput = document.getElementById('pp-history-date');
  var historyTodayBtn = document.getElementById('pp-history-today');
  var historyPrevBtn = document.getElementById('pp-history-prev');
  var historyNextBtn = document.getElementById('pp-history-next');
  var pollTimer = null;
  var pollAttempts = 0;
  var MAX_POLL_ATTEMPTS = 5;
  var POLL_INTERVAL_MS = 4000;
  // null = vue "aujourd'hui" (celle qui sondage tant que "generating") ;
  // sinon AAAA-MM-JJ = date consultée dans l'historique (jamais sondée : une
  // date passée ne repasse pas de "generating" à autre chose tout seule).
  var viewedDateKey = null;

  function escapeHtml(str) {
    var div = document.createElement('div');
    div.textContent = String(str == null ? '' : str);
    return div.innerHTML;
  }

  function renderLoading() {
    body.innerHTML = '<p class="pp-state-message">Chargement de la pensée philosophique du jour…</p>';
  }

  function renderGenerating() {
    body.innerHTML = '<p class="pp-state-message">La pensée philosophique du jour est en cours de préparation, ça ne devrait plus être long…</p>';
  }

  function renderInsufficient(reason) {
    var intro = viewedDateKey
      ? 'Aucun rapprochement philosophique sérieux n’a pu être établi pour l’actualité de ce jour-là.'
      : 'Aucun rapprochement philosophique sérieux n’a pu être établi pour l’actualité d’aujourd’hui.';
    body.innerHTML =
      '<p class="pp-state-message">' + intro + '</p>' +
      (reason ? '<p class="pp-state-message">' + escapeHtml(reason) + '</p>' : '');
  }

  function renderNotFound() {
    body.innerHTML = '<p class="pp-state-message">Aucune pensée philosophique n’a été générée ce jour-là.</p>';
  }

  function renderError() {
    body.innerHTML = '<p class="pp-state-message">Impossible de charger la pensée philosophique pour le moment. Réessaie un peu plus tard.</p>';
  }

  function renderOnePensee(pensee, index, total) {
    var sources = Array.isArray(pensee.sources) ? pensee.sources : [];
    // Aucune des références n'a de lien vérifié (l'IA n'a pas de recherche
    // documentaire réelle, cf. lib/pensee-philosophique.js) : on l'affiche
    // clairement comme indicatif plutôt que comme une source cliquable fiable.
    var hasVerifiedLink = sources.some(function (s) { return !!s.url; });
    var sourcesLabel = sources.length && !hasVerifiedLink ? 'Références indicatives' : 'Sources';
    var sourcesHtml = sources.length
      ? '<ul>' + sources.map(function (s) {
          var label = [s.title, s.author, s.publisher, s.year].filter(Boolean).join(' — ');
          var text = escapeHtml(label || s.title || '');
          return s.url
            ? '<li><a href="' + escapeHtml(s.url) + '" target="_blank" rel="noopener noreferrer">' + text + '</a></li>'
            : '<li>' + text + '</li>';
        }).join('') + '</ul>'
      : '<p class="pp-no-sources">Aucune source détaillée disponible pour cette pensée.</p>';

    // Portrait du philosophe (API Wikipedia), ou à défaut l'image déjà
    // publiée avec l'arène du sujet d'actualité (repli "press") — jamais
    // générée ni devinée par l'IA, cf. lib/pensee-philosophique.js. Absente
    // pour une partie des sujets, donc affichée seulement si trouvée.
    // Toujours créditée (philosophical_concept_image_credit, jamais une
    // image affichée sans indiquer sa provenance).
    var imageHtml = '';
    if (pensee.philosophical_concept_image_url) {
      var isPressImage = pensee.philosophical_concept_image_source === "press";
      var captionText = "Image : " + (pensee.philosophical_concept_image_credit || (isPressImage ? "source de l'actualité" : "Wikipedia"));
      var captionAlt = isPressImage ? pensee.current_topic_title : pensee.philosopher_name;
      imageHtml =
        '<figure class="pp-concept-image">' +
        '<img src="' + escapeHtml(pensee.philosophical_concept_image_url) + '" alt="' + escapeHtml(captionAlt) + '" loading="lazy" onerror="this.closest(\'.pp-concept-image\').remove();">' +
        (pensee.philosophical_concept_image_page_url
          ? '<figcaption><a href="' + escapeHtml(pensee.philosophical_concept_image_page_url) + '" target="_blank" rel="noopener noreferrer">' + escapeHtml(captionText) + '</a></figcaption>'
          : '<figcaption>' + escapeHtml(captionText) + '</figcaption>') +
        '</figure>';
    }

    // Le nombre de pensées n'est jamais fixe (1 à 3, cf.
    // lib/pensee-philosophique.js) : l'étiquette "Pensée X/N" n'apparaît que
    // s'il y en a effectivement plusieurs aujourd'hui.
    var countLabel = total > 1
      ? '<p class="pp-pensee-count">Pensée ' + (index + 1) + ' / ' + total + '</p>'
      : '';

    return (
      '<article class="pp-pensee">' +
      countLabel +
      '<p class="pp-topic-title">' + escapeHtml(pensee.current_topic_title) + '</p>' +
      '<p class="pp-topic-summary">' + escapeHtml(pensee.current_topic_summary) + '</p>' +
      '<div class="pp-section">' +
      '<h2><i class="fa-solid fa-lightbulb"></i> ' + escapeHtml(pensee.philosophical_concept) + '</h2>' +
      '<p class="pp-concept-meta"><strong>' + escapeHtml(pensee.philosopher_name) + '</strong> — ' + escapeHtml(pensee.concept_origin) + '</p>' +
      imageHtml +
      '<p>' + escapeHtml(pensee.concept_explanation) + '</p>' +
      '</div>' +
      '<div class="pp-section">' +
      '<h2><i class="fa-solid fa-arrows-rotate"></i> Ce qui fait écho</h2>' +
      '<p>' + escapeHtml(pensee.shared_mechanism) + '</p>' +
      '</div>' +
      '<div class="pp-section">' +
      '<h2><i class="fa-solid fa-code-compare"></i> La limite du rapprochement</h2>' +
      '<p>' + escapeHtml(pensee.essential_difference) + '</p>' +
      '</div>' +
      '<div class="pp-section">' +
      '<h2><i class="fa-solid fa-circle-info"></i> Conclusion</h2>' +
      '<p>' + escapeHtml(pensee.conclusion) + '</p>' +
      '</div>' +
      '<div class="pp-sources">' +
      '<p class="pp-sources-label"><i class="fa-solid fa-book"></i> ' + escapeHtml(sourcesLabel) + '</p>' +
      sourcesHtml +
      '</div>' +
      '</article>'
    );
  }

  function renderPublished(content) {
    var pensees = Array.isArray(content.pensees) ? content.pensees : [];
    if (!pensees.length) { renderError(); return; }
    body.innerHTML = pensees.map(function (p, i) { return renderOnePensee(p, i, pensees.length); }).join('');
  }

  function stopPolling() {
    if (pollTimer) { clearTimeout(pollTimer); pollTimer = null; }
  }

  // Le backend ne fait jamais plus d'un appel IA par jour (verrouillé côté
  // Supabase, cf. lib/pensee-philosophique.js) : si la génération est déjà
  // en cours quand cette page s'ouvre, on repasse simplement voir l'état un
  // peu plus tard, sans jamais déclencher nous-mêmes de génération.
  function handleResult(data) {
    var status = data && data.status;
    if (status === 'published' && data.content) {
      stopPolling();
      renderPublished(data.content);
    } else if (status === 'insufficient') {
      stopPolling();
      renderInsufficient(data.reason);
    } else if (status === 'not_found') {
      stopPolling();
      renderNotFound();
    } else if (status === 'generating') {
      renderGenerating();
      pollAttempts += 1;
      // Une date déjà passée ne redevient jamais "generating" toute seule
      // (getByDate ne déclenche jamais de génération) : le sondage ne
      // concerne que la vue "aujourd'hui".
      if (!viewedDateKey && pollAttempts < MAX_POLL_ATTEMPTS) {
        pollTimer = setTimeout(loadToday, POLL_INTERVAL_MS);
      } else {
        renderError();
      }
    } else {
      stopPolling();
      renderError();
    }
  }

  function loadToday() {
    viewedDateKey = null;
    if (titleText) titleText.textContent = 'Pensée philosophique du jour';
    if (historyTodayBtn) historyTodayBtn.hidden = true;
    updateHistoryArrowsState();
    fetch('/api/pensee-philosophique/today', { cache: 'no-store' })
      .then(function (res) { return res.json(); })
      .then(handleResult)
      .catch(function () {
        stopPolling();
        renderError();
      });
  }

  // Consultation d'un jour précédent (menu discret) : jamais de sondage
  // "generating" en boucle, jamais de déclenchement de génération — une
  // simple lecture (cf. GET /api/pensee-philosophique/:date, lecture seule).
  function loadHistoricalDate(dateKey) {
    stopPolling();
    pollAttempts = 0;
    viewedDateKey = dateKey;
    if (titleText) titleText.textContent = 'Pensée philosophique du ' + formatFrenchDate(dateKey);
    if (historyTodayBtn) historyTodayBtn.hidden = false;
    updateHistoryArrowsState();
    renderLoading();
    fetch('/api/pensee-philosophique/' + encodeURIComponent(dateKey), { cache: 'no-store' })
      .then(function (res) { return res.json(); })
      .then(handleResult)
      .catch(function () {
        renderError();
      });
  }

  function formatFrenchDate(dateKey) {
    var parts = String(dateKey || '').split('-');
    if (parts.length !== 3) return dateKey;
    var months = ['janvier', 'février', 'mars', 'avril', 'mai', 'juin', 'juillet', 'août', 'septembre', 'octobre', 'novembre', 'décembre'];
    var month = months[Number(parts[1]) - 1];
    return month ? (Number(parts[2]) + ' ' + month + ' ' + parts[0]) : dateKey;
  }

  // Même logique que parisDateKey() côté serveur : "aujourd'hui" doit rester
  // cohérent avec le reste du site, pas l'heure locale du visiteur.
  function getParisDateKey() {
    var parts = new Intl.DateTimeFormat('en-CA', {
      timeZone: 'Europe/Paris', year: 'numeric', month: '2-digit', day: '2-digit'
    }).formatToParts(new Date());
    var get = function (type) { var p = parts.filter(function (x) { return x.type === type; })[0]; return p ? p.value : ''; };
    return get('year') + '-' + get('month') + '-' + get('day');
  }

  function shiftDateKey(dateKey, deltaDays) {
    var parts = String(dateKey || '').split('-').map(Number);
    var d = new Date(Date.UTC(parts[0], parts[1] - 1, parts[2]));
    d.setUTCDate(d.getUTCDate() + deltaDays);
    var pad = function (n) { return n < 10 ? '0' + n : String(n); };
    return d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1) + '-' + pad(d.getUTCDate());
  }

  // Flèches désactivées au-delà d'aujourd'hui (pas de "futur") et, quand la
  // borne min est connue (cf. ensureHistoryDatesLoaded), avant le jour le
  // plus ancien disponible — bornes larges, pas de liste exhaustive.
  function updateHistoryArrowsState() {
    var refDateKey = viewedDateKey || getParisDateKey();
    var todayKey = getParisDateKey();
    if (historyNextBtn) historyNextBtn.disabled = refDateKey >= todayKey;
    if (historyPrevBtn) {
      var min = historyDateInput && historyDateInput.min;
      historyPrevBtn.disabled = !!min && refDateKey <= min;
    }
  }

  function navigateHistory(deltaDays) {
    var refDateKey = viewedDateKey || getParisDateKey();
    var targetDateKey = shiftDateKey(refDateKey, deltaDays);
    var todayKey = getParisDateKey();
    if (targetDateKey > todayKey) return;
    if (historyDateInput && historyDateInput.min && targetDateKey < historyDateInput.min) return;
    if (targetDateKey === todayKey) {
      if (historyDateInput) historyDateInput.value = '';
      loadToday();
    } else {
      if (historyDateInput) historyDateInput.value = targetDateKey;
      loadHistoricalDate(targetDateKey);
    }
  }

  var historyDatesLoaded = false;
  function ensureHistoryDatesLoaded() {
    if (historyDatesLoaded) return;
    historyDatesLoaded = true;
    fetch('/api/pensee-philosophique/dates', { cache: 'no-store' })
      .then(function (res) { return res.json(); })
      .then(function (data) {
        var dates = Array.isArray(data && data.dates) ? data.dates : [];
        if (!dates.length || !historyDateInput) return;
        // Bornes larges (min/max) plutôt qu'une liste exhaustive à cocher :
        // reste discret, une date sans contenu affiche simplement "aucune
        // pensée ce jour-là" (cf. renderNotFound) plutôt que de bloquer.
        historyDateInput.max = dates[0];
        historyDateInput.min = dates[dates.length - 1];
        updateHistoryArrowsState();
      })
      .catch(function () {});
  }

  if (historyToggle && historyPanel) {
    historyToggle.addEventListener('click', function () {
      var isHidden = historyPanel.hidden;
      historyPanel.hidden = !isHidden;
      historyToggle.setAttribute('aria-expanded', isHidden ? 'true' : 'false');
      if (isHidden) ensureHistoryDatesLoaded();
    });
  }
  if (historyDateInput) {
    historyDateInput.addEventListener('change', function () {
      var value = historyDateInput.value;
      if (value) loadHistoricalDate(value);
    });
  }
  if (historyTodayBtn) {
    historyTodayBtn.addEventListener('click', function () {
      if (historyDateInput) historyDateInput.value = '';
      loadToday();
    });
  }
  if (historyPrevBtn) {
    historyPrevBtn.addEventListener('click', function () { navigateHistory(-1); });
  }
  if (historyNextBtn) {
    historyNextBtn.addEventListener('click', function () { navigateHistory(1); });
  }

  function closeModal() {
    if (window.self !== window.top) {
      try { window.parent.postMessage({ type: 'agon:close-debate-modal' }, '*'); } catch (e) {}
    } else {
      location.href = '/';
    }
  }

  // Échap ferme la modale iframe : le keydown posé par le parent
  // (script.js) écoute sur son propre document, qui ne reçoit pas les
  // événements clavier une fois le focus passé dans cette iframe — on
  // reproduit donc ici le même mécanisme que le bouton de fermeture.
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') closeModal();
  });

  function init() {
    renderLoading();
    // Premier (et seul, hors "generating") fetch déclenché ici, au chargement
    // de CETTE page — elle-même chargée uniquement à l'ouverture de la
    // modale iframe (openDebateIframeModal) : rien ne part depuis l'accueil.
    // Le menu "jours précédents" ne déclenche sa propre requête qu'à
    // l'ouverture du menu (ensureHistoryDatesLoaded), pas avant.
    loadToday();
    // Focus initial sur le panneau : rend la fermeture au clavier (Échap)
    // immédiatement fonctionnelle sans clic préalable de l'utilisateur dans
    // l'iframe, et donne un point d'entrée cohérent aux lecteurs d'écran.
    if (panel && typeof panel.focus === 'function') panel.focus();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function () {
      init();
      if (typeof attachPageScrollFadeHint === 'function') attachPageScrollFadeHint('#ffffff');
    });
  } else {
    init();
    if (typeof attachPageScrollFadeHint === 'function') attachPageScrollFadeHint('#ffffff');
  }
})();
</script>
</body>
</html>
