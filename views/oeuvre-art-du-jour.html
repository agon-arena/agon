  <script>
    if (window.self !== window.top) document.documentElement.classList.add('in-iframe');

  <style>
    /* Même bleu-gris foncé que le bandeau des bulles sur l'accueil (#243038),
       posé sur html et body (cf. qcm-du-jour.html pour la justification). */
    html:has(body.page-oeuvre-art-du-jour) {
      background-color: #243038;
    }
    body.page-oeuvre-art-du-jour {
      min-height: 100vh;
      background-color: #243038;
    }
    .page-oeuvre-art-du-jour .topbar-inner {
      justify-content: center;

        padding: 0;

    }
    .oa-page-shell {
      width: min(100% - 32px, 900px);
      margin: 112px auto 48px;
    }
    /* html.in-iframe (pas body.in-iframe, ajoutée seulement au DOMContentLoaded
       — cf. qcm-du-jour.html pour le détail) : évite que le cadre apparaisse
       d'abord avec la marge "hors iframe" avant de sauter à sa position. */
    html.in-iframe .page-oeuvre-art-du-jour .oa-page-shell {
      /* Marge basse un peu plus généreuse que le haut : laisse un peu de
         mou pour scroller légèrement au-delà du bas du contenu plutôt que
         de s'arrêter pile dessus. */
      margin: 20px auto 60px;
    }
    @media (min-width: 769px) {
      .oa-page-shell {
        width: min(100% - 64px, 1200px);
      }
    }
    .oa-panel,
    .oa-panel * {
      box-sizing: border-box;
    }
    .oa-panel {
      position: relative;
      width: 100%;
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 24px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.18);
      font-family: Arial, Helvetica, sans-serif;
    }
    .oa-panel:focus {
      outline: none;
    }
    .oa-panel h1 {
      margin: 0 0 4px;
      font-family: "Barlow Condensed", Arial, sans-serif;
      font-size: 34px;
      line-height: 1;
      color: #111827;
      text-align: center;
    }
    .oa-panel .oa-subtitle {
      margin: 0 0 8px;
      color: #6b7280;
      font-size: 14px;
      text-align: center;
    }
    /* Menu discret "jours précédents" : un simple lien texte, pas un bouton
       proéminent — la consultation de l'historique reste secondaire par
       rapport à l'œuvre du jour, qui doit rester la première chose vue. */
    .oa-history {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      text-align: center;
      margin: 0 0 48px;
    }
    .oa-history-toggle {
      display: block;
      width: fit-content;
      margin: 0 auto;
      border: none;
      background: none;
      padding: 4px 6px;
      color: #6b7280;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.02em;
      cursor: pointer;
    }
    .oa-history-toggle:hover {

    .oa-history-panel {

      align-items: center;

    .oa-history-panel[hidden] {

    .oa-history-arrow {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 26px;
      height: 26px;

      border: 1px solid #d1d5db;
      border-radius: 6px;
      background: #f9fafb;
      color: #374151;
      font-size: 12px;

    .oa-history-arrow:hover:not(:disabled) {

    .oa-history-today {
      padding: 6px 12px;

      border-radius: 999px;

      color: #374151;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;

    .oa-history-today:hover {
      background: #eef3f6;
    }
    /* En pratique une seule œuvre par jour (jamais un nombre fixe côté
       affichage) : la première n'a pas de marge/séparateur au-dessus, les
       suivantes si — pour marquer clairement où commence chaque œuvre

    .oa-oeuvre + .oa-oeuvre {

    .oa-oeuvre-count {

      font-weight: 700;

      text-transform: uppercase;
      color: #9ca3af;

    }
    /* L'œuvre elle-même est l'image centrale de la rubrique (contrairement
       au portrait secondaire de citation-du-jour) : mise en avant, plus
       grande, juste sous le titre. */
    .oa-artwork-image {

    .oa-artwork-image img {

    }
    #oa-body {
      padding-top: 24px;
    }
  </style>

<body class="page-oeuvre-art-du-jour">
<header class="topbar topbar--mnoria-uniform">
  <div class="container topbar-inner topbar-home">
    <div class="home-brand-block">
      <div class="home-brand-main">
        <img src="/mnoria-logo-dark.png?v=20260815-visible-v2" alt="Logo mnoria" class="home-logo home-logo--mnoria" width="2172" height="724">
      </div>
    </div>
  </div>
</header>
<main class="oa-page-shell">
  <section class="oa-panel" id="oa-panel" tabindex="-1" aria-live="polite">
    <h1><i class="fa-solid fa-palette"></i> <span id="oa-title-text">Œuvre d'art du jour</span></h1>
    <p class="oa-subtitle">Une œuvre d'art réelle en écho à l'actualité du jour, avec une brève présentation de l'œuvre et de son artiste.</p>

    <div class="oa-history">
      <button type="button" class="oa-history-toggle" id="oa-history-toggle" aria-expanded="false" aria-controls="oa-history-panel">
        <i class="fa-solid fa-calendar-days"></i> Voir un jour précédent
      </button>
      <div class="oa-history-panel" id="oa-history-panel" hidden>
        <button type="button" class="oa-history-arrow" id="oa-history-prev" aria-label="Jour précédent">
          <i class="fa-solid fa-chevron-left"></i>
        </button>
        <input type="date" class="oa-history-date" id="oa-history-date" aria-label="Choisir une date précédente">
        <button type="button" class="oa-history-arrow" id="oa-history-next" aria-label="Jour suivant">
          <i class="fa-solid fa-chevron-right"></i>
        </button>
        <button type="button" class="oa-history-today" id="oa-history-today" hidden>Revenir à aujourd'hui</button>
      </div>
    </div>

    <div id="oa-body">
      <p class="oa-state-message">Chargement…</p>
    </div>
  </section>
</main>
<script src="/script.min.js?v=20260825-connection-error-page3" defer></script>
<script>
(function () {
  var body = document.getElementById('oa-body');
  var panel = document.getElementById('oa-panel');
  var titleText = document.getElementById('oa-title-text');
  var historyToggle = document.getElementById('oa-history-toggle');
  var historyPanel = document.getElementById('oa-history-panel');
  var historyDateInput = document.getElementById('oa-history-date');
  var historyTodayBtn = document.getElementById('oa-history-today');
  var historyPrevBtn = document.getElementById('oa-history-prev');
  var historyNextBtn = document.getElementById('oa-history-next');
  var pollTimer = null;
  var pollAttempts = 0;
  var MAX_POLL_ATTEMPTS = 5;
  var POLL_INTERVAL_MS = 4000;
  // null = vue "aujourd'hui" (celle qui sondage tant que "generating") ;
  // sinon AAAA-MM-JJ = date consultée dans l'historique (jamais sondée : une
  // date passée ne repasse pas de "generating" à autre chose tout seule).
  var viewedDateKey = null;

  function escapeHtml(str) {
    var div = document.createElement('div');
    div.textContent = String(str == null ? '' : str);
    return div.innerHTML;
  }

  function renderLoading() {
    body.innerHTML = '<p class="oa-state-message">Chargement de l\'œuvre d\'art du jour…</p>';
  }

  function renderGenerating() {
    body.innerHTML = '<p class="oa-state-message">L\'œuvre d\'art du jour est en cours de préparation, ça ne devrait plus être long…</p>';
  }

  function renderInsufficient(reason) {
    var intro = viewedDateKey
      ? 'Aucune œuvre d\'art n\'a pu être établie avec confiance ce jour-là.'
      : 'Aucune œuvre d\'art n\'a pu être établie avec confiance aujourd\'hui.';
    body.innerHTML =
      '<p class="oa-state-message">' + intro + '</p>' +
      (reason ? '<p class="oa-state-message">' + escapeHtml(reason) + '</p>' : '');
  }

  function renderNotFound() {
    body.innerHTML = '<p class="oa-state-message">Aucune œuvre d\'art du jour n\'a été générée ce jour-là.</p>';
  }

  function renderError() {
    body.innerHTML = '<p class="oa-state-message">Impossible de charger l\'œuvre d\'art du jour pour le moment. Réessaie un peu plus tard.</p>';
  }

  function renderOneOeuvre(oeuvre, index, total) {
    var sources = Array.isArray(oeuvre.sources) ? oeuvre.sources : [];
    // Aucune des références n'a de lien vérifié (l'IA n'a pas de recherche
    // documentaire réelle, cf. lib/oeuvre-art-du-jour.js) : on l'affiche
    // clairement comme indicatif plutôt que comme une source cliquable fiable.
    var hasVerifiedLink = sources.some(function (s) { return !!s.url; });
    var sourcesLabel = sources.length && !hasVerifiedLink ? 'Références indicatives' : 'Sources';
    var sourcesHtml = sources.length
      ? '<ul>' + sources.map(function (s) {
          var label = [s.title, s.author, s.publisher, s.year].filter(Boolean).join(' — ');
          var text = escapeHtml(label || s.title || '');
          return s.url
            ? '<li><a href="' + escapeHtml(s.url) + '" target="_blank" rel="noopener noreferrer">' + text + '</a></li>'
            : '<li>' + text + '</li>';
        }).join('') + '</ul>'
      : '<p class="oa-no-sources">Aucune source détaillée disponible pour cette œuvre.</p>';

    // Reproduction de l'œuvre en priorité, portrait de l'artiste en repli
    // (API Wikipedia) — jamais générée ni devinée par l'IA, cf.
    // lib/oeuvre-art-du-jour.js. Toujours créditée (artwork_image_credit,
    // jamais une image affichée sans indiquer sa provenance).
    var imageHtml = '';
    if (oeuvre.artwork_image_url) {
      var captionText = "Image : " + (oeuvre.artwork_image_credit || "Wikipedia");
      imageHtml =
        '<figure class="oa-artwork-image">' +
        '<img src="' + escapeHtml(oeuvre.artwork_image_url) + '" alt="' + escapeHtml(oeuvre.artwork_title) + '" loading="lazy" onerror="this.closest(\'.oa-artwork-image\').remove();">' +
        (oeuvre.artwork_image_page_url
          ? '<figcaption><a href="' + escapeHtml(oeuvre.artwork_image_page_url) + '" target="_blank" rel="noopener noreferrer">' + escapeHtml(captionText) + '</a></figcaption>'
          : '<figcaption>' + escapeHtml(captionText) + '</figcaption>') +
        '</figure>';
    }

    var countLabel = total > 1
      ? '<p class="oa-oeuvre-count">Œuvre ' + (index + 1) + ' / ' + total + '</p>'
      : '';

    return (
      '<article class="oa-oeuvre">' +
      countLabel +
      imageHtml +
      '<p class="oa-artwork-title">' + escapeHtml(oeuvre.artwork_title) + '</p>' +
      '<p class="oa-artwork-meta">' + escapeHtml(oeuvre.artist_name) + ' — ' + escapeHtml(oeuvre.artwork_date) + '</p>' +
      '<div class="oa-section">' +
      '<h2><i class="fa-solid fa-image"></i> L\'œuvre</h2>' +
      '<p>' + escapeHtml(oeuvre.artwork_description) + '</p>' +
      '</div>' +
      '<div class="oa-section">' +
      '<h2><i class="fa-solid fa-newspaper"></i> Le lien avec l\'actualité</h2>' +
      '<p>' + escapeHtml(oeuvre.news_connection) + '</p>' +
      '</div>' +
      '<div class="oa-section">' +
      '<h2><i class="fa-solid fa-user"></i> L\'artiste</h2>' +
      '<p>' + escapeHtml(oeuvre.artist_presentation) + '</p>' +
      '</div>' +
      '<div class="oa-sources">' +
      '<p class="oa-sources-label"><i class="fa-solid fa-book"></i> ' + escapeHtml(sourcesLabel) + '</p>' +
      sourcesHtml +
      '</div>' +
      '</article>'
    );
  }

  function renderPublished(content) {
    var oeuvres = Array.isArray(content.oeuvres) ? content.oeuvres : [];
    if (!oeuvres.length) { renderError(); return; }
    body.innerHTML = oeuvres.map(function (o, i) { return renderOneOeuvre(o, i, oeuvres.length); }).join('');
  }

  function stopPolling() {
    if (pollTimer) { clearTimeout(pollTimer); pollTimer = null; }
  }

  // Le backend ne fait jamais plus d'un appel IA par jour (verrouillé côté
  // Supabase, cf. lib/oeuvre-art-du-jour.js) : si la génération est déjà en
  // cours quand cette page s'ouvre, on repasse simplement voir l'état un peu
  // plus tard, sans jamais déclencher nous-mêmes de génération.
  function handleResult(data) {
    var status = data && data.status;
    if (status === 'published' && data.content) {
      stopPolling();
      renderPublished(data.content);
    } else if (status === 'insufficient') {
      stopPolling();
      renderInsufficient(data.reason);
    } else if (status === 'not_found') {
      stopPolling();
      renderNotFound();
    } else if (status === 'generating') {
      renderGenerating();
      pollAttempts += 1;
      // Une date déjà passée ne redevient jamais "generating" toute seule
      // (getByDate ne déclenche jamais de génération) : le sondage ne
      // concerne que la vue "aujourd'hui".
      if (!viewedDateKey && pollAttempts < MAX_POLL_ATTEMPTS) {
        pollTimer = setTimeout(loadToday, POLL_INTERVAL_MS);
      } else {
        renderError();
      }
    } else {
      stopPolling();
      renderError();
    }
  }

  function loadToday() {
    viewedDateKey = null;
    if (titleText) titleText.textContent = "Œuvre d'art du jour";
    if (historyTodayBtn) historyTodayBtn.hidden = true;
    updateHistoryArrowsState();
    fetch('/api/oeuvre-art-du-jour/today', { cache: 'no-store' })
      .then(function (res) { return res.json(); })
      .then(handleResult)
      .catch(function () {
        stopPolling();
        renderError();
      });
  }

  // Consultation d'un jour précédent (menu discret) : jamais de sondage
  // "generating" en boucle, jamais de déclenchement de génération — une
  // simple lecture (cf. GET /api/oeuvre-art-du-jour/:date, lecture seule).
  function loadHistoricalDate(dateKey) {
    stopPolling();
    pollAttempts = 0;
    viewedDateKey = dateKey;
    if (titleText) titleText.textContent = "Œuvre d'art du " + formatFrenchDate(dateKey);
    if (historyTodayBtn) historyTodayBtn.hidden = false;
    updateHistoryArrowsState();
    renderLoading();
    fetch('/api/oeuvre-art-du-jour/' + encodeURIComponent(dateKey), { cache: 'no-store' })
      .then(function (res) { return res.json(); })
      .then(handleResult)
      .catch(function () {
        renderError();
      });
  }

  function formatFrenchDate(dateKey) {
    var parts = String(dateKey || '').split('-');
    if (parts.length !== 3) return dateKey;
    var months = ['janvier', 'février', 'mars', 'avril', 'mai', 'juin', 'juillet', 'août', 'septembre', 'octobre', 'novembre', 'décembre'];
    var month = months[Number(parts[1]) - 1];
    return month ? (Number(parts[2]) + ' ' + month + ' ' + parts[0]) : dateKey;
  }

  // Même logique que parisDateKey() côté serveur : "aujourd'hui" doit rester
  // cohérent avec le reste du site, pas l'heure locale du visiteur.
  function getParisDateKey() {
    var parts = new Intl.DateTimeFormat('en-CA', {
      timeZone: 'Europe/Paris', year: 'numeric', month: '2-digit', day: '2-digit'
    }).formatToParts(new Date());
    var get = function (type) { var p = parts.filter(function (x) { return x.type === type; })[0]; return p ? p.value : ''; };
    return get('year') + '-' + get('month') + '-' + get('day');
  }

  function shiftDateKey(dateKey, deltaDays) {
    var parts = String(dateKey || '').split('-').map(Number);
    var d = new Date(Date.UTC(parts[0], parts[1] - 1, parts[2]));
    d.setUTCDate(d.getUTCDate() + deltaDays);
    var pad = function (n) { return n < 10 ? '0' + n : String(n); };
    return d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1) + '-' + pad(d.getUTCDate());
  }

  // Flèches désactivées au-delà d'aujourd'hui (pas de "futur") et, quand la
  // borne min est connue (cf. ensureHistoryDatesLoaded), avant le jour le
  // plus ancien disponible — bornes larges, pas de liste exhaustive.
  function updateHistoryArrowsState() {
    var refDateKey = viewedDateKey || getParisDateKey();
    var todayKey = getParisDateKey();
    if (historyNextBtn) historyNextBtn.disabled = refDateKey >= todayKey;
    if (historyPrevBtn) {
      var min = historyDateInput && historyDateInput.min;
      historyPrevBtn.disabled = !!min && refDateKey <= min;
    }
  }

  function navigateHistory(deltaDays) {
    var refDateKey = viewedDateKey || getParisDateKey();
    var targetDateKey = shiftDateKey(refDateKey, deltaDays);
    var todayKey = getParisDateKey();
    if (targetDateKey > todayKey) return;
    if (historyDateInput && historyDateInput.min && targetDateKey < historyDateInput.min) return;
    if (targetDateKey === todayKey) {
      if (historyDateInput) historyDateInput.value = '';
      loadToday();
    } else {
      if (historyDateInput) historyDateInput.value = targetDateKey;
      loadHistoricalDate(targetDateKey);
    }
  }

  var historyDatesLoaded = false;
  function ensureHistoryDatesLoaded() {
    if (historyDatesLoaded) return;
    historyDatesLoaded = true;
    fetch('/api/oeuvre-art-du-jour/dates', { cache: 'no-store' })
      .then(function (res) { return res.json(); })
      .then(function (data) {
        var dates = Array.isArray(data && data.dates) ? data.dates : [];
        if (!dates.length || !historyDateInput) return;
        // Bornes larges (min/max) plutôt qu'une liste exhaustive à cocher :
        // reste discret, une date sans contenu affiche simplement "aucune
        // œuvre ce jour-là" (cf. renderNotFound) plutôt que de bloquer.
        historyDateInput.max = dates[0];
        historyDateInput.min = dates[dates.length - 1];
        updateHistoryArrowsState();
      })
      .catch(function () {});
  }

  if (historyToggle && historyPanel) {
    historyToggle.addEventListener('click', function () {
      var isHidden = historyPanel.hidden;
      historyPanel.hidden = !isHidden;
      historyToggle.setAttribute('aria-expanded', isHidden ? 'true' : 'false');
      if (isHidden) ensureHistoryDatesLoaded();
    });
  }
  if (historyDateInput) {
    historyDateInput.addEventListener('change', function () {
      var value = historyDateInput.value;
      if (value) loadHistoricalDate(value);
    });
  }
  if (historyTodayBtn) {
    historyTodayBtn.addEventListener('click', function () {
      if (historyDateInput) historyDateInput.value = '';
      loadToday();
    });
  }
  if (historyPrevBtn) {
    historyPrevBtn.addEventListener('click', function () { navigateHistory(-1); });
  }
  if (historyNextBtn) {
    historyNextBtn.addEventListener('click', function () { navigateHistory(1); });
  }

  function closeModal() {
    if (window.self !== window.top) {
      try { window.parent.postMessage({ type: 'mnoria:close-debate-modal' }, '*'); } catch (e) {}
    } else {
      location.href = '/';
    }
  }

  // Échap ferme la modale iframe : le keydown posé par le parent
  // (script.js) écoute sur son propre document, qui ne reçoit pas les
  // événements clavier une fois le focus passé dans cette iframe — on
  // reproduit donc ici le même mécanisme que le bouton de fermeture.
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') closeModal();
  });

  function init() {
    renderLoading();
    // Premier (et seul, hors "generating") fetch déclenché ici, au chargement
    // de CETTE page — elle-même chargée uniquement à l'ouverture de la
    // modale iframe (openDebateIframeModal) : rien ne part depuis l'accueil.
    // Le menu "jours précédents" ne déclenche sa propre requête qu'à
    // l'ouverture du menu (ensureHistoryDatesLoaded), pas avant.
    loadToday();
    // Focus initial sur le panneau : rend la fermeture au clavier (Échap)
    // immédiatement fonctionnelle sans clic préalable de l'utilisateur dans
    // l'iframe, et donne un point d'entrée cohérent aux lecteurs d'écran.
    if (panel && typeof panel.focus === 'function') panel.focus();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function () {
      init();
      if (typeof attachPageScrollFadeHint === 'function') attachPageScrollFadeHint('#ffffff', { contentEndSelector: '.oa-panel' });
    });
  } else {
    init();
    if (typeof attachPageScrollFadeHint === 'function') attachPageScrollFadeHint('#ffffff', { contentEndSelector: '.oa-panel' });
  }
})();
</script>
</body>
</html>
